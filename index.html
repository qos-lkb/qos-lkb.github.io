<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重新導向 | Science Simulations</title>
    <!-- 無 PHP 的靜態主機：腳本會轉到備援網址；有 PHP 時先讀 default_redirect_url.php（.env 的 DEFAULT_REDIRECT_URL） -->
    <script>
(function () {
    var fallback = 'https://science.qos.edu.hk/';
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'default_redirect_url.php', false);
        xhr.send(null);
        if (xhr.status === 200) {
            var d = JSON.parse(xhr.responseText);
            if (d && typeof d.url === 'string' && d.url.trim() !== '') {
                location.replace(d.url.trim());
                return;
            }
        }
    } catch (e) {}
    location.replace(fallback);
})();
    </script>
</head>
<body>
    <p>正在前往科學模擬站…若未自動跳轉，請<a href="https://science.qos.edu.hk/">按此</a>。</p>
</body>
</html>
