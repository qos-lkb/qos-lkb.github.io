<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <script>
    /* 若 .env 設有 DEFAULT_REDIRECT_URL，經 default_redirect_url.php 讀取後立即轉址（同步請求，其餘內容不載入） */
    (function () {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'default_redirect_url.php', false);
            xhr.send(null);
            if (xhr.status !== 200) return;
            var d = JSON.parse(xhr.responseText || '{}');
            if (d && d.url && typeof d.url === 'string' && d.url.length > 0) {
                window.location.replace(d.url);
            }
        } catch (e) { /* 無 PHP 或離線時略過 */ }
    })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
