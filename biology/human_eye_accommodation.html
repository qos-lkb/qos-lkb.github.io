/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

                q: {
                    zh: '把物件距離滑到遠端（超過中點，接近 100）。哪項觀察正確？',
                    en: 'Slide Object Distance to the far end (past midpoint, near 100). Which observation is correct?'
                },
                choices: null,
                ans: null,
                explain: {
                    zh: 'A。factor≥0.5：Relax／Tight／Thinner；形狀插值亦晶薄、韌帶更直粗。',
                    en: 'A. factor≥0.5: Relax／Tight／Thinner; shape also thinner lens, straighter／thicker ligaments.'
                }
            },
            {
                q: {
                    zh: '根據本模擬，看近物時正確的因果順序是哪一項？',
                    en: 'In this sim, which is the correct causal order when viewing a near object?'
                },
                choices: [
                    { zh: '睫狀肌收縮 → 懸韌帶鬆弛 → 晶體變厚', en: 'Ciliary contracts → ligaments slacken → lens becomes thicker' },
                    { zh: '懸韌帶先拉緊 → 逼使睫狀肌收縮 → 晶體變薄', en: 'Ligaments tighten first → force ciliary contraction → lens thins' },
                    { zh: '先戴凸透鏡 → 再放鬆睫狀肌 → 瞳孔擴大', en: 'Put on a convex lens first → then relax ciliary → pupil dilates' },
                    { zh: '光強升高 → 環狀肌收縮 → 晶體變厚', en: 'Light intensity rises → circular muscle contracts → lens thickens' }
                ],
                ans: 0,
                explain: {
                    zh: 'A。對應原理機制 1；B 順序顛倒且遠近混淆；C／D 混入矯正鏡或瞳孔反射。',
                    en: 'A. Matches mechanism 1; B reverses order; C／D mix in correction or pupil reflex.'
                }
            },
            {
                q: {
                    zh: '先把滑桿拉到遠物並確認三卡為遠物狀態，再按頁首重置。用自己的話寫：（1）重置後滑桿位置與三卡應如何（本設計預期）；（2）重置會不會切換中／EN。',
                    en: 'Slide to Distant and confirm far-state cards, then press header Reset. In your own words: (1) expected slider／cards after Reset; (2) whether Reset switches zh／EN.'
                },
                choices: null,
                ans: null,
                explain: {
                    zh: '（1）滑桿回 0（近物）；三卡回 收縮／鬆弛／較厚；舞台重繪近物。（2）不切換語言。',
                    en: '(1) Slider back to 0 (Near); cards＝Contract／Slack／Thicker; near redraw. (2) Reset must not switch language.'
                }
            },
            {
                q: {
                    zh: '根據本模擬控件與設計，哪項最正確？',
                    en: 'Using this sim’s controls and design, which is most correct?'
                },
                choices: [
                    { zh: '可調物件距離，觀察睫狀肌／懸韌帶／晶體厚度與光路，並有步驟／原理／五題／中EN／重置——主軸是正常眼調節，不是近視遠視矯正鏡，也不是瞳孔對光反射', en: 'You adjust object distance to observe ciliary／ligaments／lens thickness and rays, with steps／principle／five quiz items／zh-EN／Reset—focus normal-eye accommodation, not myopia／hyperopia＋corrective lenses, not pupil light reflex' },
                    { zh: '主要控件是正常／近視／遠視按鈕與凹／凸透鏡', en: 'Main controls are Normal／Myopia／Hyperopia buttons and concave／convex lenses' },
                    { zh: '重置會強制改成英文並改為光強滑桿', en: 'Reset always switches to English and replaces the control with a light-intensity slider' },
                    { zh: '必須先選擇放射肌或環狀肌模式才能操作', en: 'You must first choose radial or circular muscle mode before the sim works' }
                ],
                ans: 0,
                explain: {
                    zh: 'A。隔離 eye-defects-correction／pupil-light-reflex；Reset 不改語言、不改控件身分。',
                    en: 'A. Separates eye-defects-correction／pupil-light-reflex; Reset does not change language or control identity.'
                }
            }
        ];

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('distSlider');
        const distValLabel = document.getElementById('distVal');
        const muscleStatus = document.getElementById('muscleStatus');
        const ligamentStatus = document.getElementById('ligamentStatus');
        const lensStatus = document.getElementById('lensStatus');

        const eyeX = 580;
        const eyeY = 240;
        const eyeR = 150;
        const corneaX = eyeX - eyeR;
        const lensX = eyeX - 100;
        const retinaX = eyeX + eyeR - 5;

        function t() { return i18n[currentLang]; }

        function draw() {
            const tt = t();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const factor = slider.value / 100;

            const minObjX = 40;
            const maxObjX = corneaX - 50;
            const objectX = maxObjX - (factor * (maxObjX - minObjX));
            const objectY = eyeY;

            const muscleInward = 14 * (1 - factor);
            const muscleThickness = 22 - (factor * 10);
            const lensThickness = 32 - (factor * 20);
            const lensHeight = 70 + (factor * 10);
            const topMuscleY = eyeY - 110 + muscleInward;
            const bottomMuscleY = eyeY + 110 - muscleInward;

            ctx.lineWidth = 4;
            ctx.strokeStyle = '#2b3a8c';
            ctx.fillStyle = '#0284c7';

            ctx.beginPath();
            ctx.moveTo(eyeX + 110, eyeY + 95);
            ctx.lineTo(eyeX + 180, eyeY + 150);
            ctx.lineTo(eyeX + 210, eyeY + 130);
            ctx.lineTo(eyeX + 130, eyeY + 70);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(eyeX - 80, eyeY - 130);
            ctx.lineTo(eyeX - 40, eyeY - 170);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(eyeX - 80, eyeY + 130);
            ctx.lineTo(eyeX - 40, eyeY + 170);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(eyeX, eyeY, eyeR, Math.PI * 0.72, Math.PI * 1.28, true);
            ctx.strokeStyle = '#2b3a8c';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(eyeX, eyeY, eyeR - 8, Math.PI * 0.7, Math.PI * 1.3, true);
            ctx.strokeStyle = '#f97316';
            ctx.lineWidth = 7;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(corneaX + 60, eyeY, 110, Math.PI * 0.72, Math.PI * 1.28, false);
            ctx.strokeStyle = '#2b3a8c';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.strokeStyle = 'rgba(16, 185, 129, 0.85)';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(objectX, objectY - 20);
            ctx.lineTo(lensX, eyeY - (lensHeight * 0.7));
            ctx.lineTo(retinaX, eyeY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(objectX, objectY);
            ctx.lineTo(retinaX, eyeY);
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.moveTo(objectX, objectY + 20);
            ctx.lineTo(lensX, eyeY + (lensHeight * 0.7));
            ctx.lineTo(retinaX, eyeY);
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.85)';
            ctx.stroke();

            ctx.strokeStyle = '#a855f7';
            ctx.lineWidth = 1.2 + (factor * 1.3);
            const curveOffset = (1 - factor) * 9;

            for (let i = -2; i <= 2; i++) {
                let offset = i * 4;
                ctx.beginPath();
                ctx.moveTo(lensX + offset, topMuscleY + (muscleThickness / 2));
                ctx.quadraticCurveTo(
                    lensX + offset + curveOffset,
                    (topMuscleY + eyeY - lensHeight) / 2,
                    lensX + offset,
                    eyeY - lensHeight
                );
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(lensX + offset, bottomMuscleY - (muscleThickness / 2));
                ctx.quadraticCurveTo(
                    lensX + offset + curveOffset,
                    (bottomMuscleY + eyeY + lensHeight) / 2,
                    lensX + offset,
                    eyeY + lensHeight
                );
                ctx.stroke();
            }

            ctx.fillStyle = '#e8927c';
            ctx.strokeStyle = '#2b3a8c';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.ellipse(lensX, topMuscleY, 18, muscleThickness, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(lensX, bottomMuscleY, 18, muscleThickness, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(lensX - 10, topMuscleY + 5);
            ctx.lineTo(lensX - 25, eyeY - 45);
            ctx.lineTo(lensX - 18, eyeY - 45);
            ctx.lineTo(lensX - 5, topMuscleY + 5);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(lensX - 10, bottomMuscleY - 5);
            ctx.lineTo(lensX - 25, eyeY + 45);
            ctx.lineTo(lensX - 18, eyeY + 45);
            ctx.lineTo(lensX - 5, bottomMuscleY - 5);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(lensX, eyeY, lensThickness, lensHeight, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(107, 191, 232, 0.75)';
            ctx.fill();
            ctx.strokeStyle = '#2b3a8c';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(lensX - (lensThickness * 0.4), eyeY, lensHeight * 0.6, -Math.PI * 0.3, Math.PI * 0.3);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(objectX, objectY, 18, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(objectX - 5, objectY - 5, 2, objectX, objectY, 18);
            grad.addColorStop(0, '#ff7675');
            grad.addColorStop(1, '#d63031');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#a71d2a';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#334155';
            ctx.font = 'bold 13px "Noto Sans TC", "Microsoft JhengHei", Arial';
            ctx.textAlign = 'center';
            ctx.fillText(tt.canvasObject, objectX, objectY + 38);
            ctx.textAlign = 'start';

            updateUI(factor);
        }

        function updateUI(factor) {
            const tt = t();
            if (factor < 0.5) {
                distValLabel.innerText = tt.distNear;
                distValLabel.style.color = '#2563eb';

                muscleStatus.innerText = tt.muscleContract;
                muscleStatus.style.color = '#dc2626';

                ligamentStatus.innerText = tt.ligamentSlack;
                ligamentStatus.style.color = '#16a34a';

                lensStatus.innerText = tt.lensThicker;
                lensStatus.style.color = '#2563eb';
            } else {
                distValLabel.innerText = tt.distFar;
                distValLabel.style.color = '#2563eb';

                muscleStatus.innerText = tt.muscleRelax;
                muscleStatus.style.color = '#16a34a';

                ligamentStatus.innerText = tt.ligamentTight;
                ligamentStatus.style.color = '#dc2626';

                lensStatus.innerText = tt.lensThinner;
                lensStatus.style.color = '#2563eb';
            }
        }

        function applyLanguage() {
            const tt = t();
            document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
            document.title = currentLang === 'zh'
                ? '人眼視覺調節模擬｜Human Eye Accommodation'
                : 'Human Eye Accommodation｜人眼視覺調節模擬';
            document.getElementById('btn-lang').textContent = tt.langBtn;
            document.getElementById('title').textContent = tt.title;
            document.getElementById('subtitle').textContent = tt.subtitle;
            document.getElementById('badge-subject').textContent = tt.badge;
            document.getElementById('btn-steps').textContent = tt.btnSteps;
            document.getElementById('btn-principle').textContent = tt.btnPrinciple;
            document.getElementById('btn-quiz').textContent = tt.btnQuiz;
            document.getElementById('btn-reset').textContent = tt.btnReset;
            document.getElementById('btn-reset-panel').textContent = tt.btnReset;
            document.getElementById('setupHeading').textContent = tt.setupHeading;
            document.getElementById('labelDist').textContent = tt.labelDist;
            document.getElementById('hintText').textContent = tt.hintText;
            document.getElementById('cardMuscleTitle').textContent = tt.cardMuscleTitle;
            document.getElementById('cardLigamentTitle').textContent = tt.cardLigamentTitle;
            document.getElementById('cardLensTitle').textContent = tt.cardLensTitle;
            document.getElementById('legMuscle').textContent = tt.legMuscle;
            document.getElementById('legLigament').textContent = tt.legLigament;
            document.getElementById('legLens').textContent = tt.legLens;
            document.getElementById('legRays').textContent = tt.legRays;
            document.getElementById('steps-title').textContent = tt.stepsTitle;
            document.getElementById('principle-title').textContent = tt.principleTitle;
            document.getElementById('quiz-title').textContent = tt.quizTitle;
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? tt.hideAns : tt.showAns;
            if (!document.getElementById('modal-steps').classList.contains('hidden')) renderSteps();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) renderPrinciple();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) renderQuiz();
            draw();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            applyLanguage();
        }

        function renderSteps() {
            const tt = t();
            const body = document.getElementById('steps-body');
            body.innerHTML = tt.steps.map(function(s, i) {
                const colors = ['bg-indigo-50 border-indigo-100', 'bg-teal-50 border-teal-100', 'bg-sky-50 border-sky-100', 'bg-amber-50 border-amber-100'];
                return '<div class="p-4 rounded-xl border ' + colors[i % 4] + '"><p class="font-bold text-slate-800 mb-1">' + s.t + '</p><p class="text-slate-700 leading-relaxed">' + s.b + '</p></div>';
            }).join('');
        }

        function renderPrinciple() {
            const tt = t();
            const body = document.getElementById('principle-body');
            let html = '<div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100"><h3 class="font-bold text-indigo-900 mb-2">' + tt.conceptTitle + '</h3><p class="text-slate-700">' + tt.concept + '</p></div>';
            html += '<div><h3 class="font-bold text-teal-800 mb-2">' + tt.mechTitle + '</h3><ol class="list-decimal list-inside space-y-2 text-slate-700">';
            tt.mech.forEach(function(m) { html += '<li>' + m + '</li>'; });
            html += '</ol></div>';
            html += '<div class="p-4 bg-emerald-50 rounded-xl border border-emerald-100"><h3 class="font-bold text-emerald-900 mb-2">' + tt.egTitle + '</h3><p class="text-slate-700">' + tt.eg + '</p></div>';
            body.innerHTML = html;
        }

        function renderQuiz() {
            const tt = t();
            const body = document.getElementById('quiz-body');
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? tt.hideAns : tt.showAns;
            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            QUIZ.forEach(function(item, i) {
                const qtext = item.q[currentLang] || item.q.zh;
                html += '<div class="p-4 rounded-xl border border-violet-100 bg-violet-50/40 space-y-2 mb-3">';
                html += '<p class="font-bold text-violet-900">Q' + (i + 1) + '. ' + qtext + '</p>';
                const qNum = i + 1;
                const isOpen = (qNum === 2 || qNum === 4);
                if (!isOpen && item.choices) {
                    const qName = 'q' + qNum;
                    html += '<div class="grid gap-1.5">';
                    item.choices.forEach(function(c, j) {
                        html += '<label class="flex items-start gap-2 rounded-lg border border-violet-100 p-2 cursor-pointer hover:bg-violet-50/60"><input type="radio" name="' + qName + '" class="mt-0.5 accent-violet-600"><span class="text-sm">' + letters[j] + '. ' + (c[currentLang] || c.zh) + '</span></label>';
                    });
                    html += '</div>';
                } else if (isOpen) {
                    html += '<p class="text-xs text-slate-500 italic">' + (currentLang === 'zh' ? '先預測，再操作畫面控件核對，用自己的話作答。' : 'Predict, then use the sim controls to check. Write in your own words.') + '</p>';
                }
                if (quizReveal && item.explain) {
                    const ref = currentLang === 'zh' ? '參考答案' : 'Reference answer';
                    html += '<div class="mt-2 p-2 rounded-lg bg-emerald-50 border border-emerald-100 text-xs text-emerald-900"><strong>' + ref + '：</strong> ' + (item.explain[currentLang] || item.explain.zh) + '</div>';
                }
                html += '</div>';
            });
            body.innerHTML = html;
        }

        function closeAllModals(exceptId) {
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
                if (exceptId && id === exceptId) return;
                const modal = document.getElementById(id);
                if (!modal || modal.classList.contains('hidden')) return;
                if (modalCloseTimers[id]) {
                    clearTimeout(modalCloseTimers[id]);
                    delete modalCloseTimers[id];
                }
                modal.classList.add('hidden');
            });
        }

        function openTeachModal(id) {
            closeAllModals(id);
            const modal = document.getElementById(id);
            if (!modal) return;
            if (modalCloseTimers[id]) {
                clearTimeout(modalCloseTimers[id]);
                delete modalCloseTimers[id];
            }
            modal.classList.remove('hidden');
        }

        function resetAll() {
            closeAllModals(null);
            slider.value = 0;
            quizReveal = false;
            draw();
        }

        slider.addEventListener('input', draw);

        document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
        document.getElementById('btn-reset').addEventListener('click', resetAll);
        document.getElementById('btn-steps').addEventListener('click', function() { renderSteps(); openTeachModal('modal-steps'); });
        document.getElementById('btn-principle').addEventListener('click', function() { renderPrinciple(); openTeachModal('modal-principle'); });
        document.getElementById('btn-quiz').addEventListener('click', function() { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
        document.getElementById('btn-quiz-answers').addEventListener('click', function() { quizReveal = !quizReveal; renderQuiz(); });
        document.querySelectorAll('.modal-close').forEach(function(btn) {
            btn.addEventListener('click', function() { closeAllModals(null); });
        });
        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
            document.getElementById(id).addEventListener('click', function(e) {
                if (e.target === this) closeAllModals(null);
            });
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAllModals(null);
        });

        applyLanguage();
    </script>
</body>
</html>
