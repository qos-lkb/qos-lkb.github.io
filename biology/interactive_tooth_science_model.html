let quizAnswersVisible = false;
let lang = 'zh';
let mode = 'healthy';
let stage = 1;
let selected = null;
const t = () => i18n[lang];

function applyI18n() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
    document.title = lang === 'zh'
        ? '牙齒結構與疾病 | Tooth Structure and Disease'
        : 'Tooth Structure and Disease | 牙齒結構與疾病';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (t()[k] != null) el.textContent = t()[k];
    });
    buildPartList();
    updateUI();
}

function buildPartList() {
    const box = document.getElementById('part-list');
    box.innerHTML = PARTS.map(p => `
        <button type="button" class="part-btn w-full text-left px-2.5 py-2 rounded-xl border border-slate-200 text-xs font-bold flex items-center gap-2 ${selected === p.id ? 'active' : ''}" data-part="${p.id}">
            <span class="w-3.5 h-3.5 rounded-full border shrink-0" style="background:${p.color};border-color:${p.border}"></span>
            <span>${t().partName[p.id]}</span>
        </button>`).join('');
    box.querySelectorAll('.part-btn').forEach(btn => {
        btn.addEventListener('mouseenter', () => previewPart(btn.dataset.part));
        btn.addEventListener('mouseleave', () => previewPart(null));
        btn.addEventListener('click', () => selectPart(btn.dataset.part));
    });
}

function setHighlight(id) {
    document.querySelectorAll('.tooth-part').forEach(el => {
        el.classList.toggle('is-on', id && el.dataset.part === id);
    });
    document.querySelectorAll('.lbl').forEach(el => {
        el.classList.toggle('is-on', id && el.dataset.part === id);
    });
    document.querySelectorAll('.part-btn').forEach(el => {
        el.classList.toggle('active', id && el.dataset.part === id);
    });
}

function showInfo(id) {
    const name = document.getElementById('info-name');
    const desc = document.getElementById('info-desc');
    if (!id) {
        name.textContent = '';
        desc.textContent = t().infoIdle;
        return;
    }
    name.textContent = t().partName[id];
    desc.textContent = t().partDesc[id];
}

function previewPart(id) {
    const use = id || selected;
    setHighlight(use);
    showInfo(use);
}

function selectPart(id) {
    selected = id;
    previewPart(selected);
    speakPart(id);
}

let cachedVoices = [];
let speakToken = 0;
let speechTimer = null;

function loadVoices() {
    if (!window.speechSynthesis) return [];
    cachedVoices = speechSynthesis.getVoices() || [];
    return cachedVoices;
}

function pickUkFemaleVoice() {
    const voices = loadVoices();
    if (!voices.length) return null;
    const nameOf = (v) => (v.name || '').toLowerCase();
    const langOf = (v) => (v.lang || '').toLowerCase().replace('_', '-');
    const isGb = (v) => langOf(v).indexOf('en-gb') === 0 || nameOf(v).indexOf('uk english') !== -1;
    const isFemale = (v) => /female|kate|serena|martha|stephanie|flo|sandy|grandma|moira|fiona|samantha/.test(nameOf(v));
    return voices.find((v) => v.name === 'Google UK English Female')
        || voices.find((v) => nameOf(v) === 'google uk english female')
        || voices.find((v) => nameOf(v).indexOf('google uk english female') !== -1)
        || voices.find((v) => nameOf(v).indexOf('uk english female') !== -1)
        || voices.find((v) => isGb(v) && isFemale(v))
        || voices.find((v) => isFemale(v) && langOf(v).indexOf('en') === 0)
        || voices.find((v) => isGb(v))
        || null;
}

function stopSpeech() {
    if (speechTimer) {
        clearTimeout(speechTimer);
        speechTimer = null;
    }
    if (window.speechSynthesis) {
        try { speechSynthesis.cancel(); } catch (e) {}
    }
}

function speakTextUk(text) {
    if (!text || !window.speechSynthesis) return;
    const token = ++speakToken;
    loadVoices();
    const start = () => {
        if (token !== speakToken) return;
        const utter = new SpeechSynthesisUtterance(text);
        const voice = pickUkFemaleVoice();
        utter.lang = 'en-GB';
        utter.rate = 0.92;
        utter.pitch = 1;
        if (voice) {
            utter.voice = voice;
            utter.lang = voice.lang || 'en-GB';
        }
        try { speechSynthesis.cancel(); } catch (e) {}
        if (speechTimer) clearTimeout(speechTimer);
        speechTimer = setTimeout(() => {
            if (token !== speakToken) return;
            speechTimer = null;
            speechSynthesis.speak(utter);
            try { speechSynthesis.resume(); } catch (e2) {}
        }, 60);
    };
    if (!cachedVoices.length) {
        const once = () => {
            speechSynthesis.removeEventListener('voiceschanged', once);
            loadVoices();
            start();
        };
        speechSynthesis.addEventListener('voiceschanged', once);
        setTimeout(() => {
            speechSynthesis.removeEventListener('voiceschanged', once);
            loadVoices();
            start();
        }, 280);
        return;
    }
    start();
}

function speakPart(id) {
    const box = document.getElementById('chk-speak');
    if (!box || !box.checked || !id) return;
    const line = (i18n.en.partSpeak && i18n.en.partSpeak[id]) || i18n.en.partName[id];
    speakTextUk(line);
}

function setMode(next) {
    mode = next;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-' + (next === 'healthy' ? 'healthy' : next === 'caries' ? 'caries' : 'perio')).classList.add('active');
    const slider = document.getElementById('stageSlider');
    slider.disabled = next === 'healthy';
    if (next === 'healthy') stage = 1;
    updateDisease();
    updateUI();
}

function updateDisease() {
    document.querySelectorAll('#g-caries .dz, #g-perio .dz').forEach(g => g.classList.add('hidden'));
    if (mode === 'healthy') return;
    const root = document.getElementById(mode === 'caries' ? 'g-caries' : 'g-perio');
    root.querySelectorAll('.dz').forEach(g => {
        const s = Number(g.getAttribute('data-stage'));
        g.classList.toggle('hidden', s > stage);
    });
}

function updateUI() {
    const title = document.getElementById('stage-title');
    const desc = document.getElementById('stage-desc');
    const hint = document.getElementById('stageHint');
    const stageVal = document.getElementById('stageVal');
    if (mode === 'healthy') {
        title.textContent = t().healthyTitle;
        desc.textContent = t().healthyDesc;
        hint.textContent = t().stageHintOff;
        stageVal.textContent = '—';
    } else {
        const names = t().stageNames;
        const texts = mode === 'caries' ? t().caries : t().perio;
        title.textContent = mode === 'caries' ? t().cariesTitle : t().perioTitle;
        desc.textContent = texts[stage - 1];
        hint.textContent = texts[stage - 1];
        stageVal.textContent = names[stage - 1];
    }
    showInfo(selected);
    const labelsOn = document.getElementById('chk-labels').checked ? '' : 'none';
    document.getElementById('g-labels').style.display = labelsOn;
    const rootTag = document.getElementById('part-root');
    if (rootTag) rootTag.style.display = labelsOn;
    const vis = document.getElementById('chk-vessels').checked ? '' : 'none';
    document.getElementById('g-vessels').style.display = vis;
    const apical = document.getElementById('g-apical');
    if (apical) apical.style.display = vis;
}

function buildTubules() {
    const g = document.getElementById('g-tubules');
    const ns = 'http://www.w3.org/2000/svg';
    g.innerHTML = '';
    const add = (x1, y1, x2, y2, w = 0.9, o = 0.55) => {
        const p = document.createElementNS(ns, 'line');
        p.setAttribute('x1', x1.toFixed(1)); p.setAttribute('y1', y1.toFixed(1));
        p.setAttribute('x2', x2.toFixed(1)); p.setAttribute('y2', y2.toFixed(1));
        p.setAttribute('stroke', '#b8893d');
        p.setAttribute('stroke-width', String(w));
        p.setAttribute('opacity', String(o));
        p.setAttribute('stroke-linecap', 'round');
        g.appendChild(p);
    };
    for (let x = 418; x <= 582; x += 7) {
        add(x, 118, x, 248, 1.05, 0.62);
    }
    for (let i = -7; i <= 7; i++) {
        const o = i * 7;
        add(455 + o, 255, 390 + o * 0.72, 655, 1.05, 0.58);
        add(545 + o, 255, 610 + o * 0.72, 655, 1.05, 0.58);
    }
}

function buildTrabeculae() {
    const g = document.getElementById('g-trabeculae');
    const ns = 'http://www.w3.org/2000/svg';
    g.innerHTML = '';
    const fills = ['#c5ccd4', '#b7c0c9', '#e7ebef', '#9aa6b2', '#d5dbe2'];
    const spots = [];
    for (let y = 310; y <= 735; y += 28) {
        for (let x = 210; x <= 830; x += 30) {
            if (((x + y) % 17) < 4) continue;
            const jx = ((y * 5 + x * 3) % 17) - 8;
            const jy = ((x * 7 + y) % 13) - 6;
            spots.push([x + jx, y + jy, 8 + (x + y) % 8, 6 + (x * y) % 5]);
        }
    }
    spots.forEach(([cx, cy, rx, ry], i) => {
        const e = document.createElementNS(ns, 'ellipse');
        e.setAttribute('cx', cx); e.setAttribute('cy', cy);
        e.setAttribute('rx', rx); e.setAttribute('ry', ry);
        e.setAttribute('fill', fills[i % fills.length]);
        e.setAttribute('stroke', '#aeb6c0');
        e.setAttribute('stroke-width', '0.6');
        g.appendChild(e);
    });
}

function svgPath(parent, d, color, w) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', String(w));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    parent.appendChild(p);
}

function buildVessels() {
    const g = document.getElementById('g-vessels');
    g.innerHTML = '';
    const RED = '#dc2626', BLUE = '#2563eb';
    const lines = [
        ['M432 688 C442 600 456 480 468 380 C474 320 480 280 470 210', BLUE, 2.6],
        ['M444 688 C454 600 466 480 476 380 C482 325 486 285 496 220', RED, 2.1],
        ['M568 688 C558 600 544 480 532 380 C526 320 520 280 530 210', BLUE, 2.6],
        ['M556 688 C546 600 534 480 524 380 C518 325 514 285 504 220', RED, 2.1],
        ['M470 210 C450 188 438 176 424 168', BLUE, 2.0],
        ['M470 210 C486 184 500 174 518 178', BLUE, 1.8],
        ['M530 210 C550 188 562 176 576 168', BLUE, 2.0],
        ['M530 210 C514 184 500 174 482 178', BLUE, 1.8],
        ['M496 220 C478 200 462 190 448 186', RED, 1.5],
        ['M504 220 C522 200 538 190 552 186', RED, 1.5],
        ['M432 688 C418 718 400 738 368 750', BLUE, 2.3],
        ['M444 688 C430 720 412 740 380 752', RED, 1.9],
        ['M568 688 C582 718 600 738 632 750', BLUE, 2.3],
        ['M556 688 C570 720 588 740 620 752', RED, 1.9]
    ];
    lines.forEach(([d, color, w]) => {
        svgPath(g, d, color, w);
        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hit.setAttribute('d', d);
        hit.setAttribute('fill', 'none');
        hit.setAttribute('stroke', 'transparent');
        hit.setAttribute('stroke-width', String(w + 10));
        hit.setAttribute('stroke-linecap', 'round');
        g.appendChild(hit);
    });
}

function buildApical() {
    const g = document.getElementById('g-apical');
    if (g) g.innerHTML = '';
}


function tq(k){
  if(typeof t==="function") return (t.length===0?t()[k]:t(k))??k;
  const L=typeof currentLang!=="undefined"?currentLang:(typeof lang!=="undefined"?lang:"zh");
  return (i18n[L]||{})[k]??k;
}
function renderClassroomQuiz(){
  const box=document.getElementById("quiz-list"); if(!box)return;
  const mk=qid=>["A","B","C","D"].map(L=>`<label class="flex items-start gap-2 bg-slate-50 border border-slate-200 rounded-lg p-2 cursor-pointer hover:bg-rose-50/40"><input type="radio" name="${qid}" class="mt-0.5 accent-rose-600"><span>${L}. ${tq("quizQ"+qid.slice(1)+L.toLowerCase())}</span></label>`).join("");
  const ans=k=>quizAnswersVisible?`<div class="mt-2 text-[11px] text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg p-2"><strong>${tq("quizRef")}：</strong> ${tq(k)}</div>`:"";
  const w=(n,inner)=>`<div class="rounded-xl border border-slate-200 p-3"><p class="font-semibold text-rose-700 mb-2">Q${n} · ${tq("quizQ"+n)}</p>${inner}${ans("quizQ"+n+"ans")}</div>`;
  box.innerHTML=w(1,mk("q1"))+w(2,"")+w(3,mk("q3"))+w(4,"")+w(5,mk("q5"));
  const ab=document.getElementById("btn-quiz-answers"); if(ab) ab.textContent=quizAnswersVisible?tq("quizHideAnswers"):tq("quizShowAnswers");
  if(window.MathJax?.typesetPromise) MathJax.typesetPromise([box]).catch(()=>{});
}
function openQuizModal(){
  if(typeof closeAllModals==="function") closeAllModals();
  else if(typeof closeModal==="function"){closeModal("modal-steps");closeModal("modal-principle");}
  quizAnswersVisible=false;
  if(typeof openModal==="function") openModal("modal-quiz");
  else if(typeof setModal==="function") setModal("modal-quiz",true);
  renderClassroomQuiz();
}
function setModal(id,open){
  if(typeof openModal==="function"){open?openModal(id):closeModal(id);return;}
  /* fallback noop */
}

function openModal(id) {
    const m = document.getElementById(id);
    m.classList.remove('opacity-0', 'pointer-events-none');
    m.querySelector('.modal-content').classList.remove('scale-95', 'opacity-0');
}
function closeModal(id) {
    const m = document.getElementById(id);
    m.classList.add('opacity-0', 'pointer-events-none');
    m.querySelector('.modal-content').classList.add('scale-95', 'opacity-0');
}

function resetAll() {
    selected = null;
    stage = 1;
    document.getElementById('stageSlider').value = 1;
    document.getElementById('chk-labels').checked = true;
    document.getElementById('chk-vessels').checked = true;
    stopSpeech();
    setMode('healthy');
}

document.querySelectorAll('.tooth-part').forEach(el => {
    el.addEventListener('mouseenter', () => previewPart(el.dataset.part));
    el.addEventListener('mouseleave', () => previewPart(null));
    el.addEventListener('click', () => selectPart(el.dataset.part));
});
document.querySelectorAll('.lbl').forEach(el => {
    el.addEventListener('mouseenter', () => previewPart(el.dataset.part));
    el.addEventListener('mouseleave', () => previewPart(null));
    el.addEventListener('click', () => selectPart(el.dataset.part));
});

document.getElementById('mode-healthy').addEventListener('click', () => setMode('healthy'));
document.getElementById('mode-caries').addEventListener('click', () => setMode('caries'));
document.getElementById('mode-perio').addEventListener('click', () => setMode('perio'));
document.getElementById('stageSlider').addEventListener('input', e => {
    stage = Number(e.target.value);
    updateDisease();
    updateUI();
});
document.getElementById('chk-labels').addEventListener('change', updateUI);
document.getElementById('chk-vessels').addEventListener('change', updateUI);
document.getElementById('chk-speak').addEventListener('change', (e) => { if (!e.target.checked) stopSpeech(); });
document.getElementById('btn-reset').addEventListener('click', resetAll);
document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
['steps-close', 'steps-confirm'].forEach(id => document.getElementById(id).addEventListener('click', () => closeModal('modal-steps')));
['modal-close', 'modal-confirm'].forEach(id => document.getElementById(id).addEventListener('click', () => closeModal('modal-principle')));
document.getElementById('modal-steps').addEventListener('click', e => { if (e.target.id === 'modal-steps') closeModal('modal-steps'); });
document.getElementById('modal-principle').addEventListener('click', e => { if (e.target.id === 'modal-principle') closeModal('modal-principle'); closeModal('modal-quiz'); });
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal('modal-steps'); closeModal('modal-principle'); }
});
function toggleLang() {
    lang = lang === 'zh' ? 'en' : 'zh';
    applyI18n();
}
document.getElementById('btn-lang').addEventListener('click', toggleLang);
document.getElementById('btn-lang-mobile').addEventListener('click', toggleLang);

document.addEventListener('DOMContentLoaded', () => {
    buildTubules();
    buildTrabeculae();
    buildVessels();
    buildApical();
    loadVoices();
    if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
    applyI18n();
});


document.getElementById("btn-quiz")?.addEventListener("click",()=>openQuizModal());
document.getElementById("quiz-close")?.addEventListener("click",()=>{if(typeof closeModal==="function")closeModal("modal-quiz");else setModal("modal-quiz",false);});
document.getElementById("quiz-confirm")?.addEventListener("click",()=>{if(typeof closeModal==="function")closeModal("modal-quiz");else setModal("modal-quiz",false);});
document.getElementById("modal-quiz")?.addEventListener("click",e=>{if(e.target.id==="modal-quiz"){if(typeof closeModal==="function")closeModal("modal-quiz");else setModal("modal-quiz",false);}});
document.getElementById("btn-quiz-answers")?.addEventListener("click",()=>{quizAnswersVisible=!quizAnswersVisible;renderClassroomQuiz();});


</script>
