/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

                },

                },

                    en: '(1) Slider back to 50, medium light, pupil “Normal”, both muscles “Moderate”; (2) Reset must not switch language.'
                }
            },
            {
                q: {
                    zh: '根據本模擬控件與設計，哪項最正確？',
                    en: 'Using this sim’s controls and design, which is most correct?'
                },
                choices: [
                    { zh: '以光線強度滑桿驅動環狀肌／放射肌／瞳孔大小，並有步驟／原理／五題／中EN／重置——主軸是瞳孔對光反射，不是睫狀肌調節或近視遠視矯正', en: 'A light-intensity slider drives circular／radial muscles and pupil size, with steps／principle／five quiz items／zh-EN／Reset—focus pupil light reflex, not ciliary accommodation or myopia／hyperopia correction' },
                    { zh: '主要控件是物件距離與晶體厚度', en: 'Main controls are object distance and lens thickness' },
                    { zh: '重置會強制改成英文並進入遠視＋凸透鏡模式', en: 'Reset always switches to English and enters hyperopia＋convex-lens mode' },

                ],
                ans: 0,
                explain: {
                    zh: 'A。隔離 human-eye-accommodation／eye-defects-correction；Reset 不改語言、不改主題。',

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const tt = t();
            const factor = slider.value / 100;

            const bgAlpha = 0.05 + factor * 0.45;
            ctx.fillStyle = 'rgba(255, 253, 208, ' + bgAlpha + ')';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const maxPupilR = 98;
            const minPupilR = 28;
            const pupilRadius = maxPupilR - (factor * (maxPupilR - minPupilR));
            const outerIrisRadius = 135;

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(450, 20);
            ctx.lineTo(450, 460);
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 15px "Noto Sans TC", "Microsoft JhengHei", Arial';
            ctx.textAlign = 'center';
            ctx.fillText(tt.panelAnterior, 225, 40);
            ctx.fillText(tt.panelSide, 675, 40);

            const cx = 225;
            const cy = 250;

            ctx.beginPath();
            ctx.arc(cx, cy, outerIrisRadius + 20, 0, Math.PI * 2);
            ctx.fillStyle = '#f8fafc';
            ctx.fill();
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, outerIrisRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#a7f3d0';
            ctx.fill();
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            const numSpokes = 32;
            const radialLineWidth = 1.5 + (1 - factor) * 2.5;
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = radialLineWidth;

            for (let i = 0; i < numSpokes; i++) {
                const angle = (i * 2 * Math.PI) / numSpokes;
                const innerX = cx + pupilRadius * Math.cos(angle);
                const innerY = cy + pupilRadius * Math.sin(angle);
                const outerX = cx + outerIrisRadius * Math.cos(angle);
                const outerY = cy + outerIrisRadius * Math.sin(angle);
                ctx.beginPath();
                ctx.moveTo(innerX, innerY);
                ctx.lineTo(outerX, outerY);
                ctx.stroke();
            }

            const circularRings = 4;
            const circularLineWidth = 1.5 + (factor * 3.5);
            ctx.strokeStyle = '#ef4444';

            for (let r = 0; r < circularRings; r++) {
                const ringRadius = pupilRadius + 6 + (r * 7);
                if (ringRadius < outerIrisRadius - 5) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
                    ctx.lineWidth = circularLineWidth;
                    ctx.stroke();
                }
            }

            ctx.beginPath();
            ctx.arc(cx, cy, pupilRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx - pupilRadius * 0.3, cy - pupilRadius * 0.3, Math.max(3, pupilRadius * 0.15), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fill();

            const rx = 675;
            const ry = 250;

            const lightRayCount = 7;
            const raySpread = 160;
            ctx.strokeStyle = 'rgba(234, 179, 8, ' + (0.2 + factor * 0.75) + ')';
            ctx.lineWidth = 1 + factor * 2.5;

            for (let i = 0; i < lightRayCount; i++) {
                const startY = ry - (raySpread / 2) + (i * (raySpread / (lightRayCount - 1)));
                if (Math.abs(startY - ry) <= pupilRadius) {
                    ctx.beginPath();
                    ctx.moveTo(rx - 180, startY);
                    ctx.lineTo(rx + 140, startY);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(rx - 180, startY);
                    ctx.lineTo(rx - 30, startY);
                    ctx.stroke();
                }
            }

            ctx.beginPath();
            ctx.arc(rx - 100, ry, 120, -Math.PI * 0.3, Math.PI * 0.3);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#0284c7';
            ctx.font = 'bold 11px "Noto Sans TC", "Microsoft JhengHei", Arial';
            ctx.fillText(tt.labelCornea, rx - 100, ry - 110);

            ctx.beginPath();
            ctx.ellipse(rx + 10, ry, 18, 65, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(186, 230, 253, 0.7)';
            ctx.fill();
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#0284c7';
            ctx.fillText(tt.labelLens, rx + 10, ry - 75);

            const upperIrisTopY = ry - outerIrisRadius;
            const upperIrisBottomY = ry - pupilRadius;
            const lowerIrisTopY = ry + pupilRadius;
            const lowerIrisBottomY = ry + outerIrisRadius;

            drawIrisFlap(rx - 30, upperIrisTopY, upperIrisBottomY, factor);
            drawIrisFlap(rx - 30, lowerIrisTopY, lowerIrisBottomY, factor);

            updateUI(factor);
        }

        function drawIrisFlap(x, startY, endY, factor) {
            const width = 24;

            ctx.beginPath();
            ctx.fillStyle = '#a7f3d0';
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 2;
            ctx.roundRect(x, Math.min(startY, endY), width, Math.abs(endY - startY), 4);
            ctx.fill();
            ctx.stroke();

            const cmHeight = 12 + factor * 8;
            const cmY = (startY < endY) ? endY - cmHeight : startY;

            ctx.beginPath();
            ctx.fillStyle = '#ef4444';
            ctx.strokeStyle = '#b91c1c';
            ctx.lineWidth = 1.5;
            ctx.rect(x + 2, cmY, width - 4, cmHeight);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 2 + (1 - factor) * 2;
            ctx.beginPath();
            ctx.moveTo(x + width / 2, startY);
            ctx.lineTo(x + width / 2, endY);
            ctx.stroke();
        }

        function updateUI(factor) {
            const tt = t();
            if (factor < 0.35) {
                lightValLabel.innerText = tt.lightDim;
                lightValLabel.style.color = '#d97706';
                circularStatus.innerText = tt.muscleRelaxed;
                circularStatus.style.color = '#16a34a';
                radialStatus.innerText = tt.muscleContracted;
                radialStatus.style.color = '#dc2626';
                pupilStatus.innerText = tt.pupilDilated;
                pupilStatus.style.color = '#2563eb';
            } else if (factor > 0.65) {
                lightValLabel.innerText = tt.lightBright;
                lightValLabel.style.color = '#ea580c';
                circularStatus.innerText = tt.muscleContracted;
                circularStatus.style.color = '#dc2626';
                radialStatus.innerText = tt.muscleRelaxed;
                radialStatus.style.color = '#16a34a';
                pupilStatus.innerText = tt.pupilConstricted;
                pupilStatus.style.color = '#2563eb';
            } else {
                lightValLabel.innerText = tt.lightMedium;
                lightValLabel.style.color = '#2563eb';
                circularStatus.innerText = tt.muscleModerate;
                circularStatus.style.color = '#475569';
                radialStatus.innerText = tt.muscleModerate;
                radialStatus.style.color = '#475569';
                pupilStatus.innerText = tt.pupilNormal;
                pupilStatus.style.color = '#2563eb';
            }
        }

        function applyLanguage() {
            const tt = t();
            document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
            document.title = currentLang === 'zh'
                ? '瞳孔光反射模擬｜Pupil Light Reflex Simulation'
                : 'Pupil Light Reflex Simulation｜瞳孔光反射模擬';
            document.getElementById('btn-lang').textContent = tt.langBtn;
            document.getElementById('title').textContent = tt.title;
            document.getElementById('subtitle').textContent = tt.subtitle;
            document.getElementById('badge-subject').textContent = tt.badge;
            document.getElementById('btn-steps').textContent = tt.btnSteps;
            document.getElementById('btn-principle').textContent = tt.btnPrinciple;
            document.getElementById('btn-quiz').textContent = tt.btnQuiz;
            document.getElementById('btn-reset').textContent = tt.btnReset;
            document.getElementById('btn-reset-panel').textContent = tt.btnReset;
            document.getElementById('setupHeading').textContent = tt.setupHeading;
            document.getElementById('labelLight').textContent = tt.labelLight;
            document.getElementById('hintText').textContent = tt.hintText;
            document.getElementById('cardCircularTitle').textContent = tt.cardCircularTitle;
            document.getElementById('cardRadialTitle').textContent = tt.cardRadialTitle;
            document.getElementById('cardPupilTitle').textContent = tt.cardPupilTitle;
            document.getElementById('legCircular').textContent = tt.legCircular;
            document.getElementById('legRadial').textContent = tt.legRadial;
            document.getElementById('legIris').textContent = tt.legIris;
            document.getElementById('legPupil').textContent = tt.legPupil;
            document.getElementById('legLight').textContent = tt.legLight;
            document.getElementById('steps-title').textContent = tt.stepsTitle;
            document.getElementById('principle-title').textContent = tt.principleTitle;
            document.getElementById('quiz-title').textContent = tt.quizTitle;
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? tt.hideAns : tt.showAns;
            if (!document.getElementById('modal-steps').classList.contains('hidden')) renderSteps();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) renderPrinciple();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) renderQuiz();
            draw();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            applyLanguage();
        }

        function renderSteps() {
            const tt = t();
            const body = document.getElementById('steps-body');
            body.innerHTML = tt.steps.map(function(s, i) {
                const colors = ['bg-indigo-50 border-indigo-100', 'bg-teal-50 border-teal-100', 'bg-sky-50 border-sky-100', 'bg-amber-50 border-amber-100'];
                return '<div class="p-4 rounded-xl border ' + colors[i % 4] + '"><p class="font-bold text-slate-800 mb-1">' + s.t + '</p><p class="text-slate-700 leading-relaxed">' + s.b + '</p></div>';
            }).join('');
        }

        function renderPrinciple() {
            const tt = t();
            const body = document.getElementById('principle-body');
            let html = '<div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100"><h3 class="font-bold text-indigo-900 mb-2">' + tt.conceptTitle + '</h3><p class="text-slate-700">' + tt.concept + '</p></div>';
            html += '<div><h3 class="font-bold text-teal-800 mb-2">' + tt.mechTitle + '</h3><ol class="list-decimal list-inside space-y-2 text-slate-700">';
            tt.mech.forEach(function(m) { html += '<li>' + m + '</li>'; });
            html += '</ol></div>';
            html += '<div class="p-4 bg-emerald-50 rounded-xl border border-emerald-100"><h3 class="font-bold text-emerald-900 mb-2">' + tt.egTitle + '</h3><p class="text-slate-700">' + tt.eg + '</p></div>';
            body.innerHTML = html;
        }

        function renderQuiz() {
            const tt = t();
            const body = document.getElementById('quiz-body');
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? tt.hideAns : tt.showAns;
            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            QUIZ.forEach(function(item, i) {
                const qtext = item.q[currentLang] || item.q.zh;
                html += '<div class="p-4 rounded-xl border border-violet-100 bg-violet-50/40 space-y-2 mb-3">';
                html += '<p class="font-bold text-violet-900">Q' + (i + 1) + '. ' + qtext + '</p>';
                const qNum = i + 1;
                const isOpen = (qNum === 2 || qNum === 4);
                if (!isOpen && item.choices) {
                    const qName = 'q' + qNum;
                    html += '<div class="grid gap-1.5">';
                    item.choices.forEach(function(c, j) {
                        html += '<label class="flex items-start gap-2 rounded-lg border border-violet-100 p-2 cursor-pointer hover:bg-violet-50/60"><input type="radio" name="' + qName + '" class="mt-0.5 accent-violet-600"><span class="text-sm">' + letters[j] + '. ' + (c[currentLang] || c.zh) + '</span></label>';
                    });
                    html += '</div>';
                } else if (isOpen) {
                    html += '<p class="text-xs text-slate-500 italic">' + (currentLang === 'zh' ? '先預測，再操作畫面控件核對，用自己的話作答。' : 'Predict, then use the sim controls to check. Write in your own words.') + '</p>';
                }
                if (quizReveal && item.explain) {
                    const ref = currentLang === 'zh' ? '參考答案' : 'Reference answer';
                    html += '<div class="mt-2 p-2 rounded-lg bg-emerald-50 border border-emerald-100 text-xs text-emerald-900"><strong>' + ref + '：</strong> ' + (item.explain[currentLang] || item.explain.zh) + '</div>';
                }
                html += '</div>';
            });
            body.innerHTML = html;
        }

        function closeAllModals(exceptId) {
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
                if (exceptId && id === exceptId) return;
                const modal = document.getElementById(id);
                if (!modal || modal.classList.contains('hidden')) return;
                if (modalCloseTimers[id]) {
                    clearTimeout(modalCloseTimers[id]);
                    delete modalCloseTimers[id];
                }
                modal.classList.add('hidden');
            });
        }

        function openTeachModal(id) {
            closeAllModals(id);
            const modal = document.getElementById(id);
            if (!modal) return;
            if (modalCloseTimers[id]) {
                clearTimeout(modalCloseTimers[id]);
                delete modalCloseTimers[id];
            }
            modal.classList.remove('hidden');
        }

        function resetAll() {
            closeAllModals(null);
            slider.value = 50;
            quizReveal = false;
            draw();
        }

        slider.addEventListener('input', draw);

        document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
        document.getElementById('btn-reset').addEventListener('click', resetAll);
        document.getElementById('btn-steps').addEventListener('click', function() { renderSteps(); openTeachModal('modal-steps'); });
        document.getElementById('btn-principle').addEventListener('click', function() { renderPrinciple(); openTeachModal('modal-principle'); });
        document.getElementById('btn-quiz').addEventListener('click', function() { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
        document.getElementById('btn-quiz-answers').addEventListener('click', function() { quizReveal = !quizReveal; renderQuiz(); });
        document.querySelectorAll('.modal-close').forEach(function(btn) {
            btn.addEventListener('click', function() { closeAllModals(null); });
        });
        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
            document.getElementById(id).addEventListener('click', function(e) {
                if (e.target === this) closeAllModals(null);
            });
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAllModals(null);
        });

        applyLanguage();
    </script>
