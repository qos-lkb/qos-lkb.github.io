/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const distSlider = document.getElementById('distSlider');
        const distValLabel = document.getElementById('distVal');

        function t() { return i18n[currentLang]; }

        function setCondition(cond) {
            condition = cond;
            document.getElementById('btnNormal').classList.toggle('active', cond === 'normal');
            document.getElementById('btnShort').classList.toggle('active', cond === 'short');
            document.getElementById('btnLong').classList.toggle('active', cond === 'long');
            draw();
        }

        function setLens(type) {
            lensType = type;
            document.getElementById('btnLensNone').classList.toggle('active', type === 'none');
            document.getElementById('btnLensConcave').classList.toggle('active', type === 'concave');
            document.getElementById('btnLensConvex').classList.toggle('active', type === 'convex');
            draw();
        }

        function draw() {
            const tt = t();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cy = canvas.height / 2;
            const eyeCenterX = 580;
            const eyeRadiusY = 110;

            const objDist = parseFloat(distSlider.value);
            const lensX = 300;
            const objectX = lensX - objDist;

            if (objDist < 100) {
                distValLabel.innerText = tt.distNear;
                distValLabel.style.color = '#dc2626';
            } else if (objDist > 180) {
                distValLabel.innerText = tt.distFar;
                distValLabel.style.color = '#16a34a';
            } else {
                distValLabel.innerText = tt.distMedium;
                distValLabel.style.color = '#2563eb';
            }

            let eyeRadiusX, eyeLensThickness, uncorrectedFocalX;

            if (condition === 'normal') {
                eyeRadiusX = 110;
                eyeLensThickness = 22 + (120 - objDist) * 0.12;
                uncorrectedFocalX = eyeCenterX + eyeRadiusX;
            } else if (condition === 'short') {
                eyeRadiusX = 125;
                const retinaPos = eyeCenterX + eyeRadiusX;
                eyeLensThickness = 29 + (100 - objDist) * 0.08;
                eyeLensThickness = Math.max(25, Math.min(34, eyeLensThickness));
                if (objDist < 100 && lensType === 'none') {
                    uncorrectedFocalX = retinaPos;
                } else {
                    const distOffset = (objDist - 70) * 0.42;
                    uncorrectedFocalX = retinaPos - Math.max(0, distOffset);
                }
            } else if (condition === 'long') {
                eyeRadiusX = 98;
                const retinaPos = eyeCenterX + eyeRadiusX;
                eyeLensThickness = 14 + (180 - objDist) * 0.06;
                eyeLensThickness = Math.max(12, Math.min(19, eyeLensThickness));
                if (objDist > 180 && lensType === 'none') {
                    uncorrectedFocalX = retinaPos;
                } else {
                    const distOffset = (180 - objDist) * 0.55;
                    uncorrectedFocalX = retinaPos + distOffset;
                }
            }

            const corneaX = eyeCenterX - eyeRadiusX;
            const retinaX = eyeCenterX + eyeRadiusX;

            let focalX = uncorrectedFocalX;
            if (lensType === 'concave') {
                if (condition === 'short') focalX = retinaX;
                else focalX += 45;
            } else if (lensType === 'convex') {
                if (condition === 'long') focalX = retinaX;
                else focalX -= 45;
            }

            drawObject(objectX, cy);

            ctx.beginPath();
            ctx.ellipse(eyeCenterX, cy, eyeRadiusX, eyeRadiusY, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#f8fafc';
            ctx.fill();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            const angleExtent = Math.PI * 0.38;
            for (let a = -angleExtent; a <= angleExtent; a += 0.02) {
                const rx = eyeCenterX + eyeRadiusX * Math.cos(a);
                const ry = cy + eyeRadiusY * Math.sin(a);
                if (a === -angleExtent) ctx.moveTo(rx, ry);
                else ctx.lineTo(rx, ry);
            }
            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.fillStyle = '#15803d';
            ctx.font = 'bold 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(tt.canvasRetina, retinaX + 45, cy - 5);

            ctx.beginPath();
            ctx.arc(corneaX + 15, cy, 75, -Math.PI * 0.26, Math.PI * 0.26);
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            const eyeLensX = corneaX + 40;
            ctx.beginPath();
            ctx.ellipse(eyeLensX, cy, Math.max(4, eyeLensThickness / 2), 48, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(186, 230, 253, 0.85)';
            ctx.fill();
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#0369a1';
            ctx.font = 'bold 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
            ctx.fillText(tt.canvasCrystalline, eyeLensX, cy - 58);

            if (lensType !== 'none') {
                ctx.beginPath();
                ctx.fillStyle = 'rgba(186, 230, 253, 0.4)';
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 2;
                if (lensType === 'concave') {
                    ctx.moveTo(lensX - 10, cy - 55);
                    ctx.lineTo(lensX + 10, cy - 55);
                    ctx.quadraticCurveTo(lensX + 2, cy, lensX + 10, cy + 55);
                    ctx.lineTo(lensX - 10, cy + 55);
                    ctx.quadraticCurveTo(lensX - 2, cy, lensX - 10, cy - 55);
                } else if (lensType === 'convex') {
                    ctx.moveTo(lensX, cy - 55);
                    ctx.quadraticCurveTo(lensX + 14, cy, lensX, cy + 55);
                    ctx.quadraticCurveTo(lensX - 14, cy, lensX, cy + 55);
                    ctx.quadraticCurveTo(lensX - 14, cy, lensX, cy - 55);
                }
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#0284c7';
                ctx.font = 'bold 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
                ctx.fillText(lensType === 'concave' ? tt.canvasConcave : tt.canvasConvex, lensX, cy - 68);
            }

            const rayOffsets = [-35, -18, 0, 18, 35];
            rayOffsets.forEach(yOffset => {
                ctx.beginPath();
                ctx.strokeStyle = '#d97706';
                ctx.lineWidth = 2;
                ctx.moveTo(objectX, cy);
                let currentY = cy + yOffset;
                if (lensType === 'none') {
                    ctx.lineTo(eyeLensX, currentY);
                    ctx.lineTo(focalX, cy);
                } else if (lensType === 'concave') {
                    ctx.lineTo(lensX, currentY);
                    currentY += yOffset * 0.35;
                    ctx.lineTo(eyeLensX, currentY);
                    ctx.lineTo(focalX, cy);
                } else if (lensType === 'convex') {
                    ctx.lineTo(lensX, currentY);
                    currentY -= yOffset * 0.30;
                    ctx.lineTo(eyeLensX, currentY);
                    ctx.lineTo(focalX, cy);
                }
                ctx.stroke();
            });

            ctx.beginPath();
            ctx.arc(focalX, cy, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#dc2626';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            if (Math.abs(focalX - retinaX) < 10) {
                ctx.fillText(tt.canvasOnRetina, focalX, cy + 25);
            } else if (focalX < retinaX) {
                ctx.fillText(tt.canvasInFront, focalX, cy + 25);
            } else {
                ctx.fillText(tt.canvasBehind, focalX, cy + 25);
            }

            updateUI(focalX, retinaX, objDist);
        }

        function drawObject(x, cy) {
            const tt = t();
            ctx.fillStyle = '#f97316';
            ctx.fillRect(x - 6, cy - 25, 12, 50);
            ctx.strokeStyle = '#c2410c';
            ctx.lineWidth = 1;
            ctx.strokeRect(x - 6, cy - 25, 12, 50);
            ctx.beginPath();
            ctx.ellipse(x, cy - 32, 6, 10, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#facc15';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x, cy - 30, 3, 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.fillStyle = '#c2410c';
            ctx.font = 'bold 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(tt.canvasObject, x, cy + 42);
        }

        function updateUI(focalX, retinaX, objDist) {
            const tt = t();
            const shapeStatus = document.getElementById('shapeStatus');
            const lensStatus = document.getElementById('lensStatus');
            const focusStatus = document.getElementById('focusStatus');

            if (condition === 'normal') shapeStatus.innerHTML = tt.shapeNormal;
            else if (condition === 'short') shapeStatus.innerHTML = tt.shapeShort;
            else shapeStatus.innerHTML = tt.shapeLong;

            if (condition === 'normal') {
                if (lensType !== 'none') lensStatus.innerHTML = tt.lensDistorted;
                else if (objDist < 100) lensStatus.innerHTML = tt.lensThicker;
                else if (objDist > 180) lensStatus.innerHTML = tt.lensThinner;
                else lensStatus.innerHTML = tt.lensNormalAcc;
            } else if (condition === 'short') {
                if (lensType === 'concave') lensStatus.innerHTML = tt.lensCorrConcave;
                else if (objDist < 100) lensStatus.innerHTML = tt.lensNearOk;
                else lensStatus.innerHTML = tt.lensCannotFlatten;
            } else if (condition === 'long') {
                if (lensType === 'convex') lensStatus.innerHTML = tt.lensCorrConvex;
                else if (objDist > 180) lensStatus.innerHTML = tt.lensFarOk;
                else lensStatus.innerHTML = tt.lensCannotThicken;
            }

            if (condition === 'long' && lensType === 'none') {
                if (objDist <= 180) focusStatus.innerHTML = tt.focusBehind;
                else focusStatus.innerHTML = tt.focusClear;
            } else {
                const isCorrected = Math.abs(focalX - retinaX) < 10;
                if (isCorrected) focusStatus.innerHTML = tt.focusClear;
                else if (focalX < retinaX) focusStatus.innerHTML = tt.focusFront;
                else focusStatus.innerHTML = tt.focusBehind;
            }
        }

        function renderQuiz() {
            const tt = t();
            const body = document.getElementById('quiz-body');
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? tt.hideAns : tt.showAns;
            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            QUIZ.forEach(function(item, i) {
                const qtext = item.q[currentLang] || item.q.zh;
                html += '<div class="p-4 rounded-xl border border-violet-100 bg-violet-50/40 space-y-2 mb-3">';
                html += '<p class="font-bold text-violet-900">Q' + (i + 1) + '. ' + qtext + '</p>';
                const qNum = i + 1;
                const isOpen = (qNum === 2 || qNum === 4);
                if (!isOpen && item.choices) {
                    const qName = 'q' + qNum;
                    html += '<div class="grid gap-1.5">';
                    item.choices.forEach(function(c, j) {
                        html += '<label class="flex items-start gap-2 rounded-lg border border-violet-100 p-2 cursor-pointer hover:bg-violet-50/60"><input type="radio" name="' + qName + '" class="mt-0.5 accent-violet-600"><span class="text-sm">' + letters[j] + '. ' + (c[currentLang] || c.zh) + '</span></label>';
                    });
                    html += '</div>';
                } else if (isOpen) {
                    html += '<p class="text-xs text-slate-500 italic">' + (currentLang === 'zh' ? '先預測，再操作畫面控件核對，用自己的話作答。' : 'Predict, then use the sim controls to check. Write in your own words.') + '</p>';
                }
                if (quizReveal && item.explain) {
                    const ref = currentLang === 'zh' ? '參考答案' : 'Reference answer';
                    html += '<div class="mt-2 p-2 rounded-lg bg-emerald-50 border border-emerald-100 text-xs text-emerald-900"><strong>' + ref + '：</strong> ' + (item.explain[currentLang] || item.explain.zh) + '</div>';
                }
                html += '</div>';
            });
            body.innerHTML = html;
        }

        function closeAllModals(exceptId) {
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
                if (exceptId && id === exceptId) return;
                const modal = document.getElementById(id);
                if (!modal || modal.classList.contains('hidden')) return;
                if (modalCloseTimers[id]) {
                    clearTimeout(modalCloseTimers[id]);
                    delete modalCloseTimers[id];
                }
                modal.classList.add('hidden');
            });
        }

        function openTeachModal(id) {
            closeAllModals(id);
            const modal = document.getElementById(id);
            if (!modal) return;
            if (modalCloseTimers[id]) {
                clearTimeout(modalCloseTimers[id]);
                delete modalCloseTimers[id];
            }
            modal.classList.remove('hidden');
        }

        function resetAll() {
            closeAllModals(null);
            setCondition('normal');
            setLens('none');
            distSlider.value = 120;
            quizReveal = false;
            draw();
        }

        distSlider.addEventListener('input', draw);

        document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
        document.getElementById('btn-reset').addEventListener('click', resetAll);
        document.getElementById('btn-steps').addEventListener('click', function() { renderSteps(); openTeachModal('modal-steps'); });
        document.getElementById('btn-principle').addEventListener('click', function() { renderPrinciple(); openTeachModal('modal-principle'); });
        document.getElementById('btn-quiz').addEventListener('click', function() { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
        document.getElementById('btn-quiz-answers').addEventListener('click', function() { quizReveal = !quizReveal; renderQuiz(); });
        document.querySelectorAll('.modal-close').forEach(function(btn) {
            btn.addEventListener('click', function() { closeAllModals(null); });
        });
        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
            document.getElementById(id).addEventListener('click', function(e) {
                if (e.target === this) closeAllModals(null);
            });
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAllModals(null);
        });

        applyLanguage();
    </script>
</body>
</html>
