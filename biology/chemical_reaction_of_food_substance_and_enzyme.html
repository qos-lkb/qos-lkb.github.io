function t() { return i18n[lang]; }
function lerp(a, b, u) { return a + (b - a) * u; }
function ease(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
function byId(id) { return actors.find(a => a.id === id); }

function alive() { return gen; }
function cancelled(token) { return token !== gen; }

function wait(ms) {
    const token = gen;
    return new Promise(resolve => {
        setTimeout(() => resolve(!cancelled(token)), ms / animSpeed);
    });
}

function tween(obj, to, dur) {
    const token = gen;
    const from = {};
    for (const k of Object.keys(to)) from[k] = obj[k];
    const ms = dur / animSpeed;
    return new Promise(resolve => {
        const t0 = performance.now();
        function step(now) {
            if (cancelled(token)) return resolve(false);
            const u = Math.min(1, (now - t0) / ms);
            const e = ease(u);
            for (const k of Object.keys(to)) obj[k] = lerp(from[k], to[k], e);
            if (u < 1) requestAnimationFrame(step);
            else resolve(true);
        }
        requestAnimationFrame(step);
    });
}

function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 40 + Math.random() * 90;
        particles.push({
            x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 20,
            life: 1, color, r: 1.6 + Math.random() * 2.2
        });
    }
}

function addGlucose(id, x, y, extra) {
    actors.push(Object.assign({ id, kind: 'glucose', x, y, a: 1, s: 1, bob: Math.random() * 6 }, extra || {}));
}
function addWater(id, x, y, extra) {
    actors.push(Object.assign({ id, kind: 'water', x, y, a: 0.4, s: 1, rot: 0, bob: Math.random() * 6 }, extra || {}));
}
function addEnzyme(id, x, y, paletteKey, extra) {
    actors.push(Object.assign({
        id, kind: 'enzyme', x, y, a: 1, s: 1, rot: 0,
        palette: paletteKey, r: 76, pocket: 1, glow: 0
    }, extra || {}));
}
function addBond(a, b, extra) {
    bonds.push(Object.assign({ a, b, alpha: 1, breaking: false, width: 5, color: '#94a3b8' }, extra || {}));
}
function addLabel(id, x, y, key, extra) {
    labels.push(Object.assign({ id, x, y, key, a: 0, size: 13, color: '#334155' }, extra || {}));
}

function clearScene() {
    actors = [];

function buildIdle() {
    clearScene();
    const cx = VW / 2, cy = 250;
    switch (currentReaction) {
        case 'hydrolysis_poly': {
            const n = 6, gap = 62, x0 = cx - (n - 1) * gap / 2;
            for (let i = 0; i < n; i++) addGlucose('g' + i, x0 + i * gap, cy);
            for (let i = 0; i < n - 1; i++) addBond('g' + i, 'g' + (i + 1));
            addEnzyme('enz', cx, 132, 'amylase', { r: 70 });
            addWater('w0', x0 + 1.5 * gap, cy - 88);
            addWater('w1', x0 + 3.5 * gap, cy - 70);
            addLabel('title', cx, cy + 58, 'starch', { a: 1, size: 15, color: '#0369a1' });
            break;
        }
        case 'hydrolysis_di': {
            addGlucose('g0', cx - 34, cy);
            addGlucose('g1', cx + 34, cy);
            addBond('g0', 'g1');
            addEnzyme('enz', cx, 132, 'maltase', { r: 72 });
            addWater('w0', cx, cy - 90);
            addLabel('title', cx, cy + 58, 'maltose', { a: 1, size: 15, color: '#0369a1' });
            break;
        }
        case 'condensation': {
            const pts = [[cx - 160, cy - 20], [cx - 40, cy + 36], [cx + 70, cy - 28], [cx + 180, cy + 24]];
            pts.forEach((p, i) => addGlucose('g' + i, p[0], p[1]));
            addEnzyme('enz', cx, 132, 'synth', { r: 72 });
            for (let i = 0; i < 3; i++) addWater('w' + i, cx - 40 + i * 50, cy + 90, { a: 0 });
            addLabel('title', cx, 430, 'glucose', { a: 1, size: 14, color: '#0369a1' });
            break;
        }
        case 'deamination': {
            actors.push({ id: 'liver', kind: 'liver', x: cx, y: 210, a: 0.18, s: 1 });
            actors.push({ id: 'aa', kind: 'amino', x: cx, y: cy + 10, a: 1, s: 1, bob: 1 });
            actors.push({ id: 'urea', kind: 'urea', x: cx - 30, y: cy + 10, a: 0, s: 0.7 });
            actors.push({ id: 'carb', kind: 'carb', x: cx + 30, y: cy + 10, a: 0, s: 0.7 });
            addEnzyme('enz', cx, 128, 'deam', { r: 72 });
            addLabel('aaL', cx, cy - 48, 'excessAA', { a: 1, size: 14, color: '#9f1239' });
            addLabel('uL', cx - 170, 400, 'urea', { a: 0, size: 14, color: '#6b21a8' });
            addLabel('cL', cx + 170, 400, 'carb', { a: 0, size: 14, color: '#a16207' });
            break;
        }
        case 'lipid_hydrolysis': {
            actors.push({ id: 'gly', kind: 'glycerol', x: cx - 70, y: cy, a: 1, s: 1 });
            for (let i = 0; i < 3; i++) {
                actors.push({ id: 'fa' + i, kind: 'fa', x: cx - 42, y: cy - 36 + i * 36, a: 1, s: 1, wave: i });
                addBond('gly', 'fa' + i, { width: 4, padA: 18, padB: 8 });
                addWater('w' + i, cx + 160, cy - 36 + i * 36);
            }
            addEnzyme('enz', cx + 230, cy, 'lipase', { r: 72, rot: Math.PI / 2 });
            addLabel('title', cx - 10, cy - 92, 'triglyceride', { a: 1, size: 15, color: '#9a3412' });
            addLabel('gL', cx - 70, cy + 92, 'glycerol', { a: 0, size: 13, color: '#c2410c' });
            addLabel('fL', cx + 160, cy + 92, 'fattyAcids', { a: 0, size: 13, color: '#a16207' });
            break;
        }
    }
}

function setPlaying(on) {
    isPlaying = on;
    const btn = document.getElementById('btn-play');
    btn.disabled = on;
    btn.classList.toggle('opacity-50', on);
    btn.classList.toggle('cursor-not-allowed', on);
}

function setStatus(idx) {
    const el = document.getElementById('status-indicator');
    if (typeof idx === 'string') el.textContent = t()[idx] || idx;
    else el.textContent = t().anim[currentReaction][idx];
}

function stopAnim() {
    gen++;
    setPlaying(false);
}

function applyI18n() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (t()[k] != null) el.textContent = t()[k];
    });
    buildNav();
    updateUI();
}

function buildNav() {
    const nav = document.getElementById('nav-menu');
    nav.innerHTML = REACTION_IDS.map(id => {
        const n = t().nav[id];
        const active = id === currentReaction ? 'active' : '';
        return `<button type="button" class="nav-btn w-full text-left p-2.5 rounded-xl border border-slate-200 text-xs font-bold transition-colors ${active}" data-id="${id}">
            <div>${n.short}</div>
            <div class="text-[10px] text-slate-500 font-medium mt-0.5">${n.sub}</div>
        </button>`;
    }).join('');
    nav.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => switchReaction(btn.dataset.id));
    });
}

function updateUI() {
    const data = t().rxn[currentReaction];
    document.getElementById('reaction-title').textContent = data.title;
    document.getElementById('reaction-desc').textContent = data.desc;
    document.getElementById('info-title').textContent = data.title;
    document.getElementById('info-desc').textContent = data.desc;
    document.getElementById('info-notes').innerHTML = data.notes.map(n =>
        `<li class="flex gap-2"><span class="text-emerald-500">▸</span><span>${n}</span></li>`
    ).join('');
    document.getElementById('eq-badge').textContent = t().eq[currentReaction];
    if (!isPlaying) setStatus('statusWait');
}

function switchReaction(id) {
    if (id === currentReaction && !isPlaying) return;
    stopAnim();
    currentReaction = id;
    buildIdle();
    buildNav();
    updateUI();
}

function resetAll() {
    stopAnim();
    buildIdle();
    setStatus('statusWait');
}

async function playReaction() {
    if (isPlaying) return;
    stopAnim();
    const token = gen;
    buildIdle();
    setPlaying(true);
    let ok = true;
    try {
        switch (currentReaction) {
            case 'hydrolysis_poly': ok = await animPoly(); break;
            case 'hydrolysis_di': ok = await animDi(); break;
            case 'condensation': ok = await animCond(); break;
            case 'deamination': ok = await animDeam(); break;
            case 'lipid_hydrolysis': ok = await animLipid(); break;
        }
    } catch (e) {
        ok = false;
    }
    if (cancelled(token)) return;
    setPlaying(false);
    if (ok) setStatus('statusDone');
}

async function animPoly() {
    setStatus(0);
    const enz = byId('enz');
    const g = i => byId('g' + i);
    const title = labels.find(l => l.id === 'title');
    if (title) title.a = 0;

    async function cleave(bondIdx, left, right, water) {
        const x = (left.x + right.x) / 2;
        const y = (left.y + right.y) / 2;
        if (!await tween(enz, { x, y, pocket: 0.16, glow: 1, s: 1.05 }, 750)) return false;
        water.a = 1;
        if (!await tween(water, { x, y: y + 8, s: 1 }, 380)) return false;
        bonds[bondIdx].breaking = true;
        bonds[bondIdx].color = '#ef4444';
        if (!await wait(500)) return false;
        burst(x, y, '#fb7185');
        bonds[bondIdx].alpha = 0;
        if (!await tween(water, { a: 0, s: 0.35, y: y + 24 }, 260)) return false;
        if (!await tween(enz, { pocket: 0.9, glow: 0.2, s: 1 }, 280)) return false;
        return true;
    }

    if (!await cleave(1, g(1), g(2), byId('w0'))) return false;
    setStatus(1);
    if (!await cleave(3, g(3), g(4), byId('w1'))) return false;
    setStatus(2);
    if (!await tween(enz, { pocket: 1, glow: 0, s: 1 }, 220)) return false;
    const pairs = [
        [g(0), g(1), 240, 355],
        [g(2), g(3), 450, 365],
        [g(4), g(5), 660, 355]
    ];
    const moves = [];
    pairs.forEach((p, i) => {
        const [a, b, x, y] = p;
        const gap = 31;
        moves.push(tween(a, { x: x - gap, y }, 900), tween(b, { x: x + gap, y }, 900));
        addLabel('m' + i, x, y + 42, 'maltose', { a: 0, size: 12, color: '#0369a1' });
        moves.push(tween(labels[labels.length - 1], { a: 1 }, 700));
    });
    moves.push(tween(enz, { x: 755, y: 118, a: 0.6, pocket: 1, glow: 0 }, 900));
    if (!await Promise.all(moves).then(rs => rs.every(Boolean))) return false;
    return true;
}

    ]).then(rs => rs.every(Boolean))) return false;

}

async function animCond() {
    setStatus(0);
    const enz = byId('enz');
    const xs = [330, 392, 454, 516];
    const y = 280;
    if (!await tween(enz, { x: xs[1], y: y - 10, pocket: 0.7, glow: 0.4 }, 600)) return false;
    setStatus(1);
    const moves = [];
    for (let i = 0; i < 4; i++) moves.push(tween(byId('g' + i), { x: xs[i], y }, 900));
    if (!await Promise.all(moves).then(rs => rs.every(Boolean))) return false;
    for (let i = 0; i < 3; i++) {
        const midX = (xs[i] + xs[i + 1]) / 2;
        if (!await tween(enz, { x: midX, y, pocket: 0.16, glow: 1, s: 1.05 }, 500)) return false;
        addBond('g' + i, 'g' + (i + 1), { alpha: 0 });
        const bond = bonds[bonds.length - 1];
        await tween(bond, { alpha: 1 }, 260);
        const w = byId('w' + i);
        w.x = midX; w.y = y; w.a = 1;
        burst(midX, y - 12, '#38bdf8');
        tween(w, { y: 145, a: 0.9 }, 700);
        if (!await tween(enz, { pocket: 0.75, glow: 0.35, s: 1 }, 220)) return false;
        if (cancelled(gen)) return false;
    }
    setStatus(2);
    labels.find(l => l.id === 'title').key = 'glycogen';
    if (!await Promise.all([
        tween(enz, { x: 755, y: 118, a: 0.6, pocket: 1, glow: 0 }, 800),
        tween(labels.find(l => l.id === 'title'), { y: 340, a: 1 }, 500)
    ]).then(rs => rs.every(Boolean))) return false;
    return true;
}

async function animDeam() {
    setStatus(0);
    const liver = byId('liver'), aa = byId('aa'), enz = byId('enz');
    if (!await tween(liver, { a: 0.4 }, 500)) return false;
    if (!await tween(enz, { x: aa.x, y: aa.y, pocket: 0.14, glow: 1, s: 1.08 }, 800)) return false;
    setStatus(1);
    burst(aa.x - 28, aa.y, '#818cf8');
    burst(aa.x + 20, aa.y, '#fbbf24');
    const urea = byId('urea'), carb = byId('carb');
    urea.x = aa.x - 24; urea.y = aa.y; urea.a = 1; urea.s = 1;
    carb.x = aa.x + 24; carb.y = aa.y; carb.a = 1; carb.s = 1;
    aa.a = 0;
    labels.find(l => l.id === 'aaL').a = 0;
    if (!await tween(enz, { pocket: 0.95, glow: 0.2, s: 1 }, 350)) return false;
    setStatus(2);
    if (!await Promise.all([
        tween(urea, { x: 250, y: 340 }, 900),
        tween(carb, { x: 650, y: 340 }, 900),
        tween(enz, { x: 755, y: 118, a: 0.55, pocket: 1, glow: 0 }, 900),
        tween(labels.find(l => l.id === 'uL'), { a: 1, y: 400 }, 700),
        tween(labels.find(l => l.id === 'cL'), { a: 1, y: 400 }, 700)
    ]).then(rs => rs.every(Boolean))) return false;
    return true;
}

async function animLipid() {
    setStatus(0);
    const enz = byId('enz');
    const gly = byId('gly');
    const fas = [byId('fa0'), byId('fa1'), byId('fa2')];
    if (!await tween(enz, { x: gly.x + 48, y: gly.y, rot: Math.PI / 2, pocket: 0.14, glow: 1, s: 1.06 }, 800)) return false;
    setStatus(1);
    const waters = [byId('w0'), byId('w1'), byId('w2')];
    const wMoves = waters.map((w, i) => {
        w.a = 1;
        return tween(w, { x: fas[i].x + 14, y: fas[i].y, s: 1 }, 550);
    });
    if (!await Promise.all(wMoves).then(rs => rs.every(Boolean))) return false;
    bonds.forEach(b => { b.breaking = true; b.color = '#ef4444'; });
    if (!await wait(600)) return false;
    fas.forEach(f => burst(f.x + 10, f.y, '#fb7185'));
    bonds.forEach(b => { b.alpha = 0; });
    await Promise.all(waters.map(w => tween(w, { a: 0, s: 0.4 }, 300)));
    setStatus(2);
    labels.find(l => l.id === 'title').a = 0;
    if (!await tween(enz, { pocket: 1, glow: 0, s: 1 }, 280)) return false;
    if (!await Promise.all([
        tween(fas[0], { x: 520 }, 900),
        tween(fas[1], { x: 555 }, 900),
        tween(fas[2], { x: 590 }, 900),
        tween(gly, { x: 280 }, 900),
        tween(enz, { x: 770, y: 250, a: 0.6, rot: Math.PI / 2, pocket: 1 }, 900),
        tween(labels.find(l => l.id === 'gL'), { a: 1, x: 280 }, 700),
        tween(labels.find(l => l.id === 'fL'), { a: 1, x: 620 }, 700)
    ]).then(rs => rs.every(Boolean))) return false;
    return true;
}

function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, stage.clientWidth);
    const h = Math.max(1, stage.clientHeight);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas._cssW = w;
    canvas._cssH = h;
    canvas._dpr = dpr;
}

function worldTransform() {
    const w = canvas._cssW, h = canvas._cssH, dpr = canvas._dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const scale = Math.min(w / VW, h / VH);
    const ox = (w - VW * scale) / 2;
    const oy = (h - VH * scale) / 2;
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#f8fafc');
    g.addColorStop(0.55, '#f0f9ff');
    g.addColorStop(1, '#ecfdf5');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
    roundRect(36, 48, VW - 72, VH - 96, 28);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(148,163,184,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.save();
    ctx.strokeStyle = 'rgba(148,163,184,0.18)';
    ctx.lineWidth = 1;
    for (let x = 70; x < VW - 50; x += 28) {
        ctx.beginPath(); ctx.moveTo(x, 70); ctx.lineTo(x, VH - 70); ctx.stroke();
    }
    for (let y = 70; y < VH - 50; y += 28) {
        ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(VW - 60, y); ctx.stroke();
    }
    ctx.restore();
}

function drawGlucose(m, tms) {
    const bob = Math.sin(tms * 0.0022 + m.bob) * (isPlaying ? 1.2 : 2.4);
    ctx.save();
    ctx.translate(m.x, m.y + bob);
    ctx.globalAlpha *= m.a;
    ctx.scale(m.s, m.s);
    ctx.beginPath();
    const r = 24;
    for (let i = 0; i < 6; i++) {
        const ang = Math.PI / 6 + i * Math.PI / 3;
        const px = Math.cos(ang) * r, py = Math.sin(ang) * r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    const grd = ctx.createRadialGradient(-6, -6, 2, 0, 0, r);
    grd.addColorStop(0, '#e0f2fe');
    grd.addColorStop(1, '#38bdf8');
    ctx.fillStyle = grd;
    ctx.shadowColor = 'rgba(2,132,199,0.28)';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#0369a1';
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(-5, -6, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0c4a6e';
    ctx.font = '900 13px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('G', 0, 1);
    ctx.restore();
}

function drawEnzyme(m, tms) {
    const pal = ENZ[m.palette];
    const bob = Math.sin(tms * 0.0018) * (m.glow > 0.5 ? 0.4 : 2);
    ctx.save();
    ctx.translate(m.x, m.y + bob);
    ctx.rotate(m.rot || 0);
    ctx.globalAlpha *= m.a;
    ctx.scale(m.s, m.s);
    const r = m.r || 70;
    const pocket = m.pocket == null ? 1 : m.pocket;
    const glow = m.glow || 0;
    const halfGap = 0.52 + pocket * 0.42;
    const rxO = r * 1.02, ryO = r * 0.84;
    const rxI = r * 0.78, ryI = r * 0.54;
    const aL = Math.PI / 2 + halfGap;
    const aR = Math.PI / 2 - halfGap;
    const long = Math.PI * 2 - 2 * halfGap;
    const n = 42;

    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
        const a = aL + (i / n) * long;
        const w = 1 + 0.035 * Math.sin(a * 3 + 0.5);
        const px = Math.cos(a) * rxO * w;
        const py = Math.sin(a) * ryO * w;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    for (let i = 0; i <= n; i++) {
        const a = aR - (i / n) * long;
        ctx.lineTo(Math.cos(a) * rxI, Math.sin(a) * ryI);
    }
    ctx.closePath();

    const grd = ctx.createRadialGradient(-r * 0.2, -r * 0.4, r * 0.08, 0, -r * 0.1, r * 1.2);
    grd.addColorStop(0, pal.light);
    grd.addColorStop(1, pal.dark);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = pal.stroke;
    ctx.lineWidth = 2.4;
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
        const a = aR - (i / n) * long;
        const px = Math.cos(a) * rxI, py = Math.sin(a) * ryI;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    const pulse = 0.55 + 0.45 * Math.sin(tms * 0.01);
    ctx.strokeStyle = glow > 0.15
        ? `rgba(225, 29, 72, ${0.45 + glow * 0.5 * pulse})`
        : pal.stroke;
    ctx.lineWidth = glow > 0.15 ? 3.2 : 2.2;
    ctx.setLineDash(glow > 0.3 ? [6, 4] : []);
    ctx.lineDashOffset = glow > 0.3 ? -tms * 0.04 : 0;
    ctx.stroke();
    ctx.setLineDash([]);

    if (glow > 0.2) {
        ctx.beginPath();
        ctx.ellipse(0, 4, rxI * 0.72, ryI * 0.55, 0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 226, 226, ${0.18 * glow})`;
        ctx.fill();
    }

    const key = { amylase: 'enzAmylase', maltase: 'enzMaltase', synth: 'enzSynth', lipase: 'enzLipase', deam: 'enzDeam' }[m.palette];
    ctx.fillStyle = pal.text;
    ctx.font = '800 12px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t()[key], 0, -ryO * 0.62);
    if (pocket > 0.5) {
        ctx.font = '700 9px "Noto Sans TC", sans-serif';
        ctx.fillStyle = glow > 0.2 ? '#be123c' : pal.stroke;
        ctx.fillText(t().activeSite, 0, -ryI * 0.12);
    }
    ctx.restore();
}

function drawWater(m, tms) {
    const bob = Math.sin(tms * 0.003 + m.bob) * 3;
    ctx.save();
    ctx.translate(m.x, m.y + bob);
    ctx.rotate(m.rot || Math.sin(tms * 0.001 + m.bob) * 0.12);
    ctx.globalAlpha *= m.a;
    ctx.scale(m.s, m.s);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-11, 13);
    ctx.moveTo(0, 0); ctx.lineTo(11, 13);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ef4444'; ctx.fill();
    ctx.strokeStyle = '#b91c1c'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('O', 0, 0.5);
    [[-11, 13], [11, 13]].forEach(([hx, hy]) => {
        ctx.beginPath(); ctx.arc(hx, hy, 5.2, 0, Math.PI * 2);
        ctx.fillStyle = '#f8fafc'; ctx.fill();
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.fillStyle = '#475569';
        ctx.font = 'bold 7px sans-serif';
        ctx.fillText('H', hx, hy + 0.4);
    });
    ctx.restore();
}

function drawAmino(m, tms) {
    const bob = Math.sin(tms * 0.002 + 1) * 2.5;
    ctx.save();
    ctx.translate(m.x, m.y + bob);
    ctx.globalAlpha *= m.a;
    ctx.scale(m.s, m.s);
    roundRect(-22, -18, 58, 36, 10);
    ctx.fillStyle = '#fecaca';
    ctx.shadowColor = 'rgba(220,38,38,0.25)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(-28, 0, 14, 0, Math.PI * 2);
    ctx.fillStyle = '#3b82f6'; ctx.fill();
    ctx.strokeStyle = '#1d4ed8'; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '800 11px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('NH₂', -28, 1);
    ctx.fillStyle = '#7f1d1d';
    ctx.font = '800 14px "Noto Sans TC", sans-serif';
    ctx.fillText('C', 8, 1);
    ctx.restore();
}

function drawUrea(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.globalAlpha *= m.a;
    ctx.scale(m.s, m.s);
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2);
    const grd = ctx.createRadialGradient(-6, -6, 2, 0, 0, 28);
    grd.addColorStop(0, '#f3e8ff');
    grd.addColorStop(1, '#c084fc');
    ctx.fillStyle = grd;
    ctx.shadowColor = 'rgba(147,51,234,0.3)';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#7e22ce';
    ctx.lineWidth = 2.4; ctx.stroke();
    [[-12, 4], [12, 4]].forEach(([nx, ny]) => {
        ctx.beginPath(); ctx.arc(nx, ny, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#7c3aed'; ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '800 8px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('N', nx, ny + 1);
    });
    ctx.fillStyle = '#6b21a8';
    ctx.font = '800 11px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('C', 0, -6);
    ctx.restore();
}

function drawCarb(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.globalAlpha *= m.a;
    ctx.scale(m.s, m.s);
    roundRect(-40, -22, 80, 44, 12);
    ctx.fillStyle = '#fde68a';
    ctx.shadowColor = 'rgba(202,138,4,0.3)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ca8a04';
    ctx.lineWidth = 2.2; ctx.stroke();
    ctx.beginPath();
    const hr = 14;
    for (let i = 0; i < 6; i++) {
        const ang = Math.PI / 6 + i * Math.PI / 3;
        const px = Math.cos(ang) * hr, py = Math.sin(ang) * hr;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#fef3c7';
    ctx.fill();
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
}

function drawLiver(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.globalAlpha *= m.a;
    ctx.beginPath();
    ctx.moveTo(-120, 20);
    ctx.bezierCurveTo(-90, -80, 20, -90, 90, -20);
    ctx.bezierCurveTo(140, 20, 80, 80, 10, 70);
    ctx.bezierCurveTo(-70, 80, -140, 60, -120, 20);
    ctx.closePath();
    ctx.fillStyle = 'rgba(252,165,165,0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(185,28,28,0.45)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(127,29,29,0.55)';
    ctx.font = '800 22px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t().liver, 0, 10);
    ctx.restore();
}

function drawGlycerol(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.globalAlpha *= m.a;
    roundRect(-14, -48, 28, 96, 10);
    ctx.fillStyle = '#fdba74';
    ctx.shadowColor = 'rgba(194,65,12,0.25)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#c2410c';
    ctx.lineWidth = 2.2; ctx.stroke();
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(14, -32 + i * 32, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff7ed';
        ctx.fill();
        ctx.stroke();
    }
    ctx.restore();
}

function drawFA(m, tms) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.globalAlpha *= m.a;
    const n = 8;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
        const px = 10 + i * 14;
        const py = Math.sin(i * 0.7 + tms * 0.003 + m.wave) * 2.2;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.strokeStyle = '#ca8a04';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    for (let i = 0; i < n; i++) {
        const px = 10 + i * 14;
        const py = Math.sin(i * 0.7 + tms * 0.003 + m.wave) * 2.2;
        ctx.beginPath();
        ctx.arc(px, py, i === n - 1 ? 9 : 6.2, 0, Math.PI * 2);
        ctx.fillStyle = i === n - 1 ? '#f59e0b' : '#fde047';
        ctx.fill();
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 1.4; ctx.stroke();
    }
    ctx.restore();
}

function actorPos(id) {
    const m = byId(id);
    return m ? { x: m.x, y: m.y } : null;
}

function drawBond(b, tms) {
    const A = actorPos(b.a), B = actorPos(b.b);
    if (!A || !B || b.alpha < 0.02) return;
    const dx = B.x - A.x, dy = B.y - A.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const padA = b.padA != null ? b.padA : 24;
    const padB = b.padB != null ? b.padB : 24;
    const x1 = A.x + ux * padA, y1 = A.y + uy * padA;
    const x2 = B.x - ux * padB, y2 = B.y - uy * padB;
    ctx.save();
    ctx.globalAlpha *= b.alpha;
    ctx.strokeStyle = b.breaking ? (Math.sin(tms * 0.012) > 0 ? '#ef4444' : '#fb7185') : b.color;
    ctx.lineWidth = b.width || 5;
    ctx.lineCap = 'round';
    if (b.breaking) {
        ctx.setLineDash([7, 6]);
        ctx.lineDashOffset = -tms * 0.06;
    }
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
}

function drawLabel(l) {
    if (l.a < 0.02) return;
    ctx.save();
    ctx.globalAlpha *= l.a;
    ctx.fillStyle = l.color;
    ctx.font = `800 ${l.size}px "Noto Sans TC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t()[l.key] || l.key, l.x, l.y);
    ctx.restore();
}

function drawParticles(dt) {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 40 * dt;
        p.life -= dt * 1.6;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function drawActor(m, tms) {
    switch (m.kind) {
        case 'glucose': drawGlucose(m, tms); break;
        case 'enzyme': drawEnzyme(m, tms); break;
        case 'water': drawWater(m, tms); break;
        case 'amino': drawAmino(m, tms); break;
        case 'urea': drawUrea(m); break;
        case 'carb': drawCarb(m); break;
        case 'liver': drawLiver(m); break;
        case 'glycerol': drawGlycerol(m); break;
        case 'fa': drawFA(m, tms); break;
    }
}

let lastTs = 0;
function frame(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    clock = ts;
    worldTransform();
    drawBg();
    const liver = actors.find(a => a.kind === 'liver');
    if (liver) drawActor(liver, ts);
    bonds.forEach(b => drawBond(b, ts));
    actors.filter(a => a.kind !== 'liver' && a.kind !== 'enzyme' && a.kind !== 'water').forEach(a => drawActor(a, ts));
    actors.filter(a => a.kind === 'enzyme').forEach(a => drawActor(a, ts));
    actors.filter(a => a.kind === 'water').forEach(a => drawActor(a, ts));
    labels.forEach(drawLabel);
    drawParticles(dt);
    requestAnimationFrame(frame);
}

function openModal(id) {
    const m = document.getElementById(id);
    m.classList.remove('opacity-0', 'pointer-events-none');
    m.querySelector('.modal-content').classList.remove('scale-95', 'opacity-0');
}
function closeModal(id) {
    const m = document.getElementById(id);
    m.classList.add('opacity-0', 'pointer-events-none');
    m.querySelector('.modal-content').classList.add('scale-95', 'opacity-0');
}

document.getElementById('btn-play').addEventListener('click', playReaction);
document.getElementById('btn-reset').addEventListener('click', resetAll);
document.getElementById('speedSlider').addEventListener('input', e => {
    animSpeed = e.target.value / 10;
    document.getElementById('speedVal').textContent = animSpeed.toFixed(1) + '×';
});
document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
['steps-close', 'steps-confirm'].forEach(id => document.getElementById(id).addEventListener('click', () => closeModal('modal-steps')));
['modal-close', 'modal-confirm'].forEach(id => document.getElementById(id).addEventListener('click', () => closeModal('modal-principle')));
document.getElementById('modal-steps').addEventListener('click', e => { if (e.target.id === 'modal-steps') closeModal('modal-steps'); });
document.getElementById('modal-principle').addEventListener('click', e => { if (e.target.id === 'modal-principle') closeModal('modal-principle'); });
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal('modal-steps'); closeModal('modal-principle'); }
});
function toggleLang() {
    lang = lang === 'zh' ? 'en' : 'zh';
    applyI18n();
}
document.getElementById('btn-lang').addEventListener('click', toggleLang);
document.getElementById('btn-lang-mobile').addEventListener('click', toggleLang);
window.addEventListener('resize', resize);

document.addEventListener('DOMContentLoaded', () => {
    applyI18n();
    buildIdle();
    resize();
    requestAnimationFrame(frame);
});
</script>
