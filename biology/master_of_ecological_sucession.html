<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecological Succession Interactive Game</title>
    <style>
        :root {
            --sky-color: #87CEEB;
            --rock-color: #708090;
            --soil-color: #5D4037;
            --ui-bg: #f4f4f4;
            --primary-btn: #2E7D32;
            --text-color: #333;
            --error-color: #c62828;
            --error-bg: #ffebee;
            --success-color: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e0e0e0;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 900px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button#lang-toggle {
            background: #fff;
            color: #333;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Visual Scene Area */
        #scene {
            height: 350px;
            position: relative;
            background: var(--sky-color);
            overflow: hidden;
            border-bottom: 5px solid #444;
            transition: background 1s;
        }

        /* Environment Elements */
        #sun {
            width: 60px;
            height: 60px;
            background: yellow;
            border-radius: 50%;
            position: absolute;
            top: 20px;
            right: 20px;
            box-shadow: 0 0 20px orange;
        }

        #ground-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px; /* Initial rock height */
            background-color: var(--rock-color);
            /* Rock Texture Pattern */
            background-image: radial-gradient(circle at 20% 20%, #8899a6 4px, transparent 4.5px), 
                              radial-gradient(circle at 50% 50%, #8899a6 3px, transparent 3.5px),
                              radial-gradient(circle at 80% 30%, #5a6b78 5px, transparent 5.5px);
            background-size: 50px 50px;
            transition: background-color 1s, height 1s;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        #soil-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0px; /* Soil grows */
            background-color: var(--soil-color);
            transition: height 1.5s ease-in-out;
            z-index: 2;
            overflow: hidden; /* Keep seeds inside */
        }

        /* Seeds Visual */
        .seed {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #D2B48C; /* Tan color */
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }

        /* Organisms Container */
        #ecosystem {
            position: absolute;
            bottom: 0; /* Aligned with bottom, adjusted by JS */
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none; /* Let clicks pass through */
        }

        .organism {
            position: absolute;
            bottom: 0;
            transition: opacity 1s, transform 1s;
            font-size: 0; /* Emoji size set inline */
            transform-origin: bottom center; /* Grow from bottom */
        }

        /* Animal Animation - Full Screen Patrol */
        @keyframes wander {
            0% { transform: translateX(0px) scaleX(-1); } /* Start facing Right */
            49% { transform: translateX(850px) scaleX(-1); } /* Walk Right */
            50% { transform: translateX(850px) scaleX(1); } /* Turn to Face Left */
            99% { transform: translateX(0px) scaleX(1); } /* Walk Left */
            100% { transform: translateX(0px) scaleX(-1); } /* Turn to Face Right */
        }

        .anim-walk {
            animation-name: wander;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Eating Animation for Rabbits */
        @keyframes eat {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-10deg) scale(1.05); } /* Dip head (assuming facing left) */
            50% { transform: rotate(0deg) scale(1); }
            75% { transform: rotate(-5deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .anim-eat {
            animation: eat 2s infinite ease-in-out;
        }

        /* Fire Effect */
        #fire-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 69, 0, 0.4);
            z-index: 10;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            animation: flicker 0.2s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.8; }
            50% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* Control Panel */
        #controls {
            padding: 20px;
            background-color: var(--ui-bg);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #narrative-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--primary-btn);
            min-height: 80px;
        }

        #narrative-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #2E7D32;
        }

        #narrative-text {
            line-height: 1.5;
        }

        #choices-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .choice-btn {
            background-color: white;
            border: 2px solid var(--primary-btn);
            color: var(--primary-btn);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background-color: var(--primary-btn);
            color: white;
        }

        .choice-btn:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
            background: white;
        }
        
        .choice-btn.correct-selected {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
            opacity: 0.7;
        }

        /* Feedback Error Styles */
        #feedback-msg {
            display: none;
            padding: 10px;
            margin-top: 10px;
            background-color: var(--error-bg);
            color: var(--error-color);
            border: 1px solid #ef9a9a;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .btn-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--error-color) !important;
            color: var(--error-color) !important;
            background-color: var(--error-bg) !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Meters */
        #stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .meter-container {
            width: 150px;
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
        }

        .meter-fill {
            height: 100%;
            background: #8D6E63;
            width: 0%;
            transition: width 1s;
        }

    </style>
</head>
<body>

<div id="game-container">

        <div>

        </div>

        <!-- Feedback Message Area -->
        <div id="feedback-msg"></div>
    </div>
</div>

                    feedbacks: [null, "錯了。藻類要水。", "錯了。演替傾向木本植物。"],
                    soil: 100,
                    type: "plant"
                },
                // 14
                {
                    title: "頂級掠食者回歸",
                    text: "森林完整了。",
                    prompt: "誰位於食物鏈頂層？",
                    options: ["花豹/老虎", "兔子", "老鼠"],
                    correctIndex: 0,
                    feedbacks: [null, "錯了。兔子是獵物。", "錯了。老鼠是獵物。"],
                    soil: 100,
                    type: "animal"
                },
                // 15
                {
                    title: "消費者回歸",
                    text: "生態系統已完全修復！",
                    prompt: "再玩一次？",
                    options: ["完成修復"],
                    correctIndex: 0,
                    feedbacks: [null],
                    soil: 100,
                    type: "end"
                }
            ]
        }
    };

    // --- Game State ---
    let currentLang = 'zh';
    let currentStageIndex = -1; 
    let isSecondary = false;
    let selectedIndices = []; // For Multi-select
    let predationInterval = null; // For infinite eating loop

    // --- DOM Elements ---
    const dom = {
        title: document.querySelector('header div strong'),
        langBtn: document.getElementById('lang-toggle'),
        soilLabel: document.getElementById('soil-label'),
        stageLabelText: document.getElementById('stage-label'),
        stageTypeLabel: document.getElementById('stage-type-display'),
        soilMeter: document.getElementById('soil-meter'),
        narrativeTitle: document.getElementById('narrative-title'),
        narrativeText: document.getElementById('narrative-text'),
        choicesArea: document.getElementById('choices-area'),
        soilLayer: document.getElementById('soil-layer'),
        groundLayer: document.getElementById('ground-layer'),
        ecosystem: document.getElementById('ecosystem'),
        fireOverlay: document.getElementById('fire-overlay'),
        feedbackMsg: document.getElementById('feedback-msg')
    };

    // --- Logic Functions ---

    function toggleLanguage() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        dom.langBtn.innerText = currentLang === 'zh' ? 'Switch to English' : '切換至中文';
        updateUI();
    }

    function startGame() {
        currentStageIndex = 0;
        isSecondary = false;
        clearInterval(predationInterval);
        resetVisuals();
        updateUI();
    }

    function resetVisuals() {
        dom.ecosystem.innerHTML = '';
        dom.soilLayer.style.height = '0px';
        dom.soilLayer.innerHTML = ''; // Clear seeds
        dom.fireOverlay.style.display = 'none';
        dom.soilMeter.style.width = '0%';
        dom.feedbackMsg.style.display = 'none';
        // Reset ground texture to rock
        dom.groundLayer.style.backgroundImage = "radial-gradient(circle at 20% 20%, #8899a6 4px, transparent 4.5px), radial-gradient(circle at 50% 50%, #8899a6 3px, transparent 3.5px), radial-gradient(circle at 80% 30%, #5a6b78 5px, transparent 5.5px)";
        dom.groundLayer.style.backgroundColor = "#708090";
    }

    function handleChoice(optionIndex, btnElement) {
        const stageData = content[currentLang].stages[currentStageIndex];
        
        // Multi-select Logic
        if (stageData.isMultiSelect) {
            if (stageData.correctIndices.includes(optionIndex)) {
                // Correct Selection
                if (!selectedIndices.includes(optionIndex)) {
                    selectedIndices.push(optionIndex);
                    btnElement.classList.add('correct-selected');
                    btnElement.disabled = true; // Disable clicked correct button
                    
                    // Add specific animal visually immediately
                    if (optionIndex === 0) addOrganisms('🐇', 3, 40, true, false, true); // Some eating, some walking
                    if (optionIndex === 1) addOrganisms('🐦', 3, 40, true);
                    if (optionIndex === 2) addOrganisms('🦎', 3, 30, true);

                    // Check if all correct answers found
                    if (selectedIndices.length === stageData.correctIndices.length) {
                        dom.feedbackMsg.style.display = 'none';
                        setTimeout(nextStage, 1000);
                    }
                }
            } else {
                // Wrong Selection (Lion)
                showFeedback(stageData.feedbacks[optionIndex], btnElement);
            }
            return;
        }

        // Single Choice Logic
        if (optionIndex === stageData.correctIndex) {
            dom.feedbackMsg.style.display = 'none';
            visualizeStage(currentStageIndex);
            nextStage();
        } else {
            showFeedback(stageData.feedbacks[optionIndex], btnElement);
        }
    }

    function showFeedback(text, btnElement) {
        dom.feedbackMsg.innerText = "❌ " + text;
        dom.feedbackMsg.style.display = 'block';
        if (btnElement) {
            btnElement.classList.add('btn-shake');
            setTimeout(() => { btnElement.classList.remove('btn-shake'); }, 400);
        }
    }

    function nextStage() {
        if (currentStageIndex < content[currentLang].stages.length - 1) {
            currentStageIndex++;
            selectedIndices = []; // Reset for potential next multi-select
            
            // Fire Trigger Logic (Stage 7 -> 8)
            if (currentStageIndex === 8) { 
                triggerFireAnimation();
            } else {
                updateUI();
            }
        } else {
            // End
            startGame();
        }
    }

    function triggerFireAnimation() {
        clearInterval(predationInterval); // Stop eating
        dom.fireOverlay.style.display = 'flex';
        dom.ecosystem.innerHTML = ''; 
        dom.soilLayer.style.backgroundColor = '#333'; // Burnt soil look
        isSecondary = true;

        setTimeout(() => {
            dom.fireOverlay.style.display = 'none';
            dom.soilLayer.style.backgroundColor = '#5D4037'; 
            // Soil level drops slightly after fire (erosion/compaction) but remains
            dom.soilLayer.style.height = '60px'; 
            dom.soilMeter.style.width = '60%';
            showSeeds(); // Add seeds to visual
            updateUI();
        }, 2000);
    }

    function showSeeds() {
        for(let i=0; i<15; i++) {
            const seed = document.createElement('div');
            seed.className = 'seed';
            seed.style.left = (Math.random() * 95) + '%';
            seed.style.top = (Math.random() * 70 + 10) + '%'; 
            dom.soilLayer.appendChild(seed);
        }
    }

    function visualizeStage(completedIndex) {
        const stageData = content[currentLang].stages[completedIndex];
        const soilHeight = stageData.soil;
        dom.soilLayer.style.height = soilHeight + 'px';
        dom.soilMeter.style.width = soilHeight + '%';

        switch(completedIndex) {
            case 0: addOrganisms('🍄', 8, 15); break; // Pioneer
            case 1: 
                addOrganisms('🌿', 20, 30); // Ferns
                addOrganisms('🌾', 20, 25); // Grass (Added)
                break; 
            case 2: addInsects(12, 20); break; // Insects only
            case 3: 
                addOrganisms('🌳', 15, 80, false, true); // Shrubs
                break;
            // Case 4 is Multi-select, visuals handled in handleChoice
            case 5: addOrganisms('🌲', 18, 220, false, true); break; // Trees
            case 6: // Tertiary
                addOrganisms('🐆', 2, 70, true); 
                addOrganisms('🐅', 2, 70, true); 
                startPredationLoop(); // CONSTANT EATING
                break;
            
            // Secondary
            case 9: 
                addOrganisms('🌿', 25, 30); 
                addOrganisms('🌾', 25, 25); // Grass (Added)
                break;
            case 10: addInsects(12, 20); break;
            case 11: addOrganisms('🌳', 15, 80, false, true); break;
            // Case 12 is Multi-select
            case 13: addOrganisms('🌲', 18, 220, false, true); break;
            case 14: // Tertiary
                addOrganisms('🐆', 2, 70, true);
                addOrganisms('🐅', 2, 70, true);
                startPredationLoop(); // CONSTANT EATING
                break;
        }
    }

    function startPredationLoop() {
        clearInterval(predationInterval); // Clear any existing
        // Trigger immediately
        triggerPredationEvent();
        // Loop every 5 seconds
        predationInterval = setInterval(triggerPredationEvent, 5000);
    }

    function triggerPredationEvent() {
        const soilH = parseInt(dom.soilLayer.style.height) || 0;
        const bottomPos = soilH - 10; // Unified level

        // 1. Create the Prey (Rabbit) - Wandering from RIGHT
        const rabbit = document.createElement('div');
        rabbit.innerText = '🐇';
        rabbit.className = 'organism';
        rabbit.style.fontSize = '40px';
        rabbit.style.left = '110%'; // Start off-screen Right
        rabbit.style.bottom = bottomPos + 'px';
        rabbit.style.zIndex = 6;
        // Rabbit walks to middle in 2.5s
        rabbit.style.transition = 'left 2.5s linear, opacity 0.5s'; 
        dom.ecosystem.appendChild(rabbit);

        // 2. Create the Predator (Tiger) - Hunting from LEFT
        const tiger = document.createElement('div');
        tiger.innerText = '🐅';
        tiger.className = 'organism';
        tiger.style.fontSize = '70px';
        tiger.style.left = '-20%'; // Start off-screen Left
        tiger.style.bottom = bottomPos + 'px';
        tiger.style.zIndex = 7;
        // Tiger walks to middle in 2.5s
        tiger.style.transition = 'left 2.5s linear'; 
        tiger.style.transform = 'scaleX(-1)'; // Face right
        dom.ecosystem.appendChild(tiger);

        // 3. Start Movement (Next Tick)
        setTimeout(() => {
            // Meet in middle
            rabbit.style.left = '50%'; 
            tiger.style.left = '45%'; 
        }, 100);

        // 4. Collision & Eating (At 2.5s + 100ms)
        setTimeout(() => {
            // Eat!
            rabbit.style.transition = 'none'; // Stop movement
            rabbit.innerText = '🍖'; // Turn to meat
            rabbit.style.transform = 'scale(0.8)';
            rabbit.style.zIndex = 8; // Make visible
        }, 2600); 

        // 5. Cleanup
        setTimeout(() => {
            rabbit.style.opacity = '0';
        }, 3600);
        
        // 6. Tiger moves on
        setTimeout(() => {
            tiger.style.transition = 'left 2s linear';
            tiger.style.left = '120%'; // Walk off screen
        }, 4000);

        setTimeout(() => {
            if(rabbit.parentNode) rabbit.remove();
            if(tiger.parentNode) tiger.remove();
        }, 6500);
    }

    function addInsects(count, sizePx) {
        const bugs = ['🦗', '🐜', '🐞', '🪲'];
        for (let i = 0; i < count; i++) {
            const randomBug = bugs[Math.floor(Math.random() * bugs.length)];
            addOrganisms(randomBug, 1, sizePx, true);
        }
    }

    function addOrganisms(emoji, count, sizePx, isAnimal = false, isTree = false, allowEating = false) {
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.classList.add('organism');
            
            // Randomly decide if this specific rabbit is eating or walking
            // Only if allowEating is true (for rabbits)
            let isEating = false;
            if (allowEating && emoji === '🐇' && Math.random() > 0.5) {
                isEating = true;
            }

            if (isAnimal && !isEating) {
                el.classList.add('anim-walk'); 
                const duration = 15 + Math.random() * 15;
                el.style.animationDuration = duration + 's';
                const delay = -(Math.random() * duration * 2); 
                el.style.animationDelay = delay + 's';
                el.style.left = '0px';
            } else if (isEating) {
                el.classList.add('anim-eat');
                el.style.left = (Math.random() * 90) + '%'; // Static random pos
            } else {
                el.style.left = (Math.random() * 90) + '%';
            }
            
            el.innerText = emoji;
            el.style.fontSize = sizePx + 'px';
            
            let soilH = parseInt(dom.soilLayer.style.height) || 0;
            let bottomPos = 0;

            if (isTree) {
                 bottomPos = soilH - 20;
            } else if (isAnimal && (emoji === '🐦' || emoji === '🦉')) {
                 bottomPos = soilH + 40 + Math.random() * 100;
            } else if (isAnimal) {
                 // UNIFIED BOTTOM for animals walking on ground
                 // Soil height is the top of the brown box.
                 // We want feet to touch soilH.
                 // Emoji baseline is roughly bottom of box.
                 bottomPos = soilH - 10; 
            } else {
                 bottomPos = soilH - 5 + Math.random() * 10;
            }
            
            el.style.bottom = bottomPos + 'px';
            el.style.zIndex = isTree ? 4 : 5; 

            el.style.opacity = '0';
            
            if (!isAnimal) {
                el.style.transform = 'scale(0) translateX(-50%)';
            } else if (!isEating) {
                 // Walking animals handle transform via animation
                 el.style.opacity = '0';
            } else {
                 // Eating animals need initial scale set or just opacity
                 el.style.transform = 'scale(0) translateX(-50%)';
            }

            dom.ecosystem.appendChild(el);

            setTimeout(() => {
                el.style.opacity = '1';
                if(!isAnimal && !isEating) {
                    el.style.transform = 'scale(1) translateX(-50%)';
                }
                if(isEating) {
                    // Reset transform to allow anim-eat to work, but keep position
                    // Actually anim-eat overrides transform, so we just remove the initial scale(0)
                    el.style.transform = 'none'; 
                }
            }, 50 + (i * 100));
        }
    }

    function updateUI() {
        dom.feedbackMsg.style.display = 'none';

        const langData = content[currentLang];
        
        dom.title.innerText = langData.title;
        dom.langBtn.innerText = currentLang === 'zh' ? 'Switch to English' : '切換至中文';
        dom.soilLabel.innerText = langData.soilLabel;
        dom.stageLabelText.innerText = langData.typeLabel; 
        
        if (currentStageIndex >= 8) {
            isSecondary = true;
        }
        dom.stageTypeLabel.innerText = isSecondary ? langData.types[1] : langData.types[0];

        if (currentStageIndex === -1) {
            dom.narrativeTitle.innerText = langData.title;
            dom.narrativeText.innerText = "Click Start / 點擊開始";
            dom.choicesArea.innerHTML = `<button class="choice-btn" onclick="startGame()">${langData.startGame}</button>`;
        } else {
            const stageData = langData.stages[currentStageIndex];
            dom.narrativeTitle.innerText = stageData.title;
            dom.narrativeText.innerText = stageData.text;
            
            let buttonsHtml = `<p style="width:100%; margin:0 0 10px 0; color:#2E7D32;"><strong>${stageData.prompt}</strong></p>`;
            stageData.options.forEach((opt, idx) => {
                // In multi-select, check if already clicked
                let isDisabled = false;
                let isSelectedClass = '';
                if(stageData.isMultiSelect && selectedIndices.includes(idx)) {
                    isDisabled = true;
                    isSelectedClass = ' correct-selected';
                }
                
                buttonsHtml += `<button class="choice-btn${isSelectedClass}" ${isDisabled?'disabled':''} onclick="handleChoice(${idx}, this)">${opt}</button>`;
            });
            dom.choicesArea.innerHTML = buttonsHtml;
        }
    }

    updateUI();

</script>

</body>
</html>
