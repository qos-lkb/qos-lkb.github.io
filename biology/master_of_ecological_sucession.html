<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生態演替大師｜Eco-Succession Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-color: #87CEEB;
            --rock-color: #708090;
            --soil-color: #5D4037;
            --primary-btn: #2E7D32;
            --error-color: #c62828;
            --error-bg: #ffebee;
            --success-color: #4caf50;
        }
        body { font-family: 'Noto Sans TC', "PingFang TC", "Microsoft JhengHei", 'Segoe UI', sans-serif; }
        #scene {
            height: 350px;
            position: relative;
            background: var(--sky-color);
            overflow: hidden;
            border-bottom: 5px solid #444;
            border-radius: 0.75rem;
            transition: background 1s;
        }
        #sun {
            width: 60px; height: 60px; background: yellow; border-radius: 50%;
            position: absolute; top: 20px; right: 20px; box-shadow: 0 0 20px orange;
        }
        #ground-layer {
            position: absolute; bottom: 0; width: 100%; height: 40px;
            background-color: var(--rock-color);
            background-image: radial-gradient(circle at 20% 20%, #8899a6 4px, transparent 4.5px),
                              radial-gradient(circle at 50% 50%, #8899a6 3px, transparent 3.5px),
                              radial-gradient(circle at 80% 30%, #5a6b78 5px, transparent 5.5px);
            background-size: 50px 50px;
            transition: background-color 1s, height 1s;
            z-index: 1;
        }
        #soil-layer {
            position: absolute; bottom: 0; width: 100%; height: 0px;
            background-color: var(--soil-color);
            transition: height 1.5s ease-in-out;
            z-index: 2; overflow: hidden;
        }
        .seed {
            position: absolute; width: 6px; height: 6px; background-color: #D2B48C;
            border-radius: 50%; opacity: 0.8; box-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
        #ecosystem {
            position: absolute; bottom: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
        }
        .organism {
            position: absolute; bottom: 0; transition: opacity 1s, transform 1s;
            font-size: 0; transform-origin: bottom center;
        }
        @keyframes wander {
            0% { transform: translateX(0px) scaleX(-1); }
            49% { transform: translateX(850px) scaleX(-1); }
            50% { transform: translateX(850px) scaleX(1); }
            99% { transform: translateX(0px) scaleX(1); }
            100% { transform: translateX(0px) scaleX(-1); }
        }
        .anim-walk {
            animation-name: wander;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes eat {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-10deg) scale(1.05); }
            50% { transform: rotate(0deg) scale(1); }
            75% { transform: rotate(-5deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .anim-eat { animation: eat 2s infinite ease-in-out; }
        #fire-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 69, 0, 0.4); z-index: 10; display: none;
            justify-content: center; align-items: center; font-size: 100px;
            animation: flicker 0.2s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0.8; } 50% { opacity: 0.4; } 100% { opacity: 0.8; }
        }
        .choice-btn {
            background-color: white; border: 2px solid var(--primary-btn);
            color: var(--primary-btn); padding: 10px 16px; border-radius: 25px;
            cursor: pointer; font-size: 0.95em; transition: all 0.2s;
            font-family: inherit;
        }
        .choice-btn:hover { background-color: var(--primary-btn); color: white; }
        .choice-btn:disabled {
            border-color: #ccc; color: #ccc; cursor: not-allowed; background: white;
        }
        .choice-btn.correct-selected {
            background-color: var(--success-color); color: white;
            border-color: var(--success-color); opacity: 0.7;
        }
        #feedback-msg {
            display: none; padding: 10px; margin-top: 8px;
            background-color: var(--error-bg); color: var(--error-color);
            border: 1px solid #ef9a9a; border-radius: 8px; text-align: center; font-weight: bold;
        }
        .btn-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--error-color) !important;
            color: var(--error-color) !important;
            background-color: var(--error-bg) !important;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .meter-container {
            width: 120px; height: 10px; background: #ddd; border-radius: 5px;
            overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 5px;
        }
        .meter-fill {
            height: 100%; background: #8D6E63; width: 0%; transition: width 1s;
        }
        .teach-modal { z-index: 80; }
        .teach-modal.hidden { display: none !important; }
    </style>
</head>

    function handleChoice(optionIndex, btnElement) {
        const stageData = content[currentLang].stages[currentStageIndex];
        if (stageData.isMultiSelect) {
            if (stageData.correctIndices.includes(optionIndex)) {
                if (!selectedIndices.includes(optionIndex)) {
                    selectedIndices.push(optionIndex);
                    btnElement.classList.add('correct-selected');
                    btnElement.disabled = true;
                    if (optionIndex === 0) addOrganisms('🐇', 3, 40, true, false, true);
                    if (optionIndex === 1) addOrganisms('🐦', 3, 40, true);
                    if (optionIndex === 2) addOrganisms('🦎', 3, 30, true);
                    if (selectedIndices.length === stageData.correctIndices.length) {
                        dom.feedbackMsg.style.display = 'none';
                        setTimeout(nextStage, 1000);
                    }
                }
            } else {
                showFeedback(stageData.feedbacks[optionIndex], btnElement);
            }
            return;
        }
        if (optionIndex === stageData.correctIndex) {
            dom.feedbackMsg.style.display = 'none';
            visualizeStage(currentStageIndex);
            nextStage();
        } else {
            showFeedback(stageData.feedbacks[optionIndex], btnElement);
        }
    }

    function showFeedback(text, btnElement) {

        if (btnElement) {
            btnElement.classList.add('btn-shake');
            setTimeout(function() { btnElement.classList.remove('btn-shake'); }, 400);
        }
    }

    function nextStage() {
        if (currentStageIndex < content[currentLang].stages.length - 1) {
            currentStageIndex++;

                updateUI();
            }

            dom.soilLayer.style.height = '60px';

            dom.soilLayer.appendChild(seed);

        dom.soilLayer.style.height = soilHeight + 'px';
        dom.soilMeter.style.width = soilHeight + '%';
        switch (completedIndex) {
            case 0: addOrganisms('🍄', 8, 15); break;
            case 1:
                addOrganisms('🌿', 20, 30);
                addOrganisms('🌾', 20, 25);
                break;
            case 2: addInsects(12, 20); break;
            case 3: addOrganisms('🌳', 15, 80, false, true); break;
            case 5: addOrganisms('🌲', 18, 220, false, true); break;
            case 6:
                addOrganisms('🐆', 2, 70, true);
                addOrganisms('🐅', 2, 70, true);
                startPredationLoop();
                break;
            case 9:
                addOrganisms('🌿', 25, 30);
                addOrganisms('🌾', 25, 25);
                break;
            case 10: addInsects(12, 20); break;
            case 11: addOrganisms('🌳', 15, 80, false, true); break;
            case 13: addOrganisms('🌲', 18, 220, false, true); break;
            case 14:
                addOrganisms('🐆', 2, 70, true);
                addOrganisms('🐅', 2, 70, true);
                startPredationLoop();
                break;
        }
    }

    function startPredationLoop() {
        clearInterval(predationInterval);
        triggerPredationEvent();
        predationInterval = setInterval(triggerPredationEvent, 5000);
    }

    function triggerPredationEvent() {
        var soilH = parseInt(dom.soilLayer.style.height) || 0;
        var bottomPos = soilH - 10;
        var rabbit = document.createElement('div');
        rabbit.innerText = '🐇';
        rabbit.className = 'organism';
        rabbit.style.fontSize = '40px';
        rabbit.style.left = '110%';
        rabbit.style.bottom = bottomPos + 'px';
        rabbit.style.zIndex = 6;
        rabbit.style.transition = 'left 2.5s linear, opacity 0.5s';
        dom.ecosystem.appendChild(rabbit);
        var tiger = document.createElement('div');
        tiger.innerText = '🐅';
        tiger.className = 'organism';
        tiger.style.fontSize = '70px';
        tiger.style.left = '-20%';
        tiger.style.bottom = bottomPos + 'px';
        tiger.style.zIndex = 7;
        tiger.style.transition = 'left 2.5s linear';
        tiger.style.transform = 'scaleX(-1)';
        dom.ecosystem.appendChild(tiger);
        setTimeout(function() {
            rabbit.style.left = '50%';
            tiger.style.left = '45%';
        }, 100);
        setTimeout(function() {
            rabbit.style.transition = 'none';
            rabbit.innerText = '🍖';
            rabbit.style.transform = 'scale(0.8)';
            rabbit.style.zIndex = 8;
        }, 2600);
        setTimeout(function() { rabbit.style.opacity = '0'; }, 3600);
        setTimeout(function() {
            tiger.style.transition = 'left 2s linear';
            tiger.style.left = '120%';
        }, 4000);
        setTimeout(function() {
            if (rabbit.parentNode) rabbit.remove();
            if (tiger.parentNode) tiger.remove();
        }, 6500);
    }

    function addInsects(count, sizePx) {
        var bugs = ['🦗', '🐜', '🐞', '🪲'];
        for (var i = 0; i < count; i++) {
            var randomBug = bugs[Math.floor(Math.random() * bugs.length)];
            addOrganisms(randomBug, 1, sizePx, true);
        }
    }

    function addOrganisms(emoji, count, sizePx, isAnimal, isTree, allowEating) {
        isAnimal = !!isAnimal; isTree = !!isTree; allowEating = !!allowEating;
        for (var i = 0; i < count; i++) {
            var el = document.createElement('div');
            el.classList.add('organism');
            var isEating = false;
            if (allowEating && emoji === '🐇' && Math.random() > 0.5) isEating = true;
            if (isAnimal && !isEating) {
                el.classList.add('anim-walk');
                var duration = 15 + Math.random() * 15;
                el.style.animationDuration = duration + 's';
                el.style.animationDelay = -(Math.random() * duration * 2) + 's';
                el.style.left = '0px';
            } else if (isEating) {
                el.classList.add('anim-eat');
                el.style.left = (Math.random() * 90) + '%';
            } else {
                el.style.left = (Math.random() * 90) + '%';
            }
            el.innerText = emoji;
            el.style.fontSize = sizePx + 'px';
            var soilH = parseInt(dom.soilLayer.style.height) || 0;
            var bottomPos = 0;
            if (isTree) {
                bottomPos = soilH - 20;
            } else if (isAnimal && (emoji === '🐦' || emoji === '🦉')) {
                bottomPos = soilH + 40 + Math.random() * 100;
            } else if (isAnimal) {
                bottomPos = soilH - 10;
            } else {
                bottomPos = soilH - 5 + Math.random() * 10;
            }
            el.style.bottom = bottomPos + 'px';
            el.style.zIndex = isTree ? 4 : 5;
            el.style.opacity = '0';
            if (!isAnimal) {
                el.style.transform = 'scale(0) translateX(-50%)';
            } else if (!isEating) {
                el.style.opacity = '0';
            } else {
                el.style.transform = 'scale(0) translateX(-50%)';
            }
            dom.ecosystem.appendChild(el);
            (function(elRef, idx, animal, eating) {
                setTimeout(function() {
                    elRef.style.opacity = '1';
                    if (!animal && !eating) elRef.style.transform = 'scale(1) translateX(-50%)';
                    if (eating) elRef.style.transform = 'none';
                }, 50 + (idx * 100));
            })(el, i, isAnimal, isEating);
        }
    }

    function updateUI() {
        dom.feedbackMsg.style.display = 'none';
        var langData = content[currentLang];
        var t = uiT();
        dom.soilLabel.innerText = langData.soilLabel;
        dom.stageLabelText.innerText = langData.typeLabel;
        if (currentStageIndex >= 8) isSecondary = true;
        if (currentStageIndex === -1) isSecondary = false;
        dom.stageTypeLabel.innerText = isSecondary ? langData.types[1] : langData.types[0];
        if (currentStageIndex === -1) {
            dom.narrativeTitle.innerText = langData.title;
            dom.narrativeText.innerText = t.clickStart;
            dom.choicesArea.innerHTML = '<button type="button" class="choice-btn" onclick="startGame()">' + langData.startGame + '</button>';
        } else {
            var stageData = langData.stages[currentStageIndex];
            dom.narrativeTitle.innerText = stageData.title;
            dom.narrativeText.innerText = stageData.text;
            var buttonsHtml = '<p style="width:100%; margin:0 0 10px 0; color:#2E7D32;"><strong>' + stageData.prompt + '</strong></p>';
            stageData.options.forEach(function(opt, idx) {
                var isDisabled = false;
                var isSelectedClass = '';
                if (stageData.isMultiSelect && selectedIndices.includes(idx)) {
                    isDisabled = true;
                    isSelectedClass = ' correct-selected';
                }
                buttonsHtml += '<button type="button" class="choice-btn' + isSelectedClass + '"' + (isDisabled ? ' disabled' : '') + ' onclick="handleChoice(' + idx + ', this)">' + opt + '</button>';
            });
            dom.choicesArea.innerHTML = buttonsHtml;
        }
    }

    function renderSteps() {
        var t = uiT();
        var body = document.getElementById('steps-body');
        var colors = ['bg-indigo-50 border-indigo-100', 'bg-teal-50 border-teal-100', 'bg-sky-50 border-sky-100', 'bg-amber-50 border-amber-100'];
        body.innerHTML = t.steps.map(function(s, i) {
            return '<div class="p-4 rounded-xl border ' + colors[i % 4] + '"><p class="font-bold text-slate-800 mb-1">' + s.t + '</p><p class="text-slate-700 leading-relaxed">' + s.b + '</p></div>';
        }).join('');
    }

    function renderPrinciple() {
        var t = uiT();
        var body = document.getElementById('principle-body');
        var html = '<div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100"><h3 class="font-bold text-indigo-900 mb-2">' + t.conceptTitle + '</h3><p class="text-slate-700">' + t.concept + '</p></div>';
        html += '<div><h3 class="font-bold text-teal-800 mb-2">' + t.mechTitle + '</h3><ol class="list-decimal list-inside space-y-2 text-slate-700">';
        t.mech.forEach(function(m) { html += '<li>' + m + '</li>'; });
        html += '</ol></div>';
        html += '<div class="p-4 bg-emerald-50 rounded-xl border border-emerald-100"><h3 class="font-bold text-emerald-900 mb-2">' + t.egTitle + '</h3><p class="text-slate-700">' + t.eg + '</p></div>';
        body.innerHTML = html;
    }

    function renderQuiz() {
        var t = uiT();
        var body = document.getElementById('quiz-body');
        document.getElementById('btn-quiz-answers').textContent = quizReveal ? t.hideAns : t.showAns;
        var letters = ['A', 'B', 'C', 'D'];
        var html = '';
        QUIZ.forEach(function(item, i) {
            var qtext = item.q[currentLang] || item.q.zh;
            html += '<div class="p-4 rounded-xl border border-violet-100 bg-violet-50/40 space-y-2 mb-3">';
            html += '<p class="font-bold text-violet-900">Q' + (i + 1) + '. ' + qtext + '</p>';
            const qNum = i + 1;
            const isOpen = (qNum === 2 || qNum === 4);
            if (!isOpen && item.choices) {
                const qName = 'q' + qNum;
                html += '<div class="grid gap-1.5">';
                item.choices.forEach(function(c, j) {
                    html += '<label class="flex items-start gap-2 rounded-lg border border-violet-100 p-2 cursor-pointer hover:bg-violet-50/60"><input type="radio" name="' + qName + '" class="mt-0.5 accent-violet-600"><span class="text-sm">' + letters[j] + '. ' + (c[currentLang] || c.zh) + '</span></label>';
                });
                html += '</div>';
            } else if (isOpen) {
                html += '<p class="text-xs text-slate-500 italic">' + (currentLang === 'zh' ? '先預測，再操作畫面控件核對，用自己的話作答。' : 'Predict, then use the sim controls to check. Write in your own words.') + '</p>';
            }
            if (quizReveal && item.explain) {
                const ref = currentLang === 'zh' ? '參考答案' : 'Reference answer';
                html += '<div class="mt-2 p-2 rounded-lg bg-emerald-50 border border-emerald-100 text-xs text-emerald-900"><strong>' + ref + '：</strong> ' + (item.explain[currentLang] || item.explain.zh) + '</div>';
            }
            html += '</div>';
        });
        body.innerHTML = html;
    }

    function closeAllModals(exceptId) {
        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
            if (exceptId && id === exceptId) return;
            var modal = document.getElementById(id);
            if (!modal || modal.classList.contains('hidden')) return;
            if (modalCloseTimers[id]) {
                clearTimeout(modalCloseTimers[id]);
                delete modalCloseTimers[id];
            }
            modal.classList.add('hidden');
        });
    }

    function openTeachModal(id) {
        closeAllModals(id);
        var modal = document.getElementById(id);
        if (!modal) return;
        if (modalCloseTimers[id]) {
            clearTimeout(modalCloseTimers[id]);
            delete modalCloseTimers[id];
        }
        modal.classList.remove('hidden');
    }

    document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
    document.getElementById('btn-reset').addEventListener('click', resetAll);
    document.getElementById('btn-steps').addEventListener('click', function() { renderSteps(); openTeachModal('modal-steps'); });
    document.getElementById('btn-principle').addEventListener('click', function() { renderPrinciple(); openTeachModal('modal-principle'); });
    document.getElementById('btn-quiz').addEventListener('click', function() { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
    document.getElementById('btn-quiz-answers').addEventListener('click', function() { quizReveal = !quizReveal; renderQuiz(); });
    document.querySelectorAll('.modal-close').forEach(function(btn) {
        btn.addEventListener('click', function() { closeAllModals(null); });
    });
    ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
        document.getElementById(id).addEventListener('click', function(e) {
            if (e.target === this) closeAllModals(null);
        });
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeAllModals(null);
    });

    applyTeachChrome();
    updateUI();
</script>
</body>
</html>
