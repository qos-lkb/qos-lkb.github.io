(function () {

  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();

              '<strong>範圍</strong>：本檔控件是<strong>尖端感光處理＋光源方向</strong>；<strong>不是</strong> Boysen-Jensen 的瓊脂／雲母阻隔；<strong>不是</strong> Went 的「先照光收集分側塊、再偏置放回去尖苗於黑暗中」定量曲率實驗。'
            ],
            egTitle: '日常例子',
            eg: '窗邊盆栽莖葉朝窗口彎曲，是向光性的日常版。理解「感光在尖端、彎曲在下方」有助解釋為何遮住芽尖或改變單側光照會改變偏向。課室以胚芽鞘＋帽／套管示意 Darwin，銜接後續 Boysen-Jensen（化學信號可透性）與 Went（命名與定量 auxin）。'
          },
          en: {
            conceptTitle: 'Concept',
            concept: 'Charles and Francis Darwin studied phototropism in grass coleoptiles and asked <strong>where light is sensed</strong>. By comparing intact, decapitated, opaque／transparent tip caps, and a basal opaque sleeve, they showed <strong>sensing occurs in the tip</strong>; a tip-produced “influence” (later <strong>auxin</strong>) travels down to the elongation zone to cause bending toward light. Real coleoptile cutting needs teacher supervision and lab safety.',
            mechTitle: 'Mechanism',
            mech: [
              'Under <strong>unilateral light</strong>, the tip senses direction so more growth stimulus travels down the <strong>shaded</strong> side → faster elongation there → bending toward light.',
              '<strong>Decapitation</strong>: no tip → no sensing／stimulus → little elongation or bending.',
              '<strong>Opaque cap</strong>: tip shaded → no directional cue → upright (may elongate without bending).',
              '<strong>Transparent cap</strong>: light reaches tip → normal phototropic bending (cap alone does not block bending).',
              '<strong>Opaque basal sleeve</strong>: elongation zone covered, tip exposed → still bends → sensing at tip, effect below.',
              '<strong>Overhead light</strong>: roughly symmetric → upright; a cut shoot still fails to elongate under overhead light.',
              '<strong>Scope</strong>: tip-sensing treatments＋light direction only—<strong>not</strong> Boysen-Jensen agar／mica barriers; <strong>not</strong> Went’s split-block X／Y dark-curvature assay.'
            ],
            egTitle: 'Everyday example',
            eg: 'Houseplants leaning toward a window are everyday phototropism. This sim is the Darwin tip-sensing foundation before Boysen-Jensen’s chemical-signal barriers and Went’s auxin quantification.'
          }
        };

        const QUIZ = [
          {
            q: {
              zh: '重置後維持預設完整胚芽鞘與右側單側光，按開始實驗。哪項觀察最合理？',
              en: 'After Reset, keep default Intact and unilateral light from the right, then Run. Which observation is best?'
            },
            choices: [
              { zh: '對照組與實驗組都向右側光源彎曲——完整尖端可感光並向下傳遞生長刺激', en: 'Control and test both bend toward the right light—an intact tip senses light and sends a growth stimulus down' },
              { zh: '實驗組因是「測試條件」而永遠不彎曲', en: 'The test plant never bends because it is labeled “test”' },
              { zh: '只有對照組彎曲，完整處理的實驗組永遠直立', en: 'Only the control bends; an intact test plant always stays upright' },
              { zh: '本模擬沒有光源方向選項', en: 'This sim has no light-direction control' }
            ],
            ans: 0,
            explain: {
              zh: 'A。intact → calculateBendingMaxAngle 回向光角；左右皆 intact 行為。',
              en: 'A. intact → bending angle toward light; both plants behave as intact.'
            }
          },
          {
            q: {
              zh: '重置後選去頂（切除尖端）、右側單側光，Run。哪項正確？',
              en: 'After Reset, choose Decapitated (tip removed), right unilateral light, Run. Which is correct?'
            },
            choices: null,
                ans: null,
            explain: {
              zh: 'A。cut → 彎曲角 0 且 growth＝1.0；intact 仍彎。',
              en: 'A. cut → bend angle 0 and growth＝1.0; intact still bends.'
            }
          },
          {
            q: {
              zh: '在右側單側光下，先跑不透明帽，再跑透明帽，最後跑基部不透明套管。哪項描述最合理？',
              en: 'Under right unilateral light, run opaque tip cap, then transparent tip cap, then opaque basal sleeve. Which description is most reasonable?'
            },
            choices: [
              { zh: '不透明帽時實驗組直立不彎；透明帽與基部套管時實驗組仍向光彎曲', en: 'Opaque cap: test stays upright without bending; transparent cap and basal sleeve: test still bends toward light' },
              { zh: '三種處理結果完全相同，實驗組都比對照彎得更厲害', en: 'All three treatments behave identically and bend more than the control' },
              { zh: '透明帽會讓實驗組瞬間變成去尖的動畫', en: 'Transparent cap instantly becomes the decapitated animation' },
              { zh: '本模擬沒有「基部不透明套管」選項', en: 'This sim has no “opaque sleeve on base” option' }
            ],
            ans: 0,
            explain: {
              zh: 'A。opaque-cap 角 0；transparent-cap／opaque-sleeve 角＝向光。',
              en: 'A. opaque-cap angle 0; transparent-cap／opaque-sleeve bend toward light.'
            }
          },
          {
            q: {
              zh: '先把處理改成去尖或不透明帽、光源改成左側或頂光並 Run 一次，再按頁首重置。用自己的話寫：（1）重置後處理、光源、動畫進度／結果卡應如何（本設計預期）；（2）重置會不會切換中／EN。',
              en: 'Set cut or opaque-cap and change light to left or overhead, Run once, then press header Reset. In your own words: (1) expected treatment／light／progress／info after Reset; (2) whether Reset switches zh／EN.'
            },
            choices: null,
            ans: null,
            explain: {
              zh: '（1）處理回完整（intact）；光源回右側單側光；progress=0（直立）；結果卡回假設提示；開始鈕可用。（2）不切換語言。',
              en: '(1) Treatment back to intact; light back to right; progress 0 (upright); info = default hypothesis; Run enabled. (2) Reset must not switch language.'
            }
          },
          {
            q: {
              zh: '根據本模擬控件與設計，哪項最正確？',
              en: 'Using this sim’s controls and design, which is most correct?'
            },
            choices: [
              { zh: '可選完整／去尖／不透明帽／透明帽／基部套管與單側／頂光，對照 intact 與實驗組並排，並有步驟／原理／五題／中EN／重置——主軸是 Darwin 證明尖端感光，不是 Boysen-Jensen 瓊脂／雲母阻隔，也不是 Went 分側瓊脂塊 X／Y 偏置回接', en: 'You choose intact／cut／opaque／transparent caps／basal sleeve and uni-/overhead light, compare intact vs test, with steps／principle／five quiz items／zh-EN／Reset—focus Darwin tip light-sensing, not Boysen-Jensen agar／mica, not Went split-block X／Y' },
              { zh: '主要控件是瓊脂塊與雲母片（背光／向光／完全貫穿），用來證明可移動化學信號', en: 'Main controls are agar and mica (shaded／lit／full) to prove a mobile chemical signal' },
              { zh: '重置會強制改成英文並刪除去尖選項', en: 'Reset always switches to English and deletes the decapitation option' },
              { zh: '必須先在單側光下做分側塊 X／Y，再於黑暗中偏置放回去尖苗才能操作', en: 'You must first make split blocks X／Y under unilateral light, then offset them on decapitated shoots in darkness' }
            ],
            ans: 0,
            explain: {
              zh: 'A。隔離 boysen-jensen／frits-went siblings；Reset 不改語言、不刪 treatment 選項。',
              en: 'A. Separates boysen-jensen／frits-went siblings; Reset does not change language or delete treatments.'
            }
          }
        ];

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const treatmentSelect = document.getElementById('treatment');
        const lightDirSelect = document.getElementById('lightDir');
        const infoBox = document.getElementById('infoBox');

        let progress = 0;
        let animationFrame = null;
        let isRunning = false;
        const BASE_Y = 280;

        function updateLanguageUI() {
            const t = i18n[currentLang];
            document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-Hant';
            document.getElementById('btn-lang').textContent = t.langBtn;
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('badge-subject').textContent = t.badge;
            document.getElementById('btn-steps').textContent = t.btnSteps;
            document.getElementById('btn-principle').textContent = t.btnPrinciple;
            document.getElementById('btn-quiz').textContent = t.btnQuiz;
            document.getElementById('btn-reset').textContent = t.btnReset;
            const rp = document.getElementById('btn-reset-panel');
            if (rp) rp.textContent = t.btnReset;
            document.getElementById('setupHeading').textContent = t.setupHeading;
            document.getElementById('labelTreatment').textContent = t.labelTreatment;
            document.getElementById('optIntact').textContent = t.optIntact;
            document.getElementById('optCut').textContent = t.optCut;
            document.getElementById('optOpaqueCap').textContent = t.optOpaqueCap;
            document.getElementById('optTransCap').textContent = t.optTransCap;
            document.getElementById('optOpaqueSleeve').textContent = t.optOpaqueSleeve;
            document.getElementById('labelLightDir').textContent = t.labelLightDir;
            document.getElementById('optRight').textContent = t.optRight;
            document.getElementById('optLeft').textContent = t.optLeft;
            document.getElementById('optOverhead').textContent = t.optOverhead;
            document.getElementById('startBtn').textContent = t.startBtn;
            document.getElementById('legendStem').textContent = t.legendStem;
            document.getElementById('legendOpaque').textContent = t.legendOpaque;
            document.getElementById('legendTrans').textContent = t.legendTrans;

            if (progress >= 1) {
                updateExplanation();
            } else if (progress === 0 && !isRunning) {
                infoBox.innerHTML = t.defaultInfo;
            }
            refreshOpenTeachModals();
            render();
        }

        function drawSoil() {
            ctx.fillStyle = '#8d6e63';
            ctx.fillRect(0, BASE_Y, canvas.width, canvas.height - BASE_Y);
            ctx.fillStyle = '#6d4c41';
            ctx.fillRect(0, BASE_Y, canvas.width, 5);
        }

        function drawLight(direction) {
            if (direction === 'overhead') {
                ctx.fillStyle = 'rgba(241, 196, 15, 0.15)';
                ctx.fillRect(0, 0, canvas.width, BASE_Y);
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(canvas.width / 2, 30, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(241, 196, 15, 0.3)';
                ctx.lineWidth = 2;
                for (let x = 50; x < canvas.width; x += 60) {
                    ctx.beginPath();
                    ctx.moveTo(x, 50);
                    ctx.lineTo(x, BASE_Y);
                    ctx.stroke();
                }
            } else {
                const x = direction === 'right' ? canvas.width - 40 : 40;
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(x, 50, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(241, 196, 15, 0.4)';
                ctx.lineWidth = 3;
                for (let i = -2; i <= 2; i++) {
                    ctx.beginPath();
                    ctx.moveTo(x, 50);
                    const targetX = direction === 'right' ? 0 : canvas.width;
                    ctx.lineTo(targetX, 150 + i * 40);
                    ctx.stroke();
                }
            }
        }

        function drawPlant(x, type, bendAngle, verticalGrowthScale) {
            ctx.save();
            ctx.translate(x, BASE_Y);

            const lowerStemLen = 30 * verticalGrowthScale;
            const bendZoneLen = 70 * verticalGrowthScale;
            const upperTipLen = (type === 'cut' ? 0 : 30);

            const lowerEndX = 0;
            const lowerEndY = -lowerStemLen;

            const ctrlPointX = lowerEndX + Math.sin(bendAngle * 0.4) * (bendZoneLen * 0.5);
            const ctrlPointY = lowerEndY - (bendZoneLen * 0.5);
            const midEndX = lowerEndX + Math.sin(bendAngle) * bendZoneLen;
            const midEndY = lowerEndY - Math.cos(bendAngle) * bendZoneLen;

            const finalTipX = midEndX + Math.sin(bendAngle) * upperTipLen;
            const finalTipY = midEndY - Math.cos(bendAngle) * upperTipLen;

            ctx.strokeStyle = '#27ae60';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(lowerEndX, lowerEndY);
            ctx.quadraticCurveTo(ctrlPointX, ctrlPointY, midEndX, midEndY);

            if (type !== 'cut') {
                ctx.lineTo(finalTipX, finalTipY);
            }
            ctx.stroke();

            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 6;
            ctx.stroke();

            if (type !== 'cut') {
                ctx.fillStyle = '#27ae60';
                ctx.beginPath();
                ctx.arc(finalTipX, finalTipY, 7, 0, Math.PI * 2);
                ctx.fill();
            }

            if (type === 'opaque-cap') {
                ctx.save();
                ctx.translate(finalTipX, finalTipY);
                ctx.rotate(bendAngle);
                ctx.fillStyle = '#34495e';
                ctx.fillRect(-8, -2, 16, upperTipLen + 5);
                ctx.restore();
            } else if (type === 'transparent-cap') {
                ctx.save();
                ctx.translate(finalTipX, finalTipY);
                ctx.rotate(bendAngle);
                ctx.fillStyle = 'rgba(52, 152, 219, 0.5)';
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 1;
                ctx.fillRect(-8, -2, 16, upperTipLen + 5);
                ctx.strokeRect(-8, -2, 16, upperTipLen + 5);
                ctx.restore();
            } else if (type === 'opaque-sleeve') {
                ctx.lineWidth = 16;
                ctx.strokeStyle = '#34495e';
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(lowerEndX, lowerEndY - 5);
                ctx.quadraticCurveTo(ctrlPointX, ctrlPointY, midEndX, midEndY + 5);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawLabels() {
            const t = i18n[currentLang];
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 14px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(t.controlLabel, 150, BASE_Y + 30);
            ctx.fillText(t.testLabel, 350, BASE_Y + 30);
        }

        function calculateBendingMaxAngle(type, direction) {
            if (direction === 'overhead') return 0;
            const bendDirectionConstant = direction === 'right' ? (Math.PI / 5.5) : -(Math.PI / 5.5);
            switch (type) {
                case 'intact':
                case 'transparent-cap':
                case 'opaque-sleeve':
                    return bendDirectionConstant;
                case 'cut':
                case 'opaque-cap':
                    return 0;
                default:
                    return 0;
            }
        }

        function calculateGrowthScale(type) {
            if (type === 'cut') return 1.0;
            return 1.25;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const lightDir = lightDirSelect.value;
            const treatment = treatmentSelect.value;
            drawLight(lightDir);
            drawSoil();
            drawLabels();
            const controlAngleTarget = calculateBendingMaxAngle('intact', lightDir);
            const testAngleTarget = calculateBendingMaxAngle(treatment, lightDir);
            const controlGrowthTarget = calculateGrowthScale('intact');
            const testGrowthTarget = calculateGrowthScale(treatment);
            const controlAngle = controlAngleTarget * progress;
            const testAngle = testAngleTarget * progress;
            const currentControlGrowth = 1.0 + (controlGrowthTarget - 1.0) * progress;
            const currentTestGrowth = 1.0 + (testGrowthTarget - 1.0) * progress;
            drawPlant(150, 'intact', controlAngle, currentControlGrowth);
            drawPlant(350, treatment, testAngle, currentTestGrowth);
        }

        function animate() {
            if (progress < 1) {
                progress += 0.01;
                render();
                animationFrame = requestAnimationFrame(animate);
            } else {
                isRunning = false;
                startBtn.disabled = false;
                updateExplanation();
            }
        }

        function updateExplanation() {
            const t = i18n[currentLang];
            const treatment = treatmentSelect.value;
            const lightDir = lightDirSelect.value;
            if (lightDir === 'overhead') {
                infoBox.innerHTML = (treatment === 'cut') ? t.expOverheadCut : t.expOverheadIntact;
                return;
            }
            switch (treatment) {
                case 'intact': infoBox.innerHTML = t.expIntact; break;
                case 'cut': infoBox.innerHTML = t.expCut; break;
                case 'opaque-cap': infoBox.innerHTML = t.expOpaqueCap; break;
                case 'transparent-cap': infoBox.innerHTML = t.expTransCap; break;
                case 'opaque-sleeve': infoBox.innerHTML = t.expOpaqueSleeve; break;
            }
        }

        function resetAll() {
            closeAllModals(null);
            cancelAnimationFrame(animationFrame);
            isRunning = false;
            startBtn.disabled = false;
            progress = 0;
            treatmentSelect.value = 'intact';
            lightDirSelect.value = 'right';
            infoBox.innerHTML = i18n[currentLang].defaultInfo;
            quizReveal = false;
            render();
        }

        function closeAllModals(exceptId) {
            if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
            ['modal-steps','modal-principle','modal-quiz'].forEach(function(id) {
                if (exceptId && id === exceptId) return;
                var el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }
        function openTeachModal(id) {
            closeAllModals(id);
            var el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        }
        function renderSteps() {
            var t = i18n[currentLang];
            document.getElementById('steps-title').textContent = t.stepsTitle;
            document.getElementById('steps-body').innerHTML = STEPS.map(function(s, i) {
                return '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200"><div class="font-bold text-indigo-600 mb-1">' + (i+1) + '</div><div class="leading-relaxed">' + (currentLang==='en'?s.en:s.zh) + '</div></div>';
            }).join('');
        }
        function renderPrinciple() {
            var p = PRINCIPLE[currentLang] || PRINCIPLE.zh;
            var t = i18n[currentLang];
            document.getElementById('principle-title').textContent = t.principleTitle;
            var mech = p.mech.map(function(m){ return '<li class="mb-2 leading-relaxed">'+m+'</li>'; }).join('');
            document.getElementById('principle-body').innerHTML =
              '<div><h3 class="font-bold text-teal-700 mb-1">'+p.conceptTitle+'</h3><p class="leading-relaxed">'+p.concept+'</p></div>' +
              '<div><h3 class="font-bold text-teal-700 mb-1">'+p.mechTitle+'</h3><ol class="list-decimal pl-5">'+mech+'</ol></div>' +
              '<div><h3 class="font-bold text-teal-700 mb-1">'+p.egTitle+'</h3><p class="leading-relaxed">'+p.eg+'</p></div>';
        }
        function renderQuiz() {
            var t = i18n[currentLang];
            document.getElementById('quiz-title').textContent = t.quizTitle;
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? t.hideAns : t.showAns;
            document.getElementById('quiz-body').innerHTML = QUIZ.map(function(item, qi) {
                var qtext = currentLang==='en' ? item.q.en : item.q.zh;
                var html = '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200 mb-3"><div class="font-bold text-violet-700 mb-2">Q'+(qi+1)+'. '+qtext+'</div>';
                var qNum = qi + 1;
                var isOpen = (qNum === 2 || qNum === 4);
                if (!isOpen && item.choices) {
                  var qName = 'q' + qNum;
                  html += '<div class="grid gap-1.5 text-sm">';
                  item.choices.forEach(function(c, ci) {
                    var label = String.fromCharCode(65+ci);
                    var txt = currentLang==='en' ? c.en : c.zh;
                    html += '<label class="flex items-start gap-2 rounded-lg border border-slate-200 p-2 cursor-pointer hover:bg-slate-50"><input type="radio" name="'+qName+'" class="mt-0.5 accent-violet-600"><span>'+label+'. '+txt+'</span></label>';
                  });
                  html += '</div>';
                } else if (isOpen) {
                  html += '<p class="text-xs text-slate-500 italic">'+(currentLang==='en'?'Predict, then use the sim controls to check. Write in your own words.':'先預測，再操作畫面控件核對，用自己的話作答。')+'</p>';
                }
                if (quizReveal && item.explain) {
                  var ex = currentLang==='en' ? item.explain.en : item.explain.zh;
                  var ref = currentLang==='en' ? 'Reference answer' : '參考答案';
                  html += '<div class="mt-2 text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg p-2"><strong>'+ref+'：</strong> '+ex+'</div>';
                }
                html += '</div>';
                return html;
            }).join('');
        }
        function refreshOpenTeachModals() {
            if (!document.getElementById('modal-steps').classList.contains('hidden')) renderSteps();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) renderPrinciple();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) renderQuiz();
        }
        function wireTeachingUI() {
            document.getElementById('btn-steps').addEventListener('click', function() { renderSteps(); openTeachModal('modal-steps'); });
            document.getElementById('btn-principle').addEventListener('click', function() { renderPrinciple(); openTeachModal('modal-principle'); });
            document.getElementById('btn-quiz').addEventListener('click', function() { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
            document.getElementById('btn-lang').addEventListener('click', function() {
                currentLang = (currentLang === 'en') ? 'zh' : 'en';
                updateLanguageUI();
            });
            document.getElementById('btn-reset').addEventListener('click', resetAll);
            document.getElementById('btn-reset-panel').addEventListener('click', resetAll);
            document.getElementById('btn-quiz-answers').addEventListener('click', function() { quizReveal = !quizReveal; renderQuiz(); });
            document.querySelectorAll('.modal-close').forEach(function(btn) {
                btn.addEventListener('click', function() { closeAllModals(null); });
            });
            document.querySelectorAll('.teach-modal').forEach(function(el) {
                el.addEventListener('click', function(e) { if (e.target === el) closeAllModals(null); });
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeAllModals(null);
            });
        }

        startBtn.addEventListener('click', () => {
            if (isRunning) return;
            isRunning = true;
            startBtn.disabled = true;
            progress = 0;
            animate();
        });

        treatmentSelect.addEventListener('change', () => {
            progress = 0;
            render();
            if (!isRunning) infoBox.innerHTML = i18n[currentLang].defaultInfo;
        });

        lightDirSelect.addEventListener('change', () => {
            progress = 0;
            render();
            if (!isRunning) infoBox.innerHTML = i18n[currentLang].defaultInfo;
        });

        wireTeachingUI();
        updateLanguageUI();
    </script>
