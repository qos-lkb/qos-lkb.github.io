/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

        function drawPlant(x, blockType, placement, bendAngle, growthScale) {
            ctx.save();
            ctx.translate(x, BASE_Y);

            const lowerStemLen = 30 * growthScale;
            const bendZoneLen = 65 * growthScale;

            const lowerEndX = 0;
            const lowerEndY = -lowerStemLen;

            const ctrlPointX = lowerEndX + Math.sin(bendAngle * 0.4) * (bendZoneLen * 0.5);
            const ctrlPointY = lowerEndY - (bendZoneLen * 0.5);
            const midEndX = lowerEndX + Math.sin(bendAngle) * bendZoneLen;
            const midEndY = lowerEndY - Math.cos(bendAngle) * bendZoneLen;

            ctx.strokeStyle = '#27ae60';
            ctx.lineWidth = 14;
            ctx.lineCap = 'butt';

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(lowerEndX, lowerEndY);
            ctx.quadraticCurveTo(ctrlPointX, ctrlPointY, midEndX, midEndY);
            ctx.stroke();

            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.save();
            ctx.translate(midEndX, midEndY);
            ctx.rotate(bendAngle);
            ctx.fillStyle = '#15803d';
            ctx.fillRect(-7, -2, 14, 2);

            if (blockType !== 'none') {
                if (blockType === 'block-Y') {
                    ctx.fillStyle = '#00e5ff';
                    ctx.strokeStyle = '#0284c7';
                } else if (blockType === 'block-X') {
                    ctx.fillStyle = '#c084fc';
                    ctx.strokeStyle = '#9333ea';
                } else if (blockType === 'block-equal') {
                    ctx.fillStyle = '#ff6600';
                    ctx.strokeStyle = '#cc5200';
                } else {
                    ctx.fillStyle = '#94a3b8';
                    ctx.strokeStyle = '#64748b';
                }

                ctx.lineWidth = 1.5;

                if (placement === 'left') {
                    ctx.fillRect(-7, -8, 7, 6);
                    ctx.strokeRect(-7, -8, 7, 6);
                } else if (placement === 'right') {
                    ctx.fillRect(0, -8, 7, 6);
                    ctx.strokeRect(0, -8, 7, 6);
                } else if (placement === 'center') {
                    ctx.fillRect(-6, -8, 12, 6);
                    ctx.strokeRect(-6, -8, 12, 6);
                }
            }

            ctx.restore();
            ctx.restore();
        }

        function calculateBendingAngle(blockType, placement) {
            if (placement === 'center' || blockType === 'block-plain') return 0;
            let magnitude = 0;
            if (blockType === 'block-Y') magnitude = (Math.PI / 5.5);
            else if (blockType === 'block-X') magnitude = (Math.PI / 11);
            else if (blockType === 'block-equal') magnitude = (Math.PI / 7);
            return (placement === 'left') ? magnitude : -magnitude;
        }

        function calculateGrowthScale(blockType) {
            if (blockType === 'block-plain') return 1.0;
            if (blockType === 'block-Y') return 1.35;
            if (blockType === 'block-X') return 1.15;
            return 1.25;
        }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawDarknessIndicator();
            drawSoil();
            drawLabels();

            const placement = placementSelect.value;
            const targetAngle = calculateBendingAngle(blockType, placement);
            const targetGrowth = calculateGrowthScale(blockType);
            const currentAngle = targetAngle * progress;
            const currentGrowth = 1.0 + (targetGrowth - 1.0) * progress;

            drawPlant(120, 'none', 'none', 0, 1.0);
            drawPlant(380, blockType, placement, currentAngle, currentGrowth);
        }

        function animate() {
            if (progress < 1) {
                progress += 0.01;
                render();
                animationFrame = requestAnimationFrame(animate);
            } else {
                isRunning = false;
                startBtn.disabled = false;
                updateExplanation();
            }
        }

        function updateExplanation() {
            const t = i18n[currentLang];
            const blockType = blockTypeSelect.value;
            const placement = placementSelect.value;

            if (blockType === 'block-plain') {
                infoBox.innerHTML = t.expPlain;
                return;
            }
            if (placement === 'center') {
                infoBox.innerHTML = t.expCenter;
                return;
            }
            if (blockType === 'block-Y') {
                infoBox.innerHTML = (placement === 'left') ? t.expBlockYLeft : t.expBlockYRight;
            } else if (blockType === 'block-X') {
                infoBox.innerHTML = (placement === 'left') ? t.expBlockXLeft : t.expBlockXRight;
            } else if (blockType === 'block-equal') {
                infoBox.innerHTML = (placement === 'left') ? t.expControlLeft : t.expControlRight;
            }
        }

        function resetAll() {
            closeAllModals(null);
            cancelAnimationFrame(animationFrame);
            isRunning = false;
            startBtn.disabled = false;
            progress = 0;
            blockTypeSelect.value = 'block-Y';
            placementSelect.value = 'left';
            infoBox.innerHTML = i18n[currentLang].defaultInfo;
            quizReveal = false;
            render();
        }

        function closeAllModals(exceptId) {
            if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
            ['modal-steps','modal-principle','modal-quiz'].forEach(function(id) {
                if (exceptId && id === exceptId) return;
                var el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }
        function openTeachModal(id) {
            closeAllModals(id);
            var el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        }
        function renderSteps() {
            var t = i18n[currentLang];
            document.getElementById('steps-title').textContent = t.stepsTitle;
            document.getElementById('steps-body').innerHTML = STEPS.map(function(s, i) {
                return '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200"><div class="font-bold text-indigo-600 mb-1">' + (i+1) + '</div><div class="leading-relaxed">' + (currentLang==='en'?s.en:s.zh) + '</div></div>';
            }).join('');
        }
        function renderPrinciple() {
            var p = PRINCIPLE[currentLang] || PRINCIPLE.zh;
            var t = i18n[currentLang];
            document.getElementById('principle-title').textContent = t.principleTitle;
            var mech = p.mech.map(function(m){ return '<li class="mb-2 leading-relaxed">'+m+'</li>'; }).join('');
            document.getElementById('principle-body').innerHTML =
              '<div><h3 class="font-bold text-teal-700 mb-1">'+p.conceptTitle+'</h3><p class="leading-relaxed">'+p.concept+'</p></div>' +
              '<div><h3 class="font-bold text-teal-700 mb-1">'+p.mechTitle+'</h3><ol class="list-decimal pl-5">'+mech+'</ol></div>' +
              '<div><h3 class="font-bold text-teal-700 mb-1">'+p.egTitle+'</h3><p class="leading-relaxed">'+p.eg+'</p></div>';
        }
        function renderQuiz() {
            var t = i18n[currentLang];
            document.getElementById('quiz-title').textContent = t.quizTitle;
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? t.hideAns : t.showAns;
            document.getElementById('quiz-body').innerHTML = QUIZ.map(function(item, qi) {
                var qtext = currentLang==='en' ? item.q.en : item.q.zh;
                var html = '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200 mb-3"><div class="font-bold text-violet-700 mb-2">Q'+(qi+1)+'. '+qtext+'</div>';
                var qNum = qi + 1;
                var isOpen = (qNum === 2 || qNum === 4);
                if (!isOpen && item.choices) {
                  var qName = 'q' + qNum;
                  html += '<div class="grid gap-1.5 text-sm">';
                  item.choices.forEach(function(c, ci) {
                    var label = String.fromCharCode(65+ci);
                    var txt = currentLang==='en' ? c.en : c.zh;
                    html += '<label class="flex items-start gap-2 rounded-lg border border-slate-200 p-2 cursor-pointer hover:bg-slate-50"><input type="radio" name="'+qName+'" class="mt-0.5 accent-violet-600"><span>'+label+'. '+txt+'</span></label>';
                  });
                  html += '</div>';
                } else if (isOpen) {
                  html += '<p class="text-xs text-slate-500 italic">'+(currentLang==='en'?'Predict, then use the sim controls to check. Write in your own words.':'先預測，再操作畫面控件核對，用自己的話作答。')+'</p>';
                }
                if (quizReveal && item.explain) {
                  var ex = currentLang==='en' ? item.explain.en : item.explain.zh;
                  var ref = currentLang==='en' ? 'Reference answer' : '參考答案';
                  html += '<div class="mt-2 text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg p-2"><strong>'+ref+'：</strong> '+ex+'</div>';
                }
                html += '</div>';
                return html;
            }).join('');
        }
        function refreshOpenTeachModals() {
            if (!document.getElementById('modal-steps').classList.contains('hidden')) renderSteps();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) renderPrinciple();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) renderQuiz();
        }
        function wireTeachingUI() {
            document.getElementById('btn-steps').addEventListener('click', function() { renderSteps(); openTeachModal('modal-steps'); });
            document.getElementById('btn-principle').addEventListener('click', function() { renderPrinciple(); openTeachModal('modal-principle'); });
            document.getElementById('btn-quiz').addEventListener('click', function() { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
            document.getElementById('btn-lang').addEventListener('click', function() {
                currentLang = (currentLang === 'en') ? 'zh' : 'en';
                updateLanguageUI();
            });
            document.getElementById('btn-reset').addEventListener('click', resetAll);
            document.getElementById('btn-reset-panel').addEventListener('click', resetAll);
            document.getElementById('btn-quiz-answers').addEventListener('click', function() { quizReveal = !quizReveal; renderQuiz(); });
            document.querySelectorAll('.modal-close').forEach(function(btn) {
                btn.addEventListener('click', function() { closeAllModals(null); });
            });
            document.querySelectorAll('.teach-modal').forEach(function(el) {
                el.addEventListener('click', function(e) { if (e.target === el) closeAllModals(null); });
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeAllModals(null);
            });
        }

        startBtn.addEventListener('click', () => {
            if (isRunning) return;
            isRunning = true;
            startBtn.disabled = true;
            progress = 0;
            animate();
        });

        blockTypeSelect.addEventListener('change', () => {
            progress = 0;
            render();
            if (!isRunning) infoBox.innerHTML = i18n[currentLang].defaultInfo;
        });

        placementSelect.addEventListener('change', () => {
            progress = 0;
            render();
            if (!isRunning) infoBox.innerHTML = i18n[currentLang].defaultInfo;
        });

        wireTeachingUI();
        updateLanguageUI();
    </script>
</body>
</html>
