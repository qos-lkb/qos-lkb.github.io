<script>
/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

function t() { return i18n[currentLang] || i18n.zh; }

function ionName(ion) {
  return currentLang === 'en' ? ion.nameEn : ion.nameZh;
}

function rxnName(rxn) {
  return currentLang === 'en' ? rxn.prodNameEn : rxn.prodNameZh;
}

function rxnKey(rxn) {
  return rxn.pair[0] + '|' + rxn.pair[1];
}

function findRxnByKey(key) {
  for (let i = 0; i < REACTIONS.length; i++) {
    if (rxnKey(REACTIONS[i]) === key) return REACTIONS[i];
  }
  return null;
}

function closeAllModals(exceptId) {
  if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
    if (id === exceptId) return;
    var el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  });
}

function openTeachModal(id) {
  closeAllModals(id);
  modalTimer = setTimeout(function () {
    var el = document.getElementById(id);
    if (el) el.classList.remove('hidden');
    modalTimer = null;
  }, 10);
}

function populateSelects() {
  var d = t();
  var ionSelect = document.getElementById('ionSelect');
  var prev = ionSelect.value;
  ionSelect.innerHTML = '';
  var catGroup = document.createElement('optgroup');
  catGroup.label = d.cations;
  var anGroup = document.createElement('optgroup');
  anGroup.label = d.anions;
  for (var key in ION_DATABASE) {
    var ion = ION_DATABASE[key];
    var opt = document.createElement('option');
    opt.value = key;
    opt.textContent = ion.formula + ' - ' + ionName(ion) + (ion.isColorless ? d.colorless : '');
    if (ion.charge > 0) catGroup.appendChild(opt); else anGroup.appendChild(opt);
  }
  ionSelect.appendChild(catGroup);
  ionSelect.appendChild(anGroup);
  if (prev && ION_DATABASE[prev]) ionSelect.value = prev;
  else ionSelect.value = 'Cu2';
  updatePosOptions(true);
}

function updatePosOptions(preserve) {
  var d = t();
  var posSelect = document.getElementById('posSelect');
  var prev = preserve ? posSelect.value : null;
  var map = currentMode === 'filter' ? d.posFilter : d.posUTube;
  posSelect.innerHTML = '';
  ['left', 'center', 'right'].forEach(function (v) {
    var opt = document.createElement('option');
    opt.value = v;
    opt.textContent = map[v];
    if (v === 'center') opt.selected = true;
    posSelect.appendChild(opt);
  });
  if (prev && (prev === 'left' || prev === 'center' || prev === 'right')) {
    posSelect.value = prev;
  }
}

function getUTubePos(s, r) {
  var x, y, nx, ny;
  if (s <= L1) {
    x = XL; y = Y_TOP + s; nx = 1; ny = 0;
  } else if (s <= L1 + L2) {
    var s_rel = s - L1;
    var theta = Math.PI - (s_rel / L2) * Math.PI;
    x = (XL + XR) / 2 + R * Math.cos(theta);
    y = Y_BOT + R * Math.sin(theta);
    nx = Math.cos(theta); ny = Math.sin(theta);
  } else {
    var s_rel2 = s - L1 - L2;
    x = XR; y = Y_BOT - s_rel2; nx = 1; ny = 0;
  }
  return { x: x + nx * r, y: y + ny * r };
}

function Particle(key, startXorS, customProps) {
  if (customProps) {
    this.key = key; this.formula = customProps.formula; this.charge = customProps.charge; this.color = customProps.color; this.isColorless = false;
  } else {
    var ion = ION_DATABASE[key];
    this.key = key; this.formula = ion.formula; this.charge = ion.charge; this.color = ion.color; this.isColorless = !!ion.isColorless;
  }
  this.radius = 5;
  this.remove = false;
  if (currentMode === 'filter') {
    this.x = startXorS + (Math.random() - 0.5) * 35;
    this.y = canvas.height / 2 + (Math.random() - 0.5) * 45;
  } else {
    this.s = startXorS + (Math.random() - 0.5) * 15;
    this.r = (Math.random() - 0.5) * (TUBE_WIDTH - 10);
  }
}

Particle.prototype.update = function () {
  if (currentMode === 'filter') {
    this.x += (Math.random() - 0.5) * 0.5;
    this.y += (Math.random() - 0.5) * 0.5;
    if (isPowerOn && voltage > 0 && this.charge !== 0) {
      this.x += (-this.charge * voltage) * 0.015;
    }
    var minX = 65, maxX = 695, minY = 75, maxY = 205;
    if (this.x < minX) this.x = minX; if (this.x > maxX) this.x = maxX;
    if (this.y < minY) this.y = minY; if (this.y > maxY) this.y = maxY;
  } else {
    this.s += (Math.random() - 0.5) * 0.5;
    this.r += (Math.random() - 0.5) * 0.3;
    if (isPowerOn && voltage > 0 && this.charge !== 0) {
      this.s += (-this.charge * voltage) * 0.04;
    }
    if (this.s < 5) this.s = 5;
    if (this.s > L_TOTAL - 5) this.s = L_TOTAL - 5;
    var maxR = (TUBE_WIDTH - 10) / 2;
    if (this.r < -maxR) this.r = -maxR;
    if (this.r > maxR) this.r = maxR;
  }
};

Particle.prototype.draw = function () {
  if (currentMode === 'utube') {
    var pos = getUTubePos(this.s, this.r);
    this.x = pos.x; this.y = pos.y;
  }
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
  ctx.fillStyle = this.color;
  ctx.globalAlpha = this.isColorless ? 0.3 : 0.85;
  ctx.fill();
  ctx.globalAlpha = 1.0;
  ctx.strokeStyle = this.isColorless ? 'rgba(0,0,0,0.4)' : 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();
};

function addIonBatch() {
  var key = document.getElementById('ionSelect').value;
  var pos = document.getElementById('posSelect').value;
  var startVal;
  if (currentMode === 'filter') {
    startVal = canvas.width / 2;
    if (pos === 'left') startVal = 110; else if (pos === 'right') startVal = 650;
  } else {
    startVal = L_TOTAL / 2;
    if (pos === 'left') startVal = L1 * 0.4; else if (pos === 'right') startVal = L1 + L2 + L3 * 0.6;
  }
  addedBatches.push({ key: key, pos: pos });
  for (var i = 0; i < 60; i++) particles.push(new Particle(key, startVal));
  renderIonTags();
}

function checkReactions() {
  for (var i = 0; i < particles.length; i++) {
    var p1 = particles[i]; if (p1.remove || !p1.x) continue;
    for (var j = i + 1; j < particles.length; j++) {
      var p2 = particles[j]; if (p2.remove || !p2.x) continue;
      var dx = p1.x - p2.x, dy = p1.y - p2.y;
      if (Math.sqrt(dx * dx + dy * dy) < 10) {
        for (var k = 0; k < REACTIONS.length; k++) {
          var rxn = REACTIONS[k];
          if ((p1.key === rxn.pair[0] && p2.key === rxn.pair[1]) || (p1.key === rxn.pair[1] && p2.key === rxn.pair[0])) {
            p1.remove = true; p2.remove = true;
            var midVal = currentMode === 'filter' ? (p1.x + p2.x) / 2 : (p1.s + p2.s) / 2;
            particles.push(new Particle(rxn.prodFormula, midVal, { formula: rxn.prodFormula, charge: rxn.charge, color: rxn.color }));
            activeReactions.add(rxnKey(rxn));
            updateReactionLog();
            break;
          }
        }
      }
    }
  }
  particles = particles.filter(function (p) { return !p.remove; });
}

function updateReactionLog() {
  var d = t();
  var logBox = document.getElementById('reactionLog');
  if (activeReactions.size > 0) {
    logBox.style.display = 'block';
    var names = [];
    activeReactions.forEach(function (key) {
      var rxn = findRxnByKey(key);
      if (rxn) names.push(rxnName(rxn));
    });
    logBox.innerHTML = '<b>' + d.logPrefix + '</b> ' + names.join(currentLang === 'zh' ? '； ' : '; ');
  } else {
    logBox.style.display = 'none';
    logBox.innerHTML = '';
  }
}

function clearAll() {
  particles = [];
  addedBatches = [];
  activeReactions.clear();
  updateReactionLog();
  renderIonTags();
}

function renderIonTags() {
  var d = t();
  var box = document.getElementById('ionTagsBox');
  if (addedBatches.length === 0) {
    box.innerHTML = '<span class="text-slate-400">' + d.tagsEmpty + '</span>';
    return;
  }
  box.innerHTML = '';
  var posTextMap = currentMode === 'filter' ? d.tagPosFilter : d.tagPosUTube;
  addedBatches.forEach(function (b) {
    var ion = ION_DATABASE[b.key]; if (!ion) return;
    var tag = document.createElement('div');
    tag.className = 'ion-tag';
    tag.innerHTML = '<span class="color-dot" style="background:' + ion.color + '"></span>' + ion.formula + ' (' + posTextMap[b.pos] + ')';
    box.appendChild(tag);
  });
}

function drawFilterPaperScene() {
  ctx.fillStyle = '#f0f0f0'; ctx.fillRect(50, 60, 660, 160);
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 2; ctx.strokeRect(50, 60, 660, 160);
  ctx.beginPath(); ctx.setLineDash([5, 5]);
  ctx.moveTo(canvas.width / 2, 60); ctx.lineTo(canvas.width / 2, 220);
  ctx.strokeStyle = '#aaa'; ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#34495e'; ctx.fillRect(30, 40, 20, 200);
  ctx.fillStyle = '#34495e'; ctx.fillRect(710, 40, 20, 200);
  ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 32px Arial'; ctx.fillText('-', 8, 145);
  ctx.fillStyle = '#2980b9'; ctx.font = 'bold 32px Arial'; ctx.fillText('+', 735, 145);
  ctx.beginPath(); ctx.lineWidth = 3;
  ctx.strokeStyle = isPowerOn ? '#f39c12' : '#95a5a6';
  ctx.moveTo(40, 40); ctx.lineTo(40, 15); ctx.lineTo(330, 15);
  ctx.moveTo(720, 40); ctx.lineTo(720, 15); ctx.lineTo(430, 15);
  ctx.stroke();
}

function drawUTubeScene() {
  var halfW = TUBE_WIDTH / 2;
  ctx.lineWidth = 3; ctx.strokeStyle = '#7f8c8d'; ctx.fillStyle = 'rgba(224, 247, 250, 0.3)';
  ctx.beginPath();
  ctx.moveTo(XL - halfW, Y_TOP);
  ctx.lineTo(XL - halfW, Y_BOT);
  ctx.arc((XL + XR) / 2, Y_BOT, R + halfW, Math.PI, 0, true);
  ctx.lineTo(XR + halfW, Y_TOP);
  ctx.moveTo(XR - halfW, Y_TOP);
  ctx.lineTo(XR - halfW, Y_BOT);
  ctx.arc((XL + XR) / 2, Y_BOT, R - halfW, 0, Math.PI, false);
  ctx.lineTo(XL + halfW, Y_TOP);
  ctx.stroke(); ctx.fill();
  ctx.fillStyle = '#34495e'; ctx.fillRect(XL - 5, Y_TOP - 20, 10, 80);
  ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 28px Arial'; ctx.fillText('-', XL - 35, Y_TOP + 15);
  ctx.fillStyle = '#34495e'; ctx.fillRect(XR - 5, Y_TOP - 20, 10, 80);
  ctx.fillStyle = '#2980b9'; ctx.font = 'bold 28px Arial'; ctx.fillText('+', XR + 20, Y_TOP + 15);
  ctx.beginPath(); ctx.lineWidth = 3;
  ctx.strokeStyle = isPowerOn ? '#f39c12' : '#95a5a6';
  ctx.moveTo(XL, Y_TOP - 20); ctx.lineTo(XL, 15); ctx.lineTo(330, 15);
  ctx.moveTo(XR, Y_TOP - 20); ctx.lineTo(XR, 15); ctx.lineTo(430, 15);
  ctx.stroke();
}

function drawScene() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (currentMode === 'filter') drawFilterPaperScene();
  else drawUTubeScene();
  var d = t();
  ctx.fillStyle = isPowerOn ? '#2ecc71' : '#e74c3c';
  ctx.fillRect(330, 5, 100, 20);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial';
  var ptxt = isPowerOn ? d.powerCanvasOn : d.powerCanvasOff;
  ctx.fillText(ptxt, 342, 19);
  checkReactions();
  particles.forEach(function (p) { p.update(); p.draw(); });
  requestAnimationFrame(drawScene);
}

function syncPowerBtn() {
  var d = t();
  var btn = document.getElementById('powerBtn');
  btn.textContent = isPowerOn ? d.powerOff : d.powerOn;
  if (isPowerOn) btn.classList.remove('off'); else btn.classList.add('off');
}

function togglePower() {
  isPowerOn = !isPowerOn;
  syncPowerBtn();
}

function switchMode(mode) {
  if (currentMode === mode) return;
  currentMode = mode;
  document.getElementById('tabFilter').classList.toggle('active', mode === 'filter');
  document.getElementById('tabUTube').classList.toggle('active', mode === 'utube');
  updatePosOptions(false);
  clearAll();
}

function resetSimulation() {
  isPowerOn = false;
  voltage = 15;
  document.getElementById('voltageSlider').value = '15';
  document.getElementById('voltageVal').textContent = '15';
  currentMode = 'filter';
  document.getElementById('tabFilter').classList.add('active');
  document.getElementById('tabUTube').classList.remove('active');
  clearAll();
  populateSelects();
  document.getElementById('ionSelect').value = 'Cu2';
  document.getElementById('posSelect').value = 'center';
  syncPowerBtn();
  closeAllModals(null);
}

function renderSteps() {
  var list = STEPS[currentLang] || STEPS.zh;
  var ol = document.getElementById('steps-body');
  ol.innerHTML = list.map(function (s) { return '<li class="leading-relaxed">' + s + '</li>'; }).join('');
}

function renderPrinciple() {
  var p = PRINCIPLE[currentLang] || PRINCIPLE.zh;
  var body = document.getElementById('principle-body');
  var html = '<h3 class="font-bold text-slate-800">' + p.conceptTitle + '</h3><p>' + p.concept + '</p>';
  html += '<h3 class="font-bold text-slate-800 mt-2">' + p.mechTitle + '</h3><ol class="list-decimal list-inside space-y-1">';
  p.mech.forEach(function (m) { html += '<li>' + m + '</li>'; });
  html += '</ol><h3 class="font-bold text-slate-800 mt-2">' + p.everydayTitle + '</h3><p>' + p.everyday + '</p>';
  body.innerHTML = html;
}

function renderQuiz() {
  var d = t();
  var body = document.getElementById('quiz-body');
  var ansBtn = document.getElementById('btn-quiz-answers');
  if (ansBtn) ansBtn.textContent = quizReveal ? d.hideAns : d.showAns;
  if (!body) return;
  var ref = currentLang === 'en' ? 'Reference answer' : '參考答案';
  var hint = currentLang === 'en' ? 'Predict, then use the sim controls to check. Write in your own words.' : '先預測，再操作畫面控件核對，用自己的話作答。';
  body.innerHTML = QUIZ.map(function (item, qi) {
    var qNum = qi + 1;
    var isOpen = (qNum === 2 || qNum === 4);
    var q = item.q[currentLang] || item.q.zh;
    var block = '<div class="border border-slate-200 rounded-lg p-3"><p class="font-semibold">Q' + qNum + '. ' + q + '</p>';
    if (!isOpen && item.options) {
      var qName = 'q' + qNum;
      var opts = item.options[currentLang] || item.options.zh;
      block += '<div class="grid gap-1.5 mt-2">' + opts.map(function (o, oi) {
        var letter = String.fromCharCode(65 + oi);
        return '<label class="flex items-start gap-2 rounded border border-slate-200 p-2 cursor-pointer"><input type="radio" name="' + qName + '" class="mt-0.5"><span>' + letter + '. ' + o + '</span></label>';
      }).join('') + '</div>';
    } else if (isOpen) {
      block += '<p class="text-xs text-slate-500 mt-2 italic">' + hint + '</p>';
    }
    if (quizReveal) {
      var ans = item.answerText[currentLang] || item.answerText.zh;
      block += '<div class="mt-2 text-emerald-800 bg-emerald-50 p-2 rounded text-xs border border-emerald-200"><strong>' + ref + '：</strong> ' + ans + '</div>';
    }
    block += '</div>';
    return block;
  }).join('');
}

function applyLang() {
  var d = t();
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-Hant';
  document.getElementById('app-title').textContent = d.title;
  document.getElementById('app-subtitle').textContent = d.subtitle;
  document.getElementById('badge-subject').textContent = d.badge;
  document.getElementById('btn-steps').textContent = d.btnSteps;
  document.getElementById('btn-principle').textContent = d.btnPrinciple;
  document.getElementById('btn-quiz').textContent = d.btnQuiz;
  document.getElementById('btn-reset-label').textContent = d.btnReset;
  document.getElementById('tabFilter').textContent = d.tabFilter;
  document.getElementById('tabUTube').textContent = d.tabUTube;
  document.getElementById('rule-tip-label').textContent = d.ruleLabel;
  document.getElementById('rule-tip-body').textContent = d.ruleBody;
  document.getElementById('lbl-ion').textContent = d.lblIon;
  document.getElementById('lbl-pos').textContent = d.lblPos;
  document.getElementById('addIonBtn').textContent = d.addIon;
  document.getElementById('lbl-voltage').innerHTML = d.lblVoltage + '<span id="voltageVal">' + voltage + '</span> V';
  document.getElementById('clearBtn').textContent = d.clear;
  document.getElementById('note-neutral').textContent = d.noteNeutral;
  document.getElementById('lbl-active').textContent = d.lblActive;
  document.getElementById('steps-title').textContent = d.stepsTitle;
  document.getElementById('principle-title').textContent = d.principleTitle;
  document.getElementById('quiz-title').textContent = d.quizTitle;
  syncPowerBtn();
  populateSelects();
  renderIonTags();
  updateReactionLog();
  if (!document.getElementById('modal-steps').classList.contains('hidden')) renderSteps();
  if (!document.getElementById('modal-principle').classList.contains('hidden')) renderPrinciple();
  if (!document.getElementById('modal-quiz').classList.contains('hidden')) renderQuiz();
}

document.getElementById('tabFilter').addEventListener('click', function () { switchMode('filter'); });
document.getElementById('tabUTube').addEventListener('click', function () { switchMode('utube'); });
document.getElementById('addIonBtn').addEventListener('click', addIonBatch);
document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('powerBtn').addEventListener('click', togglePower);
document.getElementById('voltageSlider').addEventListener('input', function (e) {
  voltage = parseInt(e.target.value, 10);
  var vv = document.getElementById('voltageVal');
  if (vv) vv.textContent = voltage;
});
document.getElementById('btn-reset').addEventListener('click', resetSimulation);
document.getElementById('btn-lang').addEventListener('click', function () {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  applyLang();
});
document.getElementById('btn-steps').addEventListener('click', function () { renderSteps(); openTeachModal('modal-steps'); });
document.getElementById('btn-principle').addEventListener('click', function () { renderPrinciple(); openTeachModal('modal-principle'); });
document.getElementById('btn-quiz').addEventListener('click', function () { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
var quizAnsBtn = document.getElementById('btn-quiz-answers');
if (quizAnsBtn) quizAnsBtn.addEventListener('click', function () { quizReveal = !quizReveal; renderQuiz(); });

document.querySelectorAll('.modal-close').forEach(function (btn) {
  btn.addEventListener('click', function () { closeAllModals(null); });
});
['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
  var el = document.getElementById(id);
  el.addEventListener('click', function (e) { if (e.target === el) closeAllModals(null); });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeAllModals(null);
});

applyLang();
drawScene();
})();
</script>
</body>
</html>
