function t(key) { return i18n[lang][key] ?? key; }

function applyI18n() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[lang][key] != null) el.innerHTML = i18n[lang][key];
    });
    document.getElementById('modal-body').innerHTML = i18n[lang].modalBody;
    document.getElementById('btn-auto-heat').textContent = isAutoHeating ? t('btnAutoStop') : t('btnAutoStart');
    if (window.MathJax?.typesetPromise) MathJax.typesetPromise([document.getElementById('modal-body')]);
    renderFractionsList();
}

function toggleLang() {
    lang = lang === 'zh' ? 'en' : 'zh';
    applyI18n();
}

function setModal(id, open) {
    const el = document.getElementById(id);
    const panel = el.querySelector('.modal-content');
    if (open) {
        el.classList.remove('opacity-0', 'pointer-events-none');
        panel.classList.remove('scale-95', 'opacity-0');
        panel.classList.add('scale-100', 'opacity-100');
    } else {
        el.classList.add('opacity-0', 'pointer-events-none');
        panel.classList.add('scale-95', 'opacity-0');
        panel.classList.remove('scale-100', 'opacity-100');
    }
}

/** 整廠幾何：原油槽 → 進料管 → 加熱爐 → 入塔管 → 分餾塔 → 出料管 → 收集槽 */
function buildLayout(w, h) {
    const towerCX = w * 0.38;
    const towerW = w * 0.17;
    const towerTop = h * 0.05;
    const towerBot = h * 0.66;
    const towerH = towerBot - towerTop;
    const trayStep = towerH / 8;
    const pipeW = Math.max(5, w * 0.014);

    const crude = { x: w * 0.025, y: h * 0.74, w: w * 0.12, h: h * 0.13 };
    const furnace = { x: towerCX - towerW * 0.85, y: h * 0.70, w: towerW * 1.7, h: h * 0.10 };

    const inletPath = [
        { x: crude.x + crude.w, y: crude.y + crude.h * 0.38 },
        { x: furnace.x - pipeW * 1.5, y: crude.y + crude.h * 0.38 },
        { x: furnace.x - pipeW * 1.5, y: furnace.y + furnace.h * 0.55 },
        { x: furnace.x + pipeW, y: furnace.y + furnace.h * 0.55 }
    ];
    const riserPath = [
        { x: towerCX, y: furnace.y + 2 },
        { x: towerCX, y: towerBot }
    ];

    const outlets = fractionsData.map(f => {
        const trayY = towerBot - (f.yIdx + 0.5) * trayStep;
        const tankH = h * 0.042;
        const tankW = w * 0.095;
        const tankX = w * 0.855;
        const tankY = trayY - tankH / 2;
        const path = [
            { x: towerCX + towerW / 2, y: trayY },
            { x: w * 0.58, y: trayY },
            { x: w * 0.58, y: trayY },
            { x: tankX, y: trayY }
        ];
        return { frac: f, trayY, path, tank: { x: tankX, y: tankY, w: tankW, h: tankH } };
    });

    return { towerCX, towerW, towerTop, towerBot, towerH, trayStep, pipeW, crude, furnace, inletPath, riserPath, outlets };
}

function pathLength(pts) {
    let len = 0;
    for (let i = 1; i < pts.length; i++) {
        len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    }
    return len;
}

function pointOnPath(pts, t) {
    const total = pathLength(pts);
    let dist = ((t % 1) + 1) % 1 * total;
    for (let i = 1; i < pts.length; i++) {
        const seg = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
        if (dist <= seg) {
            const r = seg ? dist / seg : 0;
            return {
                x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * r,
                y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * r
            };
        }
        dist -= seg;
    }
    return { ...pts[pts.length - 1] };
}

function drawPipe(pts, width, stroke, fill, active, flowColor) {
    if (pts.length < 2) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = width + 3;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.strokeStyle = fill;
    ctx.lineWidth = width;
    ctx.stroke();
    if (active && flowColor) {
        const n = 3;
        for (let i = 0; i < n; i++) {
            const p = pointOnPath(pts, (flowPhase * 0.003 + i / n) % 1);
            ctx.beginPath();
            ctx.arc(p.x, p.y, width * 0.35, 0, Math.PI * 2);
            ctx.fillStyle = flowColor;
            ctx.globalAlpha = 0.75;
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}

function drawStorageTank(tank, fillRatio, liquidColor, label, sublabel) {
    const { x, y, w, h } = tank;
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, h * 0.25);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y, w / 2, h * 0.18, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#334155';
    ctx.fill();
    ctx.stroke();
    if (fillRatio > 0.02) {
        const fh = h * 0.82 * Math.min(1, fillRatio);
        const grad = ctx.createLinearGradient(0, y + h - fh, 0, y + h);
        grad.addColorStop(0, liquidColor);
        grad.addColorStop(1, liquidColor + 'aa');
        ctx.fillStyle = grad;
        ctx.fillRect(x + 3, y + h - fh - 2, w - 6, fh);
    }
    ctx.fillStyle = '#e2e8f0';
    ctx.font = `bold ${Math.max(7, w * 0.14)}px 'Noto Sans TC', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(label, x + w / 2, y - 5);
    if (sublabel) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = `${Math.max(6, w * 0.11)}px 'Noto Sans TC', sans-serif`;
        ctx.fillText(sublabel, x + w / 2, y + h + 10);
    }
    ctx.textAlign = 'left';
}

function drawFurnaceBox(f, heat) {
    ctx.fillStyle = '#292524';
    ctx.strokeStyle = '#78716c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(f.x, f.y, f.w, f.h, 6);
    ctx.fill();
    ctx.stroke();
    const glow = ctx.createLinearGradient(0, f.y + f.h, 0, f.y);
    glow.addColorStop(0, `rgba(239,68,68,${heat * 0.9})`);
    glow.addColorStop(0.5, `rgba(251,146,60,${heat * 0.5})`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(f.x + 4, f.y + 4, f.w - 8, f.h - 4);
    if (heat > 0.15) {
        for (let i = 0; i < 4; i++) {
            const fx = f.x + f.w * (0.25 + i * 0.18);
            ctx.beginPath();
            ctx.moveTo(fx, f.y + f.h);
            ctx.quadraticCurveTo(fx + (i % 2 ? 4 : -4), f.y + f.h + 14 * heat, fx, f.y + f.h + 22 * heat);
            ctx.strokeStyle = `rgba(251,191,36,${0.3 + heat * 0.5})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }
}

function drawColumn(L, heat) {
    const { towerCX, towerW, towerTop, towerBot, towerH, trayStep, outlets } = L;
    const left = towerCX - towerW / 2;
    const grad = ctx.createLinearGradient(towerCX - towerW / 2, towerTop, towerCX + towerW / 2, towerTop);
    grad.addColorStop(0, '#334155');
    grad.addColorStop(0.45, '#475569');
    grad.addColorStop(0.55, '#475569');
    grad.addColorStop(1, '#334155');
    ctx.fillStyle = grad;
    ctx.fillRect(left, towerTop, towerW, towerH);
    const tempGrad = ctx.createLinearGradient(0, towerBot, 0, towerTop);
    tempGrad.addColorStop(0, `rgba(239,68,68,${0.2 + heat * 0.25})`);
    tempGrad.addColorStop(0.55, 'rgba(100,116,139,0.06)');
    tempGrad.addColorStop(1, 'rgba(56,189,248,0.15)');
    ctx.fillStyle = tempGrad;
    ctx.fillRect(left + 2, towerTop, towerW - 4, towerH);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(left, towerTop, towerW, towerH);
    ctx.fillStyle = '#64748b';
    ctx.beginPath();
    ctx.ellipse(towerCX, towerTop, towerW / 2, towerW * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#94a3b8';
    ctx.stroke();
    for (let i = 0; i < 8; i++) {
        const frac = fractionsData[7 - i];
        const y = towerBot - i * trayStep;
        const active = currentTemp >= frac.bp;
        ctx.strokeStyle = active ? frac.color : '#475569';
        ctx.lineWidth = active ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(left + 3, y);
        ctx.lineTo(left + towerW * 0.22, y);
        ctx.lineTo(towerCX, y - 3);
        ctx.lineTo(left + towerW * 0.78, y);
        ctx.lineTo(left + towerW - 3, y);
        ctx.stroke();
        if (active) {
            ctx.fillStyle = frac.color + '44';
            ctx.fillRect(left + 4, y - 2, towerW - 8, 4);
        }
    }
    ctx.fillStyle = '#94a3b8';
    ctx.font = `${Math.max(7, cw * 0.017)}px monospace`;
    ctx.fillText('450°C', left - 30, towerBot - 2);
    ctx.fillText('~150°C', left - 30, towerTop + towerH * 0.5);
    ctx.fillText('~40°C', left - 26, towerTop + 12);
}

function fractionState(f) {
    if (currentTemp < f.bp) return 'wait';
    if (currentTemp >= f.bp && currentTemp < f.bp + 35) return 'boil';
    return 'collect';
}

function renderFractionsList() {
    const container = document.getElementById('fractions-container');
    container.innerHTML = fractionsData.map(f => {
        const state = fractionState(f);
        const active = currentTemp >= f.bp;
        const pct = Math.min(100, Math.round((collected[f.id] / 40) * 100));
        const cardCls = active
            ? (state === 'boil' ? 'bg-white border-blue-300 shadow-md ring-1 ring-blue-100' : 'bg-white border-slate-200 shadow-sm')
            : 'bg-slate-50 border-slate-100 opacity-55';
        const statusCls = state === 'boil' ? 'text-blue-600 animate-pulse' : state === 'collect' ? 'text-emerald-600' : 'text-slate-400';
        const statusText = state === 'boil' ? t('statusBoil') : state === 'collect' ? t('statusCollect') : t('statusWait');
        return `
            <div class="p-3.5 rounded-xl border transition-all duration-300 ${cardCls}">
                <div class="flex items-center justify-between gap-2 mb-1.5">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-3 h-3 rounded-full shrink-0 shadow-sm" style="background:${active ? f.color : '#cbd5e1'}"></span>
                        <h3 class="font-bold text-sm truncate ${active ? 'text-slate-800' : 'text-slate-500'}">${f[lang].name}</h3>
                    </div>
                    <span class="text-[10px] font-mono px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded shrink-0">${t('bpLabel')} ~${f.bp}°C</span>
                </div>
                <p class="text-xs text-slate-600 ml-5 mb-2"><span class="text-slate-400">${t('usageLabel')}:</span> ${f[lang].usage}</p>
                <div class="ml-5 flex items-center gap-2">
                    <span class="text-[10px] font-bold ${statusCls}">${statusText}</span>
                    ${active ? `<div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full rounded-full transition-all" style="width:${pct}%;background:${f.color}"></div></div>` : ''}
                </div>
            </div>`;
    }).join('');
}

function setTemperature(val) {
    currentTemp = Math.max(20, Math.min(450, Math.round(val)));
    document.getElementById('temp-slider').value = currentTemp;
    document.getElementById('temp-display').textContent = currentTemp;
    renderFractionsList();
}

function toggleAutoHeat() {
    isAutoHeating = !isAutoHeating;
    const btn = document.getElementById('btn-auto-heat');
    btn.textContent = isAutoHeating ? t('btnAutoStop') : t('btnAutoStart');
    btn.className = isAutoHeating
        ? 'text-xs px-3 py-1 bg-slate-200 text-slate-700 rounded-full font-bold hover:bg-slate-300 transition-colors'
        : 'text-xs px-3 py-1 bg-red-100 text-red-600 rounded-full font-bold hover:bg-red-200 transition-colors';
}

function resetSim() {
    if (isAutoHeating) toggleAutoHeat();
    setTemperature(20);
    fractionsData.forEach(f => { collected[f.id] = 0; });
    initParticles();
    renderFractionsList();
}

class Particle {
    constructor(fraction) {
        this.fraction = fraction;
        this.pathT = 0;
        this.reset(true);
    }
    reset(initial = false) {
        const L = layout || buildLayout(cw, ch);
        const c = L.crude;
        this.x = c.x + 8 + Math.random() * (c.w - 16);
        this.y = c.y + c.h * 0.45 + Math.random() * (c.h * 0.4);
        this.radius = 1.6 + this.fraction.yIdx * 0.2;
        this.state = 'crude';
        this.pathT = initial ? Math.random() : 0;
        this.vy = 0;
        this.wait = initial ? Math.random() * 120 : 0;
        this.heatDelay = this.fraction.bp * 0.15 * Math.random();
    }
    moveAlong(path, speed) {
        this.pathT += speed;
        if (this.pathT >= 1) { this.pathT = 1; return true; }
        const p = pointOnPath(path, this.pathT);
        this.x = p.x + (Math.random() - 0.5) * 0.6;
        this.y = p.y + (Math.random() - 0.5) * 0.6;
        return false;
    }
    update() {
        const L = layout || buildLayout(cw, ch);
        const outlet = L.outlets.find(o => o.frac.id === this.fraction.id);
        const speed = 0.004 + (currentTemp / 450) * 0.008;

        if (this.wait > 0) { this.wait--; return; }

        if (this.state === 'crude') {
            if (currentTemp > 35) this.state = 'inlet';
            else {
                const c = L.crude;
                this.x += (Math.random() - 0.5) * 0.3;
                this.y += (Math.random() - 0.5) * 0.3;
                this.x = Math.min(Math.max(this.x, c.x + 4), c.x + c.w - 4);
                this.y = Math.min(Math.max(this.y, c.y + c.h * 0.3), c.y + c.h - 4);
            }
        } else if (this.state === 'inlet') {
            if (this.moveAlong(L.inletPath, speed)) {
                this.pathT = 0;
                this.state = 'furnace';
            }
        } else if (this.state === 'furnace') {
            const f = L.furnace;
            this.x += (Math.random() - 0.5) * 0.5;
            this.y += (Math.random() - 0.5) * 0.5;
            this.x = Math.min(Math.max(this.x, f.x + 6), f.x + f.w - 6);
            this.y = Math.min(Math.max(this.y, f.y + 6), f.y + f.h - 6);
            if (currentTemp >= this.fraction.bp + this.heatDelay) {
                this.state = 'riser';
                this.pathT = 0;
            }
        } else if (this.state === 'riser') {
            if (this.moveAlong(L.riserPath, speed * 1.4)) {
                this.state = 'gas';
                this.vy = -1.1 - Math.random() * 0.8;
            }
        } else if (this.state === 'gas') {
            this.x += (L.towerCX - this.x) * 0.05;
            this.y += this.vy;
            this.vy *= 0.997;
            const targetY = outlet.trayY;
            if (this.y <= targetY) {
                this.state = 'outlet';
                this.pathT = 0;
            }
        } else if (this.state === 'outlet') {
            if (this.moveAlong(outlet.path, speed * 1.2)) {
                this.state = 'stored';
                collected[this.fraction.id] = Math.min(40, collected[this.fraction.id] + 1);
                this.storeTimer = 30 + Math.random() * 20;
            }
        } else if (this.state === 'stored') {
            const t = outlet.tank;
            this.x = t.x + t.w * 0.5 + (Math.random() - 0.5) * (t.w * 0.5);
            this.y = t.y + t.h * 0.55 + (Math.random() - 0.5) * 4;
            this.storeTimer--;
            if (this.storeTimer <= 0) this.reset();
        }
    }
    draw() {
        const isVapor = this.state === 'gas' || this.state === 'riser';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        if (this.state === 'crude' || this.state === 'inlet') ctx.fillStyle = '#4a3728';
        else if (this.state === 'furnace') ctx.fillStyle = currentTemp >= this.fraction.bp ? this.fraction.color : '#5c4033';
        else ctx.fillStyle = this.fraction.color;
        if (isVapor) { ctx.shadowBlur = 7; ctx.shadowColor = this.fraction.color; }
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function initParticles() {
    particles = [];
    fractionsData.forEach(f => {
        for (let i = 0; i < 18; i++) particles.push(new Particle(f));
    });
}

function drawScene() {
    layout = buildLayout(cw, ch);
    const L = layout;
    const heat = currentTemp / 450;

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, cw, ch);

    // ── 1. 背景設備（先畫管線，再畫設備遮蓋接頭） ──
    const inletActive = currentTemp > 35;
    drawPipe(L.inletPath, L.pipeW, '#334155', '#475569', inletActive, '#78716c');
    drawPipe(L.riserPath, L.pipeW * 1.1, '#334155', '#475569', currentTemp > 60, '#fbbf24');

    L.outlets.forEach(o => {
        const active = currentTemp >= o.frac.bp;
        drawPipe(o.path, L.pipeW * 0.85, '#334155', active ? o.frac.color + '88' : '#475569', active, o.frac.color);
    });

    // ── 2. 原油儲槽 ──
    drawStorageTank(L.crude, 0.72, '#3d2b1f', t('lblCrude'), t('lblInlet'));
    ctx.fillStyle = '#78716c';
    ctx.font = `${Math.max(7, cw * 0.018)}px 'Noto Sans TC', sans-serif`;
    ctx.fillText('→', L.crude.x + L.crude.w + 2, L.crude.y + L.crude.h * 0.4);

    // ── 3. 加熱爐 ──
    drawFurnaceBox(L.furnace, heat);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = `bold ${Math.max(8, cw * 0.02)}px 'Noto Sans TC', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(t('lblFurnace'), L.furnace.x + L.furnace.w / 2, L.furnace.y - 6);
    ctx.textAlign = 'left';

    // ── 4. 分餾塔 ──
    drawColumn(L, heat);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = `bold ${Math.max(9, cw * 0.022)}px 'Noto Sans TC', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(t('lblTower'), L.towerCX, L.towerTop - 14);
    ctx.textAlign = 'left';

    // 入塔管凸缘
    ctx.fillStyle = '#64748b';
    ctx.fillRect(L.towerCX - L.pipeW, L.towerBot - 3, L.pipeW * 2, 6);

    // ── 5. 右側收集槽（各餾分） ──
    L.outlets.forEach(o => {
        const fill = collected[o.frac.id] / 40;
        const active = currentTemp >= o.frac.bp;
        drawStorageTank(o.tank, fill, o.frac.color, o.frac[lang].short, active ? t('lblOutlet') : '');
        ctx.fillStyle = active ? o.frac.color : '#475569';
        ctx.font = `bold ${Math.max(6, cw * 0.016)}px monospace`;
        ctx.textAlign = 'right';
        ctx.fillText(`~${o.frac.bp}°C`, o.tank.x - 4, o.trayY + 3);
        ctx.textAlign = 'left';
    });

    // ── 6. 塔身出料凸缘（小箭頭） ──
    L.outlets.forEach(o => {
        if (currentTemp >= o.frac.bp) {
            ctx.fillStyle = o.frac.color;
            ctx.beginPath();
            ctx.moveTo(L.towerCX + L.towerW / 2, o.trayY);
            ctx.lineTo(L.towerCX + L.towerW / 2 + 6, o.trayY - 3);
            ctx.lineTo(L.towerCX + L.towerW / 2 + 6, o.trayY + 3);
            ctx.fill();
        }
    });
}

function animate(now) {
    if (!lastFrameTime) lastFrameTime = now;
    const dt = Math.min(50, now - lastFrameTime);
    lastFrameTime = now;
    flowPhase += dt;

    if (isAutoHeating && currentTemp < 450) setTemperature(currentTemp + dt * 0.04);
    else if (isAutoHeating && currentTemp >= 450) toggleAutoHeat();

    drawScene();
    particles.forEach(p => { p.update(); p.draw(); });

    if (Math.random() < 0.02) renderFractionsList();

    requestAnimationFrame(animate);
}

function resizeCanvas() {
    const rect = document.getElementById('canvasWrap').getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    cw = rect.width;
    ch = rect.height;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initParticles();
}

document.getElementById('temp-slider').addEventListener('input', e => {
    if (isAutoHeating) toggleAutoHeat();
    setTemperature(parseInt(e.target.value, 10));
});
document.getElementById('btn-auto-heat').addEventListener('click', toggleAutoHeat);
document.getElementById('btn-reset').addEventListener('click', resetSim);
document.getElementById('btn-lang').addEventListener('click', toggleLang);
document.getElementById('btn-lang-mobile').addEventListener('click', toggleLang);
document.getElementById('btn-steps').addEventListener('click', () => setModal('modal-steps', true));
document.getElementById('btn-principle').addEventListener('click', () => setModal('modal-principle', true));
document.getElementById('steps-close').addEventListener('click', () => setModal('modal-steps', false));
document.getElementById('steps-confirm').addEventListener('click', () => setModal('modal-steps', false));
document.getElementById('modal-close').addEventListener('click', () => setModal('modal-principle', false));
document.getElementById('modal-confirm').addEventListener('click', () => setModal('modal-principle', false));
document.getElementById('modal-steps').addEventListener('click', e => { if (e.target.id === 'modal-steps') setModal('modal-steps', false); });
document.getElementById('modal-principle').addEventListener('click', e => { if (e.target.id === 'modal-principle') setModal('modal-principle', false); });
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { setModal('modal-steps', false); setModal('modal-principle', false); }
});
window.addEventListener('resize', resizeCanvas);

applyI18n();
resizeCanvas();
requestAnimationFrame(animate);
</script>
