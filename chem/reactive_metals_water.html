<body>

<div id="ui-layer" class="flex flex-col justify-between p-4 sm:p-6">
  <!-- Top bar -->

        <h1 id="title" class="text-xl sm:text-2xl font-bold">金屬與水反應模擬室</h1>

      </div>
      <p id="subtitle" class="text-sm opacity-80 mt-1">探索第一族與第二族元素與水的化學趨勢</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <button type="button" id="btn-steps" class="glass-panel px-3 py-2 rounded-lg text-white text-xs sm:text-sm font-bold hover:bg-white/20 transition bg-indigo-700/60 border border-indigo-400/40">觀察步驟</button>
      <button type="button" id="btn-principle" class="glass-panel px-3 py-2 rounded-lg text-white text-xs sm:text-sm font-bold hover:bg-white/20 transition bg-emerald-700/60 border border-emerald-400/40">原理解說</button>
      <button type="button" id="btn-quiz" class="glass-panel px-3 py-2 rounded-lg text-white text-xs sm:text-sm font-bold hover:bg-white/20 transition bg-violet-700/60 border border-violet-400/40">課堂問題</button>
      <span class="hidden sm:inline text-white/40 self-center">|</span>
      <button type="button" id="btn-lang" class="glass-panel px-3 py-2 rounded-lg text-amber-200 text-xs sm:text-sm font-bold hover:bg-white/20 transition">中 / EN</button>
      <button type="button" id="btn-reset" class="glass-panel px-3 py-2 rounded-lg text-white text-xs sm:text-sm font-bold hover:bg-red-500/40 transition bg-red-600/50 border border-red-400/40">重置</button>
    </div>
  </div>

  <!-- Right control panel -->
  <div class="absolute right-4 sm:right-6 top-28 sm:top-24 w-64 sm:w-72 interactive max-h-[calc(100vh-8rem)] overflow-y-auto">
    <div class="glass-panel p-5 sm:p-6 rounded-2xl text-white space-y-5">
      <div>
        <label id="label-group" class="block text-sm font-medium mb-2">選擇族群</label>
        <select id="group-select" class="w-full bg-slate-800 border border-slate-600 rounded-md p-2 text-sm">
          <option value="1" id="opt-group1">Group I（鹼金屬）</option>
          <option value="2" id="opt-group2">Group II（鹼土金屬）</option>
        </select>
      </div>
      <div>
        <label id="label-element" class="block text-sm font-medium mb-2">選擇元素</label>
        <select id="element-select" class="w-full bg-slate-800 border border-slate-600 rounded-md p-2 text-sm"></select>
      </div>
      <div>
        <label id="label-mass" class="block text-sm font-medium mb-1">質量: <span id="mass-val">1.0</span> g</label>
        <input type="range" id="mass-slider" min="0.1" max="5.0" step="0.1" value="1.0" class="w-full">
      </div>
      <div>
        <label id="label-temp" class="block text-sm font-medium mb-1">水溫: <span id="temp-val">25</span> °C</label>
        <input type="range" id="temp-slider" min="5" max="95" step="1" value="25" class="w-full">
      </div>
      <button type="button" id="btn-start" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transform active:scale-95 transition">開始實驗</button>
      <button type="button" id="btn-reset-panel" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-xl transition">重置</button>
      <p id="note-alkaline" class="text-xs text-white/60 leading-relaxed">溶液變紫／粉示意鹼性（OH⁻）</p>
    </div>
  </div>

  <!-- Bottom status -->
  <div class="interactive flex justify-center pb-2">
    <div id="reaction-status" class="glass-panel px-6 sm:px-8 py-3 sm:py-4 rounded-full text-white text-sm sm:text-lg font-medium hidden">
      <span id="status-prefix">反應中…</span> <span id="current-obs"></span>
    </div>
  </div>
</div>

<!-- Modal: Steps -->
<div id="modal-steps" class="teach-modal hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="steps-title">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col text-white">
    <div class="flex justify-between items-center p-4 border-b border-slate-700">
      <h2 id="steps-title" class="text-lg font-bold text-indigo-300">觀察步驟</h2>
      <button type="button" class="modal-close text-slate-400 hover:text-white text-2xl leading-none px-2" aria-label="Close">&times;</button>
    </div>
    <div id="steps-body" class="p-4 overflow-y-auto space-y-3 text-sm"></div>
  </div>
</div>

<!-- Modal: Principle -->
<div id="modal-principle" class="teach-modal hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="principle-title">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col text-white">
    <div class="flex justify-between items-center p-4 border-b border-slate-700">
      <h2 id="principle-title" class="text-lg font-bold text-emerald-300">原理解說</h2>

    </div>
    <div id="principle-body" class="p-4 overflow-y-auto space-y-4 text-sm"></div>
  </div>
</div>

<!-- Modal: Quiz -->
<div id="modal-quiz" class="teach-modal hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col text-white">
    <div class="flex justify-between items-center p-4 border-b border-slate-700 gap-2">
      <h2 id="quiz-title" class="text-lg font-bold text-violet-300">課堂問題</h2>
      <div class="flex items-center gap-2">
        <button type="button" id="btn-quiz-answers" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white rounded-lg text-xs font-bold">顯示參考答案</button>

    </div>
    <div id="quiz-body" class="p-4 overflow-y-auto space-y-3 text-sm"></div>
  </div>
</div>

function elementDisplayName(el) {
  if (currentLang === 'en') return el.nameEn + ' (' + el.symbol + ')';
  return el.nameZh + ' (' + el.symbol + ')';
}

function typeset(nodes) {
  if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
    return MathJax.typesetPromise(nodes).catch(function(err) {
      console.log('MathJax typesetting failed: ' + err.message);
    });
  }
  return Promise.resolve();
}

function closeAllModals(exceptId) {
  if (_modalCloseTimer) { clearTimeout(_modalCloseTimer); _modalCloseTimer = null; }
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
    if (exceptId && id === exceptId) return;
    const el = document.getElementById(id);
    if (el) { el.classList.add('hidden'); el.classList.remove('flex'); }
  });
}

function openTeachModal(id) {
  closeAllModals(id);
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('hidden');
  el.classList.add('flex');
}

function renderSteps() {
  const body = document.getElementById('steps-body');
  const steps = STEPS_CONTENT[currentLang] || STEPS_CONTENT.zh;
  const d = i18n[currentLang];
  body.innerHTML = steps.map(function(html, i) {
    return '<div class="p-3 bg-indigo-950/60 rounded-lg border border-indigo-700/50"><div class="font-bold text-indigo-300 mb-1">' + d.stepLabel + ' ' + (i + 1) + '</div><div class="leading-relaxed text-slate-200">' + html + '</div></div>';
  }).join('');
  typeset([body]);
}

function renderPrinciple() {
  const body = document.getElementById('principle-body');
  const p = PRINCIPLE_CONTENT[currentLang] || PRINCIPLE_CONTENT.zh;
  let html = '<section><h3 class="font-bold text-emerald-300 mb-1">' + p.conceptTitle + '</h3><p class="leading-relaxed text-slate-200">' + p.concept + '</p></section>';
  html += '<section><h3 class="font-bold text-emerald-300 mb-1">' + p.mechTitle + '</h3><ol class="list-decimal pl-5 space-y-2 text-slate-200">';
  p.mech.forEach(function(item) { html += '<li class="leading-relaxed">' + item + '</li>'; });
  html += '</ol></section>';
  html += '<section><h3 class="font-bold text-emerald-300 mb-1">' + p.everydayTitle + '</h3><p class="leading-relaxed text-slate-200">' + p.everyday + '</p></section>';
  body.innerHTML = html;
  typeset([body]);
}

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  const d = dict[currentLang];
  const ansBtn = document.getElementById('btn-quiz-answers');
  if (ansBtn) ansBtn.textContent = quizReveal ? d.hideAns : d.showAns;
  const ref = currentLang === 'en' ? 'Reference answer' : '參考答案';
  body.innerHTML = QUIZ.map(function(item, qi) {
    const qNum = qi + 1;
    const isOpen = (qNum === 2 || qNum === 4);
    const q = item.q[currentLang] || item.q.zh;
    let block = '<div class="p-3 bg-violet-50 rounded-lg border border-violet-100"><div class="font-bold text-violet-900 mb-2">Q' + qNum + '. ' + q + '</div>';
    if (!isOpen && item.options) {
      const qName = 'q' + qNum;
      const opts = item.options[currentLang] || item.options.zh;
      block += '<div class="grid gap-1.5 mb-2">';
      opts.forEach(function(opt, oi) {
        block += '<label class="flex items-start gap-2 rounded border border-violet-200 p-2 cursor-pointer"><input type="radio" name="' + qName + '" class="mt-0.5 accent-violet-600"><span>(' + String.fromCharCode(65 + oi) + ') ' + opt + '</span></label>';
      });
      block += '</div>';
    } else if (isOpen) {
      block += '<p class="text-xs text-gray-500 mb-2">' + d.shortHint + '</p>';
    }
    if (quizReveal) {
      const ans = item.answerText[currentLang] || item.answerText.zh;
      block += '<div class="mt-2 p-2 bg-emerald-50 border border-emerald-200 rounded text-emerald-900 text-xs leading-relaxed"><strong>' + ref + '：</strong> ' + ans + '</div>';
    }
    block += '</div>';
    return block;
  }).join('');
  typeset([body]);
}

// --- Three.js engine (preserved) ---
let scene, camera, renderer, water, metal, particles = [], flames = [];
let isReacting = false;
let reactionTime = 0;

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 12);
  camera.lookAt(0, 2, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0xffffff, 0.8);
  pointLight.position.set(5, 10, 5);
  scene.add(pointLight);

  const tankGeo = new THREE.BoxGeometry(10, 6, 6);
  const tankMat = new THREE.MeshPhongMaterial({ color: 0x00aaff, transparent: true, opacity: 0.3, side: THREE.BackSide });
  const tank = new THREE.Mesh(tankGeo, tankMat);
  tank.position.y = 3;
  scene.add(tank);

  const waterGeo = new THREE.PlaneGeometry(10, 6);
  const waterMat = new THREE.MeshPhongMaterial({ color: 0x0077ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
  water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.y = 4.5;
  scene.add(water);

  animate();
}

function updateElementOptions() {
  const group = document.getElementById('group-select').value;
  const select = document.getElementById('element-select');
  const prev = select.value;
  select.innerHTML = '';
  elementsData[group].forEach(function(el) {
    const opt = document.createElement('option');
    opt.value = el.symbol;
    opt.innerText = elementDisplayName(el);
    select.appendChild(opt);
  });
  if (prev && Array.from(select.options).some(function(o) { return o.value === prev; })) {
    select.value = prev;
  }
}

function observationText(symbol, temp) {
  const t = i18n[currentLang];
  if (symbol === 'Li') return t.obs_li;
  if (symbol === 'Na') return t.obs_na;
  if (symbol === 'K') return t.obs_k;
  if (symbol === 'Cs' || symbol === 'Rb') return t.obs_cs;
  if (symbol === 'Mg' && temp < 60) return t.obs_mg_cold;
  if (symbol === 'Mg' && temp >= 60) return t.obs_mg_hot;
  if (symbol === 'Ca') return t.obs_ca;
  if (symbol === 'Sr') return t.obs_sr;
  if (symbol === 'Ba') return t.obs_ba;
  return '';
}

function startReaction() {
  if (isReacting) return;
  resetScene();

  const group = document.getElementById('group-select').value;
  const symbol = document.getElementById('element-select').value;
  const el = elementsData[group].find(function(e) { return e.symbol === symbol; });
  if (!el) return;
  const mass = parseFloat(document.getElementById('mass-slider').value);
  const temp = parseFloat(document.getElementById('temp-slider').value);

  const size = Math.pow(mass, 1 / 3) * 0.4;
  const metalGeo = group == 1 ? new THREE.SphereGeometry(size, 32, 32) : new THREE.BoxGeometry(size, size, size);
  const metalMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
  metal = new THREE.Mesh(metalGeo, metalMat);
  metal.position.set(0, 8, 0);
  scene.add(metal);

  isReacting = true;
  reactionTime = 0;

  document.getElementById('reaction-status').classList.remove('hidden');
  document.getElementById('current-obs').innerText = observationText(symbol, temp);

  metal.userData = {
    density: el.density,
    activity: el.activity,
    temp: temp,
    flameColor: el.flame,
    vy: -0.1,
    vx: 0,
    vz: 0,
    isSubmerged: false
  };
}

function resetScene() {
  isReacting = false;
  if (metal) { scene.remove(metal); metal = null; }
  particles.forEach(function(p) { scene.remove(p); });
  flames.forEach(function(f) { scene.remove(f); });
  particles = [];
  flames = [];
  if (water) water.material.color.set(0x0077ff);
  document.getElementById('reaction-status').classList.add('hidden');
  document.getElementById('current-obs').innerText = '';
}

function resetSimulation() {
  closeAllModals(null);
  resetScene();
  document.getElementById('group-select').value = '1';
  updateElementOptions();
  document.getElementById('element-select').value = 'Li';
  document.getElementById('mass-slider').value = '1.0';
  document.getElementById('temp-slider').value = '25';
  document.getElementById('mass-val').innerText = '1.0';
  document.getElementById('temp-val').innerText = '25';
  syncMassTempLabels();
}

function createBubble(pos, intensity) {
  const geo = new THREE.SphereGeometry(0.05, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
  const p = new THREE.Mesh(geo, mat);
  p.position.copy(pos);
  p.position.x += (Math.random() - 0.5) * 0.5;
  p.position.z += (Math.random() - 0.5) * 0.5;
  p.userData = { vy: 0.05 + Math.random() * 0.05 };
  scene.add(p);
  particles.push(p);
}

function createFlame(pos, color) {
  const geo = new THREE.SphereGeometry(0.15, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.8 });
  const f = new THREE.Mesh(geo, mat);
  f.position.copy(pos);
  f.userData = { vy: 0.1, life: 1.0, vx: (Math.random() - 0.5) * 0.1 };
  scene.add(f);
  flames.push(f);
}

function animate() {
  requestAnimationFrame(animate);

  if (isReacting && metal) {
    const data = metal.userData;
    const waterLevel = 4.5;

    if (metal.position.y > waterLevel) {
      data.vy -= 0.01;
    } else {
      if (data.density < 1.0) {
        metal.position.y = waterLevel;
        data.vy = 0;
        const speed = data.activity * (data.temp / 50) * 0.02;
        data.vx += (Math.random() - 0.5) * speed;
        data.vz += (Math.random() - 0.5) * speed;
        data.vx *= 0.95;
        data.vz *= 0.95;
      } else {
        data.vy = -0.05;
      }

      const bubbleCount = Math.floor(data.activity * (data.temp / 25));
      if (Math.random() < 0.5) {
        for (let i = 0; i < bubbleCount; i++) createBubble(metal.position, data.activity);
      }

      if (data.activity > 5 || (data.activity > 2 && Math.random() < 0.1)) {
        createFlame(metal.position, data.flameColor);
      }

      const colorShift = Math.min(reactionTime / 500, 1);
      water.material.color.lerp(new THREE.Color(0xff00ff), colorShift * 0.01);
    }

    metal.position.x += data.vx;
    metal.position.y += data.vy;
    metal.position.z += data.vz;

    if (Math.abs(metal.position.x) > 4.8) data.vx *= -1;
    if (Math.abs(metal.position.z) > 2.8) data.vz *= -1;

    reactionTime++;
    if (reactionTime > 600) isReacting = false;
  }

  particles.forEach(function(p, i) {
    p.position.y += p.userData.vy;
    p.material.opacity -= 0.01;
    if (p.material.opacity <= 0 || p.position.y > 6) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  });

  flames.forEach(function(f, i) {
    f.position.y += f.userData.vy;
    f.position.x += f.userData.vx;
    f.userData.life -= 0.05;
    f.scale.setScalar(f.userData.life);
    if (f.userData.life <= 0) {
      scene.remove(f);
      flames.splice(i, 1);
    }
  });

  renderer.render(scene, camera);
}

function syncMassTempLabels() {
  const t = i18n[currentLang];
  const massVal = document.getElementById('mass-slider').value;
  const tempVal = document.getElementById('temp-slider').value;
  document.getElementById('label-mass').innerHTML = t.mass + ': <span id="mass-val">' + massVal + '</span> g';
  document.getElementById('label-temp').innerHTML = t.temp + ': <span id="temp-val">' + tempVal + '</span> °C';
}

function updateUIStrings() {
  const t = i18n[currentLang];
  document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-Hant';
  document.getElementById('title').innerText = t.title;
  document.getElementById('subtitle').innerText = t.subtitle;
  document.getElementById('badge-subject').innerText = t.badge;
  document.getElementById('btn-steps').innerText = t.btnSteps;
  document.getElementById('btn-principle').innerText = t.btnPrinciple;
  document.getElementById('btn-quiz').innerText = t.btnQuiz;
  document.getElementById('btn-lang').innerText = t.btnLang;
  document.getElementById('btn-reset').innerText = t.btnReset;
  document.getElementById('btn-reset-panel').innerText = t.btnReset;
  document.getElementById('btn-start').innerText = t.btnStart;
  document.getElementById('label-group').innerText = t.group;
  document.getElementById('label-element').innerText = t.element;
  document.getElementById('opt-group1').innerText = t.group1;
  document.getElementById('opt-group2').innerText = t.group2;
  document.getElementById('status-prefix').innerText = t.statusPrefix;
  document.getElementById('note-alkaline').innerText = t.noteAlkaline;
  document.getElementById('steps-title').innerText = t.stepsTitle;
  document.getElementById('principle-title').innerText = t.principleTitle;
  document.getElementById('quiz-title').innerText = t.quizTitle;
  document.getElementById('btn-quiz-answers').innerText = t.showAns;
  document.title = t.title + '｜' + (currentLang === 'zh' ? i18n.en.title : i18n.zh.title);
  syncMassTempLabels();
  updateElementOptions();
  renderSteps();
  renderPrinciple();
  renderQuiz();
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  updateUIStrings();
}

document.getElementById('group-select').addEventListener('change', updateElementOptions);
document.getElementById('btn-start').addEventListener('click', startReaction);
document.getElementById('btn-reset').addEventListener('click', resetSimulation);
document.getElementById('btn-reset-panel').addEventListener('click', resetSimulation);
document.getElementById('btn-lang').addEventListener('click', toggleLang);
document.getElementById('btn-steps').addEventListener('click', function() { renderSteps(); openTeachModal('modal-steps'); });
document.getElementById('btn-principle').addEventListener('click', function() { renderPrinciple(); openTeachModal('modal-principle'); });
document.getElementById('btn-quiz').addEventListener('click', function() { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
document.getElementById('btn-quiz-answers').addEventListener('click', function() { quizReveal = !quizReveal; renderQuiz(); });

document.querySelectorAll('.modal-close').forEach(function(btn) {
  btn.addEventListener('click', function() { closeAllModals(null); });
});
['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('click', function(e) { if (e.target === el) closeAllModals(null); });
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeAllModals(null);
});

document.getElementById('mass-slider').addEventListener('input', function() {
  const el = document.getElementById('mass-val');
  if (el) el.innerText = this.value;
});
document.getElementById('temp-slider').addEventListener('input', function() {
  const el = document.getElementById('temp-val');
  if (el) el.innerText = this.value;
});

window.addEventListener('load', function() {
  initThree();
  updateUIStrings();
});

window.addEventListener('resize', function() {
  if (!camera || !renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
})();
