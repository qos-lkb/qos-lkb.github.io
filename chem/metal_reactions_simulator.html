<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金屬反應綜合模擬器</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* 頂部分頁選單 */
        .top-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            z-index: 100;
        }

        .nav-tab {
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-tab:hover {
            background: #334155;
            transform: translateY(-2px);
        }

        .nav-tab.active {
            background: var(--accent);
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        /* 分頁容器 */
        .tab-content {
            display: none;
            width: 100%;
            max-width: 1100px;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ================= 介面一樣式 ================= */
        .container-tab1 {
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin: 0 0 5px 0;
            font-size: 1.8em;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.85em;
            margin-bottom: 15px;
        }

        .series-bar {
            display: flex;
            justify-content: space-between;
            background: #090d16;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 0.85em;
            border: 1px solid #334155;
        }
        .high { color: #f87171; }
        .med { color: #facc15; }
        .low { color: #4ade80; }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8em;
            color: var(--accent);
            margin-bottom: 4px;
        }

        select, button {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 0.9em;
            cursor: pointer;
        }

        .toggle-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: auto;
            background: #1e293b;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #475569;
            cursor: pointer;
            font-size: 0.85em;
        }
        .toggle-box input { cursor: pointer; }

        .reset-btn {
            background: #ef4444;
            border: none;
            font-weight: bold;
            margin-top: auto;
            transition: 0.2s;
        }
        .reset-btn:hover { background: #dc2626; }

        .metal-tray-container {
            margin-bottom: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
        }
        .tray-title {
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 8px;
            text-align: center;
        }
        .metal-tray {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .metal-chip {
            padding: 6px 10px;
            background: #334155;
            border: 2px solid #64748b;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            font-size: 0.82em;
            transition: all 0.2s;
        }
        .metal-chip:hover {
            border-color: var(--accent);
            background: #475569;
            transform: translateY(-2px);
        }

        .stage {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 15px;
            background: #090d16;
            border-radius: 12px;
            padding: 15px;
            min-height: 340px;
        }

        .lab-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            background: #030712;
            border-radius: 8px;
            position: relative;
            padding: 10px;
            border: 1px dashed #334155;
            overflow: hidden;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #334155;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78em;
            color: #facc15;
            font-weight: bold;
            z-index: 20;
        }

        .drop-hint {
            position: absolute;
            top: 40px;
            font-size: 0.75em;
            color: #64748b;
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }

        .test-tube {
            width: 70px;
            height: 210px;
            border: 3px solid rgba(255, 255, 255, 0.7);
            border-top: none;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
        }

        .steam-cloud {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
            display: none;
            animation: steamPulse 2s infinite alternate;
        }

        @keyframes steamPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65%;
            background: rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
        }

        .sample-metal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #cbd5e1;
            border-radius: 3px;
            bottom: 12px;
            left: calc(50% - 10px);
            transition: background-color 0.5s;
            z-index: 5;
            transform-origin: center bottom;
        }

        .floating-ball {
            border-radius: 50% !important;
            bottom: 60% !important;
            animation: floatDart 0.6s infinite alternate ease-in-out;
        }

        @keyframes floatDart {
            0% { left: 15px; }
            100% { left: 37px; }
        }

        .flame {
            position: absolute;
            width: 16px;
            height: 22px;
            top: -20px;
            left: 1px;
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.08s infinite alternate;
            display: none;
        }
        .flame.potassium {
            background: radial-gradient(circle, #f472b6 0%, #c084fc 60%, rgba(192,132,252,0) 100%);
            box-shadow: 0 0 16px #c084fc, 0 0 30px #d8b4fe;
        }
        .flame.sodium {
            background: radial-gradient(circle, #fef08a 0%, #f59e0b 60%, rgba(245,158,11,0) 100%);
            box-shadow: 0 0 16px #f59e0b, 0 0 28px #fbbf24;
        }

        @keyframes flicker {
            0% { transform: scale(0.85) rotate(-5deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        .burner {
            margin-top: 5px;
            font-size: 0.8em;
            color: #ef4444;
            font-weight: bold;
            display: none;
        }

        .bubble {
            position: absolute;
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            animation: rise 1.2s infinite linear;
        }

        @keyframes rise {
            0% { bottom: 15px; opacity: 1; transform: scale(0.4); }
            100% { bottom: 62%; opacity: 0; transform: scale(1.2); }
        }

        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        .coating {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s, background-color 1s, box-shadow 1s;
        }

        .precipitate {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
        }

        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-card {
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .info-title {
            font-size: 0.75em;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .obs-list {
            margin: 0;
            padding-left: 18px;
            font-size: 0.88em;
            color: #e2e8f0;
            line-height: 1.4;
        }

        .eq-table {
            display: grid;
            grid-template-columns: 95px 1fr;
            gap: 6px;
            font-size: 0.88em;
            align-items: center;
        }

        .eq-label {
            color: #94a3b8;
            font-size: 0.8em;
            font-weight: bold;
        }

        .eq-val-zh { color: #fde047; font-weight: bold; }
        .eq-val-en { color: #38bdf8; font-weight: bold; font-style: italic; }
        .eq-val-chem { color: #4ade80; font-family: 'Consolas', monospace; font-weight: bold; font-size: 1.0em; }
        .eq-val-ionic { color: #a7f3d0; font-family: 'Consolas', monospace; font-weight: bold; font-size: 1.0em; }

        .lab-note { font-size: 0.85em; color: #cbd5e1; font-style: italic; }

        /* ================= 介面二樣式 ================= */
        .container-tab2 {
            position: relative;
            width: 100%;
            height: calc(100vh - 100px);
            min-height: 500px;
            background: #050811;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #simCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: max-content;
            max-width: 95%;
        }

        .element-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .group-label {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: bold;
            width: 65px;
            white-space: nowrap;
        }

        .btn-container {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .element-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .element-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
        }

        .group-1 { border-color: #f472b6; }
        .group-1:hover { background: #f472b6; color: #000; }

        .group-2 { border-color: #38bdf8; }
        .group-2:hover { background: #38bdf8; color: #000; }

        .tab2-reset-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            margin-left: 8px;
        }
        .tab2-reset-btn:hover {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- 頂部切換導航 -->
    <div class="top-nav">
        <button class="nav-tab active" id="btn-tab1" onclick="switchTab('tab1')">🧪 不同金屬的反應</button>
        <button class="nav-tab" id="btn-tab2" onclick="switchTab('tab2')">💥 第 I、II 族金屬水反應</button>
    </div>

    <!-- 介面一：不同金屬的反應 -->
    <div id="view-tab1" class="tab-content active">
        <div class="container-tab1">
            <h1>金屬反應模擬器 5.0</h1>
            <div class="subtitle">金屬與水、水蒸汽、酸及鹽溶液反應模擬觀察</div>

            <div class="series-bar">
                <span>活性強 ➔</span>
                <span class="high">K</span><span class="high">Na</span><span class="high">Ca</span>
                <span class="med">Mg</span><span class="med">Al</span><span class="med">Zn</span><span class="med">Fe</span><span class="med">Pb</span>
                <span class="low">Cu</span><span class="low">Hg</span><span class="low">Ag</span><span class="low">Au</span>
                <span>➔ 活性弱</span>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="reactionType">1. 選擇反應類別：</label>
                    <select id="reactionType" onchange="onReactionTypeChange()">
                        <option value="water">與冷水反應 (Cold Water - 試管)</option>
                        <option value="steam">與水蒸汽反應 (Steam - 高溫加熱)</option>
                        <option value="acid">與酸反應 (Acid)</option>
                        <option value="displacement">置換反應 (Displacement Reaction)</option>
                    </select>
                </div>

                <div class="control-group" id="acidGroup" style="display: none;">
                    <label for="acidSelect">2. 選擇酸的種類：</label>
                    <select id="acidSelect" onchange="resetExperiment()">
                        <option value="hcl">稀氫氯酸 (Dilute hydrochloric acid)</option>
                        <option value="hno3">極稀硝酸 (Very dilute nitric acid)</option>
                        <option value="h2so4">稀硫酸 (Dilute sulphuric acid)</option>
                    </select>
                </div>

                <div class="control-group" id="solutionGroup" style="display: none;">
                    <label for="solutionSelect">2. 選擇鹽溶液：</label>
                    <select id="solutionSelect" onchange="resetExperiment()"></select>
                </div>

                <div class="control-group">
                    <label class="toggle-box">
                        <input type="checkbox" id="continuousToggle" onchange="toggleContinuous()">
                        <span>♾️ 持續反應 (不自動停止)</span>
                    </label>
                </div>

                <div class="control-group">
                    <button class="reset-btn" onclick="resetExperiment()">🧹 重置實驗</button>
                </div>
            </div>

            <div class="metal-tray-container">
                <div class="tray-title" id="trayTitle">👇 點擊選擇金屬加入試管：</div>
                <div class="metal-tray" id="metalTray"></div>
            </div>

            <div class="stage">
                <div class="lab-view" id="dropZone">
                    <div class="status-badge" id="statusBadge">⚪ 準備就緒</div>
                    <div class="drop-hint" id="dropHint">點擊上方金屬開始實驗</div>
                    
                    <div class="test-tube" id="testTubeContainer">
                        <div class="steam-cloud" id="steamCloud"></div>
                        <div class="liquid" id="liquid">
                            <div class="precipitate" id="precipitate"></div>
                        </div>
                        <div class="sample-metal" id="sampleMetal" style="display: none;">
                            <div class="flame" id="flame"></div>
                            <div class="coating" id="coating"></div>
                        </div>
                        <div id="bubbleContainer"></div>
                    </div>

                    <div class="burner" id="burner">🔥 酒精燈持續加熱中</div>
                </div>

                <div class="info-panel">
                    <div class="info-card">
                        <div class="info-title">👀 視覺與實驗觀察現象</div>
                        <ul class="obs-list" id="obsList">
                            <li>請點擊上方金屬開始實驗。</li>
                        </ul>
                    </div>
                    <div class="info-card">
                        <div class="info-title">📝 方程式對照 (Word, Chemical & Ionic Equations)</div>
                        <div class="eq-table">
                            <div class="eq-label">中文提示:</div>
                            <div class="eq-val-zh" id="wordEqZH">-</div>
                            <div class="eq-label">English:</div>
                            <div class="eq-val-en" id="wordEqEN">-</div>
                            <div class="eq-label">化學方程式:</div>
                            <div class="eq-val-chem" id="chemEq">-</div>
                            <div class="eq-label">離子方程式:</div>
                            <div class="eq-val-ionic" id="ionicEq">-</div>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-title">💡 化學原理說明</div>
                        <div class="lab-note" id="labNote">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 介面二：第 I、II 族金屬反應 (Canvas) -->
    <div id="view-tab2" class="tab-content">
        <div class="container-tab2">
            <div class="ui-panel">
                <div class="element-group">
                    <span class="group-label">第 I 族：</span>
                    <div class="btn-container">
                        <button class="element-btn group-1" onclick="dropMetalTab2('Li')">Li (鋰)</button>
                        <button class="element-btn group-1" onclick="dropMetalTab2('Na')">Na (鈉)</button>
                        <button class="element-btn group-1" onclick="dropMetalTab2('K')">K (鉀)</button>
                        <button class="element-btn group-1" onclick="dropMetalTab2('Rb')">Rb (銣)</button>
                        <button class="element-btn group-1" onclick="dropMetalTab2('Cs')">Cs (銫)</button>
                    </div>
                </div>
                <div class="element-group">
                    <span class="group-label">第 II 族：</span>
                    <div class="btn-container">
                        <button class="element-btn group-2" onclick="dropMetalTab2('Be')">Be (鈹)</button>
                        <button class="element-btn group-2" onclick="dropMetalTab2('Mg')">Mg (鎂)</button>
                        <button class="element-btn group-2" onclick="dropMetalTab2('Ca')">Ca (鈣)</button>
                        <button class="element-btn group-2" onclick="dropMetalTab2('Sr')">Sr (鍶)</button>
                        <button class="element-btn group-2" onclick="dropMetalTab2('Ba')">Ba (鋇)</button>
                    </div>
                    <button class="element-btn tab2-reset-btn" onclick="resetTankTab2()">🧹 清空水缸</button>
                </div>
            </div>

            <canvas id="simCanvas"></canvas>
        </div>
    </div>

<script>
    // ================= 分頁切換邏輯 =================
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

        if (tabId === 'tab1') {
            document.getElementById('view-tab1').classList.add('active');
            document.getElementById('btn-tab1').classList.add('active');
        } else if (tabId === 'tab2') {
            document.getElementById('view-tab2').classList.add('active');
            document.getElementById('btn-tab2').classList.add('active');
            resizeTab2();
        }
    }

    // ================= 介面一 JavaScript 邏輯 =================
    const metals = [
        { symbol: 'K',  nameZH: '鉀', nameEN: 'potassium', saltZH: '鉀',     saltEN: 'potassium',  ion: 'K⁺',   valency: 1, color: '#e2e8f0', group: 1 },
        { symbol: 'Na', nameZH: '鈉', nameEN: 'sodium',    saltZH: '鈉',     saltEN: 'sodium',     ion: 'Na⁺',  valency: 1, color: '#e2e8f0', group: 1 },
        { symbol: 'Ca', nameZH: '鈣', nameEN: 'calcium',   saltZH: '鈣',     saltEN: 'calcium',    ion: 'Ca²⁺', valency: 2, color: '#cbd5e1', group: 2 },
        { symbol: 'Mg', nameZH: '鎂', nameEN: 'magnesium', saltZH: '鎂',     saltEN: 'magnesium',  ion: 'Mg²⁺', valency: 2, color: '#94a3b8', group: 2 },
        { symbol: 'Al', nameZH: '鋁', nameEN: 'aluminium', saltZH: '鋁',     saltEN: 'aluminium',  ion: 'Al³⁺', valency: 3, color: '#cbd5e1' },
        { symbol: 'Zn', nameZH: '鋅', nameEN: 'zinc',      saltZH: '鋅',     saltEN: 'zinc',       ion: 'Zn²⁺', valency: 2, color: '#71717a' },
        { symbol: 'Fe', nameZH: '鐵', nameEN: 'iron',      saltZH: '鐵(II)', saltEN: 'iron (II)',  ion: 'Fe²⁺', valency: 2, color: '#52525b' },
        { symbol: 'Pb', nameZH: '鉛', nameEN: 'lead',      saltZH: '鉛(II)', saltEN: 'lead (II)',  ion: 'Pb²⁺', valency: 2, color: '#475569' },
        { symbol: 'Cu', nameZH: '銅', nameEN: 'copper',    saltZH: '銅(II)', saltEN: 'copper (II)',ion: 'Cu²⁺', valency: 2, color: '#b45309' },
        { symbol: 'Hg', nameZH: '汞', nameEN: 'mercury',   saltZH: '汞',     saltEN: 'mercury',    ion: 'Hg²⁺', valency: 2, color: '#94a3b8' },
        { symbol: 'Ag', nameZH: '銀', nameEN: 'silver',    saltZH: '銀',     saltEN: 'silver',     ion: 'Ag⁺',  valency: 1, color: '#f1f5f9' },
        { symbol: 'Au', nameZH: '金', nameEN: 'gold',      saltZH: '金',     saltEN: 'gold',       ion: 'Au³⁺', valency: 3, color: '#eab308' }
    ];

    const COLOR_CLEAR = [255, 255, 255, 0.08];
    const COLOR_BLUE = [14, 165, 233, 0.5];
    const COLOR_GREEN = [34, 197, 94, 0.35];
    const COLOR_TURBID = [255, 255, 255, 0.45];

    let currentMetalIndex = null;
    let timerInterval = null;
    let reactionTime = 0;
    let metalScale = 1.0;
    let isContinuous = false;

    let startColor = COLOR_CLEAR;
    let targetColor = COLOR_CLEAR;
    let colorProgress = 0;

    function getNitrateFormula(m) {
        if (m.valency === 1) return `${m.symbol}NO₃`;
        if (m.valency === 2) return `${m.symbol}(NO₃)₂`;
        if (m.valency === 3) return `${m.symbol}(NO₃)₃`;
    }

    function interpolateColor(c1, c2, factor) {
        let f = Math.max(0, Math.min(1, factor));
        let r = Math.round(c1[0] + f * (c2[0] - c1[0]));
        let g = Math.round(c1[1] + f * (c2[1] - c1[1]));
        let b = Math.round(c1[2] + f * (c2[2] - c1[2]));
        let a = (c1[3] + f * (c2[3] - c1[3])).toFixed(2);
        return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    function initTab1() {
        const tray = document.getElementById('metalTray');
        tray.innerHTML = '';
        metals.forEach((m, idx) => {
            const chip = document.createElement('div');
            chip.className = 'metal-chip';
            chip.id = `chip-${idx}`;
            chip.textContent = `${m.symbol} (${m.nameZH})`;
            chip.onclick = () => addMetalToExperiment(idx);
            tray.appendChild(chip);
        });

        const solSelect = document.getElementById('solutionSelect');
        solSelect.innerHTML = '';
        metals.forEach((m, idx) => {
            let opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `${getNitrateFormula(m)} 溶液 (硝酸${m.saltZH} / ${m.saltEN} nitrate)`;
            solSelect.appendChild(opt);
        });
        solSelect.value = 8;

        onReactionTypeChange();
    }

    function onReactionTypeChange() {
        const type = document.getElementById('reactionType').value;
        document.getElementById('acidGroup').style.display = (type === 'acid') ? 'flex' : 'none';
        document.getElementById('solutionGroup').style.display = (type === 'displacement') ? 'flex' : 'none';

        document.getElementById('testTubeContainer').style.display = 'block';
        document.getElementById('trayTitle').textContent = "👇 點擊選擇金屬加入試管：";

        resetExperiment();
    }

    function toggleContinuous() {
        isContinuous = document.getElementById('continuousToggle').checked;
        if (currentMetalIndex !== null) {
            runSimulation(currentMetalIndex);
        }
    }

    function stopTimers() {
        if (timerInterval) clearInterval(timerInterval);
    }

    function resetExperiment() {
        stopTimers();
        currentMetalIndex = null;
        reactionTime = 0;
        metalScale = 1.0;
        colorProgress = 0;

        const mElem = document.getElementById('sampleMetal');
        mElem.style.display = 'none';
        mElem.style.transform = 'scale(1)';
        mElem.className = 'sample-metal';

        document.getElementById('flame').className = 'flame';
        document.getElementById('flame').style.display = 'none';

        const coating = document.getElementById('coating');
        coating.style.opacity = '0';
        coating.style.backgroundColor = 'transparent';

        document.getElementById('precipitate').style.opacity = '0';
        document.getElementById('bubbleContainer').innerHTML = '';

        document.getElementById('dropZone').classList.remove('shake');
        document.getElementById('dropHint').style.display = 'block';
        document.getElementById('statusBadge').textContent = "⚪ 準備就緒";

        const type = document.getElementById('reactionType').value;
        const liquid = document.getElementById('liquid');
        const steamCloud = document.getElementById('steamCloud');
        const burner = document.getElementById('burner');

        if (type === 'steam') {
            liquid.style.height = '0%';
            steamCloud.style.display = 'block';
            burner.style.display = 'block';
            startColor = COLOR_CLEAR;
            targetColor = COLOR_CLEAR;
        } else {
            liquid.style.height = '65%';
            steamCloud.style.display = 'none';
            burner.style.display = 'none';

            if (type === 'water' || type === 'acid') {
                startColor = COLOR_CLEAR;
                targetColor = COLOR_CLEAR;
            } else if (type === 'displacement') {
                const solIdx = parseInt(document.getElementById('solutionSelect').value);
                setSolutionBaseColor(solIdx);
            }
            liquid.style.backgroundColor = interpolateColor(startColor, startColor, 0);
        }

        document.getElementById('obsList').innerHTML = '<li>請點擊上方金屬開始實驗。</li>';
        document.getElementById('wordEqZH').textContent = '-';
        document.getElementById('wordEqEN').textContent = '-';
        document.getElementById('chemEq').textContent = '-';
        document.getElementById('ionicEq').textContent = '-';
        document.getElementById('labNote').textContent = '-';
    }

    function setSolutionBaseColor(solMetalIdx) {
        if (solMetalIdx === 8) startColor = COLOR_BLUE;
        else if (solMetalIdx === 6) startColor = COLOR_GREEN;
        else startColor = COLOR_CLEAR;
        targetColor = startColor;
    }

    function addMetalToExperiment(idx) {
        resetExperiment();
        currentMetalIndex = idx;
        document.getElementById('dropHint').style.display = 'none';

        const metal = metals[idx];
        const mElem = document.getElementById('sampleMetal');
        mElem.style.display = 'block';
        mElem.style.backgroundColor = metal.color;

        runSimulation(idx);
    }

    function createBubbles(count, speed = 1.2) {
        const container = document.getElementById('bubbleContainer');
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            let b = document.createElement('div');
            b.className = 'bubble';
            let sz = Math.random() * 5 + 3;
            b.style.width = sz + 'px';
            b.style.height = sz + 'px';
            b.style.left = (Math.random() * 40 + 15) + 'px';
            b.style.animationDuration = (speed + Math.random() * 0.5) + 's';
            b.style.animationDelay = (Math.random() * 0.8) + 's';
            container.appendChild(b);
        }
    }

    function runSimulation(mIdx) {
        const type = document.getElementById('reactionType').value;
        const metal = metals[mIdx];

        const mElem = document.getElementById('sampleMetal');
        const flame = document.getElementById('flame');
        const coating = document.getElementById('coating');
        const precipitate = document.getElementById('precipitate');

        let obs = [];
        let wordZH = "", wordEN = "", chem = "", ionic = "", note = "";
        let isReacting = false, stopsEarlyDueToCoating = false;

        if (type === 'water') {
            if (mIdx <= 1) {
                isReacting = true;
                mElem.classList.add('floating-ball');
                flame.className = `flame ${mIdx === 0 ? 'potassium' : 'sodium'}`;

                createBubbles(14, 0.5);
                obs = [
                    `金屬${metal.nameZH}浮於水面熔化為小球並快速游動`,

                wordEN = `${metal.nameEN} + water ➔ ${metal.saltEN} hydroxide + hydrogen`;
                chem = `2${metal.symbol}(s) + 2H₂O(l) ➔ 2${metal.symbol}OH(aq) + H₂(g)↑`;
                ionic = `2${metal.symbol}(s) + 2H₂O(l) ➔ 2${metal.ion}(aq) + 2OH⁻(aq) + H₂(g)↑`;

            } else if (mIdx === 2) {
                isReacting = true;
                createBubbles(8, 1.0);
                targetColor = COLOR_TURBID;
                obs = ["鈣沉入水底並迅速產生大量無色氣泡", "溶液生成白色微溶沉澱 [Ca(OH)₂] 變得渾濁", "金屬鈣塊逐漸反應至完全消失"];
                wordZH = "鈣 + 水 ➔ 氫氧化鈣 + 氫氣";
                wordEN = "calcium + water ➔ calcium hydroxide + hydrogen";
                chem = "Ca(s) + 2H₂O(l) ➔ Ca(OH)₂(s/aq) + H₂(g)↑";
                ionic = "Ca(s) + 2H₂O(l) ➔ Ca²⁺(aq) + 2OH⁻(aq) + H₂(g)↑";

            } else if (mIdx === 3) {
                isReacting = true;
                createBubbles(2, 2.5);
                obs = ["在冷水中反應極為緩慢", "金屬表面僅附著極少量微細氫氣氣泡"];
                wordZH = "鎂 + 水 ➔ 氫氧化鎂 + 氫氣";
                wordEN = "magnesium + water ➔ magnesium hydroxide + hydrogen";
                chem = "Mg(s) + 2H₂O(l) ➔ Mg(OH)₂(s) + H₂(g)↑";
                ionic = "Mg(s) + 2H₂O(l) ➔ Mg(OH)₂(s) + H₂(g)↑";
                note = "鎂在冷水中反應微弱，熱水中反應較顯著。";

                obs = ["無明顯變化", "金屬沉於水底，無氣泡生成"];

                wordEN = `${metal.nameEN} + water ➔ No Reaction`;

                ionic = "No Reaction";
                note = "金屬活性較低，不與冷水反應。";

        else if (type === 'steam') {

                flame.style.display = 'block';
                createBubbles(18, 0.3);
                obs = [`非常危險！高溫下與水蒸汽發生爆炸性劇烈反應並燃起${mIdx===0?'淡紫色':'黃橙色'}火焰`, "產生強烈火焰與白色氧化物煙霧，金屬完全消耗"];
                wordZH = `${metal.nameZH} + 水蒸汽 ➔ 氧化${metal.saltZH} + 氫氣`;

                ionic = "N/A (高溫氣態反應)";
                note = "水蒸汽為氣態 H₂O(g)，極活潑金屬反應劇烈且發光發熱。";
            } else if (mIdx === 3) {

                flame.style.display = 'block';
                createBubbles(12, 0.5);

                wordZH = "鎂 + 水蒸汽 ➔ 氧化鎂 + 氫氣";

                if (mIdx === 6) {
                    wordZH = "鐵 + 水蒸汽 ⇌ 四氧化三鐵 + 氫氣";
                    wordEN = "iron + steam ⇌ iron(II,III) oxide + hydrogen";
                    chem = "3Fe(s) + 4H₂O(g) ⇌ Fe₃O₄(s) + 4H₂(g)↑";
                } else if (mIdx === 4) {
                    wordZH = "鋁 + 水蒸汽 ➔ 氧化鋁 + 氫氣";
                    wordEN = "aluminium + steam ➔ aluminium oxide + hydrogen";
                    chem = "2Al(s) + 3H₂O(g) ➔ Al₂O₃(s) + 3H₂(g)↑";
                } else {
                    wordZH = "鋅 + 水蒸汽 ➔ 氧化鋅 + 氫氣";
                    wordEN = "zinc + steam ➔ zinc oxide + hydrogen";
                    chem = "Zn(s) + H₂O(g) ➔ ZnO(s) + H₂(g)↑";
                }
                ionic = "N/A (高溫氣態反應)";
                note = "紅熱的鐵與水蒸汽反應生成黑色的四氧化三鐵 (Fe₃O₄)。";
            } else {
                obs = ["無反應", "高溫加熱下亦不與水蒸汽反應"];
                wordZH = `${metal.nameZH} + 水蒸汽 ➔ 無反應`;
                wordEN = `${metal.nameEN} + steam ➔ No Reaction`;
                chem = "No Reaction";
                ionic = "No Reaction";
                note = "活性較低的金屬無法奪取水蒸汽中的氧。";
            }
        } 
        else if (type === 'acid') {
            const acid = document.getElementById('acidSelect').value;
            let acidZH = acid==='hcl'?'氫氯酸':(acid==='hno3'?'硝酸':'硫酸');
            let acidEN = acid==='hcl'?'hydrochloric acid':(acid==='hno3'?'nitric acid':'sulphuric acid');

                isReacting = true;
                mElem.classList.add('floating-ball');
                flame.className = mIdx === 0 ? 'flame potassium' : 'flame sodium';
                flame.style.display = 'block';
                createBubbles(18, 0.3);
                obs = ["極度危險！在酸液中發生爆炸性反應", "金屬在液面劇烈燃燒並瞬間完全溶解消失"];
                let saltZH = acid==='hcl' ? `氯化${metal.saltZH}` : (acid==='hno3' ? `硝酸${metal.saltZH}` : `硫酸${metal.saltZH}`);
                let saltEN = acid==='hcl' ? `${metal.saltEN} chloride` : (acid==='hno3' ? `${metal.saltEN} nitrate` : `${metal.saltEN} sulphate`);
                
                wordZH = `${metal.nameZH} + ${acidZH} ➔ ${saltZH} + 氫氣`;
                wordEN = `${metal.nameEN} + ${acidEN} ➔ ${saltEN} + hydrogen`;
                if (acid==='hcl') chem = `2${metal.symbol}(s) + 2HCl(aq) ➔ 2${metal.symbol}Cl(aq) + H₂(g)↑`;
                else if (acid==='hno3') chem = `2${metal.symbol}(s) + 2HNO₃(aq) ➔ 2${metal.symbol}NO₃(aq) + H₂(g)↑`;
                else chem = `2${metal.symbol}(s) + H₂SO₄(aq) ➔ ${metal.symbol}₂SO₄(aq) + H₂(g)↑`;
                ionic = `2${metal.symbol}(s) + 2H⁺(aq) ➔ 2${metal.ion}(aq) + H₂(g)↑`;
                note = "鉀和鈉絕對不可直接投入酸中實驗。";
            } else if (mIdx === 2) {
                if (acid === 'h2so4') {
                    stopsEarlyDueToCoating = true;
                    coating.style.backgroundColor = '#fb923c';
                    coating.style.opacity = '0.95';
                    createBubbles(3, 1.5);
                    obs = ["反應開始時有少量無色氣泡", "鈣表面迅速生成【微溶硫酸鈣 (CaSO₄)】阻隔層", "塗層包覆表面阻斷酸液接觸，反應迅速中斷！"];

                    createBubbles(12, 0.6);

                    let saltEN = acid === 'hcl' ? 'calcium chloride' : 'calcium nitrate';
                    wordZH = `鈣 + ${acidZH} ➔ ${saltZH} + 氫氣`;
                    wordEN = `calcium + ${acidEN} ➔ ${saltEN} + hydrogen`;
                    if (acid==='hcl') chem = "Ca(s) + 2HCl(aq) ➔ CaCl₂(aq) + H₂(g)↑";
                    else chem = "Ca(s) + 2HNO₃(aq) ➔ Ca(NO₃)₂(aq) + H₂(g)↑";
                    ionic = "Ca(s) + 2H⁺(aq) ➔ Ca²⁺(aq) + H₂(g)↑";
                    obs = ["反應非常劇烈，迅速產生大量氫氣氣泡", "金屬迅速完全溶解消失"];
                    note = "鈣與 HCl/HNO₃ 可生成可溶性鹽並持續反應至完全溶解。";

            } else if (mIdx >= 3 && mIdx <= 6) {
                isReacting = true;
                let rate = (8 - mIdx) * 2;
                createBubbles(rate, 0.8 - (8 - mIdx)*0.08);

                if (mIdx === 6) targetColor = COLOR_GREEN;

                let saltZH = acid==='hcl' ? `氯化${metal.saltZH}` : (acid==='hno3' ? `硝酸${metal.saltZH}` : `硫酸${metal.saltZH}`);
                let saltEN = acid==='hcl' ? `${metal.saltEN} chloride` : (acid==='hno3' ? `${metal.saltEN} nitrate` : `${metal.saltEN} sulphate`);

                obs = ["穩步產生大量氫氣氣泡", mIdx === 6 ? "生成 Fe²⁺ 離子，溶液隨著金屬溶解逐漸轉變為【淡綠色】" : "金屬漸漸變細並同步溶解", "反應結束後金屬完全消失"];
                wordZH = `${metal.nameZH} + ${acidZH} ➔ ${saltZH} + 氫氣`;
                wordEN = `${metal.nameEN} + ${acidEN} ➔ ${saltEN} + hydrogen`;

                if (mIdx === 4) {
                    if (acid==='hcl') chem = "2Al(s) + 6HCl(aq) ➔ 2AlCl₃(aq) + 3H₂(g)↑";
                    else if (acid==='hno3') chem = "2Al(s) + 6HNO₃(aq) ➔ 2Al(NO₃)₃(aq) + 3H₂(g)↑";
                    else chem = "2Al(s) + 3H₂SO₄(aq) ➔ Al₂(SO₄)₃(aq) + 3H₂(g)↑";
                    ionic = "2Al(s) + 6H⁺(aq) ➔ 2Al³⁺(aq) + 3H₂(g)↑";
                } else {
                    if (acid==='hcl') chem = `${metal.symbol}(s) + 2HCl(aq) ➔ ${metal.symbol}Cl₂(aq) + H₂(g)↑`;
                    else if (acid==='hno3') chem = `${metal.symbol}(s) + 2HNO₃(aq) ➔ ${metal.symbol}(NO₃)₂(aq) + H₂(g)↑`;
                    else chem = `${metal.symbol}(s) + H₂SO₄(aq) ➔ ${metal.symbol}SO₄(aq) + H₂(g)↑`;
                    ionic = `${metal.symbol}(s) + 2H⁺(aq) ➔ ${metal.ion}(aq) + H₂(g)↑`;

                        chem = "Pb(s) + 2HCl(aq) ➔ PbCl₂(s)↓ + H₂(g)↑";

                    isReacting = true;
                    createBubbles(4, 1.2);

            } else {
                obs = ["無氣泡產生", "金屬不溶解，無化學反應"];

        else if (type === 'displacement') {
            const solIdx = parseInt(document.getElementById('solutionSelect').value);
            const solMetal = metals[solIdx];

            if (mIdx <= 1) {
                isReacting = true;
                mElem.classList.add('floating-ball');
                flame.className = `flame ${mIdx === 0 ? 'potassium' : 'sodium'}`;
                flame.style.display = 'block';
                createBubbles(14, 0.5);

                precipitate.style.opacity = '0.95';
                if (solIdx === 8) precipitate.style.backgroundColor = '#0284c7';
                else if (solIdx === 6) precipitate.style.backgroundColor = '#15803d';
                else precipitate.style.backgroundColor = '#f8fafc';

                obs = [
                    `⚠️ 鉀/鈉優先與溶液中的【水】發生劇烈反應！`,
                    `金屬在表面游動並發出火焰，隨反應逐漸完全消失`,
                    `生成的 OH⁻ 離子隨後與溶液中的 ${solMetal.symbol} 離子反應，生成【金屬氫氧化物沉澱】`
                ];
                wordZH = `1) ${metal.nameZH} + 水 ➔ 氫氧化${metal.saltZH} + 氫氣\n2) 氫氧化${metal.saltZH} + 硝酸${solMetal.saltZH} ➔ 氫氧化${solMetal.saltZH} + 硝酸${metal.saltZH}`;
                wordEN = `1) ${metal.nameEN} + water ➔ ${metal.saltEN} hydroxide + hydrogen\n2) hydroxide + ${solMetal.saltEN} nitrate ➔ ${solMetal.saltEN} hydroxide (ppt)`;
                chem = `2${metal.symbol}(s) + 2H₂O(l) ➔ 2${metal.symbol}OH(aq) + H₂(g)↑`;
                ionic = `2${metal.symbol}(s) + 2H₂O(l) ➔ 2${metal.ion}(aq) + 2OH⁻(aq) + H₂(g)↑`;
                note = "鉀和鈉無法直接置換出金屬，因其會優先與水反應生成 OH⁻ 離子產生沉澱。";
            } else if (mIdx < solIdx) {
                isReacting = true;
                if (solIdx === 8) {
                    coating.style.backgroundColor = '#b45309';
                    coating.style.opacity = '0.95';
                    targetColor = (mIdx === 6) ? COLOR_GREEN : COLOR_CLEAR;
                    obs = ["置換反應成功！", "金屬表面逐漸被置換出來的【紅棕色金屬銅 (Cu)】覆蓋", mIdx === 6 ? "溶液由藍色轉變為淡綠色" : "溶液原有的藍色隨著金屬溶解逐漸褪去，恢復無色透明"];
                } else if (solIdx === 6) {
                    coating.style.backgroundColor = '#52525b';
                    coating.style.opacity = '0.85';
                    targetColor = (mIdx === 8) ? COLOR_BLUE : COLOR_CLEAR;
                    obs = ["置換反應成功！", `活性高的 [${metal.symbol}] 將 [Fe] 置換出來`, mIdx === 8 ? "溶液由淡綠色轉變為藍色 [Cu(NO₃)₂]" : "溶液原有的淡綠色逐漸褪色變澄清無色"];
                } else if (solIdx === 10) {
                    coating.style.backgroundColor = '#f1f5f9';
                    coating.style.opacity = '0.95';
                    targetColor = (mIdx === 8) ? COLOR_BLUE : ((mIdx === 6) ? COLOR_GREEN : COLOR_CLEAR);
                    let solDesc = "溶液保持澄清無色";
                    if (mIdx === 8) solDesc = "溶液逐漸生成 Cu²⁺ 轉變為藍色 [Cu(NO₃)₂]";
                    else if (mIdx === 6) solDesc = "溶液逐漸生成 Fe²⁺ 轉變為淡綠色 [Fe(NO₃)₂]";
                    obs = ["置換反應成功！", "金屬表面結締出銀白色晶體 (金屬銀 Ag)", solDesc];
                } else {
                    coating.style.backgroundColor = '#94a3b8';
                    coating.style.opacity = '0.8';
                    targetColor = (mIdx === 8) ? COLOR_BLUE : ((mIdx === 6) ? COLOR_GREEN : COLOR_CLEAR);
                    let solDesc = (mIdx === 8) ? "溶液逐漸生成 Cu²⁺ 轉變為藍色" : "溶液呈現澄清無色";
                    obs = [`置換成功：[${metal.symbol}] 將 [${solMetal.symbol}] 從其鹽溶液中置換出來`, `原金屬逐漸溶解，${solDesc}`];
                }

                wordZH = `${metal.nameZH} + 硝酸${solMetal.saltZH} ➔ 硝酸${metal.saltZH} + ${solMetal.nameZH}`;
                wordEN = `${metal.nameEN} + ${solMetal.saltEN} nitrate ➔ ${metal.saltEN} nitrate + ${solMetal.nameEN}`;
                chem = `${metal.symbol}(s) + ${getNitrateFormula(solMetal)}(aq) ➔ ...`;
                ionic = `${metal.symbol}(s) + ${solMetal.ion}(aq) ➔ ${metal.ion}(aq) + ${solMetal.symbol}(s)`;
                note = "活性較高的金屬能將活性較低的金屬離子從化合物溶液中置換為單質固體。";
            } else {
                obs = ["無任何反應現象", `因為 [${metal.symbol}] 的活性低於 [${solMetal.symbol}]，無法發生置換`];
                wordZH = `${metal.nameZH} + 硝酸${solMetal.saltZH} ➔ 無反應`;
                wordEN = `${metal.nameEN} + ${solMetal.saltEN} nitrate ➔ No Reaction`;
                chem = "No Reaction";
                ionic = "No Reaction";
                note = "活性較低的金屬無法置換出較活潑的金屬。";
            }
        }

        document.getElementById('obsList').innerHTML = obs.map(i => `<li>${i}</li>`).join('');
        document.getElementById('wordEqZH').innerText = wordZH;
        document.getElementById('wordEqEN').innerText = wordEN;
        document.getElementById('chemEq').innerText = chem;
        document.getElementById('ionicEq').innerText = ionic;
        document.getElementById('labNote').innerText = note;

        startReactionProgress(isReacting, stopsEarlyDueToCoating);
    }

    function startReactionProgress(isReacting, stopsEarly) {
        stopTimers();
        reactionTime = 0;
        metalScale = 1.0;
        colorProgress = 0;

        const mElem = document.getElementById('sampleMetal');
        const badge = document.getElementById('statusBadge');
        const liquid = document.getElementById('liquid');

        if (!isReacting && !stopsEarly) {
            badge.textContent = "⚪ 無反應";
            liquid.style.backgroundColor = interpolateColor(startColor, startColor, 0);
            return;
        }

        badge.textContent = isContinuous ? "♾️ 持續反應中" : "🟢 反應進行中";

        timerInterval = setInterval(() => {
            reactionTime += 0.1;

            if (stopsEarly) {
                if (reactionTime >= 2.5 && !isContinuous) {
                    stopTimers();
                    document.getElementById('bubbleContainer').innerHTML = '';
                    badge.textContent = "⛔ 反應中斷 (不溶塗層阻隔)";
                }
            } else if (isReacting) {
                if (isContinuous) {
                    metalScale = 1.0;
                    mElem.style.transform = 'scale(1)';
                    colorProgress += 0.0008;
                } else {
                    metalScale -= 0.01;
                    colorProgress = 1.0 - metalScale;
                }

                liquid.style.backgroundColor = interpolateColor(startColor, targetColor, colorProgress);

                if (!isContinuous && metalScale <= 0) {
                    metalScale = 0;
                    mElem.style.display = 'none';
                    stopTimers();
                    document.getElementById('bubbleContainer').innerHTML = '';
                    badge.textContent = "🔴 反應完成 (金屬完全溶解)";
                } else {
                    mElem.style.transform = `scale(${metalScale})`;
                }
            }
        }, 100);
    }

    // ================= 介面二 JavaScript 邏輯 (Canvas) =================
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let canvasWidth, canvasHeight, waterY, tankMargin = 60;

    const METAL_DATA_TAB2 = {
        'Li': { float: true,  reactivity: 2, sparkColor: '#ff2255', flameColor: '#ff4466', name: '鋰' },
        'Na': { float: true,  reactivity: 3.5, sparkColor: '#f59e0b', flameColor: '#facc15', name: '鈉' },
        'K':  { float: true,  reactivity: 5, sparkColor: '#c084fc', flameColor: '#e879f9', name: '鉀' },
        'Rb': { float: true,  reactivity: 7, sparkColor: '#f43f5e', flameColor: '#fb7185', name: '銣' },
        'Cs': { float: false, reactivity: 10, sparkColor: '#38bdf8', flameColor: '#a5f3fc', name: '銫' },
        'Be': { float: false, reactivity: 0, sparkColor: null, flameColor: null, name: '鈹' },
        'Mg': { float: false, reactivity: 0.2, sparkColor: null, flameColor: null, name: '鎂' },
        'Ca': { float: false, reactivity: 2.5, sparkColor: null, flameColor: null, milky: true, name: '鈣' },
        'Sr': { float: false, reactivity: 4, sparkColor: '#f43f5e', flameColor: null, milky: true, name: '鍶' },
        'Ba': { float: false, reactivity: 6, sparkColor: '#4ade80', flameColor: null, milky: true, name: '鋇' }
    };

    let activeMetalsTab2 = [];
    let sparksTab2 = [];
    let bubblesTab2 = [];
    let waterOpacityTab2 = 0.15;
    let milkyOpacityTab2 = 0;

    function resizeTab2() {
        const container = document.querySelector('.container-tab2');
        if (!container) return;
        canvasWidth = canvas.width = container.clientWidth;
        canvasHeight = canvas.height = container.clientHeight;
        waterY = canvasHeight * 0.45;
    }

    window.addEventListener('resize', resizeTab2);

    function resetTankTab2() {
        activeMetalsTab2 = [];
        sparksTab2 = [];
        bubblesTab2 = [];
        milkyOpacityTab2 = 0;
    }

    function dropMetalTab2(symbol) {
        const data = METAL_DATA_TAB2[symbol];
        const startX = canvasWidth * 0.3 + Math.random() * (canvasWidth * 0.4);
        
        activeMetalsTab2.push({
            symbol: symbol,
            x: startX,
            y: 50,
            vx: (Math.random() - 0.5) * 2,
            vy: 3,
            radius: symbol === 'Cs' || symbol === 'Ba' ? 14 : 10,
            data: data,
            inWater: false,
            life: 1.0,
            reactionProgress: 0
        });
    }

    function createSparksTab2(x, y, count, color, intensity) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * intensity * 3 + 1;
            sparksTab2.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - (Math.random() * 2),
                radius: Math.random() * 2.5 + 1,
                color: color,
                life: 1.0,
                decay: Math.random() * 0.03 + 0.015
            });
        }
    }

    function createBubblesTab2(x, y, count) {
        for (let i = 0; i < count; i++) {
            bubblesTab2.push({
                x: x + (Math.random() - 0.5) * 20,
                y: y,
                vx: (Math.random() - 0.5) * 1.5,
                vy: -Math.random() * 3 - 1,
                radius: Math.random() * 3 + 1,
                alpha: 0.8
            });
        }
    }

    function updateTab2() {
        for (let i = activeMetalsTab2.length - 1; i >= 0; i--) {
            let m = activeMetalsTab2[i];

            if (!m.inWater) {
                m.y += m.vy;
                m.x += m.vx;
                if (m.y >= waterY) {
                    m.inWater = true;
                    if (m.data.sparkColor) {
                        createSparksTab2(m.x, waterY, m.data.reactivity * 12, m.data.sparkColor, m.data.reactivity);
                    }
                }
            } else {
                m.reactionProgress += 0.005 * m.data.reactivity;
                m.life -= 0.003 * Math.max(m.data.reactivity, 0.5);

                if (m.data.float) {
                    m.y = waterY + Math.sin(Date.now() * 0.01) * 2;
                    m.vx += (Math.random() - 0.5) * m.data.reactivity * 0.8;
                    m.vx *= 0.92;
                    m.x += m.vx;

                    if (m.data.sparkColor && Math.random() < 0.6) {
                        createSparksTab2(m.x, m.y - 2, Math.ceil(m.data.reactivity * 1.5), m.data.sparkColor, m.data.reactivity * 0.8);
                    }
                    createBubblesTab2(m.x, m.y + 5, Math.ceil(m.data.reactivity));

                } else {
                    const targetBottom = canvasHeight - tankMargin - m.radius;
                    if (m.y < targetBottom) {
                        m.y += 2;
                    }
                    
                    if (m.data.reactivity > 0) {
                        createBubblesTab2(m.x, m.y, Math.ceil(m.data.reactivity * 1.5));
                        
                        if (m.symbol === 'Cs' && Math.random() < 0.8) {
                            createSparksTab2(m.x, m.y, 15, m.data.sparkColor, 6);
                        }

                        if (m.data.milky && milkyOpacityTab2 < 0.65) {
                            milkyOpacityTab2 += 0.0008 * m.data.reactivity;
                        }
                    }
                }

                m.x = Math.max(tankMargin + 20, Math.min(canvasWidth - tankMargin - 20, m.x));

                if (m.life <= 0) {
                    activeMetalsTab2.splice(i, 1);
                }
            }
        }

        for (let i = sparksTab2.length - 1; i >= 0; i--) {
            let s = sparksTab2[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.15;
            s.life -= s.decay;
            if (s.life <= 0) sparksTab2.splice(i, 1);
        }

        for (let i = bubblesTab2.length - 1; i >= 0; i--) {
            let b = bubblesTab2[i];
            b.x += b.vx;
            b.y += b.vy;
            b.alpha -= 0.005;
            if (b.y <= waterY || b.alpha <= 0) bubblesTab2.splice(i, 1);
        }
    }

    function drawTab2() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // 水缸邊框
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 4;
        ctx.strokeRect(tankMargin, waterY - 20, canvasWidth - tankMargin * 2, canvasHeight - waterY - tankMargin + 20);

        // 水體與濁度
        ctx.fillStyle = `rgba(56, 189, 248, ${waterOpacityTab2})`;
        ctx.fillRect(tankMargin, waterY, canvasWidth - tankMargin * 2, canvasHeight - waterY - tankMargin);

        if (milkyOpacityTab2 > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${milkyOpacityTab2})`;
            ctx.fillRect(tankMargin, waterY, canvasWidth - tankMargin * 2, canvasHeight - waterY - tankMargin);
        }

        // 水面波光
        ctx.beginPath();
        ctx.moveTo(tankMargin, waterY);
        ctx.lineTo(canvasWidth - tankMargin, waterY);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 氣泡
        bubblesTab2.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha})`;
            ctx.fill();
        });

        // 金屬與火焰
        activeMetalsTab2.forEach(m => {
            const currentR = Math.max(2, m.radius * m.life);

            if (m.inWater && m.data.flameColor && m.data.float) {
                ctx.beginPath();
                ctx.arc(m.x, m.y - 2, currentR * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = m.data.flameColor;
                ctx.globalAlpha = 0.6 + Math.random() * 0.4;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            ctx.beginPath();
            ctx.arc(m.x, m.y, currentR, 0, Math.PI * 2);
            ctx.fillStyle = '#e2e8f0';
            ctx.shadowColor = m.data.sparkColor || '#ffffff';
            ctx.shadowBlur = m.inWater ? 10 : 0;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.font = '12px sans-serif';
            ctx.fillText(m.symbol, m.x - 6, m.y - currentR - 8);
        });

        // 火花
        sparksTab2.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fillStyle = s.color;
            ctx.globalAlpha = s.life;
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        });
    }

    function loopTab2() {
        updateTab2();
        drawTab2();
        requestAnimationFrame(loopTab2);
    }

    // 初始化載入
    window.onload = () => {
        initTab1();
        resizeTab2();
        loopTab2();
    };
</script>
</body>
