<script>
/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

        :root {

        .steam-cloud {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
            display: none;
            animation: steamPulse 2s infinite alternate;
        }

        @keyframes steamPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65%;
            background: rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
        }

        .sample-metal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #cbd5e1;
            border-radius: 3px;
            bottom: 12px;
            left: calc(50% - 10px);
            transition: background-color 0.5s;
            z-index: 5;
            transform-origin: center bottom;
        }

        .floating-ball {
            border-radius: 50% !important;
            bottom: 60% !important;
            animation: floatDart 0.6s infinite alternate ease-in-out;
        }

        @keyframes floatDart {
            0% { left: 15px; }
            100% { left: 37px; }
        }

        .flame {
            position: absolute;
            width: 16px;
            height: 22px;
            top: -20px;
            left: 1px;
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.08s infinite alternate;
            display: none;
        }
        .flame.potassium {
            background: radial-gradient(circle, #f472b6 0%, #c084fc 60%, rgba(192,132,252,0) 100%);

        .flame.sodium {
            background: radial-gradient(circle, #fef08a 0%, #f59e0b 60%, rgba(245,158,11,0) 100%);

        }

        @keyframes flicker {
            0% { transform: scale(0.85) rotate(-5deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        .burner {
            margin-top: 5px;
            font-size: 0.8em;
            color: #ef4444;
            font-weight: bold;
            display: none;
        }

        .bubble {
            position: absolute;
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            animation: rise 1.2s infinite linear;
        }

        @keyframes rise {
            0% { bottom: 15px; opacity: 1; transform: scale(0.4); }
            100% { bottom: 62%; opacity: 0; transform: scale(1.2); }
        }

        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        .coating {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s, background-color 1s, box-shadow 1s;
        }

        .precipitate {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
        }

        /* ================= 介面二樣式 ================= */
        .container-tab2 {

        .group-1 { border-color: #f472b6; }

            color: #fca5a5;
            margin-left: 8px;
        }
        .tab2-reset-btn:hover {
            background: #ef4444;
            color: #fff;
        }

      <!-- aside controls: order-2 on narrow -->
      <aside class="order-2 lg:order-1 lg:col-span-4 space-y-3 controls-aside">
        <div class="aside-card">
          <div class="series-bar" style="margin-bottom:10px;">
            <span id="series-strong">活性強 ➔</span>
            <span class="high">K</span><span class="high">Na</span><span class="high">Ca</span>
            <span class="med">Mg</span><span class="med">Al</span><span class="med">Zn</span><span class="med">Fe</span><span class="med">Pb</span>
            <span class="low">Cu</span><span class="low">Hg</span><span class="low">Ag</span><span class="low">Au</span>
            <span id="series-weak">➔ 活性弱</span>
          </div>
          <div class="controls" style="flex-direction:column;align-items:stretch;">
            <div class="control-group">
              <label id="label-reactionType" for="reactionType">1. 選擇反應類別：</label>
              <select id="reactionType" onchange="onReactionTypeChange()">

                <option value="steam">與水蒸汽反應（高溫加熱）</option>

                <option value="hcl" selected>稀氫氯酸</option>
                <option value="hno3">極稀硝酸</option>
                <option value="h2so4">稀硫酸</option>

            </div>

              <select id="solutionSelect" onchange="resetExperiment()"></select>

              <label class="toggle-box">
                <input type="checkbox" id="continuousToggle" onchange="toggleContinuous()">
                <span id="label-continuous">♾️ 持續反應（不自動停止）</span>

              <button type="button" class="reset-btn" id="btn-reset-tab1" onclick="resetExperiment()">🧹 重置實驗</button>

    function t() { return i18n[currentLang] || i18n.zh; }

    function trObs(s) {
      if (currentLang !== 'en') return s;
      return OBS_EN[s] || s;
    }
    function trNote(s) {
      if (currentLang !== 'en') return s;
      return NOTE_EN[s] !== undefined ? NOTE_EN[s] : s;
    }
    function trStatus(s) {
      if (currentLang !== 'en') return s;
      return STATUS_EN[s] || s;
    }

    function closeAllModals(exceptId) {
      if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
      ['modal-steps','modal-principle','modal-quiz'].forEach(function(id) {
        if (exceptId && id === exceptId) return;
        var el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
    }
    function openTeachModal(id) {
      closeAllModals(id);
      var el = document.getElementById(id);
      if (el) el.classList.remove('hidden');
    }

    function renderSteps() {
      var body = document.getElementById('steps-body');
      var tt = t();
      document.getElementById('steps-title').textContent = tt.stepsTitle;
      body.innerHTML = STEPS.map(function(s, i) {
        return '<div class="p-3 rounded-xl bg-slate-800/80 border border-slate-600"><div class="font-bold text-indigo-300 mb-1">' + (i+1) + '</div><div class="leading-relaxed">' + (currentLang==='en'?s.en:s.zh) + '</div></div>';
      }).join('');
    }
    function renderPrinciple() {
      var p = PRINCIPLE[currentLang] || PRINCIPLE.zh;
      var tt = t();
      document.getElementById('principle-title').textContent = tt.principleTitle;
      var mech = p.mech.map(function(m){ return '<li class="mb-2 leading-relaxed">'+m+'</li>'; }).join('');
      document.getElementById('principle-body').innerHTML =
        '<div><h3 class="font-bold text-emerald-300 mb-1">'+p.conceptTitle+'</h3><p class="leading-relaxed">'+p.concept+'</p></div>' +

        '<div><h3 class="font-bold text-emerald-300 mb-1">'+p.egTitle+'</h3><p class="leading-relaxed">'+p.eg+'</p></div>';

    function renderQuiz() {
      var body = document.getElementById('quiz-body');
      var tt = t();
      document.getElementById('quiz-title').textContent = tt.quizTitle;
      document.getElementById('btn-quiz-answers').textContent = quizReveal ? tt.hideAns : tt.showAns;
      body.innerHTML = QUIZ.map(function(item, qi) {
        var qtext = currentLang==='en' ? item.q.en : item.q.zh;
        var html = '<div class="p-3 rounded-xl bg-slate-800/80 border border-slate-600 mb-3"><div class="font-bold text-violet-300 mb-2">Q'+(qi+1)+'. '+qtext+'</div>';
        var qNum = qi + 1;
        var isOpen = (qNum === 2 || qNum === 4);
        if (!isOpen && item.choices) {
          var qName = 'q' + qNum;
          html += '<div class="grid gap-1.5 text-sm">';
          item.choices.forEach(function(c, ci) {
            var label = String.fromCharCode(65+ci);
            var txt = currentLang==='en' ? c.en : c.zh;
            html += '<label class="flex items-start gap-2 rounded-lg border border-slate-600 p-2 cursor-pointer hover:bg-slate-800/50"><input type="radio" name="'+qName+'" class="mt-0.5"><span>'+label+'. '+txt+'</span></label>';
          });
          html += '</div>';
        } else if (isOpen) {
          html += '<p class="text-xs text-slate-400 italic">'+(currentLang==='en'?'Predict, then use the sim controls to check. Write in your own words.':'先預測，再操作畫面控件核對，用自己的話作答。')+'</p>';
        }
        if (quizReveal && item.explain) {
          var ex = currentLang==='en' ? item.explain.en : item.explain.zh;
          var ref = currentLang==='en' ? 'Reference answer' : '參考答案';
          html += '<div class="mt-2 text-xs text-emerald-300 bg-emerald-950/40 border border-emerald-800/40 rounded-lg p-2"><strong>'+ref+'：</strong> '+ex+'</div>';
        }
        html += '</div>';
        return html;
      }).join('');
    }

    function refreshObsUI() {
      var ul = document.getElementById('obsList');
      if (!ul) return;
      if (!lastObs || !lastObs.length) {
        ul.innerHTML = '<li>'+t().obsEmpty+'</li>';
      } else {
        ul.innerHTML = '';
        lastObs.forEach(function(line) {
          var li = document.createElement('li');
          li.textContent = trObs(line);
          ul.appendChild(li);
        });
      }
      var noteEl = document.getElementById('labNote');
      if (noteEl) noteEl.textContent = lastNote ? trNote(lastNote) : '-';
      var badge = document.getElementById('statusBadge');
      if (badge && lastStatusKey) badge.textContent = trStatus(lastStatusKey);
      // word equation: show current language only
      var wzh = document.getElementById('wordEqZH');
      var wen = document.getElementById('wordEqEN');
      var rowZh = document.getElementById('eq-row-zh');
      var rowEn = document.getElementById('eq-row-en');
      if (rowZh && rowEn) {
        if (currentLang === 'en') {
          rowZh.classList.add('hidden-lang');
          rowEn.classList.remove('hidden-lang');
        } else {
          rowEn.classList.add('hidden-lang');
          rowZh.classList.remove('hidden-lang');
        }
      }
    }

    function rebuildTrayAndSolutions() {
      var tray = document.getElementById('metalTray');
      if (!tray || typeof metals === 'undefined') return;
      tray.innerHTML = '';
      metals.forEach(function(m, idx) {
        var chip = document.createElement('div');
        chip.className = 'metal-chip';
        chip.id = 'chip-' + idx;
        chip.textContent = m.symbol + ' (' + (currentLang==='en' ? m.nameEN : m.nameZH) + ')';
        chip.onclick = function() { addMetalToExperiment(idx); };
        tray.appendChild(chip);
      });
      var solSelect = document.getElementById('solutionSelect');
      var prev = solSelect.value || '8';
      solSelect.innerHTML = '';
      metals.forEach(function(m, idx) {
        var opt = document.createElement('option');
        opt.value = idx;
        if (currentLang === 'en') {
          opt.textContent = getNitrateFormula(m) + ' (' + m.saltEN + ' nitrate)';
        } else {
          opt.textContent = getNitrateFormula(m) + '（硝酸' + m.saltZH + '）';
        }
        solSelect.appendChild(opt);
      });
      solSelect.value = prev;
    }

    const COLOR_GREEN = [34, 197, 94, 0.35];
    const COLOR_TURBID = [255, 255, 255, 0.45];

    let currentMetalIndex = null;
    let timerInterval = null;
    let reactionTime = 0;
    let metalScale = 1.0;
    let isContinuous = false;

    let startColor = COLOR_CLEAR;
    let targetColor = COLOR_CLEAR;
    let colorProgress = 0;

    function getNitrateFormula(m) {
        if (m.valency === 1) return `${m.symbol}NO₃`;
        if (m.valency === 2) return `${m.symbol}(NO₃)₂`;
        if (m.valency === 3) return `${m.symbol}(NO₃)₃`;
    }

    function interpolateColor(c1, c2, factor) {
        let f = Math.max(0, Math.min(1, factor));
        let r = Math.round(c1[0] + f * (c2[0] - c1[0]));
        let g = Math.round(c1[1] + f * (c2[1] - c1[1]));
        let b = Math.round(c1[2] + f * (c2[2] - c1[2]));
        let a = (c1[3] + f * (c2[3] - c1[3])).toFixed(2);
        return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    
    function initTab1() {
        const rt = document.getElementById('reactionType');
        rt.value = 'acid';
        document.getElementById('acidSelect').value = 'hcl';
        document.getElementById('continuousToggle').checked = false;
        isContinuous = false;
        rebuildTrayAndSolutions();
        document.getElementById('solutionSelect').value = 8;
        onReactionTypeChange();
    }

    function onReactionTypeChange() {
        const type = document.getElementById('reactionType').value;
        document.getElementById('acidGroup').style.display = (type === 'acid') ? 'flex' : 'none';
        document.getElementById('solutionGroup').style.display = (type === 'displacement') ? 'flex' : 'none';

        document.getElementById('testTubeContainer').style.display = 'block';
        document.getElementById('trayTitle').textContent = t().trayTitle;

        resetExperiment();
    }

    function toggleContinuous() {
        isContinuous = document.getElementById('continuousToggle').checked;
        if (currentMetalIndex !== null) {
            runSimulation(currentMetalIndex);
        }
    }

    function stopTimers() {
        if (timerInterval) clearInterval(timerInterval);
    }

    function resetExperiment() {
        stopTimers();
        currentMetalIndex = null;
        reactionTime = 0;
        metalScale = 1.0;
        colorProgress = 0;

        const mElem = document.getElementById('sampleMetal');
        mElem.style.display = 'none';
        mElem.style.transform = 'scale(1)';
        mElem.className = 'sample-metal';

        document.getElementById('flame').className = 'flame';
        document.getElementById('flame').style.display = 'none';

        const coating = document.getElementById('coating');
        coating.style.opacity = '0';
        coating.style.backgroundColor = 'transparent';

        document.getElementById('precipitate').style.opacity = '0';
        document.getElementById('bubbleContainer').innerHTML = '';

        document.getElementById('dropZone').classList.remove('shake');
        document.getElementById('dropHint').style.display = 'block';
        lastStatusKey = "⚪ 準備就緒"; document.getElementById('statusBadge').textContent = trStatus(lastStatusKey);

        const type = document.getElementById('reactionType').value;
        const liquid = document.getElementById('liquid');
        const steamCloud = document.getElementById('steamCloud');
        const burner = document.getElementById('burner');

        if (type === 'steam') {
            liquid.style.height = '0%';
            steamCloud.style.display = 'block';
            burner.style.display = 'block';
            startColor = COLOR_CLEAR;
            targetColor = COLOR_CLEAR;
        } else {
            liquid.style.height = '65%';
            steamCloud.style.display = 'none';
            burner.style.display = 'none';

            if (type === 'water' || type === 'acid') {
                startColor = COLOR_CLEAR;
                targetColor = COLOR_CLEAR;
            } else if (type === 'displacement') {
                const solIdx = parseInt(document.getElementById('solutionSelect').value);
                setSolutionBaseColor(solIdx);
            }
            liquid.style.backgroundColor = interpolateColor(startColor, startColor, 0);
        }

        lastObs = []; lastNote = '';
        document.getElementById('wordEqZH').textContent = '-';
        document.getElementById('wordEqEN').textContent = '-';
        document.getElementById('chemEq').textContent = '-';
        document.getElementById('ionicEq').textContent = '-';
        refreshObsUI();
    }

    function setSolutionBaseColor(solMetalIdx) {
        if (solMetalIdx === 8) startColor = COLOR_BLUE;
        else if (solMetalIdx === 6) startColor = COLOR_GREEN;
        else startColor = COLOR_CLEAR;
        targetColor = startColor;
    }

    function addMetalToExperiment(idx) {
        resetExperiment();
        currentMetalIndex = idx;
        document.getElementById('dropHint').style.display = 'none';

        const metal = metals[idx];
        const mElem = document.getElementById('sampleMetal');
        mElem.style.display = 'block';
        mElem.style.backgroundColor = metal.color;

        runSimulation(idx);
    }

    function createBubbles(count, speed = 1.2) {
        const container = document.getElementById('bubbleContainer');
        container.innerHTML = '';
        for (let i = 0; i < count; i++) {
            let b = document.createElement('div');
            b.className = 'bubble';
            let sz = Math.random() * 5 + 3;
            b.style.width = sz + 'px';
            b.style.height = sz + 'px';
            b.style.left = (Math.random() * 40 + 15) + 'px';
            b.style.animationDuration = (speed + Math.random() * 0.5) + 's';
            b.style.animationDelay = (Math.random() * 0.8) + 's';
            container.appendChild(b);
        }
    }

                else precipitate.style.backgroundColor = '#f8fafc';

                obs = [
                    `⚠️ 鉀/鈉優先與溶液中的【水】發生劇烈反應！`,
                    `金屬在表面游動並發出火焰，隨反應逐漸完全消失`,
                    `生成的 OH⁻ 離子隨後與溶液中的 ${solMetal.symbol} 離子反應，生成【金屬氫氧化物沉澱】`
                ];
                wordZH = `1) ${metal.nameZH} + 水 ➔ 氫氧化${metal.saltZH} + 氫氣\n2) 氫氧化${metal.saltZH} + 硝酸${solMetal.saltZH} ➔ 氫氧化${solMetal.saltZH} + 硝酸${metal.saltZH}`;
                wordEN = `1) ${metal.nameEN} + water ➔ ${metal.saltEN} hydroxide + hydrogen\n2) hydroxide + ${solMetal.saltEN} nitrate ➔ ${solMetal.saltEN} hydroxide (ppt)`;
                chem = `2${metal.symbol}(s) + 2H₂O(l) ➔ 2${metal.symbol}OH(aq) + H₂(g)↑`;
                ionic = `2${metal.symbol}(s) + 2H₂O(l) ➔ 2${metal.ion}(aq) + 2OH⁻(aq) + H₂(g)↑`;
                note = "鉀和鈉無法直接置換出金屬，因其會優先與水反應生成 OH⁻ 離子產生沉澱。";
            } else if (mIdx < solIdx) {
                isReacting = true;
                if (solIdx === 8) {
                    coating.style.backgroundColor = '#b45309';
                    coating.style.opacity = '0.95';
                    targetColor = (mIdx === 6) ? COLOR_GREEN : COLOR_CLEAR;
                    obs = ["置換反應成功！", "金屬表面逐漸被置換出來的【紅棕色金屬銅 (Cu)】覆蓋", mIdx === 6 ? "溶液由藍色轉變為淡綠色" : "溶液原有的藍色隨著金屬溶解逐漸褪去，恢復無色透明"];
                } else if (solIdx === 6) {
                    coating.style.backgroundColor = '#52525b';
                    coating.style.opacity = '0.85';
                    targetColor = (mIdx === 8) ? COLOR_BLUE : COLOR_CLEAR;
                    obs = ["置換反應成功！", `活性高的 [${metal.symbol}] 將 [Fe] 置換出來`, mIdx === 8 ? "溶液由淡綠色轉變為藍色 [Cu(NO₃)₂]" : "溶液原有的淡綠色逐漸褪色變澄清無色"];
                } else if (solIdx === 10) {
                    coating.style.backgroundColor = '#f1f5f9';
                    coating.style.opacity = '0.95';
                    targetColor = (mIdx === 8) ? COLOR_BLUE : ((mIdx === 6) ? COLOR_GREEN : COLOR_CLEAR);
                    let solDesc = "溶液保持澄清無色";
                    if (mIdx === 8) solDesc = "溶液逐漸生成 Cu²⁺ 轉變為藍色 [Cu(NO₃)₂]";
                    else if (mIdx === 6) solDesc = "溶液逐漸生成 Fe²⁺ 轉變為淡綠色 [Fe(NO₃)₂]";
                    obs = ["置換反應成功！", "金屬表面結締出銀白色晶體 (金屬銀 Ag)", solDesc];
                } else {
                    coating.style.backgroundColor = '#94a3b8';
                    coating.style.opacity = '0.8';
                    targetColor = (mIdx === 8) ? COLOR_BLUE : ((mIdx === 6) ? COLOR_GREEN : COLOR_CLEAR);
                    let solDesc = (mIdx === 8) ? "溶液逐漸生成 Cu²⁺ 轉變為藍色" : "溶液呈現澄清無色";
                    obs = [`置換成功：[${metal.symbol}] 將 [${solMetal.symbol}] 從其鹽溶液中置換出來`, `原金屬逐漸溶解，${solDesc}`];
                }

                wordZH = `${metal.nameZH} + 硝酸${solMetal.saltZH} ➔ 硝酸${metal.saltZH} + ${solMetal.nameZH}`;
                wordEN = `${metal.nameEN} + ${solMetal.saltEN} nitrate ➔ ${metal.saltEN} nitrate + ${solMetal.nameEN}`;
                chem = `${metal.symbol}(s) + ${getNitrateFormula(solMetal)}(aq) ➔ ...`;
                ionic = `${metal.symbol}(s) + ${solMetal.ion}(aq) ➔ ${metal.ion}(aq) + ${solMetal.symbol}(s)`;
                note = "活性較高的金屬能將活性較低的金屬離子從化合物溶液中置換為單質固體。";
            } else {
                obs = ["無任何反應現象", `因為 [${metal.symbol}] 的活性低於 [${solMetal.symbol}]，無法發生置換`];
                wordZH = `${metal.nameZH} + 硝酸${solMetal.saltZH} ➔ 無反應`;
                wordEN = `${metal.nameEN} + ${solMetal.saltEN} nitrate ➔ No Reaction`;
                chem = "No Reaction";
                ionic = "No Reaction";
                note = "活性較低的金屬無法置換出較活潑的金屬。";
            }
        }

        setResultDisplay(obs, note, wordZH, wordEN, chem, ionic);

        startReactionProgress(isReacting, stopsEarlyDueToCoating);
    }

    function startReactionProgress(isReacting, stopsEarly) {
        stopTimers();
        reactionTime = 0;
        metalScale = 1.0;
        colorProgress = 0;

        const mElem = document.getElementById('sampleMetal');
        const badge = document.getElementById('statusBadge');
        const liquid = document.getElementById('liquid');

        if (!isReacting && !stopsEarly) {
            lastStatusKey = "⚪ 無反應"; badge.textContent = trStatus(lastStatusKey);
            liquid.style.backgroundColor = interpolateColor(startColor, startColor, 0);
            return;
        }

        lastStatusKey = isContinuous ? "♾️ 持續反應中" : "🟢 反應進行中"; badge.textContent = trStatus(lastStatusKey);

        timerInterval = setInterval(() => {
            reactionTime += 0.1;

            if (stopsEarly) {
                if (reactionTime >= 2.5 && !isContinuous) {
                    stopTimers();
                    document.getElementById('bubbleContainer').innerHTML = '';
                    lastStatusKey = "⛔ 反應中斷 (不溶塗層阻隔)"; badge.textContent = trStatus(lastStatusKey);
                }
            } else if (isReacting) {
                if (isContinuous) {
                    metalScale = 1.0;
                    mElem.style.transform = 'scale(1)';
                    colorProgress += 0.0008;
                } else {
                    metalScale -= 0.01;
                    colorProgress = 1.0 - metalScale;
                }

                liquid.style.backgroundColor = interpolateColor(startColor, targetColor, colorProgress);

                if (!isContinuous && metalScale <= 0) {
                    metalScale = 0;
                    mElem.style.display = 'none';
                    stopTimers();
                    document.getElementById('bubbleContainer').innerHTML = '';
                    lastStatusKey = "🔴 反應完成 (金屬完全溶解)"; badge.textContent = trStatus(lastStatusKey);
                } else {
                    mElem.style.transform = `scale(${metalScale})`;
                }
            }
        }, 100);
    }

    // ================= 介面二 JavaScript 邏輯 (Canvas) =================
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    let canvasWidth, canvasHeight, waterY, tankMargin = 60;

    const METAL_DATA_TAB2 = {
        'Li': { float: true,  reactivity: 2, sparkColor: '#ff2255', flameColor: '#ff4466', name: '鋰' },
        'Na': { float: true,  reactivity: 3.5, sparkColor: '#f59e0b', flameColor: '#facc15', name: '鈉' },
        'K':  { float: true,  reactivity: 5, sparkColor: '#c084fc', flameColor: '#e879f9', name: '鉀' },
        'Rb': { float: true,  reactivity: 7, sparkColor: '#f43f5e', flameColor: '#fb7185', name: '銣' },
        'Cs': { float: false, reactivity: 10, sparkColor: '#38bdf8', flameColor: '#a5f3fc', name: '銫' },
        'Be': { float: false, reactivity: 0, sparkColor: null, flameColor: null, name: '鈹' },
        'Mg': { float: false, reactivity: 0.2, sparkColor: null, flameColor: null, name: '鎂' },
        'Ca': { float: false, reactivity: 2.5, sparkColor: null, flameColor: null, milky: true, name: '鈣' },
        'Sr': { float: false, reactivity: 4, sparkColor: '#f43f5e', flameColor: null, milky: true, name: '鍶' },
        'Ba': { float: false, reactivity: 6, sparkColor: '#4ade80', flameColor: null, milky: true, name: '鋇' }
    };

    let activeMetalsTab2 = [];
    let sparksTab2 = [];
    let bubblesTab2 = [];
    let waterOpacityTab2 = 0.15;
    let milkyOpacityTab2 = 0;

    function resizeTab2() {
        const container = document.querySelector('.container-tab2');
        if (!container) return;
        canvasWidth = canvas.width = container.clientWidth;
        canvasHeight = canvas.height = container.clientHeight;
        waterY = canvasHeight * 0.45;
    }

    window.addEventListener('resize', resizeTab2);

    function resetTankTab2() {
        activeMetalsTab2 = [];
        sparksTab2 = [];
        bubblesTab2 = [];
        milkyOpacityTab2 = 0;
    }

    function dropMetalTab2(symbol) {
        const data = METAL_DATA_TAB2[symbol];
        const startX = canvasWidth * 0.3 + Math.random() * (canvasWidth * 0.4);
        
        activeMetalsTab2.push({
            symbol: symbol,
            x: startX,
            y: 50,
            vx: (Math.random() - 0.5) * 2,
            vy: 3,
            radius: symbol === 'Cs' || symbol === 'Ba' ? 14 : 10,
            data: data,
            inWater: false,
            life: 1.0,
            reactionProgress: 0
        });
    }

    function createSparksTab2(x, y, count, color, intensity) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * intensity * 3 + 1;
            sparksTab2.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - (Math.random() * 2),
                radius: Math.random() * 2.5 + 1,
                color: color,
                life: 1.0,
                decay: Math.random() * 0.03 + 0.015
            });
        }
    }

    function createBubblesTab2(x, y, count) {
        for (let i = 0; i < count; i++) {
            bubblesTab2.push({
                x: x + (Math.random() - 0.5) * 20,
                y: y,
                vx: (Math.random() - 0.5) * 1.5,
                vy: -Math.random() * 3 - 1,
                radius: Math.random() * 3 + 1,
                alpha: 0.8
            });
        }
    }

    function updateTab2() {
        for (let i = activeMetalsTab2.length - 1; i >= 0; i--) {
            let m = activeMetalsTab2[i];

            if (!m.inWater) {
                m.y += m.vy;
                m.x += m.vx;
                if (m.y >= waterY) {
                    m.inWater = true;
                    if (m.data.sparkColor) {
                        createSparksTab2(m.x, waterY, m.data.reactivity * 12, m.data.sparkColor, m.data.reactivity);
                    }
                }
            } else {
                m.reactionProgress += 0.005 * m.data.reactivity;
                m.life -= 0.003 * Math.max(m.data.reactivity, 0.5);

                if (m.data.float) {
                    m.y = waterY + Math.sin(Date.now() * 0.01) * 2;
                    m.vx += (Math.random() - 0.5) * m.data.reactivity * 0.8;
                    m.vx *= 0.92;
                    m.x += m.vx;

                    if (m.data.sparkColor && Math.random() < 0.6) {
                        createSparksTab2(m.x, m.y - 2, Math.ceil(m.data.reactivity * 1.5), m.data.sparkColor, m.data.reactivity * 0.8);
                    }
                    createBubblesTab2(m.x, m.y + 5, Math.ceil(m.data.reactivity));

                } else {
                    const targetBottom = canvasHeight - tankMargin - m.radius;
                    if (m.y < targetBottom) {
                        m.y += 2;
                    }
                    
                    if (m.data.reactivity > 0) {
                        createBubblesTab2(m.x, m.y, Math.ceil(m.data.reactivity * 1.5));
                        
                        if (m.symbol === 'Cs' && Math.random() < 0.8) {
                            createSparksTab2(m.x, m.y, 15, m.data.sparkColor, 6);
                        }

                        if (m.data.milky && milkyOpacityTab2 < 0.65) {
                            milkyOpacityTab2 += 0.0008 * m.data.reactivity;
                        }
                    }
                }

                m.x = Math.max(tankMargin + 20, Math.min(canvasWidth - tankMargin - 20, m.x));

                if (m.life <= 0) {
                    activeMetalsTab2.splice(i, 1);
                }
            }
        }

        for (let i = sparksTab2.length - 1; i >= 0; i--) {
            let s = sparksTab2[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.15;
            s.life -= s.decay;
            if (s.life <= 0) sparksTab2.splice(i, 1);
        }

        for (let i = bubblesTab2.length - 1; i >= 0; i--) {
            let b = bubblesTab2[i];
            b.x += b.vx;
            b.y += b.vy;
            b.alpha -= 0.005;
            if (b.y <= waterY || b.alpha <= 0) bubblesTab2.splice(i, 1);
        }
    }

    function drawTab2() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // 水缸邊框
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 4;
        ctx.strokeRect(tankMargin, waterY - 20, canvasWidth - tankMargin * 2, canvasHeight - waterY - tankMargin + 20);

        // 水體與濁度
        ctx.fillStyle = `rgba(56, 189, 248, ${waterOpacityTab2})`;
        ctx.fillRect(tankMargin, waterY, canvasWidth - tankMargin * 2, canvasHeight - waterY - tankMargin);

        if (milkyOpacityTab2 > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${milkyOpacityTab2})`;
            ctx.fillRect(tankMargin, waterY, canvasWidth - tankMargin * 2, canvasHeight - waterY - tankMargin);
        }

        // 水面波光
        ctx.beginPath();
        ctx.moveTo(tankMargin, waterY);
        ctx.lineTo(canvasWidth - tankMargin, waterY);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 氣泡
        bubblesTab2.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha})`;
            ctx.fill();
        });

        // 金屬與火焰
        activeMetalsTab2.forEach(m => {
            const currentR = Math.max(2, m.radius * m.life);

            if (m.inWater && m.data.flameColor && m.data.float) {
                ctx.beginPath();
                ctx.arc(m.x, m.y - 2, currentR * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = m.data.flameColor;
                ctx.globalAlpha = 0.6 + Math.random() * 0.4;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            ctx.beginPath();
            ctx.arc(m.x, m.y, currentR, 0, Math.PI * 2);
            ctx.fillStyle = '#e2e8f0';
            ctx.shadowColor = m.data.sparkColor || '#ffffff';
            ctx.shadowBlur = m.inWater ? 10 : 0;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.font = '12px sans-serif';
            ctx.fillText(m.symbol, m.x - 6, m.y - currentR - 8);
        });

        // 火花
        sparksTab2.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fillStyle = s.color;
            ctx.globalAlpha = s.life;
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        });
    }

    function loopTab2() {
        updateTab2();
        drawTab2();
        requestAnimationFrame(loopTab2);
    }

    // 初始化載入
    window.onload = () => {
        wireTeachingUI();
        initTab1();
        applyLang();
        resizeTab2();
        loopTab2();
    };

</script>
