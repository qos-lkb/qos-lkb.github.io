openapi: 3.0.3
info:
  title: Science Sims API
  version: 1.1.0
  description: |
    REST contract for the science_sims platform. Learner SPA and admin UI should
    call `/api/v1` only (session cookie `SCI_SIM_SESSID` + `X-CSRF-Token` on
    mutating requests). Route authority: `api/v1/build_router.php`.
servers:
  - url: /api/v1
tags:
  - name: Catalog
  - name: Auth
  - name: Content
  - name: Learning
  - name: Teacher
  - name: Student
  - name: Admin
  - name: Review
paths:
  /catalog:
    get:
      tags: [Catalog]
      summary: Published catalogue (simulations tree + published content)
      responses:
        '200':
          description: OK
  /subjects:
    get:
      tags: [Catalog]
      summary: Public subjects + topics tree
      responses:
        '200':
          description: OK
  /nav-menu:
    get:
      tags: [Catalog]
      summary: Visible top-nav items and display order for current session
      responses:
        '200':
          description: OK (items map, order list)
  /courses:
    get:
      tags: [Catalog]
      summary: List self-study course subjects
      responses:
        '200':
          description: OK
  /courses/{subject}:
    get:
      tags: [Catalog]
      summary: Course structure for a subject slug
      parameters:
        - $ref: '#/components/parameters/SubjectSlug'
      responses:
        '200':
          description: OK

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (QSIS-backed; no CSRF; rate-limited)
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      tags: [Auth]
      summary: Student register with invite code (rate-limited)
      responses:
        '200':
          description: OK
  /auth/dev-login:
    post:
      tags: [Auth]
      summary: Dev-only login (APP_ENV=local)
      responses:
        '200':
          description: OK
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user (includes csrf_token, permissions)
      responses:
        '200':
          description: OK
  /auth/profile:
    post:
      tags: [Auth]
      summary: Update display names
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /auth/student-profile:
    post:
      tags: [Auth]
      summary: Update student profile
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /auth/stop-impersonation:
    post:
      tags: [Auth]
      summary: End impersonation session
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK

  /simulations/{slug}:
    get:
      tags: [Content]
      summary: Simulation metadata
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /simulations/contribute:
    get:
      tags: [Content]
      summary: Contribute form bootstrap (subjects, CSRF, optional user)
      responses:
        '200':
          description: OK
    post:
      tags: [Content]
      summary: Guest or logged-in simulation contribution (always pending_review; rate-limited)
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: Submitted
        '429':
          description: Rate limited
  /simulations/{slug}/html:
    get:
      tags: [Content]
      summary: Simulation HTML body (iframe source)
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: text/html
  /learning-tools:
    get:
      tags: [Content]
      summary: List learning tools (compat; prefer question-banks)
      responses:
        '200':
          description: OK
  /learning-tools/pending:
    get:
      tags: [Content]
      summary: Pending learning tools (manage_any)
      responses:
        '200':
          description: OK
  /learning-tools/{slug}:
    get:
      tags: [Content]
      summary: Learning tool detail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /learning-tools/{slug}/answers:
    get:
      tags: [Content]
      summary: Learning tool answers
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /articles:
    get:
      tags: [Content]
      summary: List published articles
      responses:
        '200':
          description: OK
  /articles/pending:
    get:
      tags: [Content]
      summary: Pending articles
      responses:
        '200':
          description: OK
  /articles/{slug}:
    get:
      tags: [Content]
      summary: Article detail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /articles/{slug}/answers:
    get:
      tags: [Content]
      summary: Article comprehension answers
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /learning-notes:
    get:
      tags: [Content]
      summary: List published notes
      responses:
        '200':
          description: OK
  /learning-notes/pending:
    get:
      tags: [Content]
      summary: Pending notes
      responses:
        '200':
          description: OK
  /learning-notes/{slug}:
    get:
      tags: [Content]
      summary: Note detail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /worksheets:
    get:
      tags: [Content]
      summary: List published worksheets
      responses:
        '200':
          description: OK
  /worksheets/pending:
    get:
      tags: [Content]
      summary: Pending worksheets
      responses:
        '200':
          description: OK
  /worksheets/{slug}:
    get:
      tags: [Content]
      summary: Worksheet detail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /learning-videos:
    get:
      tags: [Content]
      summary: List published videos
      responses:
        '200':
          description: OK
  /learning-videos/pending:
    get:
      tags: [Content]
      summary: Pending videos
      responses:
        '200':
          description: OK
  /learning-videos/{slug}:
    get:
      tags: [Content]
      summary: Video detail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /question-banks:
    get:
      tags: [Content]
      summary: List published question banks
      responses:
        '200':
          description: OK
  /question-banks/{slug}:
    get:
      tags: [Content]
      summary: Question bank detail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /question-banks/{slug}/answers:
    get:
      tags: [Content]
      summary: Question bank answers
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /summer-homework:
    get:
      tags: [Content]
      summary: List summer homework (student view, no answer keys)
      responses:
        '200':
          description: OK
  /summer-homework/{slug}:
    get:
      tags: [Content]
      summary: Summer homework detail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OK
  /summer-homework/{slug}/submit:
    post:
      tags: [Content]
      summary: Submit summer homework attempt
      parameters:
        - $ref: '#/components/parameters/Slug'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK

  /learning/events:
    post:
      tags: [Learning]
      summary: Record learning event
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /learning/events/summary:
    get:
      tags: [Learning]
      summary: Learning events summary
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /learning/attempts:
    get:
      tags: [Learning]
      summary: List learning attempts
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Learning]
      summary: Record learning attempt
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /learning/mastery:
    get:
      tags: [Learning]
      summary: Mastery scores
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /learning/progress:
    get:
      tags: [Learning]
      summary: Learning progress
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /learning/dashboard:
    get:
      tags: [Learning]
      summary: Student learning dashboard
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /learning/goals:
    post:
      tags: [Learning]
      summary: Set learning goals
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /learning/recommendations:
    get:
      tags: [Learning]
      summary: Recommendations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /learning/adaptive-quiz:
    get:
      tags: [Learning]
      summary: Adaptive quiz payload (learning_tool route or hydrated review_wrong questions)
      security:
        - cookieAuth: []
      parameters:
        - name: topic_id
          in: query
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: mode learning_tool with source.route, or mode review_wrong with questions/answers

  /learning/streak:
    get:
      tags: [Learning]
      summary: Student learning streak (current & best)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK

  /learning/badges:
    get:
      tags: [Learning]
      summary: Student achievement badges
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK

  /learning/class-leaderboard:
    get:
      tags: [Learning]
      summary: Class leaderboard (Top N + weekly champion)
      security:
        - cookieAuth: []
      parameters:
        - name: class_id
          in: query
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /learning/bookmarks:
    get:
      tags: [Learning]
      summary: List user content bookmarks
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
    post:
      tags: [Learning]
      summary: Toggle user content bookmark
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK

  /course-discussions:
    get:
      tags: [Learning]
      summary: Fetch course discussion thread & published posts
      security:
        - cookieAuth: []
      parameters:
        - name: class_id
          in: query
          required: true
          schema:
            type: integer
        - name: topic_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /course-discussions/posts:
    post:
      tags: [Learning]
      summary: Create a new course discussion post or single-level reply (pending)
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK

  /course-discussions/posts/{id}/reactions:
    post:
      tags: [Learning]
      summary: Toggle up-reaction on a published discussion post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK

  /admin/course-discussions/pending:
    get:
      tags: [Teacher]
      summary: List pending discussion posts for moderation
      security:
        - cookieAuth: []
      parameters:
        - name: class_id
          in: query
          required: true
          schema:
            type: integer
        - name: topic_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /admin/course-discussions/posts/{id}/moderate:
    post:
      tags: [Teacher]
      summary: Publish or reject a pending discussion post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK

  /teacher/classes:
    get:
      tags: [Teacher]
      summary: List classes for teacher
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Teacher]
      summary: Create class
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /teacher/classes/{id}/enroll:
    post:
      tags: [Teacher]
      summary: Enroll students by email
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /teacher/classes/{id}/invite:
    post:
      tags: [Teacher]
      summary: Reset invite code
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /teacher/classes/{id}/report:
    get:
      tags: [Teacher]
      summary: Class learning report (JSON) with SDL + coursework KPIs
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: summary, coursework, weak_topics, students, achievements_summary (streaks/badges)
  /teacher/classes/{id}/report.csv:
    get:
      tags: [Teacher]
      summary: Class learning report (CSV, includes worksheet/summer columns)
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: text/csv
  /teacher/classes/{id}/students/{userId}:
    get:
      tags: [Teacher]
      summary: Student coursework dossier in class (SDL + worksheets + summer)
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      security:
        - cookieAuth: []
      responses:
        '200':
          description: student profile, kpis, detail (SDL), worksheets, summer_homework, recent_events
  /teacher/inbox:
    get:
      tags: [Teacher]
      summary: Ungraded submissions and overdue missing assignments
      parameters:
        - name: class_id
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum: [worksheet_submission, overdue_missing]
        - name: status
          in: query
          schema:
            type: string
            enum: [ungraded, overdue_missing]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: items + count
  /teacher/inbox/count:
    get:
      tags: [Teacher]
      summary: Inbox badge counts
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ungraded, overdue_missing, total
  /admin/school-overview:
    get:
      tags: [Admin]
      summary: School-wide class coursework overview (class.manage_any)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: classes[] with activity and coursework KPIs
  /teacher/classes/{id}/worksheet-assignments:
    get:
      tags: [Teacher]
      summary: List worksheet assignments for class
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Teacher]
      summary: Create worksheet assignment
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /teacher/worksheet-assignments/{id}:
    get:
      tags: [Teacher]
      summary: Worksheet assignment detail
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Teacher]
      summary: Update worksheet assignment
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /teacher/worksheet-submissions/{id}/grade:
    post:
      tags: [Teacher]
      summary: Grade worksheet submission
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /teacher/worksheets:
    get:
      tags: [Teacher]
      summary: Worksheets available to assign
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK

  /student/worksheet-assignments:
    get:
      tags: [Student]
      summary: List assigned worksheets
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /student/worksheet-assignments/{id}:
    get:
      tags: [Student]
      summary: Assignment detail
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /student/worksheet-assignments/{id}/submit:
    post:
      tags: [Student]
      summary: Submit worksheet assignment
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK

  /review-queue:
    get:
      tags: [Review]
      summary: Pending review items (learning_tool rows may include mapped_bank_id from legacy_learning_tool_map)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /review/{type}/{id}/publish:
    post:
      tags: [Review]
      summary: Publish pending content (type = learning-tools|articles|learning-notes|worksheets|learning-videos|question-banks|summer-homework|simulations)
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /review/{type}/{id}/reject:
    post:
      tags: [Review]
      summary: Reject pending content (type includes simulations)
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK

  /admin/simulations:
    get:
      tags: [Admin]
      summary: List simulations (or one full row when id is set, including html/tags)
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Create or update simulation
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Delete simulation
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /admin/simulations/upload-html:
    post:
      tags: [Admin]
      summary: Upload HTML file for simulation editor (returns html + suggested_title)
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /admin/simulations/upload-screenshot:
    post:
      tags: [Admin]
      summary: Upload screenshot image (returns path under uploads/simulations/)
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /admin/learning-tools:
    get:
      tags: [Admin]
      summary: List learning tools (read; writes return 410)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Frozen — returns 410
      responses:
        '410':
          description: Gone
    delete:
      tags: [Admin]
      summary: Frozen — returns 410
      responses:
        '410':
          description: Gone
  /admin/articles:
    get:
      tags: [Admin]
      summary: List articles (admin)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Create or update article
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Delete article
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /admin/learning-notes:
    get:
      tags: [Admin]
      summary: List learning notes
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Create or update note
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Delete note
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /admin/worksheets:
    get:
      tags: [Admin]
      summary: List worksheets
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Create or update worksheet
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Delete worksheet
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /admin/learning-videos:
    get:
      tags: [Admin]
      summary: List learning videos
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Create or update video
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Delete video
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /admin/question-banks:
    get:
      tags: [Admin]
      summary: List question banks
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Create or update question bank
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Delete question bank
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '200':
          description: OK
  /admin/question-banks/{id}:
    get:
      tags: [Admin]
      summary: Get question bank by id
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
  /admin/question-banks/{id}/media:
    post:
      tags: [Admin]
      summary: Upload question bank media
      parameters:
