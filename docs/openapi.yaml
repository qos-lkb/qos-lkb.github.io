components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    SubjectSlug:
      name: subject
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SCI_SIM_SESSID
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
