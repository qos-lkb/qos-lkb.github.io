openapi: 3.0.3
info:
  title: Science Sims API
  version: 1.0.0
  description: |
    REST contract for the science_sims platform. All learner and admin UIs should
    call `/api/v1` only (session cookie + `X-CSRF-Token` on mutating requests).
servers:
  - url: /api/v1
paths:
  /catalog:
    get:
      summary: Published catalogue (simulations tree)
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Login (QSIS-backed)
      responses:
        '200':
          description: OK
  /auth/logout:
    post:
      summary: Logout
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      summary: Current user
      responses:
        '200':
          description: OK
  /summer-homework:
    get:
      summary: List summer homework items
      responses:
        '200':
          description: OK
  /simulations/{slug}:
    get:
      summary: Simulation metadata
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /simulations/{slug}/html:
    get:
      summary: Simulation HTML body (iframe source)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: text/html
  /courses:
    get:
      summary: List courses (classes)
      responses:
        '200':
          description: OK
  /subjects:
    get:
      summary: Public subjects + topics tree
      responses:
        '200':
          description: OK
  /admin/subjects:
    get:
      summary: Admin subjects with topics (requires user.manage)
      responses:
        '200':
          description: OK
    post:
      summary: Create subject
      responses:
        '201':
          description: Created
  /admin/subjects/reorder:
    post:
      summary: Reorder subjects
      responses:
        '200':
          description: OK
  /admin/subjects/{id}:
    patch:
      summary: Update subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    delete:
      summary: Delete empty subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /admin/subjects/{id}/topics:
    post:
      summary: Create topic under subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Created
  /admin/subjects/{id}/topics/reorder:
    post:
      summary: Reorder topics in subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /admin/topics/{id}:
    patch:
      summary: Update topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    delete:
      summary: Delete unused topic
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /admin/simulations:
    get:
      summary: List simulations for admin/portal
      responses:
        '200':
          description: OK
    post:
      summary: Create or update simulation
      responses:
        '200':
          description: OK
    delete:
      summary: Delete simulation
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SCI_SIM_SESSID
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
