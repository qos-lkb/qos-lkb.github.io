<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="">
    <script>window.__SITE_BASE__=(function(){var p=location.pathname,i=p.indexOf('/app');return i>=0?p.slice(0,i):'';})();</script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-src 'self';">
    <title>科學模擬實驗平台 | Science Simulations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-indigo-50/30 font-sans text-slate-900 min-h-screen flex flex-col antialiased">

    <header class="fixed w-full z-50 top-0 bg-gradient-to-r from-indigo-950 via-indigo-900 to-violet-900 text-white shadow-lg border-b border-white/10">
        <div class="flex items-center h-16 px-4 sm:px-6 lg:px-8 justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <button type="button" id="btn-sidebar" class="md:hidden p-2 rounded-lg hover:bg-white/10" aria-label="選單">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <a href="." class="font-bold text-base sm:text-lg truncate">科學模擬實驗平台</a>
            </div>
            <nav class="flex items-center gap-1 sm:gap-2 text-xs sm:text-sm flex-shrink-0">
                <button type="button" class="nav-tab active px-2 py-1 rounded-lg" data-tab="simulations">模擬</button>
                <button type="button" class="nav-tab px-2 py-1 rounded-lg text-indigo-200" data-tab="learning">學習工具</button>
                <button type="button" class="nav-tab px-2 py-1 rounded-lg text-indigo-200" data-tab="articles">文章</button>
            </nav>
            <div class="flex items-center gap-2 flex-shrink-0">
                <div id="auth-nav"></div>
                <button type="button" id="btn-lang" class="px-2 py-1 rounded-full bg-white/10 border border-white/20 text-xs">中 / EN</button>
            </div>
        </div>
    </header>

    <div id="overlay" class="fixed inset-0 bg-slate-900/60 z-30 md:hidden"></div>

    <div class="app-shell pt-16 flex-1">
        <aside id="sidebar" class="bg-slate-900/95 text-slate-300 border-r border-slate-700/60">
            <div class="px-4 pt-4 pb-2 text-[10px] font-bold text-slate-500 tracking-widest uppercase">科目 Subjects</div>
            <nav id="main-nav" class="px-2 pb-8 space-y-0.5"></nav>
        </aside>

        <main id="main-content" class="flex-1 py-4 md:py-8 px-3 sm:px-6 lg:px-10">
            <div class="max-w-6xl mx-auto w-full">
                <div class="mb-6 pb-6 border-b border-slate-200/80">
                    <h1 id="page-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900">載入中…</h1>
                </div>
                <div id="card-container" class="space-y-4">
                    <p class="text-slate-500">載入目錄中…</p>
                </div>
            </div>
        </main>
    </div>

    <footer class="bg-slate-900 text-slate-400 text-xs py-4 px-6 text-center border-t border-slate-800">
        <span>版權 © Mr. Bryan Leung · </span>
        <a href="https://creativecommons.org/licenses/by/4.0/" class="text-blue-400 hover:underline" target="_blank" rel="noopener">CC BY 4.0</a>
    </footer>

    <div id="sim-modal">
        <button type="button" id="sim-modal-fullscreen" class="sim-modal-tool-btn" aria-label="全螢幕" title="顯示成全螢幕">
            <svg id="sim-modal-fullscreen-expand" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
            </svg>
            <svg id="sim-modal-fullscreen-compress" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"></path>
            </svg>
        </button>
        <button type="button" id="sim-modal-close" class="sim-modal-tool-btn" aria-label="關閉" title="關閉">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <button type="button" id="sim-modal-capture" class="sim-modal-tool-btn" aria-label="截圖" title="截圖並下載為 PNG" disabled>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </button>
        <div id="sim-modal-content">
            <iframe id="sim-modal-iframe" title="模擬內容" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-same-origin"></iframe>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/router.js"></script>
    <script src="assets/js/modal-capture.js"></script>
    <script src="assets/js/catalog.js"></script>
    <script src="assets/js/quiz.js"></script>
    <script src="assets/js/article.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
