/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

        function calculate() {
            state.v = parseFloat(inputs.speed.value);
            state.r = parseFloat(inputs.length.value);
            state.rho = parseFloat(inputs.density.value);
            state.eta = parseFloat(inputs.efficiency.value);

            displays.speed.textContent = state.v.toFixed(1);
            displays.length.textContent = state.r.toFixed(1);
            displays.density.textContent = state.rho.toFixed(3);
            displays.efficiency.textContent = state.eta.toFixed(0);

            const area = PI * Math.pow(state.r, 2);
            const etaDecimal = state.eta / 100;
            const rawWindPower = 0.5 * state.rho * area * Math.pow(state.v, 3);
            const outputPower = rawWindPower * etaDecimal;

            displays.area.textContent = area.toFixed(1);
            displays.windPower.textContent = formatPower(rawWindPower);
            displays.output.textContent = formatPower(outputPower);
        }

        function formatPower(watts) {
            if (watts >= 1000000) {
                return (watts / 1000000).toFixed(2) + ' MW';
            } else if (watts >= 1000) {
                return (watts / 1000).toFixed(2) + ' kW';
            } else {
                return watts.toFixed(1) + ' W';
            }
        }

        function resetSimulation() {
            inputs.speed.value = String(DEFAULTS.v);
            inputs.length.value = String(DEFAULTS.r);
            inputs.density.value = String(DEFAULTS.rho);
            inputs.efficiency.value = String(DEFAULTS.eta);
            state.v = DEFAULTS.v;
            state.r = DEFAULTS.r;
            state.rho = DEFAULTS.rho;
            state.eta = DEFAULTS.eta;
            state.angle = 0;
            calculate();
        }

        function initParticles() {
            state.particles = [];
            for (let i = 0; i < 50; i++) {
                state.particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    len: Math.random() * 20 + 10,
                    speedOffset: Math.random() * 0.5 + 0.8
                });
            }
        }

        function resizeCanvas() {
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function draw() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width * 0.6;
            const centerY = canvas.height * 0.6;
            const scaleFactor = (canvas.height * 0.4) / 30;
            const visualRadius = state.r * scaleFactor;
            const hubRadius = visualRadius * 0.1 > 5 ? visualRadius * 0.1 : 5;

            ctx.strokeStyle = 'rgba(167, 243, 208, ' + (state.rho - 0.8) + ')';
            ctx.lineWidth = 1;
            const particleSpeed = state.v * 0.5;

            state.particles.forEach(function (p) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + p.len, p.y);
                ctx.stroke();
                p.x += particleSpeed * p.speedOffset;
                if (p.x > canvas.width) {
                    p.x = -50;
                    p.y = Math.random() * canvas.height;
                }
            });

            const towerWidthTop = hubRadius * 1.5;
            const towerWidthBottom = hubRadius * 3;
            const gradTower = ctx.createLinearGradient(centerX - 20, 0, centerX + 20, 0);
            gradTower.addColorStop(0, '#334155');
            gradTower.addColorStop(0.5, '#64748b');
            gradTower.addColorStop(1, '#334155');
            ctx.fillStyle = gradTower;
            ctx.beginPath();
            ctx.moveTo(centerX - towerWidthTop / 2, centerY);
            ctx.lineTo(centerX + towerWidthTop / 2, centerY);
            ctx.lineTo(centerX + towerWidthBottom / 2, canvas.height);
            ctx.lineTo(centerX - towerWidthBottom / 2, canvas.height);
            ctx.closePath();
            ctx.fill();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(state.angle);
            ctx.fillStyle = '#f1f5f9';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(hubRadius, 0, hubRadius, -hubRadius / 2);
                ctx.lineTo(visualRadius, -hubRadius / 4);
                ctx.lineTo(visualRadius, hubRadius / 4);
                ctx.quadraticCurveTo(hubRadius, hubRadius / 2, 0, 0);
                ctx.fill();
                ctx.rotate((2 * Math.PI) / 3);
            }
            ctx.shadowBlur = 0;
            ctx.restore();

            ctx.beginPath();
            ctx.arc(centerX, centerY, hubRadius, 0, Math.PI * 2);
            const gradHub = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, hubRadius);
            gradHub.addColorStop(0, '#e2e8f0');
            gradHub.addColorStop(1, '#94a3b8');
            ctx.fillStyle = gradHub;
            ctx.fill();

            if (state.v > 0) {
                const angularVelocity = (state.v * 0.05) / (Math.sqrt(state.r) * 0.3);
                state.angle += angularVelocity;
            }

            requestAnimationFrame(draw);
        }

                const ans = quizAnswersVisible ? '<div class="mt-2 text-xs text-emerald-300 bg-emerald-950/40 border border-emerald-800/40 rounded-lg p-2"><strong>' + ref + '：</strong> ' + q.answer[lang] + '</div>' : '';
                return '<div class="quiz-item mb-4"><p class="q-stem font-semibold mb-2"><span class="text-violet-300">Q' + n + '.</span> ' + q.stem[lang] + '</p>' + opts + ans + '</div>';

            const ansBtn = document.getElementById('btn-quiz-answers');

            typeset([body]);

        function applyLanguage() {
            const t = i18n[state.lang];
            document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : 'en';
            document.querySelectorAll('[data-i18n]').forEach(function (el) {

            });
            document.title = state.lang === 'zh'

        function closeAllModals(exceptId) {
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
                if (exceptId && id === exceptId) return;
                const modal = document.getElementById(id);
                if (modal) modal.classList.add('hidden');
            });
        }

        function openModal(id) {
            closeAllModals(id);
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('hidden');
            if (id === 'modal-steps') renderSteps();
            if (id === 'modal-principle') renderPrinciple();
            if (id === 'modal-quiz') renderQuiz();
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('hidden');

            input.addEventListener('input', calculate);

            if (e.key === 'Escape') closeAllModals();
