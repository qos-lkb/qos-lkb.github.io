<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTTV 建築物理模擬 (3D) / OTTV Physics Simulation (3D)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid currentColor;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 4px;
        }
        #input-wwr::-webkit-slider-thumb { border-color: #2563eb; }
        #input-sc::-webkit-slider-thumb { border-color: #06b6d4; }
        #input-ug::-webkit-slider-thumb { border-color: #ef4444; }
        #input-uw::-webkit-slider-thumb { border-color: #78716c; }
        #canvas-container { width: 100%; height: 100%; outline: none; }
        canvas { outline: none; }
        .teach-btn {
            font-size: 0.75rem; font-weight: 700; padding: 0.4rem 0.7rem; border-radius: 0.5rem;
            border: 1px solid; transition: background-color 0.15s, color 0.15s;
        }
        .step-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1rem; margin-bottom: 0.75rem; }
        .quiz-item { margin-bottom: 1.25rem; padding: 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; }
        .quiz-item .q-stem { font-weight: 600; color: #1e293b; margin-bottom: 0.75rem; }
        .quiz-options { display: flex; flex-direction: column; gap: 0.5rem; }
        .quiz-options button {
            text-align: left; padding: 0.5rem 0.75rem; border-radius: 0.5rem;
            border: 1px solid #cbd5e1; background: #fff; font-size: 0.875rem; color: #334155; transition: all 0.15s;
        }
        .quiz-options button:hover { border-color: #6366f1; background: #eef2ff; }
        .quiz-options button.selected { border-color: #6366f1; background: #e0e7ff; }
        .quiz-options button.correct { border-color: #16a34a; background: #dcfce7; }
        .quiz-options button.wrong { border-color: #dc2626; background: #fee2e2; }
        .quiz-answer { display: none; margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: #f1f5f9; border-radius: 0.5rem; font-size: 0.85rem; color: #475569; }
        .quiz-answer.show { display: block; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex flex-col overflow-hidden">

    <nav class="bg-slate-900 text-white p-3 shadow-lg flex-none z-30">
        <div class="container mx-auto flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3 min-w-0">
                <div class="bg-yellow-500 text-slate-900 font-bold rounded-full w-8 h-8 flex items-center justify-center shrink-0">Ph</div>
                <h1 class="text-base md:text-xl font-bold tracking-wide truncate" id="app-title">OTTV 建築物理模擬 (3D)</h1>
            </div>
            <div class="flex flex-wrap gap-1.5 sm:gap-2 items-center justify-end">
                <button type="button" id="btn-steps" class="teach-btn border-indigo-400 bg-slate-700 text-indigo-200 hover:bg-slate-600">觀察步驟</button>
                <button type="button" id="btn-principle" class="teach-btn border-yellow-400 bg-slate-700 text-yellow-200 hover:bg-slate-600">原理解說</button>
                <button type="button" id="btn-quiz" class="teach-btn border-violet-400 bg-slate-700 text-violet-200 hover:bg-slate-600">課堂問題</button>
                <span class="hidden sm:inline text-slate-500 mx-0.5">|</span>
                <button type="button" id="btn-lang" class="teach-btn border-blue-400 bg-blue-600 text-white hover:bg-blue-500 font-medium">中 / EN</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-hidden h-full">

        <div class="lg:col-span-1 flex flex-col gap-4 h-full overflow-hidden pr-1 pb-1 order-2">
            <div class="bg-white p-5 rounded-xl shadow-md border border-slate-200 flex-shrink-0 overflow-y-auto max-h-[50vh]">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 border-b pb-2" id="controls-title">變數控制</h3>
                <div class="flex flex-col gap-6">
                    <div class="relative">
                        <div class="flex justify-between mb-2">
                            <label class="font-bold text-slate-700 text-sm flex items-center whitespace-nowrap">
                                <span class="w-3 h-3 rounded-full bg-blue-500 mr-2"></span>
                                <span id="label-wwr">窗牆比例 (WWR)</span>
                            </label>
                            <span id="val-wwr" class="font-mono font-bold text-blue-600 text-lg">30%</span>
                        </div>
                        <input type="range" id="input-wwr" min="10" max="90" value="30" step="5" class="accent-blue-600">
                    </div>
                    <div class="relative">
                        <div class="flex justify-between mb-2">
                            <label class="font-bold text-slate-700 text-sm flex items-center whitespace-nowrap">
                                <span class="w-3 h-3 rounded-full bg-cyan-400 mr-2"></span>
                                <span id="label-sc">遮蔽係數 (SC)</span>
                            </label>
                            <span id="val-sc" class="font-mono font-bold text-cyan-600 text-lg">0.7</span>
                        </div>
                        <input type="range" id="input-sc" min="0.1" max="1.0" value="0.7" step="0.1" class="accent-cyan-500">
                        <p class="text-[10px] text-gray-400 mt-1 text-right" id="hint-sc">1.0 = 透明, 0.1 = 全遮光</p>
                    </div>
                    <div class="relative">
                        <div class="flex justify-between mb-2">
                            <label class="font-bold text-slate-700 text-sm flex items-center whitespace-nowrap">
                                <span class="w-3 h-3 rounded-full bg-red-400 mr-2"></span>
                                <span id="label-ug">玻璃 U-Value ($U_g$)</span>
                            </label>
                            <span id="val-ug" class="font-mono font-bold text-red-600 text-lg">5.0</span>
                        </div>
                        <input type="range" id="input-ug" min="1.0" max="6.0" value="5.0" step="0.5" class="accent-red-500">
                        <p class="text-[10px] text-gray-400 mt-1 text-right" id="hint-ug">單位: $W/m^2K$ (低 = 隔熱好)</p>
                    </div>
                    <div class="relative">
                        <div class="flex justify-between mb-2">
                            <label class="font-bold text-slate-700 text-sm flex items-center whitespace-nowrap">
                                <span class="w-3 h-3 rounded-full bg-stone-500 mr-2"></span>
                                <span id="label-uw">牆體 U-Value ($U_w$)</span>
                            </label>
                            <span id="val-uw" class="font-mono font-bold text-stone-600 text-lg">2.0</span>
                        </div>
                        <input type="range" id="input-uw" min="0.5" max="3.5" value="2.0" step="0.5" class="accent-stone-500">
                        <p class="text-[10px] text-gray-400 mt-1 text-right" id="hint-uw">單位: $W/m^2K$</p>
                    </div>
                </div>
                <button type="button" id="btn-reset" class="mt-5 w-full py-2 rounded-lg text-sm font-bold border border-red-200 text-red-600 hover:bg-red-50 hover:border-red-300 transition">
                    <span id="btn-reset-label">重置</span>
                </button>
            </div>

            <div class="flex flex-col bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden flex-grow min-h-0">
                <div class="bg-slate-800 text-slate-100 p-4 border-b border-slate-700 flex-none">
                    <h2 class="text-md font-bold flex items-center justify-between">
                        <div class="flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                            <span id="calc-title">實時計算</span>
                        </div>
                        <div class="text-right">
                            <span id="result-ottv" class="text-2xl font-mono font-bold text-green-400">0.00</span>
                            <span class="text-xs text-green-500 ml-1">W/m²</span>
                        </div>
                    </h2>
                </div>
                <div class="p-4 overflow-y-auto space-y-4 bg-slate-50 flex-grow">
                    <div class="bg-white p-3 rounded border border-stone-200 shadow-sm">
                        <h4 class="text-xs font-bold text-stone-500 uppercase mb-1 flex justify-between">
                            <span id="title-wall-heat">1. 牆體傳熱</span>
                            <span class="text-stone-700 font-mono" id="res-qw"></span>
                        </h4>
                        <div class="text-sm text-stone-800 overflow-x-hidden">
                            <div id="math-wall" class="text-xs text-stone-600 font-mono"></div>
                        </div>
                    </div>
                    <div class="bg-white p-3 rounded border border-blue-200 shadow-sm">
                        <h4 class="text-xs font-bold text-blue-500 uppercase mb-1 flex justify-between">
                            <span id="title-glass-heat">2. 玻璃傳熱</span>
                            <span class="text-blue-700 font-mono" id="res-qg"></span>
                        </h4>
                        <div class="text-sm text-blue-800 overflow-x-hidden">
                            <div id="math-glass" class="text-xs text-blue-600 font-mono"></div>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-dashed border-gray-300">
                        <div id="math-total" class="text-sm font-bold text-center text-slate-700"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 flex flex-col h-full overflow-hidden order-1">
            <div class="bg-slate-900 rounded-xl shadow-lg border border-slate-700 h-full flex flex-col relative overflow-hidden group">
                <div class="absolute top-4 left-4 z-10">
                    <div class="bg-white/90 backdrop-blur px-3 py-1.5 rounded shadow-sm text-xs font-mono text-slate-700 border border-white/20">
                        <span id="env-info">TD<sub>eq</sub>: 12K | ΔT: 8K | SF: 160</span>
                    </div>
                </div>
                <div id="canvas-container" class="cursor-move"></div>
                <div class="absolute bottom-4 right-4 z-10 pointer-events-none opacity-50 group-hover:opacity-100 transition-opacity">
                    <span id="orbit-hint" class="bg-black/60 text-white text-[10px] px-2 py-1 rounded">拖曳旋轉｜滾輪縮放</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Steps modal -->
    <div id="modal-steps" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="steps-title">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 class="text-xl font-bold text-slate-800" id="steps-title">觀察步驟</h3>
                    <button type="button" class="text-gray-400 hover:text-red-500 text-2xl font-bold leading-none" data-close-modal="modal-steps" aria-label="Close">&times;</button>
                </div>
                <div id="steps-body" class="text-gray-700 text-sm leading-relaxed"></div>
                <div class="mt-4 flex justify-end">
                    <button type="button" class="px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition" data-close-modal="modal-steps" id="btn-steps-close">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Principle modal -->
    <div id="modal-principle" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="principle-title">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 class="text-xl font-bold text-slate-800" id="principle-title">原理解說</h3>
                    <button type="button" class="text-gray-400 hover:text-red-500 text-2xl font-bold leading-none" data-close-modal="modal-principle" aria-label="Close">&times;</button>
                </div>
                <div id="principle-body" class="space-y-4 text-gray-700 text-sm leading-relaxed"></div>
                <div class="mt-4 flex justify-end">
                    <button type="button" class="px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition" data-close-modal="modal-principle" id="btn-principle-close">明白</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz modal -->
    <div id="modal-quiz" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center border-b pb-3 mb-4 flex-wrap gap-2">
                    <h3 class="text-xl font-bold text-slate-800" id="quiz-title">課堂問題</h3>
                    <div class="flex items-center gap-2 ml-auto">
                        <button type="button" id="btn-quiz-answers" class="px-3 py-1.5 rounded-lg bg-violet-100 text-violet-800 border border-violet-300 text-xs font-semibold">顯示參考答案</button>
                        <button type="button" class="text-gray-400 hover:text-red-500 text-2xl font-bold leading-none" data-close-modal="modal-quiz" aria-label="Close">&times;</button>
                    </div>
                </div>
                <div id="quiz-body" class="text-gray-700 text-sm leading-relaxed"></div>
                <div class="mt-4 flex justify-end">
                    <button type="button" class="px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition" data-close-modal="modal-quiz" id="btn-quiz-close">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state = { wwr: 30, sc: 0.7, ug: 5.0, uw: 2.0 };
        const DEFAULTS = { wwr: 30, sc: 0.7, ug: 5.0, uw: 2.0 };
        const env = { TDeq: 12, DT: 8, SF: 160 };

        const els = {
            inputWwr: document.getElementById('input-wwr'),
            inputSc: document.getElementById('input-sc'),
            inputUg: document.getElementById('input-ug'),
            inputUw: document.getElementById('input-uw'),
            valWwr: document.getElementById('val-wwr'),
            valSc: document.getElementById('val-sc'),
            valUg: document.getElementById('val-ug'),
            valUw: document.getElementById('val-uw'),
            mathWall: document.getElementById('math-wall'),
            mathGlass: document.getElementById('math-glass'),
            mathTotal: document.getElementById('math-total'),
            resQw: document.getElementById('res-qw'),
            resQg: document.getElementById('res-qg'),
            resOttv: document.getElementById('result-ottv')
        };

        let scene, camera, renderer, controls;
        let buildingGroup, wallMesh, sunMesh;
        let windows = [];

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 10, 60);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(15, 12, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffaa00, 1.2);
            sunLight.position.set(20, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const planeGeometry = new THREE.PlaneGeometry(100, 100);
            const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -5;
            plane.receiveShadow = true;
            scene.add(plane);

            buildingGroup = new THREE.Group();
            scene.add(buildingGroup);

            const bWidth = 6, bHeight = 10, bDepth = 6;
            const wallGeo = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.9, metalness: 0.1 });
            wallMesh = new THREE.Mesh(wallGeo, wallMat);
            wallMesh.castShadow = true;
            wallMesh.receiveShadow = true;
            buildingGroup.add(wallMesh);

            const winMat = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8, metalness: 0.2, roughness: 0.1,
                transparent: true, opacity: 0.6, transmission: 0.6, side: THREE.DoubleSide
            });
            const winGeo = new THREE.PlaneGeometry(1, 1);
            const positions = [
                { x: 0, y: 0, z: bDepth / 2 + 0.05, rotY: 0 },
                { x: 0, y: 0, z: -bDepth / 2 - 0.05, rotY: Math.PI },
                { x: bWidth / 2 + 0.05, y: 0, z: 0, rotY: Math.PI / 2 },
                { x: -bWidth / 2 - 0.05, y: 0, z: 0, rotY: -Math.PI / 2 }
            ];
            positions.forEach(function (pos) {
                const mesh = new THREE.Mesh(winGeo, winMat);
                mesh.position.set(pos.x, pos.y, pos.z);
                mesh.rotation.y = pos.rotY;
                buildingGroup.add(mesh);
                windows.push(mesh);
            });

            const sunGeo = new THREE.SphereGeometry(2, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
            sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.copy(sunLight.position);
            scene.add(sunMesh);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container || !camera || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        function update() {
            state.wwr = parseInt(els.inputWwr.value, 10);
            state.sc = parseFloat(els.inputSc.value);
            state.ug = parseFloat(els.inputUg.value);
            state.uw = parseFloat(els.inputUw.value);

            els.valWwr.innerText = state.wwr + '%';
            els.valSc.innerText = state.sc.toFixed(1);
            els.valUg.innerText = state.ug.toFixed(1);
            els.valUw.innerText = state.uw.toFixed(1);

            if (windows.length > 0) {
                const bWidth = 6, bHeight = 10;
                const faceArea = bWidth * bHeight;
                const winArea = faceArea * (state.wwr / 100);
                let h = Math.sqrt(winArea / (bWidth / bHeight));
                let w = h * (bWidth / bHeight);
                const margin = 0.2;
                if (h > bHeight - margin) { h = bHeight - margin; w = winArea / h; }
                if (w > bWidth - margin) { w = bWidth - margin; h = winArea / w; }

                windows.forEach(function (win) {
                    win.scale.set(w, h, 1);
                    const opacity = 1.0 - (state.sc * 0.7);
                    win.material.opacity = opacity;
                    const lightBlue = new THREE.Color(0x38bdf8);
                    const darkBlue = new THREE.Color(0x021f30);
                    win.material.color.lerpColors(darkBlue, lightBlue, state.sc);
                    win.material.roughness = state.sc * 0.3;
                });
            }

            const wwrRatio = state.wwr / 100;
            const wallPart = (1 - wwrRatio);
            const Qw = env.TDeq * state.uw;
            const Qg_cond = env.DT * state.ug;
            const Qg_solar = env.SF * state.sc;
            const Qg = Qg_cond + Qg_solar;
            const OTTV = (wallPart * Qw) + (wwrRatio * Qg);

            els.resQw.innerText = Qw.toFixed(1);
            els.resQg.innerText = Qg.toFixed(1);
            els.resOttv.innerText = OTTV.toFixed(2);

            els.mathWall.innerHTML = '$$\\begin{aligned} Q_{w} &= ' + env.TDeq + ' \\times ' + state.uw + ' = ' + Qw.toFixed(1) + ' \\\\ Contribution &= ' + (1 - wwrRatio).toFixed(2) + ' \\times ' + Qw.toFixed(1) + ' = \\mathbf{' + (wallPart * Qw).toFixed(1) + '} \\end{aligned}$$';
            els.mathGlass.innerHTML = '$$\\begin{aligned} Q_{g} &= (' + env.DT + ' \\times ' + state.ug + ') + (' + env.SF + ' \\times ' + state.sc + ') = ' + Qg.toFixed(1) + ' \\\\ Contribution &= ' + wwrRatio.toFixed(2) + ' \\times ' + Qg.toFixed(1) + ' = \\mathbf{' + (wwrRatio * Qg).toFixed(1) + '} \\end{aligned}$$';
            els.mathTotal.innerText = '$$ Total = ' + (wallPart * Qw).toFixed(1) + ' + ' + (wwrRatio * Qg).toFixed(1) + ' = ' + OTTV.toFixed(2) + ' \\; W/m^2 $$';

            if (window.MathJax && MathJax.typesetPromise) {

            });

            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
                const modal = document.getElementById(id);
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) closeModal(id);
                });
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(closeModal);
                }
            });
        }

        els.inputWwr.addEventListener('input', update);
        els.inputSc.addEventListener('input', update);
        els.inputUg.addEventListener('input', update);
        els.inputUw.addEventListener('input', update);

        window.addEventListener('load', function () {
            document.documentElement.lang = 'zh-Hant';
            wireModals();
            init3D();
            applyLanguage();
            setTimeout(onWindowResize, 100);
        });
    </script>
</body>
</html>
