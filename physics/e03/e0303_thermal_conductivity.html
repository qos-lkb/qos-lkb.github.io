<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱傳導實驗室 | Conduction Lab</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <!-- Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- MathJax tex-mml-chtml (keep; no KaTeX; no tex-svg) -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Three.js Imports -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/"
        }
      }
    </script>

    <style>
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #60a5fa;
            margin-top: -6px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            background: #4b5563;
            border-radius: 2px;
        }
        input[type=range]:focus { outline: none; }
        .math-container {
            font-size: 1.2em;
            overflow-x: auto;
            padding: 10px;
        }
        .teach-btn {
            font-size: 0.75rem; font-weight: 700; padding: 0.4rem 0.75rem; border-radius: 0.5rem;
            border: 1px solid; transition: background-color 0.15s, color 0.15s;
        }
        .step-card {
            background: #1f2937; border: 1px solid #374151; border-radius: 0.75rem;
            padding: 1rem; margin-bottom: 0.75rem;
        }
        .quiz-item {
            margin-bottom: 1.25rem; padding: 1rem; background: #1f2937;
            border: 1px solid #374151; border-radius: 0.75rem;
        }
        .quiz-item .q-stem { font-weight: 600; color: #f3f4f6; margin-bottom: 0.75rem; }
        .quiz-options { display: flex; flex-direction: column; gap: 0.5rem; }
        .quiz-options button {
            text-align: left; padding: 0.5rem 0.75rem; border-radius: 0.5rem;
            border: 1px solid #4b5563; background: #111827; font-size: 0.875rem;
            color: #d1d5db; transition: all 0.15s;
        }
        .quiz-options button:hover { border-color: #6366f1; background: #1e1b4b; }
        .quiz-options button.selected { border-color: #6366f1; background: #312e81; }
        .quiz-options button.correct { border-color: #16a34a; background: #14532d; }
        .quiz-options button.wrong { border-color: #dc2626; background: #7f1d1d; }
        .quiz-answer {
            display: none; margin-top: 0.5rem; padding: 0.5rem 0.75rem;
            background: #111827; border-radius: 0.5rem; font-size: 0.85rem; color: #9ca3af;
        }
        .quiz-answer.show { display: block; }
        .short-answer-box {
            width: 100%; min-height: 4rem; margin-top: 0.5rem; padding: 0.5rem 0.75rem;
            border-radius: 0.5rem; border: 1px solid #4b5563; background: #111827;
            color: #e5e7eb; font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="min-h-16 bg-gray-800 border-b border-gray-700 flex flex-wrap items-center justify-between gap-2 px-4 sm:px-6 py-2 shadow-md z-20">
        <div class="flex items-center gap-3 min-w-0">
            <div class="bg-blue-600 p-2 rounded text-white shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
            </div>
            <div class="min-w-0">
                <span class="inline-block text-[10px] font-bold uppercase tracking-wider bg-blue-900/60 text-blue-300 px-2 py-0.5 rounded mb-0.5" data-i18n="badge">物理</span>
                <h1 class="text-lg sm:text-xl font-bold tracking-wider truncate" data-i18n="title">熱傳導實驗室</h1>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
            <button type="button" id="btn-steps" class="teach-btn border-indigo-400 bg-gray-700 text-indigo-200 hover:bg-gray-600" data-i18n="btnSteps">觀察步驟</button>
            <button type="button" id="btn-principle" class="teach-btn border-yellow-400 bg-gray-700 text-yellow-200 hover:bg-gray-600" data-i18n="btnPrinciple">原理解說</button>
            <button type="button" id="btn-quiz" class="teach-btn border-violet-400 bg-gray-700 text-violet-200 hover:bg-gray-600" data-i18n="btnQuiz">課堂問題</button>
            <span class="hidden sm:inline text-gray-500 mx-0.5">|</span>
            <button type="button" id="btn-lang" class="teach-btn border-blue-400 bg-blue-600 text-white hover:bg-blue-500 font-medium">中 / EN</button>
        </div>
    </header>

    <!-- Main Content: Scheme C -->
    <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">

        <!-- Viz first in DOM for order-1 on narrow -->
        <main class="flex-1 relative bg-black order-1 min-h-[45vh] lg:min-h-0">
            <div id="canvas-container" class="w-full h-full cursor-move"></div>

            <div class="absolute top-4 left-4 bg-black/60 backdrop-blur border border-red-500/30 px-3 py-1 rounded text-xs text-red-400 pointer-events-none select-none">
                <span data-i18n="labelHot">熱源 (高溫)</span>
            </div>
            <div class="absolute top-4 right-4 bg-black/60 backdrop-blur border border-blue-500/30 px-3 py-1 rounded text-xs text-blue-400 pointer-events-none select-none">
                <span data-i18n="labelCold">冷端 (低溫)</span>
            </div>
            <div class="absolute bottom-4 right-4 text-gray-600 text-xs pointer-events-none select-none" data-i18n="poweredBy">
                Powered by Three.js &amp; MathJax
            </div>
            <div class="absolute bottom-4 left-4 text-gray-500 text-[10px] pointer-events-none select-none opacity-70" data-i18n="orbitHint">
                拖曳旋轉｜滾輪縮放
            </div>
        </main>

        <!-- Controls: Scheme C aside -->
        <aside class="w-full lg:w-[300px] xl:w-[320px] shrink-0 order-2 bg-gray-800 border-t lg:border-t-0 lg:border-l border-gray-700 flex flex-col p-5 z-10 overflow-y-auto shadow-xl max-h-[50vh] lg:max-h-none">
            <h2 class="text-blue-400 font-semibold mb-4 uppercase text-xs tracking-widest border-b border-gray-700 pb-2" data-i18n="controlsHeader">實驗參數</h2>

            <div class="mb-6">
                <div class="flex justify-between items-end mb-2">
                    <label class="text-sm text-gray-300" data-i18n="labelArea">截面面積 (A)</label>
                    <span class="text-blue-400 font-mono text-sm"><span id="val-area">1.0</span> m²</span>
                </div>
                <input type="range" id="input-area" min="0.1" max="5.0" step="0.1" value="1.0">
            </div>

            <div class="mb-6">
                <div class="flex justify-between items-end mb-2">
                    <label class="text-sm text-gray-300" data-i18n="labelThickness">厚度 (d)</label>
                    <span class="text-blue-400 font-mono text-sm"><span id="val-thickness">2.0</span> m</span>
                </div>
                <input type="range" id="input-thickness" min="0.5" max="10.0" step="0.5" value="2.0">
            </div>

            <div class="mb-6">
                <div class="flex justify-between items-end mb-2">
                    <label class="text-sm text-gray-300" data-i18n="labelKappa">導熱率 (κ)</label>
                    <span class="text-blue-400 font-mono text-sm"><span id="val-kappa">50</span> W/m·K</span>
                </div>
                <input type="range" id="input-kappa" min="10" max="400" step="10" value="50">
                <div class="text-xs text-gray-500 mt-1 italic" id="material-hint">近似材質：鋼</div>
            </div>

            <div class="mb-6">
                <div class="flex justify-between items-end mb-2">
                    <label class="text-sm text-gray-300" data-i18n="labelDt">溫差 (ΔT)</label>
                    <span class="text-red-400 font-mono text-sm"><span id="val-dt">100</span> K</span>
                </div>
                <input type="range" id="input-dt" min="0" max="500" step="10" value="100">
                <div class="flex justify-between text-xs text-gray-500 mt-1">
                    <span data-i18n="labelLow">低</span>
                    <span data-i18n="labelHigh">高</span>
                </div>
            </div>

            <button type="button" id="btn-reset" class="mb-4 w-full py-2 rounded-lg text-sm font-bold border border-red-500/50 text-red-300 hover:bg-red-900/40 hover:border-red-400 transition">
                <span data-i18n="btnReset">重置</span>
            </button>

            <div class="mt-auto bg-gray-900/50 p-4 rounded-lg border border-gray-600">
                <div class="text-xs text-gray-400 mb-1 uppercase tracking-wider" data-i18n="labelResult">熱流速率 (P)</div>
                <div class="flex items-baseline gap-2">
                    <span id="result-p" class="text-3xl font-bold text-green-400">2500.00</span>
                    <span class="text-sm text-gray-500" data-i18n="labelWatts">瓦特 (J/s)</span>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modal: Steps -->
    <div id="modal-steps" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="steps-title">
        <div class="bg-gray-800 border border-gray-600 rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" data-modal-panel>
            <div class="flex justify-between items-center p-5 border-b border-gray-700">
                <h3 class="text-xl font-bold text-white" id="steps-title" data-i18n="stepsTitle">觀察步驟</h3>
                <button type="button" class="text-gray-400 hover:text-white text-2xl leading-none" data-close-modal="modal-steps" aria-label="Close">&times;</button>
            </div>
            <div id="steps-body" class="p-5 text-sm text-gray-300 leading-relaxed"></div>
            <div class="px-5 pb-5 flex justify-end">
                <button type="button" class="px-5 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm" data-close-modal="modal-steps" data-i18n="btnClose">關閉</button>
            </div>
        </div>
    </div>

    <!-- Modal: Principle -->
    <div id="modal-principle" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="principle-title">
        <div class="bg-gray-800 border border-gray-600 rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" data-modal-panel>
            <div class="flex justify-between items-center p-5 border-b border-gray-700">
                <h3 class="text-xl font-bold text-white" id="principle-title" data-i18n="principleTitle">原理解說</h3>
                <button type="button" class="text-gray-400 hover:text-white text-2xl leading-none" data-close-modal="modal-principle" aria-label="Close">&times;</button>
            </div>
            <div id="principle-body" class="p-5 text-sm text-gray-300 leading-relaxed space-y-4"></div>
            <div class="px-5 pb-5 flex justify-end">
                <button type="button" class="px-5 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm" data-close-modal="modal-principle" data-i18n="btnGotIt">明白</button>
            </div>
        </div>
    </div>

    <!-- Modal: Quiz -->
    <div id="modal-quiz" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
        <div class="bg-gray-800 border border-gray-600 rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" data-modal-panel>
            <div class="flex justify-between items-center p-5 border-b border-gray-700 flex-wrap gap-2">
                <h3 class="text-xl font-bold text-white" id="quiz-title" data-i18n="quizTitle">課堂問題</h3>
                <div class="flex items-center gap-2 ml-auto">
                    <button type="button" id="btn-quiz-answers" class="px-3 py-1.5 rounded-lg bg-violet-600/30 text-violet-200 border border-violet-500/40 text-xs font-semibold" data-i18n="btnShowAnswer">顯示參考答案</button>
                    <button type="button" class="text-gray-400 hover:text-white text-2xl leading-none" data-close-modal="modal-quiz" aria-label="Close">&times;</button>
                </div>
            </div>
            <div id="quiz-body" class="p-5 text-sm text-gray-300 leading-relaxed"></div>
            <div class="px-5 pb-5 flex justify-end">
                <button type="button" class="px-5 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm" data-close-modal="modal-quiz" data-i18n="btnClose">關閉</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const DEFAULTS = { area: 1.0, thickness: 2.0, kappa: 50, dt: 100 };

        let quizAnswersVisible = false;

        const state = {
            area: 1.0,
            thickness: 2.0,
            kappa: 50,
            dt: 100,
            lang: 'zh'
        };

        const materials = {
            10: { en: "Insulator / Glass", zh: "絕緣體 / 玻璃" },
            50: { en: "Steel", zh: "鋼" },
            100: { en: "Iron", zh: "鐵" },
            200: { en: "Aluminum", zh: "鋁" },
            300: { en: "Gold", zh: "金" },
            400: { en: "Copper / Silver", zh: "銅 / 銀" }
        };

        const STEPS = {
            zh: [
                '確認預設約 <strong>$A=1.0\\,\\mathrm{m}^2$</strong>、$d=2.0\\,\\mathrm{m}$、$\\kappa=50$（近似鋼）、$\\Delta T=100\\,\\mathrm{K}$。記下左側 <strong>熱流速率 $P$</strong>（應約 $2500\\,\\mathrm{W}$）。把 <strong>截面積 $A$</strong> 明顯調大：3D 截面應變粗，$P$ 應近似成比例上升。把 $A$ 調小則相反。',
                '保持其他不變，把 <strong>厚度 $d$</strong> 調大：金屬塊沿熱→冷方向變長；$P$ 應下降（反比於 $d$）。再把 $d$ 調小，確認 $P$ 回升。對照公式中的 $1/d$。',
                '掃動 <strong>導熱率 $\\kappa$</strong>：觀察 $P$ 隨 $\\kappa$ 上升，並讀材質提示（低 κ≈玻璃／絕緣，高 κ≈銅／銀）。再把 <strong>$\\Delta T$</strong> 拉到 0：確認 $P=0$ 且黃色熱流箭頭消失；再提高 $\\Delta T$ 使箭頭重現、$P$ 上升。',
                '按<strong>重置</strong>：四個滑桿與 $P$／3D 幾何／箭頭應回預設；<strong>語言不變</strong>。打開原理解說與課堂問題：對照 $P=\\kappa A\\Delta T/d$ 與本模擬假設（一維穩態、忽略側向散熱／對流輻射並聯；<strong>非</strong>晶格粒子微觀模型、<strong>非</strong> OTTV 建築指標）。'
            ],
            en: [
                'Note defaults ~<strong>$A=1.0\\,\\mathrm{m}^2$</strong>, $d=2.0\\,\\mathrm{m}$, $\\kappa=50$ (≈steel), $\\Delta T=100\\,\\mathrm{K}$. Record <strong>$P$</strong> (~$2500\\,\\mathrm{W}$). Raise <strong>area $A$</strong>: the cross-section thickens and $P$ rises roughly in proportion. Lower $A$ for the reverse.',
                'Keep other inputs fixed; raise <strong>thickness $d$</strong>: the block lengthens hot→cold and $P$ falls (inversely with $d$). Lower $d$ and watch $P$ rise. Match the $1/d$ in the formula.',
                'Sweep <strong>$\\kappa$</strong>: $P$ rises with $\\kappa$; read the material hint (low κ≈insulator／glass, high κ≈copper／silver). Set <strong>$\\Delta T$</strong> to 0: $P=0$ and yellow arrows hide; raise $\\Delta T$ to restore arrows and $P$.',
                '<strong>Reset</strong>: sliders, $P$, and 3D geometry／arrows return to defaults; <strong>language unchanged</strong>. Open Principles and Quiz: match $P=\\kappa A\\Delta T/d$ and the idealizations (1D steady state; no side losses／parallel convection–radiation; <strong>not</strong> a lattice-particle micro-model and <strong>not</strong> building OTTV).'
            ]
        };

        const PRINCIPLE = {
            zh: {
                conceptTitle: '概念',
                concept: '<strong>熱傳導（thermal conduction）</strong> 是熱能在固體（或靜止流體）中，經由粒子振動／自由電子等機制，由高溫區傳到低溫區的過程。課堂巨觀層次用 <strong>傅立葉定律</strong> 描述通過截面的<strong>熱流速率</strong> $P$（單位時間傳送的熱能）。',
                mechTitle: '機制',
                mech: [
                    '<strong>公式</strong>：$P = \\dfrac{Q}{t} = \\kappa A \\dfrac{\\Delta T}{d}$。',
                    '<strong>$A$（截面積）</strong>：垂直於熱流方向的面積愈大，單位時間可傳的熱愈多 → $P\\propto A$。',
                    '<strong>$d$（厚度／長度）</strong>：熱路徑愈長，同樣溫差下梯度 $\\Delta T/d$ 愈小 → $P\\propto 1/d$。',
                    '<strong>$\\kappa$（導熱率）</strong>：物質屬性；金屬（銅、銀、鋁）通常遠高於玻璃、木材、氣隙保溫層。',
                    '<strong>$\\Delta T$</strong>：兩端溫差；無溫差則無淨熱流。',
                    '<strong>假設</strong>：均勻截面、一維穩態、忽略接觸熱阻與側向對流／輻射——示意用，<strong>非</strong>完整 3D 熱模擬；亦<strong>不是</strong>質量–彈簧晶格粒子動畫。'
                ],
                egTitle: '日常例子',
                eg: '金屬鍋柄比木柄燙手（$\\kappa$ 高）；厚棉被／雙層玻璃減熱流失（等效增大 $d$ 或降低有效 $\\kappa$）；散熱片加大面積加快導走熱量（$A$↑）。本模擬中拖曳旋轉 3D 塊只為觀察幾何，不改變公式常數。勿與「建築 OTTV 窗牆比」「黑瓶／銀瓶輻射」「晶格拖曳加熱粒子」混為同一操作目標。'
            },
            en: {
                conceptTitle: 'Concept',
                concept: '<strong>Thermal conduction</strong> transfers thermal energy through a solid (or still fluid) from hotter to cooler regions via vibrations／free electrons, etc. At the classroom macro level, <strong>Fourier\'s law</strong> gives the <strong>rate of heat flow</strong> $P$ through a cross-section.',
                mechTitle: 'Mechanism',
                mech: [
                    '<strong>Formula</strong>: $P = \\dfrac{Q}{t} = \\kappa A \\dfrac{\\Delta T}{d}$.',
                    '<strong>$A$ (area)</strong>: larger cross-section perpendicular to the flow → $P\\propto A$.',
                    '<strong>$d$ (thickness／length)</strong>: longer path → smaller gradient $\\Delta T/d$ → $P\\propto 1/d$.',
                    '<strong>$\\kappa$ (conductivity)</strong>: a material property; metals (Cu, Ag, Al) are typically much higher than glass, wood, or air gaps.',
                    '<strong>$\\Delta T$</strong>: end-to-end temperature difference; zero difference ⇒ no net flow.',
                    '<strong>Idealizations</strong>: uniform section, 1D steady state, ignore contact resistance and side convection／radiation—schematic only, <strong>not</strong> a full 3D thermal FEM; also <strong>not</strong> a mass–spring lattice-particle demo.'
                ],
                egTitle: 'Everyday example',
                eg: 'Metal pan handles feel hotter than wooden ones (high $\\kappa$); thick quilts／double glazing cut loss (larger effective $d$ or lower effective $\\kappa$); heat sinks enlarge area to dump heat faster ($A$↑). Orbiting the 3D block is for viewing only and does not change formula constants. Do not merge with building-OTTV WWR labs, black／silver radiation bottles, or lattice drag-to-heat particle labs as the same learning goal.'
            }
        };

        const QUIZ = [
            {
                type: 'mc',
                stem: {
                    zh: '在其他參數大致維持預設時，把 <strong>截面積 $A$</strong> 明顯調大。哪項最符合本模擬？',
                    en: 'With other inputs near defaults, raise <strong>area $A$</strong> clearly. Which best matches this sim?'
                },
                options: {
                    zh: [
                        '3D 截面變粗；$P$ 近似隨 $A$ 成比例上升',
                        '$A$ 只改變語言，永不影響 $P$',

            },
            {

            {

                        '主要用來計算建築窗牆比 WWR 與 OTTV',

                        '主要展示晶格彈簧粒子被滑鼠拖曳加熱後的動能擴散'
                    ],
                    en: [
                        'You can tune $A$／$d$／$\\kappa$／$\\Delta T$, watch $P$ and the 3D block／plates／arrows, with steps／principle／five quiz items／zh-EN／reset—this is macro Fourier conduction, not building OTTV, not vehicle energy conversion, nor lattice drag-heating or black／silver radiation bottles',

                },
                correct: 0,
                answer: {

                    en: 'A. Isolated from OTTV／cars／radiation-colour／lattice siblings; Reset does not change language or remove sliders.'

        ];

        const i18n = {
            zh: {
                title: "熱傳導實驗室",
                badge: "物理",
                btnSteps: "觀察步驟",
                btnPrinciple: "原理解說",
                btnQuiz: "課堂問題",
                btnReset: "重置",
                btnClose: "關閉",
                btnGotIt: "明白",
                btnShowAnswer: "顯示參考答案",
                btnHideAnswer: "隱藏參考答案",
                controlsHeader: "實驗參數",
                labelArea: "截面面積 (A)",
                labelThickness: "厚度 (d)",
                labelKappa: "導熱率 (κ)",
                labelDt: "溫差 (ΔT)",
                labelResult: "熱流速率 (P)",
                labelHot: "熱源 (高溫)",
                labelCold: "冷端 (低溫)",
                labelLow: "低",
                labelHigh: "高",
                labelWatts: "瓦特 (J/s)",
                poweredBy: "Powered by Three.js & MathJax",
                orbitHint: "拖曳旋轉｜滾輪縮放",
                stepsTitle: "觀察步驟",
                principleTitle: "原理解說",
                quizTitle: "課堂問題",
                stepLabel: "步驟",
                hintPre: "近似材質："
            },
            en: {
                title: "Conduction Lab",
                badge: "Physics",
                btnSteps: "Steps",
                btnPrinciple: "Principles",
                btnQuiz: "Quiz",
                btnReset: "Reset",
                btnClose: "Close",
                btnGotIt: "Got it",
                btnShowAnswer: "Show answer",
                btnHideAnswer: "Hide answer",
                controlsHeader: "Parameters",
                labelArea: "Area (A)",
                labelThickness: "Thickness (d)",
                labelKappa: "Conductivity (κ)",
                labelDt: "Temp. Diff (ΔT)",
                labelResult: "Rate of Heat Flow (P)",
                labelHot: "Heat Source",
                labelCold: "Cold Sink",
                labelLow: "Low",
                labelHigh: "High",
                labelWatts: "Watts (J/s)",
                poweredBy: "Powered by Three.js & MathJax",
                orbitHint: "Drag to orbit · scroll to zoom",
                stepsTitle: "Observation Steps",
                principleTitle: "Principles",
                quizTitle: "Quiz",
                stepLabel: "Step",
                hintPre: "Approx Material: "
            }
        };

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(4, 5, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff, 1);
        spotLight.position.set(5, 10, 5);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.1;
        spotLight.castShadow = true;
        scene.add(spotLight);

        const gridHelper = new THREE.GridHelper(20, 20, 0x333333, 0x111111);
        scene.add(gridHelper);

        const group = new THREE.Group();
        scene.add(group);

        const blockMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x888888,
            metalness: 0.7,
            roughness: 0.2,
            clearcoat: 0.5,
            clearcoatRoughness: 0.1
        });

        const hotMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000, emissive: 0xaa0000, emissiveIntensity: 0.5 });
        const coldMaterial = new THREE.MeshLambertMaterial({ color: 0x0000ff, emissive: 0x0000aa, emissiveIntensity: 0.2 });

        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        const plateGeo = new THREE.BoxGeometry(0.1, 1, 1);

        const mainBlock = new THREE.Mesh(blockGeo, blockMaterial);
        mainBlock.castShadow = true;
        mainBlock.receiveShadow = true;

        const hotPlate = new THREE.Mesh(plateGeo, hotMaterial);
        const coldPlate = new THREE.Mesh(plateGeo, coldMaterial);

        group.add(mainBlock);
        group.add(hotPlate);
        group.add(coldPlate);

        const arrowGroup = new THREE.Group();
        group.add(arrowGroup);

        function createArrows() {
            while (arrowGroup.children.length > 0) {
                arrowGroup.remove(arrowGroup.children[0]);
            }
            const dir = new THREE.Vector3(1, 0, 0);
            const len = 1;
            const col = 0xffff00;
            for (let i = 0; i < 2; i++) {
                const arrowHelper = new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, 0), len, col, 0.3, 0.2);
                arrowGroup.add(arrowHelper);
            }
        }
        createArrows();

        function updatePhysics() {
            const P = (state.kappa * state.area * state.dt) / state.thickness;

            document.getElementById('result-p').textContent = P.toFixed(2);
            document.getElementById('val-area').textContent = state.area.toFixed(1);
            document.getElementById('val-thickness').textContent = state.thickness.toFixed(1);
            document.getElementById('val-kappa').textContent = state.kappa;
            document.getElementById('val-dt').textContent = state.dt;

            const kVal = state.kappa;
            let matText = "";
            let closest = 0;
            let minDiff = Infinity;

            for (let key in materials) {
                let diff = Math.abs(key - kVal);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = key;
                }
            }
            const hintPre = i18n[state.lang].hintPre;
            if (minDiff < 30) {
                matText = hintPre + materials[closest][state.lang];
            } else {
                matText = "";
            }
            document.getElementById('material-hint').textContent = matText;

            const side = Math.sqrt(state.area);
            const thick = state.thickness;

            mainBlock.scale.set(thick, side, side);

            hotPlate.scale.set(1, side, side);
            hotPlate.position.set(-(thick / 2) - 0.05, 0, 0);

            coldPlate.scale.set(1, side, side);
            coldPlate.position.set((thick / 2) + 0.05, 0, 0);

            group.position.y = side / 2;

            const pRatio = Math.min(P / 4000, 1);

            arrowGroup.children.forEach((arrow, index) => {
                arrow.position.x = -(thick / 2) + 0.1;
                arrow.position.z = side / 2 + 0.1;
                const yOffset = side * 0.25;
                arrow.position.y = (index === 0) ? yOffset : -yOffset;
                arrow.setLength(Math.max(thick - 0.2, 0.1), 0.4, 0.25);
                arrow.visible = P > 0;
            });

            blockMaterial.emissive = new THREE.Color(0xff4400);
            blockMaterial.emissiveIntensity = pRatio * 0.8;
        }

        function resetSimulation() {
            state.area = DEFAULTS.area;
            state.thickness = DEFAULTS.thickness;
            state.kappa = DEFAULTS.kappa;
            state.dt = DEFAULTS.dt;
            document.getElementById('input-area').value = String(DEFAULTS.area);
            document.getElementById('input-thickness').value = String(DEFAULTS.thickness);
            document.getElementById('input-kappa').value = String(DEFAULTS.kappa);
            document.getElementById('input-dt').value = String(DEFAULTS.dt);
            updatePhysics();
        }

        function typeset(nodes) {
            if (window.MathJax && MathJax.typesetPromise) {
                return MathJax.typesetPromise(nodes || undefined).catch(function () {});
            }
            return Promise.resolve();
        }

        function renderSteps() {
            const t = i18n[state.lang];
            const steps = STEPS[state.lang];
            const body = document.getElementById('steps-body');
            body.innerHTML = steps.map(function (html, i) {
                return '<div class="step-card"><div class="text-indigo-300 font-bold mb-2">' + t.stepLabel + ' ' + (i + 1) + '</div><div>' + html + '</div></div>';
            }).join('');
            typeset([body]);
        }

        function renderPrinciple() {
            const p = PRINCIPLE[state.lang];
            const body = document.getElementById('principle-body');
            let html = '';
            html += '<div><h4 class="text-yellow-300 font-bold mb-2">' + p.conceptTitle + '</h4><p>' + p.concept + '</p></div>';
            html += '<div class="bg-gray-900 rounded p-4 text-center border border-gray-700 math-container text-yellow-400">$$ P = \\frac{Q}{t} = \\kappa A \\frac{\\Delta T}{d} $$</div>';
            html += '<div><h4 class="text-yellow-300 font-bold mb-2">' + p.mechTitle + '</h4><ol class="list-decimal pl-5 space-y-2">';
            p.mech.forEach(function (item) {
                html += '<li>' + item + '</li>';
            });
            html += '</ol></div>';
            html += '<div><h4 class="text-yellow-300 font-bold mb-2">' + p.egTitle + '</h4><p>' + p.eg + '</p></div>';
            body.innerHTML = html;
            typeset([body]);
        }

        function renderQuiz() {
            const t = i18n[state.lang];
            const lang = state.lang;
            const body = document.getElementById('quiz-body');
            if (!body) return;
            const ref = lang === 'zh' ? '參考答案' : 'Reference answer';
            const shortNote = lang === 'zh' ? '先預測，再操作本模擬核對。' : 'Predict first, then verify on the sim.';
            body.innerHTML = QUIZ.map(function (q, qi) {
                const n = qi + 1;
                const name = 'q' + n;
                let opts = '';
                if (q.type === 'mc') {
                    opts = '<div class="grid gap-1.5 mt-1">' + q.options[lang].map(function (text, oi) {
                        const L = String.fromCharCode(65 + oi);
                        return '<label class="flex items-start gap-2 rounded-lg border border-gray-600 p-2 cursor-pointer"><input type="radio" name="' + name + '" class="mt-0.5"><span>' + L + '. ' + text + '</span></label>';
                    }).join('') + '</div>';
                } else {
                    opts = '<p class="text-xs text-gray-400 mb-1">' + shortNote + '</p>';
                }
                const ans = quizAnswersVisible ? '<div class="mt-2 text-xs text-emerald-300 bg-emerald-950/40 border border-emerald-800/40 rounded-lg p-2"><strong>' + ref + '：</strong> ' + q.answer[lang] + '</div>' : '';
                return '<div class="quiz-item mb-4"><p class="q-stem font-semibold mb-2"><span class="text-violet-300">Q' + n + '.</span> ' + q.stem[lang] + '</p>' + opts + ans + '</div>';
            }).join('');
            const ansBtn = document.getElementById('btn-quiz-answers');
            if (ansBtn) ansBtn.textContent = quizAnswersVisible ? t.btnHideAnswer : t.btnShowAnswer;
            typeset([body]);
        }

        function applyLanguage() {
            const t = i18n[state.lang];
            document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : 'en';
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.title = state.lang === 'zh' ? '熱傳導實驗室 | Conduction Lab' : 'Conduction Lab | 熱傳導實驗室';

            if (!document.getElementById('modal-steps').classList.contains('hidden')) renderSteps();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) renderPrinciple();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) renderQuiz();
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('hidden');
            if (id === 'modal-steps') renderSteps();
            if (id === 'modal-principle') renderPrinciple();
            if (id === 'modal-quiz') renderQuiz();
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('hidden');
        }

        // Sliders
        document.getElementById('input-area').addEventListener('input', function (e) {
            state.area = parseFloat(e.target.value);
            updatePhysics();
        });
        document.getElementById('input-thickness').addEventListener('input', function (e) {
            state.thickness = parseFloat(e.target.value);
            updatePhysics();
        });
        document.getElementById('input-kappa').addEventListener('input', function (e) {
            state.kappa = parseFloat(e.target.value);
            updatePhysics();
        });
        document.getElementById('input-dt').addEventListener('input', function (e) {
            state.dt = parseFloat(e.target.value);
            updatePhysics();
        });

        document.getElementById('btn-lang').addEventListener('click', function () {
            state.lang = state.lang === 'zh' ? 'en' : 'zh';
            applyLanguage();
            updatePhysics();
        });

        document.getElementById('btn-reset').addEventListener('click', resetSimulation);
        document.getElementById('btn-steps').addEventListener('click', function () { openModal('modal-steps'); });
        document.getElementById('btn-principle').addEventListener('click', function () { openModal('modal-principle'); });
        document.getElementById('btn-quiz').addEventListener('click', function () { openModal('modal-quiz'); });
        document.getElementById('btn-quiz-answers').addEventListener('click', function () {
            quizAnswersVisible = !quizAnswersVisible;
            renderQuiz();
        });

        document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                closeModal(btn.getAttribute('data-close-modal'));
            });
        });

        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
            const modal = document.getElementById(id);
            modal.addEventListener('click', function (e) {
                if (e.target === modal) closeModal(id);
            });
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(closeModal);
            }
        });

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        document.documentElement.lang = 'zh-Hant';
        applyLanguage();
        updatePhysics();
        animate();
    </script>
</body>
</html>
