/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

        // --- 物理系統常數與狀態 ---
        const FLOOR_HEIGHT = 3.0; 
        const TOTAL_FLOORS = 50;
        const MAX_Y = (TOTAL_FLOORS - 1) * FLOOR_HEIGHT; 
        const PIXELS_PER_METER = 100; 

        const AUTO_MAX_V = 6.0; 
        const AUTO_MAX_A = 1.5; 

        let state = {
            mode: 'manual', 
            m: 60,
            g: 9.81, 
            y: 0,        
            v: 0,        
            a: 0,        
            targetFloor: 1, 
            time: 0,     
            history: []  
        };

        // UI 元素
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');
        const graphCanvas = document.getElementById('graph-canvas');
        const graphCtx = graphCanvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawArrow(ctx, fromx, fromy, tox, toy, color, label, lineWidth = 4) {
            if(Math.abs(fromy - toy) < 2) return;
            const headlen = 15; 
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = "round";
            
            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();

            ctx.font = "bold 18px 'Noto Sans TC', 'Segoe UI', sans-serif";
            ctx.fillStyle = color;
            
            // 智能配置文字位置避免遮擋
            let textX = fromx;
            if (label === 'R') {
                ctx.textAlign = "right";
                textX -= 20;
            } else {
                ctx.textAlign = "left";
                textX += 20;
            }
            
            const textY = fromy + dy * 0.5;
            ctx.fillText(label, textX, textY);
        }

        function updateAccLimits() {
            const accInput = document.getElementById('input-acc');
            const limit = state.g;
            
            accInput.min = -limit;
            accInput.max = limit;

            if (state.a > limit) state.a = limit;
            if (state.a < -limit) state.a = -limit;

            accInput.value = state.a;

            const t = i18n[currentLang];
            document.getElementById('hint-acc').innerText = `${t.hintAcc} (Max: ±${limit} m/s²)`;
            
            updateUIData();
        }

        function updatePhysics(dt) {
            if(dt > 0.1) dt = 0.1;

            if (state.mode === 'auto') {
                const targetY = (state.targetFloor - 1) * FLOOR_HEIGHT;
                const dist = targetY - state.y;
                const dir = Math.sign(dist);
                
                if (Math.abs(dist) < 0.02 && Math.abs(state.v) < 0.05) {
                    state.y = targetY;
                    state.v = 0;
                    state.a = 0;
                } else {
                    const currentMaxA = Math.min(AUTO_MAX_A, state.g > 0 ? state.g : AUTO_MAX_A);
                    const dBrake = Math.max(0, Math.abs(dist) - 0.05);
                    let vIdeal = dir * Math.min(AUTO_MAX_V, Math.sqrt(2 * currentMaxA * dBrake));
                    let reqA = (vIdeal - state.v) / dt;
                    
                    state.a = Math.max(-currentMaxA, Math.min(currentMaxA, reqA));
                }
            }

            state.v += state.a * dt;
            state.y += state.v * dt;

            if (state.y <= 0) { 
                state.y = 0; 
                if(state.v < 0) state.v = 0; 
                if(state.mode === 'manual' && state.a < 0) state.a = 0; 
            }
            if (state.y >= MAX_Y) { 
                state.y = MAX_Y; 
                if(state.v > 0) state.v = 0; 
                if(state.mode === 'manual' && state.a > 0) state.a = 0; 
            }

            state.time += dt;
            const appWValue = Math.max(0, state.m * (state.g + state.a));
            const realWValue = state.m * state.g;

            state.history.push({ t: state.time, v: state.v, a: state.a, R: appWValue, W: realWValue });
            
            while (state.history.length > 0 && state.history[0].t < state.time - 10) {
                state.history.shift();
            }
        }

        function drawGraphs() {
            const w = graphCanvas.width;
            const h = graphCanvas.height;
            graphCtx.clearRect(0, 0, w, h);

            if (state.history.length === 0) return;

            const tMax = state.time;
            const tMin = Math.max(0, state.time - 10);
            const chartH = h / 4;
            
            function drawLineChart(offsetY, dataKey, valMin, valMax, color, labelText, unit) {
                graphCtx.save();
                graphCtx.translate(0, offsetY);
                
                graphCtx.strokeStyle = "#475569"; graphCtx.lineWidth = 1;
                graphCtx.beginPath(); graphCtx.moveTo(0, chartH); graphCtx.lineTo(w, chartH); graphCtx.stroke();
                
                if (0 >= valMin && 0 <= valMax) {
                    const y0 = chartH - ((0 - valMin) / (valMax - valMin)) * chartH;
                    graphCtx.strokeStyle = "#64748b"; graphCtx.setLineDash([4, 4]);
                    graphCtx.beginPath(); graphCtx.moveTo(0, y0); graphCtx.lineTo(w, y0); graphCtx.stroke();
                    graphCtx.setLineDash([]);
                }

                graphCtx.beginPath();
                graphCtx.strokeStyle = color;
                graphCtx.lineWidth = 2;
                
                for (let i = 0; i < state.history.length; i++) {
                    const pt = state.history[i];
                    const px = ((pt.t - tMin) / 10) * w;
                    
                    let val = pt[dataKey];
                    val = Math.max(valMin, Math.min(valMax, val));
                    const py = chartH - ((val - valMin) / (valMax - valMin)) * chartH;
                    
                    if (i === 0) graphCtx.moveTo(px, py);
                    else graphCtx.lineTo(px, py);
                }
                graphCtx.stroke();

                graphCtx.fillStyle = color;
                graphCtx.font = "bold 12px monospace";
                graphCtx.fillText(`${labelText} (${unit})`, 5, 15);
                
                const currentVal = state.history[state.history.length - 1][dataKey];
                graphCtx.textAlign = "right";
                graphCtx.fillText(currentVal.toFixed(1), w - 5, 15);
                graphCtx.textAlign = "left";

                graphCtx.restore();
            }

            drawLineChart(0, 'v', -AUTO_MAX_V - 2, AUTO_MAX_V + 2, "#38bdf8", "v", "m/s");
            
            const aLimit = Math.max(AUTO_MAX_A, state.g);
            drawLineChart(chartH, 'a', -aLimit - 1, aLimit + 1, "#f87171", "a", "m/s²");
            
            const rMax = state.m * (state.g + Math.max(2, Math.abs(state.a)) + 1);
            
            drawLineChart(chartH * 2, 'R', 0, rMax, "#34d399", "R", "N");
            drawLineChart(chartH * 3, 'W', 0, rMax, "#eab308", "W", "N");
        }

        let lastTime = performance.now();
        function draw(time) {
            const dt = (time - lastTime) / 1000;
            lastTime = time;

            updatePhysics(dt);
            
            if (state.mode === 'manual' && parseFloat(document.getElementById('input-acc').value) !== state.a) {
                document.getElementById('input-acc').value = state.a;
            }

            updateUIData();
            drawGraphs();

            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = "#e2e8f0"; 
            ctx.fillRect(0, 0, width, height);
            
            const shaftWidth = 400;
            const leftWall = width/2 - shaftWidth/2;
            const rightWall = width/2 + shaftWidth/2;
            
            ctx.fillStyle = "#cbd5e1";
            ctx.fillRect(leftWall, 0, shaftWidth, height);
            
            const eleHeight = 260;
            const eleFloorScreenY = height/2 + eleHeight/2; 
            
            ctx.lineWidth = 4;
            ctx.font = "bold 24px 'Noto Sans TC', 'Segoe UI'";
            ctx.textBaseline = "bottom";
            
            for (let i = 1; i <= TOTAL_FLOORS; i++) {
                const floorWorldY = (i - 1) * FLOOR_HEIGHT;
                const screenY = eleFloorScreenY - (floorWorldY - state.y) * PIXELS_PER_METER;
                
                if (screenY > -100 && screenY < height + 100) {
                    ctx.strokeStyle = "#94a3b8";
                    ctx.beginPath();
                    ctx.moveTo(leftWall, screenY);
                    ctx.lineTo(rightWall, screenY);
                    ctx.stroke();
                    
                    ctx.fillStyle = "#64748b";
                    ctx.textAlign = "right";
                    ctx.fillText(`${i} F`, rightWall - 15, screenY - 5);
                }
            }

            const eleWidth = 280;
            const eleX = width/2 - eleWidth/2;
            const eleY = height/2 - eleHeight/2;
            
            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(eleX, eleY, eleWidth, eleHeight);
            
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 10;
            ctx.lineJoin = "round";
            ctx.strokeRect(eleX, eleY, eleWidth, eleHeight);
            
            ctx.beginPath();
            ctx.moveTo(width/2, 0);
            ctx.lineTo(width/2, eleY);
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 6;
            ctx.stroke();

            const scaleWidth = 180;
            const scaleHeight = 15;
            const scaleX = width/2 - scaleWidth/2;
            const scaleY = eleFloorScreenY - scaleHeight;
            ctx.fillStyle = "#94a3b8"; 
            ctx.fillRect(scaleX, scaleY, scaleWidth, scaleHeight);
            ctx.fillStyle = "#cbd5e1"; 
            ctx.fillRect(width/2 - 20, scaleY + 2, 40, 10);

            const personWidth = 80;
            const personHeight = 140;
            const personX = width/2 - personWidth/2;
            let personY = scaleY - personHeight;
            
            const appWValue = state.m * (state.g + state.a);
            const appW = Math.max(0, appWValue);
            if (appW === 0 && state.g > 0) {
                personY -= 20; 
            }

            ctx.fillStyle = "#3b82f6";
            ctx.beginPath();
            ctx.roundRect(personX, personY, personWidth, personHeight, 15);
            ctx.fill();
            
            ctx.fillStyle = "white";
            ctx.font = "bold 18px 'Noto Sans TC', 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`${state.m} kg`, width/2, personY + personHeight/2);

            // --- 繪製力學向量箭頭 ---
            const forceScale = 0.08; 
            const realW = state.m * state.g;
            
            const cmX = width/2;
            const cmY = personY + personHeight/2; 
            const feetY = personY + personHeight; 
            
            // 1. 真實重量 (W) 向下
            const wLength = realW * forceScale;
            if(wLength > 0) {
                drawArrow(ctx, cmX + 25, cmY, cmX + 25, cmY + wLength, "#eab308", "W", 5);
            }

            // 2. 表觀重量/法向力 (R) 向上
            const rLength = appW * forceScale;
            if(rLength > 0) {
                drawArrow(ctx, cmX - 25, feetY, cmX - 25, feetY - rLength, "#10b981", "R", 5);
            }
            
            // 3. 系統加速度 (a)
            const aScale = 12; 
            const aLength = Math.abs(state.a) * aScale;
            
            if (aLength > 2) {
                const aX = cmX + 85; 
                const aDir = state.a > 0 ? -1 : 1; 
                const aStartY = cmY; 
                const aEndY = cmY + aDir * aLength;
                
                drawArrow(ctx, aX, aStartY, aX, aEndY, "#ef4444", "a", 6);
            }

            requestAnimationFrame(draw);
        }

        function updateUIData() {
            const t = i18n[currentLang];
            
            document.getElementById('val-mass').innerText = state.m;
            if(state.mode === 'manual') {
                document.getElementById('val-acc').innerText = parseFloat(state.a).toFixed(1);
            }
            
            const currFloorNum = Math.round(state.y / FLOOR_HEIGHT) + 1;
            document.getElementById('disp-curr-floor').innerText = currFloorNum;

            const realW = (state.m * state.g).toFixed(1);
            const appWValue = state.m * (state.g + state.a);
            const appW = Math.max(0, appWValue).toFixed(1);

            document.getElementById('data-real-w').innerText = `${realW} N`;
            document.getElementById('data-app-w').innerText = `${appW} N`;

            let statusText = t.stIdle;
            let statusColor = "bg-slate-700 text-green-400 border border-slate-600";
            
            if (state.a > 0.05) {
                statusText = t.stHeavy;
                statusColor = "bg-red-900/80 text-red-300 border border-red-500";
            } else if (state.a < -0.05) {
                statusText = t.stLight;
                statusColor = "bg-blue-900/80 text-blue-300 border border-blue-500";
            }
            
            const stateBadge = document.getElementById('data-state');
            stateBadge.innerText = statusText;
            stateBadge.className = `px-3 py-1 rounded-full font-bold text-sm ${statusColor}`;
        }

        function typesetMath(root) {
            if (window.MathJax && MathJax.typesetPromise) {
                const nodes = root ? [root] : undefined;
                MathJax.typesetPromise(nodes).catch(() => {});
            }
        }

        function renderSteps() {
            const t = i18n[currentLang];
            const body = document.getElementById('steps-body');
            body.innerHTML = [t.step1, t.step2, t.step3, t.step4].map(s => `<li>${s}</li>`).join('');
            typesetMath(body);
        }

        function renderPrinciple() {
            const t = i18n[currentLang];
            const body = document.getElementById('principle-body');
            body.innerHTML = `
                <h3 class="font-bold text-lg text-blue-700">${t.conceptLabel}</h3>
                <p>${t.principleConcept}</p>
                <h3 class="font-bold text-lg text-blue-700 mt-4">${t.mechanismLabel}</h3>
                ${t.principleMechanism}
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 my-4 text-center">
                    $$R - mg = ma \\implies R = m(g + a)$$
                </div>
                <h3 class="font-bold text-lg text-blue-700 mt-4">${t.exampleLabel}</h3>
                <p>${t.principleExample}</p>
            `;
            typesetMath(body);
        }

        function renderQuiz() {
            const t = i18n[currentLang];
            const body = document.getElementById('quiz-body');
            if (!body) return;
            const ref = currentLang === 'zh' ? '參考答案' : 'Reference answer';
            const mkChoice = (qid) => ['a', 'b', 'c', 'd'].map(L => {
                const key = qid + L;
                return `<label class="flex items-start gap-2 rounded-lg border border-slate-200 p-2 cursor-pointer"><input type="radio" name="${qid}" class="mt-1 accent-violet-600"><span>${t[key]}</span></label>`;
            }).join('');
            const ans = (key) => quizAnswersVisible
                ? `<div class="mt-2 text-xs rounded-lg border border-emerald-200 bg-emerald-50 p-2 text-emerald-900"><strong>${ref}：</strong> ${t[key]}</div>` : '';
            const block = (n, qid, mc) => {
                let h = `<div class="quiz-item border border-slate-200 rounded-xl p-4 mb-3"><p class="font-bold text-slate-800 mb-1">Q${n}. ${t[qid]}</p>`;
                if (mc) h += `<div class="grid gap-1.5">${mkChoice(qid)}</div>`;
                else h += `<p class="text-sm text-slate-500 mt-1">${t.shortHint}</p>`;
                return h + ans(qid + 'ans') + '</div>';
            };
            body.innerHTML = block(1, 'q1', true) + block(2, 'q2', false) + block(3, 'q3', true) + block(4, 'q4', false) + block(5, 'q5', true);
            const ansBtn = document.getElementById('btn-quiz-answers');
            if (ansBtn) ansBtn.textContent = quizAnswersVisible ? t.hideAnswers : t.showAnswers;
            if (quizAnswersVisible) typesetMath(document.getElementById('modal-quiz'));
        }

        function updateGOptions() {
            const t = i18n[currentLang];
            const map = { earth: t.gEarth, moon: t.gMoon, mars: t.gMars, space: t.gSpace };
            document.querySelectorAll('#input-g option').forEach(opt => {
                const key = opt.getAttribute('data-g-key');
                if (key && map[key]) opt.textContent = map[key];
            });
        }

        function updateLang() {
            const t = i18n[currentLang];
            document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
            document.title = currentLang === 'zh' ? '物理模型：升降機中的表觀重量' : 'Physics model: Apparent weight in an elevator';
            document.getElementById('title').innerText = t.title;
            document.getElementById('label-mass').innerText = t.mass;
            document.getElementById('label-acc').innerText = t.acc;
            document.getElementById('label-g').innerText = t.gEnv;
            document.getElementById('reset-btn').innerText = t.reset;
            document.getElementById('btn-principle').innerText = t.theory;
            document.getElementById('btn-steps').innerText = t.stepsBtn;
            document.getElementById('btn-quiz').innerText = t.quizBtn;
            document.getElementById('data-title').innerText = t.dataTitle;
            document.getElementById('data-real-w-label').innerText = t.realW;
            document.getElementById('data-app-w-label').innerText = t.appW;
            document.getElementById('data-state-label').innerText = t.state;
            document.getElementById('principle-title').innerText = t.modalTitle;
            document.getElementById('steps-title').innerText = t.stepsTitle;
            document.getElementById('quiz-title').innerText = t.quizTitle;
            document.getElementById('close-principle').innerText = t.close;
            document.getElementById('close-steps').innerText = t.close;
            document.getElementById('close-quiz').innerText = t.close;
            document.getElementById('btn-quiz-answers').innerText = quizAnswersVisible ? t.hideAnswers : t.showAnswers;
            document.getElementById('label-mode').innerText = t.mode;
            document.getElementById('btn-mode-manual').innerText = t.manual;
            document.getElementById('btn-mode-auto').innerText = t.auto;
            document.getElementById('label-target-floor').innerText = t.targetFloor;
            document.getElementById('btn-go').innerText = t.go;
            document.getElementById('label-curr-floor').innerText = t.currFloor;
            document.getElementById('label-graphs').innerText = t.graphs;
            
            document.getElementById('hint-acc').innerText = `${t.hintAcc} (Max: ±${state.g} m/s²)`;
            updateGOptions();
            renderSteps();
            renderPrinciple();
            renderQuiz();
            updateUIData();
        }

        function openModal(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.add('is-open');
            el.style.display = 'flex';
            if (id === 'modal-principle') typesetMath(document.getElementById('principle-body'));
            if (id === 'modal-steps') typesetMath(document.getElementById('steps-body'));
            if (id === 'modal-quiz') typesetMath(document.getElementById('quiz-body'));
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('is-open');
            el.style.display = 'none';
        }

        function closeAllModals() {
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(closeModal);
        }

        window.setMode = function(mode) {
            state.mode = mode;
            if(mode === 'manual') {
                document.getElementById('btn-mode-manual').className = "btn-mode active";
                document.getElementById('btn-mode-auto').className = "btn-mode inactive";
                document.getElementById('manual-controls').style.display = "block";
                document.getElementById('auto-controls').style.display = "none";
                state.a = parseFloat(document.getElementById('input-acc').value);
            } else {
                document.getElementById('btn-mode-auto').className = "btn-mode active";
                document.getElementById('btn-mode-manual').className = "btn-mode inactive";
                document.getElementById('manual-controls').style.display = "none";
                document.getElementById('auto-controls').style.display = "block";
                state.a = 0; 
            }
        };

        document.getElementById('input-mass').addEventListener('input', (e) => {
            state.m = parseInt(e.target.value);
            updateUIData();
        });

        document.getElementById('input-acc').addEventListener('input', (e) => {
            if(state.mode === 'manual') state.a = parseFloat(e.target.value);
        });

        document.getElementById('input-g').addEventListener('change', (e) => {
            state.g = parseFloat(e.target.value);
            updateAccLimits(); 
        });
        
        document.getElementById('btn-go').addEventListener('click', () => {
            let f = parseInt(document.getElementById('input-floor').value);
            if(f < 1) f = 1;
            if(f > TOTAL_FLOORS) f = TOTAL_FLOORS;
            document.getElementById('input-floor').value = f;
            state.targetFloor = f;
        });

        // Reset: #reset-btn ≡ Reset（不重置語言／質量／g／模式）
        document.getElementById('reset-btn').addEventListener('click', () => {
            state.a = 0;
            state.v = 0;
            state.y = 0;
            state.targetFloor = 1;
            document.getElementById('input-acc').value = 0;
            document.getElementById('input-floor').value = 1;
            state.history = []; 
        });

        document.getElementById('btn-lang').addEventListener('click', () => {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateLang();
        });

        document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
        document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
        document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));

        document.querySelectorAll('[data-close-modal]').forEach(btn => {
            btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close-modal')));
        });

        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(id => {
            const modal = document.getElementById(id);
            modal.addEventListener('click', (event) => {
                if (event.target === modal) closeModal(id);
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAllModals();
        });

        document.getElementById('btn-quiz-answers').addEventListener('click', () => {
            quizAnswersVisible = !quizAnswersVisible;
            renderQuiz();
        });

        // Checklist notes: #reset-btn ≡ Reset (optional #btn-reset alias); #btn-lang ≡ 中/EN (optional #lang-btn).
        const resetEl = document.getElementById('reset-btn');
        if (resetEl && !document.getElementById('btn-reset')) {
            resetEl.setAttribute('data-also', 'btn-reset');
        }
        if (!document.getElementById('lang-btn')) {
            const alias = document.createElement('button');
            alias.id = 'lang-btn';
            alias.type = 'button';
            alias.style.display = 'none';
            alias.setAttribute('aria-hidden', 'true');
            alias.addEventListener('click', () => document.getElementById('btn-lang').click());
            document.body.appendChild(alias);
        }

        window.onload = () => {
            updateLang();
            updateAccLimits(); 
            requestAnimationFrame(draw);
        };
    </script>
</body>
</html>
