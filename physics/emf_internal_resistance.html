<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電動勢與內阻 | EMF and Internal Resistance</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sim-mathjax.css">
<script>
  MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  .lab-modal[hidden] { display: none !important; }
  .lab-modal { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  input[type=range] { width: 100%; accent-color: #0284c7; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="max-w-7xl mx-auto mt-3 px-4 py-3 bg-white/90 backdrop-blur rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3 sticky top-2 z-20">
  <div>
    <p class="text-[11px] font-semibold tracking-wide text-sky-700" data-i18n="badge">物理</p>
    <h1 class="text-lg sm:text-xl font-bold" data-i18n="title"></h1>
  </div>
  <div class="flex flex-wrap gap-2">
    <button type="button" id="btn-steps" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-slate-100" data-i18n="btnSteps">觀察步驟</button>
    <button type="button" id="btn-principle" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-sky-600 text-white" data-i18n="btnPrinciple">原理解說</button>
    <button type="button" id="btn-quiz" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200" data-i18n="btnQuiz">課堂問題</button>
    <div class="flex rounded-full border border-slate-200 overflow-hidden">
      <button type="button" id="langZh" class="px-3 py-1.5 text-sm font-semibold bg-slate-900 text-white">中</button>
      <button type="button" id="langEn" class="px-3 py-1.5 text-sm font-semibold">EN</button>
    </div>
  </div>
</header>
<main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
  <aside class="lg:col-span-4 order-2 lg:order-1 bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
    
    <label class="block text-sm font-semibold" data-i18n="eLabel"></label>
    <input id="eSlider" type="range" min="1.5" max="12" step="0.1" value="6">
    <p id="eValue" class="text-sm text-slate-600"></p>
    <label class="block text-sm font-semibold" data-i18n="rLabel"></label>
    <input id="rSlider" type="range" min="0.2" max="5" step="0.1" value="1">
    <p id="rValue" class="text-sm text-slate-600"></p>
    <label class="block text-sm font-semibold" data-i18n="RLabel"></label>
    <input id="RSlider" type="range" min="1" max="40" step="0.5" value="10">
    <p id="RValue" class="text-sm text-slate-600"></p>
    <button type="button" id="btn-reset" class="w-full px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold" data-i18n="reset"></button>
    <p id="note" class="text-sm leading-relaxed bg-slate-50 rounded-xl p-3"></p>
    
  </aside>
  <section class="lg:col-span-8 order-1 lg:order-2 bg-white rounded-2xl border border-slate-200 p-4" aria-label="simulation">
    
    <p class="text-sm mb-2" data-i18n="formula"></p>
    <canvas id="plot" width="720" height="380" class="w-full h-auto bg-slate-50 rounded-xl border border-slate-100"></canvas>
    <p id="readout" class="mt-3 text-sm"></p>
    
  </section>
</main>
<div id="modal-steps" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="steps-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="steps-title" class="text-lg font-bold" data-i18n="stepsTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <ol id="steps-body" class="list-decimal pl-5 space-y-1 text-sm"></ol>
  </div>
</div>
<div id="modal-principle" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="principle-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="principle-title" class="text-lg font-bold" data-i18n="principleTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="principle-body" class="space-y-2 text-sm"></div>
  </div>
</div>
<div id="modal-quiz" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="quiz-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="quiz-title" class="text-lg font-bold" data-i18n="quizTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="quiz-list"></div>
    <button type="button" id="btn-quiz-answers" class="mt-2 px-3 py-1.5 rounded-lg bg-slate-900 text-white text-sm"></button>
  </div>
</div>
<script>
const I18N = {"zh": {"badge": "物理", "btnSteps": "觀察步驟", "btnPrinciple": "原理解說", "btnQuiz": "課堂問題", "stepsTitle": "觀察步驟", "principleTitle": "原理解說", "quizTitle": "課堂問題", "showAnswers": "顯示參考答案", "hideAnswers": "隱藏參考答案", "answerLabel": "參考答案", "reset": "重置", "title": "電動勢與內阻", "eLabel": "電動勢 E", "rLabel": "內阻 r", "RLabel": "外電阻 R", "formula": "\\(V = E - Ir\\)。圖線與 V 軸交於 E，斜率大小是 r。", "note": "改變外電阻，工作點沿同一直線移動。截距是 E，斜率是 −r。"}, "en": {"badge": "Physics", "btnSteps": "Steps", "btnPrinciple": "Principle", "btnQuiz": "Quiz", "stepsTitle": "Steps", "principleTitle": "Principle", "quizTitle": "Quiz", "showAnswers": "Show answers", "hideAnswers": "Hide answers", "answerLabel": "Answer", "reset": "Reset", "title": "EMF and Internal Resistance", "eLabel": "EMF E", "rLabel": "Internal resistance r", "RLabel": "External resistance R", "formula": "\\(V = E - Ir\\). The intercept on the V axis is E, and the slope magnitude is r.", "note": "Changing the external resistance moves the operating point along the same line. The intercept is E and the slope is −r."}};
const CLASSROOM = {"steps": {"zh": ["固定 E 和 r，把外電阻 R 由大調小，看電流上升、端電壓下降。", "看圖上的點是否沿直線移動。", "只加大 E，看直線的截距上升。", "只加大 r，看直線變斜，短路電流變小。", "再調 R，確認截距仍是 E、斜率大小仍是 r。"], "en": ["Keep E and r fixed and lower the external resistance R. The current rises and the terminal voltage falls.", "Check that the point moves along a straight line.", "Increase only E and watch the intercept rise.", "Increase only r and watch the line get steeper while the short-circuit current falls.", "Change R again. The intercept is still E and the slope magnitude is still r."]}, "principle": {"zh": ["電池端電壓 \\(V = E - Ir\\)。外電阻愈小，電流愈大，內阻分去的電壓愈多。", "以 V 對 I 作圖，I = 0 時 V = E，所以截距是電動勢。", "斜率是 −r，斜率的大小就是內阻。"], "en": ["The terminal voltage is \\(V = E - Ir\\). A smaller external resistance means a larger current and a larger drop inside the cell.", "On a V–I graph, V = E when I = 0, so the intercept is the EMF.", "The slope is −r, so the size of the slope is the internal resistance."]}, "quiz": [{"zh": "V–I 圖與電壓軸的截距代表？", "en": "The intercept of the V–I graph on the voltage axis is?", "azh": "A。", "aen": "A.", "czh": ["電動勢 E", "內阻 r", "外電阻 R", "電流 I"], "cen": ["The EMF E", "The internal resistance r", "The external resistance R", "The current I"], "ans": 0}, {"zh": "先預測外電阻變小會令端電壓下降，再把 R 調小。", "en": "Predict that a smaller external resistance lowers the terminal voltage, then decrease R.", "azh": "電流變大，Ir 變大，V = E − Ir 下降。", "aen": "The current rises, Ir rises, and V = E − Ir falls."}, {"zh": "圖線斜率的大小等於？", "en": "The magnitude of the graph's slope equals?", "azh": "B。", "aen": "B.", "czh": ["E", "r", "R", "I"], "cen": ["E", "r", "R", "I"], "ans": 1}, {"zh": "先預測只加大內阻會令直線更斜，再調 r。", "en": "Predict that increasing only the internal resistance makes the line steeper, then move r.", "azh": "斜率是 −r，r 變大時直線更斜。", "aen": "The slope is −r, so a larger r makes a steeper line."}, {"zh": "外電路斷開、電流為零時，端電壓等於？", "en": "When the external circuit is open and the current is zero, the terminal voltage equals?", "azh": "A。", "aen": "A.", "czh": ["E", "零", "Ir", "R"], "cen": ["E", "Zero", "Ir", "R"], "ans": 0}]};
let lang = 'zh';
let quizAnswers = false;

const S = { E: 6, r: 1, R: 10 };
function fitCanvas(canvas, ratio) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(360, canvas.clientWidth || 720);
  const h = Math.max(280, Math.round(w * ratio));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function zz(ctx, x1, y1, x2, y2, amp, n) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    const side = i === n ? 0 : (i % 2 ? amp : -amp);
    ctx.lineTo(x1 + dx * t + nx * side, y1 + dy * t + ny * side);
  }
  ctx.stroke();
}
function render() {
  const I = S.E / (S.R + S.r);
  const V = S.E - I * S.r;
  const canvas = document.getElementById('plot');
  const { ctx, w, h } = fitCanvas(canvas, 0.62);
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(0, 0, w, h);
  const showCell = w > 680;
  const appW = showCell ? 268 : 0;
  if (showCell) {
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(12, 12, appW, h - 24, 16);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.font = '600 13px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(lang === 'zh' ? '電池與外電路' : 'Cell and circuit', 12 + appW / 2, 34);
    const x0 = 48;
    const x1 = 12 + appW - 46;
    const yTop = 86;
    const yBot = h - 92;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x0, yBot);
    ctx.lineTo(x0, yTop);
    ctx.lineTo(x0 + 18, yTop);
    ctx.stroke();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#b91c1c';
    ctx.beginPath();
    ctx.moveTo(x0 + 22, yTop - 15);
    ctx.lineTo(x0 + 22, yTop + 15);
    ctx.stroke();
    ctx.strokeStyle = '#1d4ed8';
    ctx.beginPath();
    ctx.moveTo(x0 + 34, yTop - 8);
    ctx.lineTo(x0 + 34, yTop + 8);
    ctx.stroke();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x0 + 34, yTop);
    ctx.lineTo(x0 + 52, yTop);
    ctx.stroke();
    zz(ctx, x0 + 52, yTop, x0 + 108, yTop, 7, 5);
    ctx.beginPath();
    ctx.moveTo(x0 + 108, yTop);
    ctx.lineTo(x1, yTop);
    ctx.lineTo(x1, yTop + 28);
    ctx.stroke();
    zz(ctx, x1, yTop + 42, x1, yBot - 28, 8, 7);
    ctx.beginPath();
    ctx.moveTo(x1, yBot - 14);
    ctx.lineTo(x1, yBot);
    ctx.lineTo(x0, yBot);
    ctx.stroke();
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x0 - 8, yTop - 30, 128, 58);
    ctx.setLineDash([]);
    ctx.fillStyle = '#64748b';
    ctx.font = '11px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(lang === 'zh' ? '電池' : 'Cell', x0 - 4, yTop - 34);
    ctx.fillStyle = '#0f172a';
    ctx.font = '600 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('E ' + S.E.toFixed(1) + ' V', x0 + 78, yTop + 20);
    ctx.textAlign = 'left';
    ctx.fillText('r ' + S.r.toFixed(1) + ' Ω', x0 + 52, yTop - 12);
    ctx.textAlign = 'right';
    ctx.fillText('R ' + S.R.toFixed(0) + ' Ω', x1 - 14, (yTop + yBot) / 2);
    const ax = (x0 + x1) / 2;
    const ay = yBot + 4;
    ctx.beginPath();
    ctx.arc(ax, ay, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0f172a';
    ctx.stroke();
    const frac = Math.max(0, Math.min(1, I / (S.E / S.r)));
    const ang = Math.PI + frac * Math.PI;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + Math.cos(ang) * 14, ay + Math.sin(ang) * 14);
    ctx.strokeStyle = '#e11d48';
    ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.font = '700 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('A', ax, ay + 10);
    ctx.font = '11px sans-serif';
    ctx.fillText(I.toFixed(2) + ' A', ax, ay + 34);
    ctx.fillStyle = '#0369a1';
    ctx.font = '600 12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('V ' + V.toFixed(2) + ' V', x0, yTop + 46);
    ctx.restore();
  }
  const iMax = (S.E / S.r) * 1.08;
  const vMax = Math.max(S.E * 1.25, 2);
  const plotX = (showCell ? 28 + appW : 16) + 46;
  const plotY = 32;
  const plotW = Math.max(80, w - plotX - 24);
  const plotH = h - 78;
  const X = (i) => plotX + (i / iMax) * plotW;
  const Y = (v) => plotY + plotH - (v / vMax) * plotH;
  ctx.fillStyle = '#fff';
  ctx.fillRect(plotX, plotY, plotW, plotH);
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#475569';
  ctx.font = '12px sans-serif';
  for (let i = 0; i <= 4; i++) {
    const gx = plotX + plotW * i / 4;
    const gy = plotY + plotH * i / 4;
    ctx.beginPath();
    ctx.moveTo(gx, plotY);
    ctx.lineTo(gx, plotY + plotH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(plotX, gy);
    ctx.lineTo(plotX + plotW, gy);
    ctx.stroke();
    ctx.fillStyle = '#475569';
    ctx.textAlign = 'center';
    ctx.fillText((iMax * i / 4).toFixed(2), gx, plotY + plotH + 16);
    ctx.textAlign = 'right';
    ctx.fillText((vMax * (4 - i) / 4).toFixed(1), plotX - 6, gy + 4);
  }
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(plotX, plotY);
  ctx.lineTo(plotX, plotY + plotH);
  ctx.lineTo(plotX + plotW, plotY + plotH);
  ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.font = '600 13px "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(lang === 'zh' ? '電流 I / A' : 'Current I / A', plotX + plotW / 2, h - 12);
  ctx.save();
  ctx.translate(plotX - 40, plotY + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(lang === 'zh' ? '端電壓 V / V' : 'Terminal V / V', 0, 0);
  ctx.restore();
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(X(0), Y(S.E));
  ctx.lineTo(X(Math.min(iMax, S.E / S.r)), Y(0));
  ctx.stroke();
  const iA = iMax * 0.08;
  const iB = iMax * 0.22;
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = '#0369a1';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(X(iA), Y(S.E - iA * S.r));
  ctx.lineTo(X(iB), Y(S.E - iA * S.r));
  ctx.lineTo(X(iB), Y(S.E - iB * S.r));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#0369a1';
  ctx.font = '700 12px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('E', X(0) + 8, Y(S.E) + 14);
  ctx.fillText(lang === 'zh' ? '斜率 = −r' : 'slope = −r', X(iB) + 8, Y(S.E - iB * S.r) + 4);
  ctx.beginPath();
  ctx.arc(X(I), Y(V), 6, 0, Math.PI * 2);
  ctx.fillStyle = '#e11d48';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  document.getElementById('eValue').textContent = S.E.toFixed(1) + ' V';
  document.getElementById('rValue').textContent = S.r.toFixed(1) + ' Ω';
  document.getElementById('RValue').textContent = S.R.toFixed(1) + ' Ω';
  document.getElementById('note').textContent = I18N[lang].note;
  document.getElementById('readout').textContent =
    'I = ' + I.toFixed(3) + ' A,  V = ' + V.toFixed(2) + ' V,  slope = -' + S.r.toFixed(1) + ' Ω';
}
function resetSim() {
  S.E = 6; S.r = 1; S.R = 10;
  document.getElementById('eSlider').value = 6;
  document.getElementById('rSlider').value = 1;
  document.getElementById('RSlider').value = 10;
  render();
}

function renderClassroom() {
  const steps = CLASSROOM.steps[lang];
  const principle = CLASSROOM.principle[lang];
  document.getElementById('steps-body').innerHTML = steps.map((s, i) => '<li>' + (i + 1) + '. ' + s + '</li>').join('');
  document.getElementById('principle-body').innerHTML = principle.map((s) => '<p>' + s + '</p>').join('');
  const labels = ['A', 'B', 'C', 'D'];
  document.getElementById('quiz-list').innerHTML = CLASSROOM.quiz.map((q, idx) => {
    const n = idx + 1;
    const open = n === 2 || n === 4;
    let choices = '';
    if (!open) {
      const arr = q[lang === 'zh' ? 'czh' : 'cen'];
      choices = '<div class="grid gap-1.5 mt-2">' + arr.map((text, i) =>
        '<label class="flex gap-2 items-start text-sm"><input type="radio" name="qq' + n + '"> <span>' + labels[i] + '. ' + text + '</span></label>'
      ).join('') + '</div>';
    }
    const ans = quizAnswers
      ? '<div class="mt-2 rounded-lg border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-sm"><strong>' + I18N[lang].answerLabel + '</strong> ' + q[lang === 'zh' ? 'azh' : 'aen'] + '</div>'
      : '';
    return '<article class="border border-slate-200 rounded-xl p-3 mb-2"><p class="text-sm"><strong>Q' + n + '.</strong> ' + q[lang] + '</p>' + choices + ans + '</article>';
  }).join('');
  document.getElementById('btn-quiz-answers').textContent = quizAnswers ? I18N[lang].hideAnswers : I18N[lang].showAnswers;
}
function setLang(next) {
  lang = next;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key] != null) el.innerHTML = I18N[lang][key];
  });
  document.getElementById('langZh').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'zh' ? 'bg-slate-900 text-white' : '');
  document.getElementById('langEn').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'en' ? 'bg-slate-900 text-white' : '');
  renderClassroom();
  render();
  if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(() => {});
}
function openModal(id) {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => {
    document.getElementById(mid).hidden = mid !== id;
  });
}
function closeModals() {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => { document.getElementById(mid).hidden = true; });
}
document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
document.getElementById('btn-quiz-answers').addEventListener('click', () => { quizAnswers = !quizAnswers; renderClassroom(); });
document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.querySelectorAll('[data-close]').forEach((btn) => btn.addEventListener('click', closeModals));
document.querySelectorAll('.lab-modal').forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) closeModals(); }));
