<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金屬線電阻率 | Resistivity of a Wire</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sim-mathjax.css">
<script>
  MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  .lab-modal[hidden] { display: none !important; }
  .lab-modal { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  input[type=range] { width: 100%; accent-color: #0284c7; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="max-w-7xl mx-auto mt-3 px-4 py-3 bg-white/90 backdrop-blur rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3 sticky top-2 z-20">
  <div>
    <p class="text-[11px] font-semibold tracking-wide text-sky-700" data-i18n="badge">物理</p>
    <h1 class="text-lg sm:text-xl font-bold" data-i18n="title"></h1>
  </div>
  <div class="flex flex-wrap gap-2">
    <button type="button" id="btn-steps" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-slate-100" data-i18n="btnSteps">觀察步驟</button>
    <button type="button" id="btn-principle" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-sky-600 text-white" data-i18n="btnPrinciple">原理解說</button>
    <button type="button" id="btn-quiz" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200" data-i18n="btnQuiz">課堂問題</button>
    <div class="flex rounded-full border border-slate-200 overflow-hidden">
      <button type="button" id="langZh" class="px-3 py-1.5 text-sm font-semibold bg-slate-900 text-white">中</button>
      <button type="button" id="langEn" class="px-3 py-1.5 text-sm font-semibold">EN</button>
    </div>
  </div>
</header>
<main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
  <aside class="lg:col-span-4 order-2 lg:order-1 bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
    
    <p class="text-sm font-semibold" data-i18n="matLabel"></p>
    <div class="grid gap-2">
      <button type="button" data-mat="copper" class="mat px-3 py-2 rounded-xl border text-sm text-left" data-i18n="copper"></button>
      <button type="button" data-mat="constantan" class="mat px-3 py-2 rounded-xl border text-sm text-left" data-i18n="constantan"></button>
      <button type="button" data-mat="nichrome" class="mat px-3 py-2 rounded-xl border text-sm text-left" data-i18n="nichrome"></button>
    </div>
    <label class="block text-sm font-semibold" data-i18n="lLabel"></label>
    <input id="lSlider" type="range" min="0.2" max="2" step="0.05" value="1">
    <p id="lValue" class="text-sm text-slate-600"></p>
    <label class="block text-sm font-semibold" data-i18n="dLabel"></label>
    <input id="dSlider" type="range" min="0.2" max="1" step="0.05" value="0.4">
    <p id="dValue" class="text-sm text-slate-600"></p>
    <button type="button" id="btn-reset" class="w-full px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold" data-i18n="reset"></button>
    <p id="note" class="text-sm leading-relaxed bg-slate-50 rounded-xl p-3"></p>
    
  </aside>
  <section class="lg:col-span-8 order-1 lg:order-2 bg-white rounded-2xl border border-slate-200 p-4" aria-label="simulation">
    
    <p class="text-sm mb-2" data-i18n="formula"></p>
    <canvas id="plot" width="720" height="380" class="w-full h-auto bg-slate-50 rounded-xl border border-slate-100"></canvas>
    <p id="readout" class="mt-3 text-sm"></p>
    
  </section>
</main>
<div id="modal-steps" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="steps-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="steps-title" class="text-lg font-bold" data-i18n="stepsTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <ol id="steps-body" class="list-decimal pl-5 space-y-1 text-sm"></ol>
  </div>
</div>
<div id="modal-principle" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="principle-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="principle-title" class="text-lg font-bold" data-i18n="principleTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="principle-body" class="space-y-2 text-sm"></div>
  </div>
</div>
<div id="modal-quiz" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="quiz-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="quiz-title" class="text-lg font-bold" data-i18n="quizTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="quiz-list"></div>
    <button type="button" id="btn-quiz-answers" class="mt-2 px-3 py-1.5 rounded-lg bg-slate-900 text-white text-sm"></button>
  </div>
</div>
<script>
const I18N = {"zh": {"badge": "物理", "btnSteps": "觀察步驟", "btnPrinciple": "原理解說", "btnQuiz": "課堂問題", "stepsTitle": "觀察步驟", "principleTitle": "原理解說", "quizTitle": "課堂問題", "showAnswers": "顯示參考答案", "hideAnswers": "隱藏參考答案", "answerLabel": "參考答案", "reset": "重置", "title": "金屬線電阻率", "matLabel": "材料（電阻率固定）", "copper": "銅", "constantan": "康銅", "nichrome": "鎳鉻", "lLabel": "長度 L", "dLabel": "直徑（改變截面積）", "formula": "\\(R = \\rho L/A\\)。R–L 圖過原點，斜率是 \\(\\rho/A\\)。", "note": "這次只改長度或截面積。材料不變時，電阻率 ρ 不變。"}, "en": {"badge": "Physics", "btnSteps": "Steps", "btnPrinciple": "Principle", "btnQuiz": "Quiz", "stepsTitle": "Steps", "principleTitle": "Principle", "quizTitle": "Quiz", "showAnswers": "Show answers", "hideAnswers": "Hide answers", "answerLabel": "Answer", "reset": "Reset", "title": "Resistivity of a Wire", "matLabel": "Material (resistivity fixed)", "copper": "Copper", "constantan": "Constantan", "nichrome": "Nichrome", "lLabel": "Length L", "dLabel": "Diameter (changes the area)", "formula": "\\(R = \\rho L/A\\). The R–L graph passes through the origin and its slope is \\(\\rho/A\\).", "note": "Change only the length or the cross-sectional area. Resistivity stays fixed for a given material."}};
const CLASSROOM = {"steps": {"zh": ["選鎳鉻，加長金屬線，看 R 沿直線上升。", "確認直線過原點。", "只加大直徑，看同一長度的 R 下降，直線變平。", "改選銅，比較同樣 L 和直徑時 R 小很多。", "再只改 L，確認斜率由 ρ/A 決定。"], "en": ["Choose nichrome and lengthen the wire. R rises along a straight line.", "Check that the line passes through the origin.", "Increase only the diameter. R at the same length falls and the line gets flatter.", "Switch to copper and compare the much smaller resistance.", "Change only L again and confirm the slope is ρ/A."]}, "principle": {"zh": ["均勻金屬線 \\(R = \\rho L/A\\)。A 是截面積。", "以 R 對 L 作圖，斜率是 ρ/A。材料不變，ρ 不變。", "直徑變大時 A 變大，電阻變小。"], "en": ["For a uniform wire, \\(R = \\rho L/A\\), where A is the cross-sectional area.", "On an R–L graph the slope is ρ/A. Resistivity stays fixed if the material stays the same.", "A larger diameter means a larger area and a smaller resistance."]}, "quiz": [{"zh": "只把長度加倍，截面積不變，R 會？", "en": "If only the length is doubled and the area stays the same, R will?", "azh": "A。", "aen": "A.", "czh": ["加倍", "減半", "不變", "變為四分之一"], "cen": ["Double", "Halve", "Stay the same", "Fall to a quarter"], "ans": 0}, {"zh": "先預測直徑變大時電阻變小，再只調直徑。", "en": "Predict that a larger diameter lowers the resistance, then change only the diameter.", "azh": "直徑變大，A 變大，R = ρL/A 變小。", "aen": "A larger diameter increases A, so R = ρL/A falls."}, {"zh": "R–L 圖的斜率等於？", "en": "The slope of the R–L graph equals?", "azh": "C。", "aen": "C.", "czh": ["ρ", "L", "ρ/A", "A"], "cen": ["ρ", "L", "ρ/A", "A"], "ans": 2}, {"zh": "先預測換成銅後同一條線的 R 會小很多，再按「銅」。", "en": "Predict that copper gives a much smaller R for the same wire, then select Copper.", "azh": "銅的電阻率遠小於鎳鉻，所以 R 小很多。", "aen": "Copper's resistivity is much smaller than nichrome, so R is much smaller."}, {"zh": "材料不變時，電阻率 ρ？", "en": "If the material is unchanged, the resistivity ρ?", "azh": "B。", "aen": "B.", "czh": ["隨長度加倍", "保持不變", "隨截面積加倍", "一定是零"], "cen": ["Doubles with length", "Stays the same", "Doubles with area", "Is certainly zero"], "ans": 1}]};
let lang = 'zh';
let quizAnswers = false;

const RHO = { copper: 1.68e-8, constantan: 4.9e-7, nichrome: 1.10e-6 };
const S = { mat: 'nichrome', L: 1, d: 0.4 };
function area() { const r = (S.d / 2) * 1e-3; return Math.PI * r * r; }
function resistance(L) { return RHO[S.mat] * L / area(); }
function fitCanvas(canvas, ratio) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(360, canvas.clientWidth || 720);
  const h = Math.max(280, Math.round(w * ratio));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function render() {
  const canvas = document.getElementById('plot');
  const { ctx, w, h } = fitCanvas(canvas, 0.62);
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(0, 0, w, h);
  const showWire = w > 680;
  const appW = showWire ? 268 : 0;
  const color = S.mat === 'copper' ? '#c2410c' : S.mat === 'constantan' ? '#64748b' : '#44403c';
  if (showWire) {
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(12, 12, appW, h - 24, 16);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.font = '600 13px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(I18N[lang][S.mat], 12 + appW / 2, 34);
    const rx = 32;
    const ry = Math.round(h * 0.42);
    const rw = appW - 40;
    const wood = ctx.createLinearGradient(0, ry, 0, ry + 28);
    wood.addColorStop(0, '#f5deb3');
    wood.addColorStop(1, '#d6b48c');
    ctx.fillStyle = wood;
    ctx.strokeStyle = '#a16207';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(rx, ry, rw, 28, 4);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#78350f';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    for (let i = 0; i <= 10; i++) {
      const x = rx + 8 + (rw - 16) * i / 10;
      ctx.beginPath();
      ctx.moveTo(x, ry + 2);
      ctx.lineTo(x, ry + (i % 5 === 0 ? 12 : 7));
      ctx.stroke();
    }
    const lenPx = 36 + (S.L / 2) * (rw - 56);
    const thick = 3 + S.d * 6;
    const x1 = rx + 18;
    const x2 = x1 + lenPx;
    const wy = ry - 18;
    const metal = ctx.createLinearGradient(0, wy - thick, 0, wy + thick);
    metal.addColorStop(0, '#fff');
    metal.addColorStop(0.45, color);
    metal.addColorStop(1, '#1c1917');
    ctx.strokeStyle = metal;
    ctx.lineWidth = thick;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, wy);
    ctx.lineTo(x2, wy);
    ctx.stroke();
    ctx.fillStyle = '#ca8a04';
    ctx.fillRect(x1 - 7, wy - 11, 10, 22);
    ctx.fillRect(x2 - 3, wy - 11, 10, 22);
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x1, wy + 16);
    ctx.lineTo(x2, wy + 16);
    ctx.moveTo(x1, wy + 11);
    ctx.lineTo(x1, wy + 21);
    ctx.moveTo(x2, wy + 11);
    ctx.lineTo(x2, wy + 21);
    ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.font = '12px sans-serif';
    ctx.fillText('L ' + S.L.toFixed(2) + ' m', (x1 + x2) / 2, wy + 32);
    const cr = 10 + S.d * 14;
    const ccx = 12 + appW / 2;
    const ccy = h - 78;
    const disc = ctx.createRadialGradient(ccx - cr * 0.3, ccy - cr * 0.3, 2, ccx, ccy, cr);
    disc.addColorStop(0, '#fff');
    disc.addColorStop(0.45, color);
    disc.addColorStop(1, '#1c1917');
    ctx.beginPath();
    ctx.arc(ccx, ccy, cr, 0, Math.PI * 2);
    ctx.fillStyle = disc;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0f172a';
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ccx - cr - 8, ccy);
    ctx.lineTo(ccx + cr + 8, ccy);
    ctx.moveTo(ccx - cr, ccy - 4);
    ctx.lineTo(ccx - cr, ccy + 4);
    ctx.moveTo(ccx + cr, ccy - 4);
    ctx.lineTo(ccx + cr, ccy + 4);
    ctx.stroke();
    ctx.font = '12px sans-serif';
    ctx.fillText('⌀ ' + S.d.toFixed(2) + ' mm', ccx, ccy + cr + 16);
    ctx.restore();
  }
  const rMax = resistance(2) * 1.15;
  const plotX = (showWire ? 28 + appW : 16) + 46;
  const plotY = 32;
  const plotW = Math.max(80, w - plotX - 24);
  const plotH = h - 78;
  const X = (L) => plotX + (L / 2) * plotW;
  const Y = (R) => plotY + plotH - (R / rMax) * plotH;
  ctx.fillStyle = '#fff';
  ctx.fillRect(plotX, plotY, plotW, plotH);
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#475569';
  for (let i = 0; i <= 4; i++) {
    const gx = plotX + plotW * i / 4;
    const gy = plotY + plotH * i / 4;
    ctx.beginPath();
    ctx.moveTo(gx, plotY);
    ctx.lineTo(gx, plotY + plotH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(plotX, gy);
    ctx.lineTo(plotX + plotW, gy);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillText((2 * i / 4).toFixed(1), gx, plotY + plotH + 16);
    ctx.textAlign = 'right';
    ctx.fillText((rMax * (4 - i) / 4).toFixed(2), plotX - 6, gy + 4);
  }
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(plotX, plotY);
  ctx.lineTo(plotX, plotY + plotH);
  ctx.lineTo(plotX + plotW, plotY + plotH);
  ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.font = '600 13px "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(lang === 'zh' ? '長度 L / m' : 'Length L / m', plotX + plotW / 2, h - 12);
  ctx.save();
  ctx.translate(plotX - 40, plotY + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(lang === 'zh' ? '電阻 R / Ω' : 'Resistance R / Ω', 0, 0);
  ctx.restore();
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(X(0), Y(0));
  ctx.lineTo(X(2), Y(resistance(2)));
  ctx.stroke();
  const R = resistance(S.L);
  ctx.fillStyle = '#0369a1';
  ctx.font = '700 12px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('0', X(0) + 8, Y(0) - 8);
  ctx.fillText('ρ/A', X(1.2), Y(resistance(1.2)) - 10);
  ctx.beginPath();
  ctx.arc(X(S.L), Y(R), 6, 0, Math.PI * 2);
  ctx.fillStyle = '#e11d48';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  document.getElementById('lValue').textContent = S.L.toFixed(2) + ' m';
  document.getElementById('dValue').textContent = S.d.toFixed(2) + ' mm';
  document.getElementById('note').textContent = I18N[lang].note;
  const slope = RHO[S.mat] / area();
  document.getElementById('readout').textContent =
    'R = ' + R.toFixed(3) + ' Ω,  A = ' + (area() * 1e6).toFixed(3) + ' mm²,  slope = ' + slope.toFixed(3) + ' Ω/m';
  document.querySelectorAll('.mat').forEach((btn) => {
    const on = btn.getAttribute('data-mat') === S.mat;
    btn.classList.toggle('border-sky-600', on);
    btn.classList.toggle('bg-sky-50', on);
  });
}
function resetSim() {
  S.mat = 'nichrome'; S.L = 1; S.d = 0.4;
  document.getElementById('lSlider').value = 1;
  document.getElementById('dSlider').value = 0.4;
  render();
}

function renderClassroom() {
  const steps = CLASSROOM.steps[lang];
  const principle = CLASSROOM.principle[lang];
  document.getElementById('steps-body').innerHTML = steps.map((s, i) => '<li>' + (i + 1) + '. ' + s + '</li>').join('');
  document.getElementById('principle-body').innerHTML = principle.map((s) => '<p>' + s + '</p>').join('');
  const labels = ['A', 'B', 'C', 'D'];
  document.getElementById('quiz-list').innerHTML = CLASSROOM.quiz.map((q, idx) => {
    const n = idx + 1;
    const open = n === 2 || n === 4;
    let choices = '';
    if (!open) {
      const arr = q[lang === 'zh' ? 'czh' : 'cen'];
      choices = '<div class="grid gap-1.5 mt-2">' + arr.map((text, i) =>
        '<label class="flex gap-2 items-start text-sm"><input type="radio" name="qq' + n + '"> <span>' + labels[i] + '. ' + text + '</span></label>'
      ).join('') + '</div>';
    }
    const ans = quizAnswers
      ? '<div class="mt-2 rounded-lg border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-sm"><strong>' + I18N[lang].answerLabel + '</strong> ' + q[lang === 'zh' ? 'azh' : 'aen'] + '</div>'
      : '';
    return '<article class="border border-slate-200 rounded-xl p-3 mb-2"><p class="text-sm"><strong>Q' + n + '.</strong> ' + q[lang] + '</p>' + choices + ans + '</article>';
  }).join('');
  document.getElementById('btn-quiz-answers').textContent = quizAnswers ? I18N[lang].hideAnswers : I18N[lang].showAnswers;
}
function setLang(next) {
  lang = next;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key] != null) el.innerHTML = I18N[lang][key];
  });
  document.getElementById('langZh').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'zh' ? 'bg-slate-900 text-white' : '');
  document.getElementById('langEn').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'en' ? 'bg-slate-900 text-white' : '');
  renderClassroom();
  render();
  if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(() => {});
}
function openModal(id) {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => {
    document.getElementById(mid).hidden = mid !== id;
  });
}
function closeModals() {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => { document.getElementById(mid).hidden = true; });
}
document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
document.getElementById('btn-quiz-answers').addEventListener('click', () => { quizAnswers = !quizAnswers; renderClassroom(); });
document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.querySelectorAll('[data-close]').forEach((btn) => btn.addEventListener('click', closeModals));
document.querySelectorAll('.lab-modal').forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) closeModals(); }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });
window.addEventListener('resize', () => render());

document.getElementById('lSlider').addEventListener('input', (e) => { S.L = Number(e.target.value); render(); });
document.getElementById('dSlider').addEventListener('input', (e) => { S.d = Number(e.target.value); render(); });
document.querySelectorAll('.mat').forEach((btn) => btn.addEventListener('click', () => { S.mat = btn.getAttribute('data-mat'); render(); }));
document.getElementById('btn-reset').addEventListener('click', resetSim);

setLang('zh');
</script>
</body>
</html>
