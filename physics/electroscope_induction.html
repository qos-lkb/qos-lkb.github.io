<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金箔驗電器 | Gold-Leaf Electroscope</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  .lab-modal[hidden] { display: none !important; }
  .lab-modal { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  input[type=range] { width: 100%; accent-color: #0284c7; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="max-w-7xl mx-auto mt-3 px-4 py-3 bg-white/90 backdrop-blur rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3 sticky top-2 z-20">
  <div>
    <p class="text-[11px] font-semibold tracking-wide text-sky-700" data-i18n="badge">物理</p>
    <h1 class="text-lg sm:text-xl font-bold" data-i18n="title"></h1>
  </div>
  <div class="flex flex-wrap gap-2">
    <button type="button" id="btn-steps" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-slate-100" data-i18n="btnSteps">觀察步驟</button>
    <button type="button" id="btn-principle" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-sky-600 text-white" data-i18n="btnPrinciple">原理解說</button>
    <button type="button" id="btn-quiz" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200" data-i18n="btnQuiz">課堂問題</button>
    <div class="flex rounded-full border border-slate-200 overflow-hidden">
      <button type="button" id="langZh" class="px-3 py-1.5 text-sm font-semibold bg-slate-900 text-white">中</button>
      <button type="button" id="langEn" class="px-3 py-1.5 text-sm font-semibold">EN</button>
    </div>
  </div>
</header>
<main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
  <aside class="lg:col-span-4 order-2 lg:order-1 bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
    
    <div>
      <p class="text-sm font-semibold mb-2" data-i18n="rodLabel"></p>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="rodPos" class="px-3 py-2 rounded-xl border text-sm font-semibold" data-i18n="rodPos"></button>
        <button type="button" id="rodNeg" class="px-3 py-2 rounded-xl border text-sm font-semibold" data-i18n="rodNeg"></button>
      </div>
    </div>
    <div>
      <p class="text-sm font-semibold mb-2" data-i18n="methodLabel"></p>
      <div class="grid gap-2">
        <button type="button" data-mode="friction" class="mode px-3 py-2 rounded-xl border text-sm text-left" data-i18n="modeFriction"></button>
        <button type="button" data-mode="contact" class="mode px-3 py-2 rounded-xl border text-sm text-left" data-i18n="modeContact"></button>
        <button type="button" data-mode="induction" class="mode px-3 py-2 rounded-xl border text-sm text-left" data-i18n="modeInduction"></button>
      </div>
    </div>
    <div id="induction-steps" class="grid gap-2">
      <button type="button" data-step="1" class="step px-3 py-2 rounded-xl border text-sm text-left" data-i18n="stepNear"></button>
      <button type="button" data-step="2" class="step px-3 py-2 rounded-xl border text-sm text-left" data-i18n="stepGround"></button>
      <button type="button" data-step="3" class="step px-3 py-2 rounded-xl border text-sm text-left" data-i18n="stepUnground"></button>
      <button type="button" data-step="4" class="step px-3 py-2 rounded-xl border text-sm text-left" data-i18n="stepRemove"></button>
    </div>
    <button type="button" id="btn-reset" class="w-full px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold" data-i18n="reset"></button>
    <p id="status" class="text-sm leading-relaxed bg-slate-50 rounded-xl p-3"></p>
    
  </aside>
  <section class="lg:col-span-8 order-1 lg:order-2 bg-white rounded-2xl border border-slate-200 p-4" aria-label="simulation">
    
    <canvas id="stage" class="w-full rounded-xl border border-slate-100" width="720" height="420"></canvas>
    <p id="charge-readout" class="mt-3 text-sm font-medium"></p>
    
  </section>
</main>
<div id="modal-steps" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="steps-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="steps-title" class="text-lg font-bold" data-i18n="stepsTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <ol id="steps-body" class="list-decimal pl-5 space-y-1 text-sm"></ol>
  </div>
</div>
<div id="modal-principle" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="principle-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="principle-title" class="text-lg font-bold" data-i18n="principleTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="principle-body" class="space-y-2 text-sm"></div>
  </div>
</div>
<div id="modal-quiz" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="quiz-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="quiz-title" class="text-lg font-bold" data-i18n="quizTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="quiz-list"></div>
    <button type="button" id="btn-quiz-answers" class="mt-2 px-3 py-1.5 rounded-lg bg-slate-900 text-white text-sm"></button>
  </div>
</div>
<script>
const I18N = {"zh": {"badge": "物理", "btnSteps": "觀察步驟", "btnPrinciple": "原理解說", "btnQuiz": "課堂問題", "stepsTitle": "觀察步驟", "principleTitle": "原理解說", "quizTitle": "課堂問題", "showAnswers": "顯示參考答案", "hideAnswers": "隱藏參考答案", "answerLabel": "參考答案", "reset": "重置", "title": "金箔驗電器", "rodLabel": "棒的電荷", "rodPos": "正電棒", "rodNeg": "負電棒", "methodLabel": "起電方法", "modeFriction": "摩擦：棒帶電，驗電器仍中性", "modeContact": "接觸：棒碰到金屬蓋", "modeInduction": "感應：按下面四步", "stepNear": "1. 棒移近金屬蓋", "stepGround": "2. 手指接地", "stepUnground": "3. 先移開手指", "stepRemove": "4. 再移走棒", "neutral": "中性", "positive": "正", "negative": "負", "readLeaves": "箔片", "statusFriction": "摩擦只令棒帶電。驗電器淨電荷仍是零，金箔合上。", "statusContact": "接觸後電荷由棒傳到驗電器。箔片與棒同號，所以張開。", "status0": "先把帶電棒移近，先不要碰到金屬蓋。", "status1": "棒移近後，近端感應出相反電荷，箔片帶與棒相同的電荷，所以張開。淨電荷仍是零。", "status2": "手指接地時，箔片上與棒同號的電荷流走，金箔合上。近端仍留著相反電荷。", "status3": "手指移開後，電荷被困在驗電器。棒仍在附近，金箔保持合上。", "status4": "棒移走後，剩下的電荷分佈到箔片。箔片與棒相反，所以再度張開。"}, "en": {"badge": "Physics", "btnSteps": "Steps", "btnPrinciple": "Principle", "btnQuiz": "Quiz", "stepsTitle": "Steps", "principleTitle": "Principle", "quizTitle": "Quiz", "showAnswers": "Show answers", "hideAnswers": "Hide answers", "answerLabel": "Answer", "reset": "Reset", "title": "Gold-Leaf Electroscope", "rodLabel": "Rod charge", "rodPos": "Positive rod", "rodNeg": "Negative rod", "methodLabel": "Charging method", "modeFriction": "Friction: rod charged, electroscope neutral", "modeContact": "Contact: rod touches the cap", "modeInduction": "Induction: follow the four steps", "stepNear": "1. Bring the rod near the cap", "stepGround": "2. Earth with a finger", "stepUnground": "3. Remove the finger first", "stepRemove": "4. Then remove the rod", "neutral": "neutral", "positive": "positive", "negative": "negative", "readLeaves": "Leaves", "statusFriction": "Friction charges only the rod. The electroscope stays neutral and the leaves stay closed.", "statusContact": "Contact shares the rod's charge with the electroscope. The leaves have the same sign and diverge.", "status0": "Bring the charged rod near without touching the cap.", "status1": "The near end gains the opposite charge. The leaves gain the same sign as the rod and diverge. The net charge is still zero.", "status2": "Earthing lets the like charge on the leaves flow away, so the leaves collapse. The opposite charge stays on the cap.", "status3": "After the finger leaves, the charge is trapped. The rod is still nearby, so the leaves stay closed.", "status4": "When the rod is removed, the remaining charge spreads to the leaves. They have the opposite sign and diverge again."}};
const CLASSROOM = {"steps": {"zh": ["選正電棒，保持「摩擦」，確認金箔合上。", "改按「接觸」，看箔片與棒同號並張開。", "改選負電棒再接觸，看張開方向仍由電荷正負決定，箔片換成負。", "改按「感應」，依序按 1 到 4。", "把棒由正改負，重做感應，比較最後箔片的正負。"], "en": ["Choose a positive rod and stay on Friction. The leaves stay closed.", "Switch to Contact and see the leaves take the rod's sign.", "Change the rod to negative and touch again.", "Switch to Induction and press steps 1 to 4 in order.", "Flip the rod's sign and repeat induction. Compare the final leaf charge."]}, "principle": {"zh": ["同號相斥，金箔帶電就張開。張開的大小看電荷多少，正負則看箔片的符號。", "接觸起電：驗電器與棒同號。", "感應起電要先接地再移開手指，最後移走棒。驗電器得到與棒相反的電荷。"], "en": ["Like charges repel, so charged leaves diverge. The sign of the leaves tells positive from negative.", "Charging by contact gives the electroscope the same sign as the rod.", "Induction needs earthing before the finger and the rod are removed. The electroscope ends with the opposite sign."]}, "quiz": [{"zh": "只摩擦棒、尚未接觸驗電器時，金箔？", "en": "If only the rod is charged and it has not touched the electroscope, the leaves?", "azh": "A。驗電器仍中性。", "aen": "A. The electroscope is still neutral.", "czh": ["合上", "一定張開且帶正電", "一定張開且帶負電", "消失"], "cen": ["Stay closed", "Must diverge and become positive", "Must diverge and become negative", "Disappear"], "ans": 0}, {"zh": "先預測正電棒接觸後箔片帶正電並張開，再按「接觸」核對。", "en": "Predict that a positive rod makes the leaves positive, then press Contact.", "azh": "接觸後箔片與棒同號，所以張開。", "aen": "After contact the leaves have the same sign as the rod and diverge."}, {"zh": "感應起電完成後，驗電器的電荷與棒？", "en": "After induction is complete, the electroscope's charge is?", "azh": "B。", "aen": "B.", "czh": ["同號", "異號", "一定是零", "一定比棒多"], "cen": ["The same sign", "The opposite sign", "Certainly zero", "Certainly larger than the rod"], "ans": 1}, {"zh": "先預測手指接地時金箔會合上，再按「手指接地」。", "en": "Predict that the leaves collapse while a finger earths the cap, then press that step.", "azh": "接地讓箔片上的同號電荷流走，金箔合上。", "aen": "Earthing lets the like charge leave the leaves, so they collapse."}, {"zh": "感應步驟中，應先移開的是？", "en": "During induction, which should be removed first?", "azh": "A。先移開手指，再移走棒。", "aen": "A. Remove the finger before the rod.", "czh": ["手指", "棒", "金屬蓋", "金箔"], "cen": ["The finger", "The rod", "The metal cap", "The gold leaves"], "ans": 0}]};
let lang = 'zh';
let quizAnswers = false;

const S = { rod: 1, mode: 'friction', step: 0 };
function signWord(v) {
  if (v > 0) return I18N[lang].positive;
  if (v < 0) return I18N[lang].negative;
  return I18N[lang].neutral;
}
function leafCharge() {
  if (S.mode === 'friction') return 0;
  if (S.mode === 'contact') return S.rod;
  if (S.step <= 0) return 0;
  if (S.step === 1) return S.rod;
  if (S.step === 2 || S.step === 3) return 0;
  return -S.rod;
}
function fitCanvas(canvas, ratio) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(360, canvas.clientWidth || 720);
  const h = Math.max(280, Math.round(w * ratio));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function rr(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function render() {
  const q = leafCharge();
  const canvas = document.getElementById('stage');
  const { ctx, w, h } = fitCanvas(canvas, 0.56);
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#e0f2fe');
  sky.addColorStop(1, '#f8fafc');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  const baseY = h * 0.84;
  ctx.fillStyle = '#d6c3a1';
  ctx.fillRect(0, baseY, w, h - baseY);
  ctx.fillStyle = '#c4ae88';
  ctx.fillRect(0, baseY, w, 8);
  const near = S.mode === 'contact' || (S.mode === 'induction' && S.step >= 1 && S.step <= 3);
  const cx = w * 0.58;
  const jarW = Math.min(190, w * 0.28);
  const jarH = h * 0.5;
  const jarX = cx - jarW / 2;
  const jarY = baseY - jarH;
  ctx.save();
  rr(ctx, jarX, jarY + 26, jarW, jarH - 26, 22);
  ctx.fillStyle = 'rgba(186,230,253,0.55)';
  ctx.fill();
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  rr(ctx, jarX + 12, jarY + 52, 8, jarH * 0.45, 4);
  ctx.fill();
  ctx.restore();
  const capW = jarW * 0.7;
  const brass = ctx.createLinearGradient(0, jarY, 0, jarY + 24);
  brass.addColorStop(0, '#fcd34d');
  brass.addColorStop(1, '#b45309');
  ctx.fillStyle = brass;
  rr(ctx, cx - capW / 2, jarY, capW, 24, 6);
  ctx.fill();
  ctx.fillStyle = '#78716c';
  ctx.fillRect(cx - 4, jarY + 22, 8, 48);
  const spread = Math.min(0.72, Math.abs(q) * 0.58);
  const len = jarH * 0.4;
  [-1, 1].forEach((sign) => {
    ctx.save();
    ctx.translate(cx, jarY + 66);
    ctx.rotate(sign * spread);
    const g = ctx.createLinearGradient(0, 0, 0, len);
    g.addColorStop(0, '#fef3c7');
    g.addColorStop(1, '#d97706');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-2, 0);
    ctx.quadraticCurveTo(sign * 14, len * 0.5, sign * 3, len);
    ctx.lineTo(-sign * 1, len - 2);
    ctx.quadraticCurveTo(sign * -6, len * 0.4, 2, 0);
    ctx.fill();
    ctx.restore();
  });
  if (q !== 0) {
    ctx.fillStyle = q > 0 ? '#b91c1c' : '#1d4ed8';
    ctx.font = '700 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(q > 0 ? '+' : '−', cx, jarY + 70 + len + 8);
  }
  const rodX = near ? cx - capW / 2 - 78 : w * 0.12;
  ctx.fillStyle = S.rod > 0 ? '#ef4444' : '#2563eb';
  rr(ctx, rodX, jarY - 18, 28, 156, 14);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '700 16px sans-serif';
  ctx.textAlign = 'center';
  const mark = S.rod > 0 ? '+' : '−';
  for (let i = 0; i < 4; i++) ctx.fillText(mark, rodX + 12, jarY + 22 + i * 30);
  ctx.save();
  ctx.fillStyle = '#fde68a';
  ctx.beginPath();
  ctx.ellipse(cx, jarY + 3, capW * 0.48, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#b45309';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#92400e';
  rr(ctx, rodX - 10, jarY + 122, 48, 18, 8);
  ctx.fill();
  ctx.restore();
  if (S.mode === 'induction' && S.step === 2) {
    ctx.fillStyle = '#fdba74';
    rr(ctx, cx + capW / 2 - 6, jarY - 6, 78, 20, 10);
    ctx.fill();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    const earthX = Math.min(w - 28, cx + capW / 2 + 110);
    ctx.beginPath();
    ctx.moveTo(cx + capW / 2 + 70, jarY + 4);
    ctx.lineTo(earthX, jarY + 4);
    ctx.lineTo(earthX, baseY - 8);
    ctx.moveTo(earthX - 16, baseY - 8);
    ctx.lineTo(earthX + 16, baseY - 8);
    ctx.moveTo(earthX - 10, baseY - 2);
    ctx.lineTo(earthX + 10, baseY - 2);
    ctx.moveTo(earthX - 4, baseY + 4);
    ctx.lineTo(earthX + 4, baseY + 4);
    ctx.stroke();
  }
  document.getElementById('induction-steps').classList.toggle('hidden', S.mode !== 'induction');
  const key = S.mode === 'friction' ? 'statusFriction' : S.mode === 'contact' ? 'statusContact' : ('status' + S.step);
  document.getElementById('status').textContent = I18N[lang][key];
  document.getElementById('charge-readout').textContent = I18N[lang].readLeaves + ': ' + signWord(q);
  document.querySelectorAll('.mode').forEach((btn) => {
    const on = btn.getAttribute('data-mode') === S.mode;
    btn.classList.toggle('border-sky-600', on);
    btn.classList.toggle('bg-sky-50', on);
  });
  document.getElementById('rodPos').classList.toggle('bg-rose-50', S.rod > 0);
  document.getElementById('rodNeg').classList.toggle('bg-sky-50', S.rod < 0);
}
function resetSim() { S.rod = 1; S.mode = 'friction'; S.step = 0; render(); }

function renderClassroom() {
  const steps = CLASSROOM.steps[lang];
  const principle = CLASSROOM.principle[lang];
  document.getElementById('steps-body').innerHTML = steps.map((s, i) => '<li>' + (i + 1) + '. ' + s + '</li>').join('');
  document.getElementById('principle-body').innerHTML = principle.map((s) => '<p>' + s + '</p>').join('');
  const labels = ['A', 'B', 'C', 'D'];
  document.getElementById('quiz-list').innerHTML = CLASSROOM.quiz.map((q, idx) => {
    const n = idx + 1;
    const open = n === 2 || n === 4;
    let choices = '';
    if (!open) {
      const arr = q[lang === 'zh' ? 'czh' : 'cen'];
      choices = '<div class="grid gap-1.5 mt-2">' + arr.map((text, i) =>
        '<label class="flex gap-2 items-start text-sm"><input type="radio" name="qq' + n + '"> <span>' + labels[i] + '. ' + text + '</span></label>'
      ).join('') + '</div>';
    }
    const ans = quizAnswers
      ? '<div class="mt-2 rounded-lg border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-sm"><strong>' + I18N[lang].answerLabel + '</strong> ' + q[lang === 'zh' ? 'azh' : 'aen'] + '</div>'
      : '';
    return '<article class="border border-slate-200 rounded-xl p-3 mb-2"><p class="text-sm"><strong>Q' + n + '.</strong> ' + q[lang] + '</p>' + choices + ans + '</article>';
  }).join('');
  document.getElementById('btn-quiz-answers').textContent = quizAnswers ? I18N[lang].hideAnswers : I18N[lang].showAnswers;
}
function setLang(next) {
  lang = next;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key] != null) el.innerHTML = I18N[lang][key];
  });
  document.getElementById('langZh').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'zh' ? 'bg-slate-900 text-white' : '');
  document.getElementById('langEn').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'en' ? 'bg-slate-900 text-white' : '');
  renderClassroom();
  render();
  if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(() => {});
}
function openModal(id) {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => {
    document.getElementById(mid).hidden = mid !== id;
  });
}
function closeModals() {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => { document.getElementById(mid).hidden = true; });
}
document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
document.getElementById('btn-quiz-answers').addEventListener('click', () => { quizAnswers = !quizAnswers; renderClassroom(); });
document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.querySelectorAll('[data-close]').forEach((btn) => btn.addEventListener('click', closeModals));
document.querySelectorAll('.lab-modal').forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) closeModals(); }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });

document.getElementById('rodPos').addEventListener('click', () => { S.rod = 1; render(); });
document.getElementById('rodNeg').addEventListener('click', () => { S.rod = -1; render(); });
document.querySelectorAll('.mode').forEach((btn) => btn.addEventListener('click', () => { S.mode = btn.getAttribute('data-mode'); S.step = 0; render(); }));
document.querySelectorAll('.step').forEach((btn) => btn.addEventListener('click', () => { S.step = Number(btn.getAttribute('data-step')); render(); }));
document.getElementById('btn-reset').addEventListener('click', resetSim);
window.addEventListener('resize', () => render());

setLang('zh');
</script>
</body>
</html>
