<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分壓器 | Potential Divider</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sim-mathjax.css">
<script>
  MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  .lab-modal[hidden] { display: none !important; }
  .lab-modal { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  input[type=range] { width: 100%; accent-color: #0284c7; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="max-w-7xl mx-auto mt-3 px-4 py-3 bg-white/90 backdrop-blur rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3 sticky top-2 z-20">
  <div>
    <p class="text-[11px] font-semibold tracking-wide text-sky-700" data-i18n="badge">物理</p>
    <h1 class="text-lg sm:text-xl font-bold" data-i18n="title"></h1>
  </div>
  <div class="flex flex-wrap gap-2">
    <button type="button" id="btn-steps" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-slate-100" data-i18n="btnSteps">觀察步驟</button>
    <button type="button" id="btn-principle" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-sky-600 text-white" data-i18n="btnPrinciple">原理解說</button>
    <button type="button" id="btn-quiz" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200" data-i18n="btnQuiz">課堂問題</button>
    <div class="flex rounded-full border border-slate-200 overflow-hidden">
      <button type="button" id="langZh" class="px-3 py-1.5 text-sm font-semibold bg-slate-900 text-white">中</button>
      <button type="button" id="langEn" class="px-3 py-1.5 text-sm font-semibold">EN</button>
    </div>
  </div>
</header>
<main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
  <aside class="lg:col-span-4 order-2 lg:order-1 bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
    
    <label class="block text-sm font-semibold" data-i18n="vinLabel"></label>
    <input id="vin" type="range" min="1" max="12" step="0.1" value="6">
    <p id="vinValue" class="text-sm text-slate-600"></p>
    <label class="block text-sm font-semibold" data-i18n="r1Label"></label>
    <input id="r1" type="range" min="100" max="1000" step="10" value="400">
    <p id="r1Value" class="text-sm text-slate-600"></p>
    <label class="block text-sm font-semibold" data-i18n="r2Label"></label>
    <input id="r2" type="range" min="100" max="1000" step="10" value="600">
    <p id="r2Value" class="text-sm text-slate-600"></p>
    <button type="button" id="btn-reset" class="w-full px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold" data-i18n="reset"></button>
    
  </aside>
  <section class="lg:col-span-8 order-1 lg:order-2 bg-white rounded-2xl border border-slate-200 p-4" aria-label="simulation">
    
    <p class="text-sm mb-2" data-i18n="formula"></p>
    <canvas id="stage" class="w-full rounded-xl border border-slate-100" width="720" height="380"></canvas>
    <p id="readout" class="mt-3 text-sm leading-relaxed"></p>
    
  </section>
</main>
<div id="modal-steps" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="steps-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="steps-title" class="text-lg font-bold" data-i18n="stepsTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <ol id="steps-body" class="list-decimal pl-5 space-y-1 text-sm"></ol>
  </div>
</div>
<div id="modal-principle" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="principle-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="principle-title" class="text-lg font-bold" data-i18n="principleTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="principle-body" class="space-y-2 text-sm"></div>
  </div>
</div>
<div id="modal-quiz" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="quiz-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="quiz-title" class="text-lg font-bold" data-i18n="quizTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="quiz-list"></div>
    <button type="button" id="btn-quiz-answers" class="mt-2 px-3 py-1.5 rounded-lg bg-slate-900 text-white text-sm"></button>
  </div>
</div>
<script>
const I18N = {"zh": {"badge": "物理", "btnSteps": "觀察步驟", "btnPrinciple": "原理解說", "btnQuiz": "課堂問題", "stepsTitle": "觀察步驟", "principleTitle": "原理解說", "quizTitle": "課堂問題", "showAnswers": "顯示參考答案", "hideAnswers": "隱藏參考答案", "answerLabel": "參考答案", "reset": "重置", "title": "分壓器", "vinLabel": "輸入電壓 Vin", "r1Label": "上方電阻 R1", "r2Label": "下方電阻 R2", "formula": "\\(V_{out} = V_{in}\\dfrac{R_2}{R_1+R_2}\\)", "across": "輸出取在 R2 兩端。"}, "en": {"badge": "Physics", "btnSteps": "Steps", "btnPrinciple": "Principle", "btnQuiz": "Quiz", "stepsTitle": "Steps", "principleTitle": "Principle", "quizTitle": "Quiz", "showAnswers": "Show answers", "hideAnswers": "Hide answers", "answerLabel": "Answer", "reset": "Reset", "title": "Potential Divider", "vinLabel": "Input voltage Vin", "r1Label": "Upper resistor R1", "r2Label": "Lower resistor R2", "formula": "\\(V_{out} = V_{in}\\dfrac{R_2}{R_1+R_2}\\)", "across": "The output is taken across R2."}};
const CLASSROOM = {"steps": {"zh": ["固定兩隻電阻，把 Vin 由小調大，看 Vout 跟著上升。", "只加大 R2，看 Vout 佔 Vin 的比例上升。", "只加大 R1，看 Vout 下降。", "把 R1 調成等於 R2，看 Vout 是否約為 Vin 的一半。", "再改其中一隻電阻，確認比例由 R2/(R1+R2) 決定。"], "en": ["Keep both resistors fixed and raise Vin. Vout rises with it.", "Increase only R2 and watch Vout take a larger share of Vin.", "Increase only R1 and watch Vout fall.", "Set R1 equal to R2 and check that Vout is about half of Vin.", "Change one resistor again and confirm the fraction is R2/(R1+R2)."]}, "principle": {"zh": ["兩電阻串聯，電流相同，電壓按電阻比例分配。", "若輸出取在 R2，\\(V_{out} = V_{in} R_2/(R_1+R_2)\\)。", "只改一隻電阻或只改 Vin，就可以看出誰影響輸出。"], "en": ["Two resistors in series carry the same current, so the voltage splits in proportion to resistance.", "If the output is across R2, \\(V_{out} = V_{in} R_2/(R_1+R_2)\\).", "Changing one resistor, or only Vin, shows what controls the output."]}, "quiz": [{"zh": "R1 = R2 時，Vout 約是 Vin 的？", "en": "When R1 = R2, Vout is about?", "azh": "B。", "aen": "B.", "czh": ["全部", "一半", "四分之一", "零"], "cen": ["All of Vin", "Half of Vin", "A quarter of Vin", "Zero"], "ans": 1}, {"zh": "先預測只加大 R2 會令 Vout 上升，再調 R2。", "en": "Predict that increasing only R2 raises Vout, then move R2.", "azh": "R2 佔總電阻的比例變大，Vout 上升。", "aen": "R2 takes a larger share of the total resistance, so Vout rises."}, {"zh": "只把 Vin 加倍，R1 和 R2 不變，Vout 會？", "en": "If only Vin is doubled and both resistors stay the same, Vout will?", "azh": "A。", "aen": "A.", "czh": ["加倍", "減半", "不變", "變為零"], "cen": ["Double", "Halve", "Stay the same", "Become zero"], "ans": 0}, {"zh": "先預測只加大 R1 會令 Vout 下降，再調 R1。", "en": "Predict that increasing only R1 lowers Vout, then move R1.", "azh": "R1 變大時，R2 所佔比例變小，Vout 下降。", "aen": "A larger R1 gives R2 a smaller fraction, so Vout falls."}, {"zh": "分壓器的輸出取在哪一隻電阻兩端？", "en": "The output of this divider is taken across which resistor?", "azh": "B。", "aen": "B.", "czh": ["R1", "R2", "兩隻並聯的總電阻", "電源內阻"], "cen": ["R1", "R2", "The parallel combination", "The internal resistance"], "ans": 1}]};
let lang = 'zh';
let quizAnswers = false;

const S = { Vin: 6, R1: 400, R2: 600 };
function fitCanvas(canvas, ratio) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(360, canvas.clientWidth || 720);
  const h = Math.max(260, Math.round(w * ratio));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function zigzagH(ctx, x1, x2, y, amp) {
  const n = 7;
  ctx.beginPath();
  ctx.moveTo(x1, y);
  for (let i = 1; i <= n; i++) {
    const x = x1 + (x2 - x1) * i / n;
    const yy = y + (i % 2 === 0 ? amp : -amp);
    ctx.lineTo(i === n ? x2 : x, i === n ? y : yy);
  }
  ctx.stroke();
}
function zigzagV(ctx, x, y1, y2, amp) {
  const n = 7;
  ctx.beginPath();
  ctx.moveTo(x, y1);
  for (let i = 1; i <= n; i++) {
    const y = y1 + (y2 - y1) * i / n;
    const xx = x + (i % 2 === 0 ? amp : -amp);
    ctx.lineTo(i === n ? x : xx, i === n ? y2 : y);
  }
  ctx.stroke();
}
function zz(ctx, x1, y1, x2, y2, amp, n) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    const side = i === n ? 0 : (i % 2 ? amp : -amp);
    ctx.lineTo(x1 + dx * t + nx * side, y1 + dy * t + ny * side);
  }
  ctx.stroke();
}
function render() {
  const vout = S.Vin * S.R2 / (S.R1 + S.R2);
  const canvas = document.getElementById('stage');
  const { ctx, w, h } = fitCanvas(canvas, 0.56);
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, w, h);
  const x0 = 78;
  const yTop = 56;
  const yBot = h - 108;
  const xR = w - 148;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x0, yBot);
  ctx.lineTo(x0, yTop);
  ctx.lineTo(x0 + 22, yTop);
  ctx.stroke();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#b91c1c';
  ctx.beginPath();
  ctx.moveTo(x0 + 26, yTop - 16);
  ctx.lineTo(x0 + 26, yTop + 16);
  ctx.stroke();
  ctx.strokeStyle = '#1d4ed8';
  ctx.beginPath();
  ctx.moveTo(x0 + 38, yTop - 8);
  ctx.lineTo(x0 + 38, yTop + 8);
  ctx.stroke();
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x0 + 38, yTop);
  ctx.lineTo(x0 + 56, yTop);
  ctx.stroke();
  const teeth1 = 4 + Math.round(S.R1 / 180);
  zz(ctx, x0 + 56, yTop, xR - 24, yTop, 11, teeth1);
  ctx.beginPath();
  ctx.moveTo(xR - 24, yTop);
  ctx.lineTo(xR, yTop);
  ctx.lineTo(xR, yTop + 28);
  ctx.stroke();
  const teeth2 = 4 + Math.round(S.R2 / 180);
  zz(ctx, xR, yTop + 42, xR, yBot - 28, 11, teeth2);
  ctx.beginPath();
  ctx.moveTo(xR, yBot - 14);
  ctx.lineTo(xR, yBot);
  ctx.lineTo(x0, yBot);
  ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.font = '600 13px "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Vin ' + S.Vin.toFixed(1) + ' V', x0 + 8, yBot + 22);
  ctx.fillText('R1 ' + S.R1.toFixed(0) + ' Ω', (x0 + 70 + xR) / 2, yTop - 18);
  ctx.textAlign = 'right';
  ctx.fillText('R2 ' + S.R2.toFixed(0) + ' Ω', xR - 16, (yTop + yBot) / 2);
  const meterX = xR + 62;
  const meterY = (yTop + yBot) / 2;
  const meterR = 30;
  ctx.beginPath();
  ctx.arc(meterX, meterY, meterR, Math.PI, Math.PI * 2, false);
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 2;
  ctx.stroke();
  for (let i = 0; i <= 4; i++) {
    const a = Math.PI + Math.PI * i / 4;
    ctx.beginPath();
    ctx.moveTo(meterX + Math.cos(a) * (meterR - 8), meterY + Math.sin(a) * (meterR - 8));
    ctx.lineTo(meterX + Math.cos(a) * meterR, meterY + Math.sin(a) * meterR);
    ctx.stroke();
  }
  const frac = S.Vin > 0 ? vout / S.Vin : 0;
  const ang = Math.PI + frac * Math.PI;
  ctx.beginPath();
  ctx.moveTo(meterX, meterY);
  ctx.lineTo(meterX + Math.cos(ang) * (meterR - 6), meterY + Math.sin(ang) * (meterR - 6));
  ctx.strokeStyle = '#e11d48';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(meterX, meterY, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#0f172a';
  ctx.fill();
  ctx.fillStyle = '#0369a1';
  ctx.font = '700 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('V', meterX, meterY + 16);
  ctx.font = '600 12px sans-serif';
  ctx.fillText(vout.toFixed(2) + ' V', meterX, meterY + 32);
  ctx.strokeStyle = '#0284c7';
  ctx.setLineDash([4, 3]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(xR, yTop + 18);
  ctx.lineTo(meterX - meterR, yTop + 18);
  ctx.lineTo(meterX - meterR, meterY - meterR + 2);
  ctx.moveTo(xR, yBot - 10);
  ctx.lineTo(meterX - meterR, yBot - 10);
  ctx.lineTo(meterX - meterR, meterY + meterR - 2);
  ctx.stroke();
  ctx.setLineDash([]);
  document.getElementById('vinValue').textContent = S.Vin.toFixed(1) + ' V';
  document.getElementById('r1Value').textContent = S.R1.toFixed(0) + ' Ω';
  document.getElementById('r2Value').textContent = S.R2.toFixed(0) + ' Ω';
  document.getElementById('readout').textContent = 'Vout = ' + vout.toFixed(2) + ' V. ' + I18N[lang].across;
}
function resetSim() {
  S.Vin = 6; S.R1 = 400; S.R2 = 600;
  document.getElementById('vin').value = 6;
  document.getElementById('r1').value = 400;
  document.getElementById('r2').value = 600;
  render();
}

function renderClassroom() {
  const steps = CLASSROOM.steps[lang];
  const principle = CLASSROOM.principle[lang];
  document.getElementById('steps-body').innerHTML = steps.map((s, i) => '<li>' + (i + 1) + '. ' + s + '</li>').join('');
  document.getElementById('principle-body').innerHTML = principle.map((s) => '<p>' + s + '</p>').join('');
  const labels = ['A', 'B', 'C', 'D'];
  document.getElementById('quiz-list').innerHTML = CLASSROOM.quiz.map((q, idx) => {
    const n = idx + 1;
    const open = n === 2 || n === 4;
    let choices = '';
    if (!open) {
      const arr = q[lang === 'zh' ? 'czh' : 'cen'];
      choices = '<div class="grid gap-1.5 mt-2">' + arr.map((text, i) =>
        '<label class="flex gap-2 items-start text-sm"><input type="radio" name="qq' + n + '"> <span>' + labels[i] + '. ' + text + '</span></label>'
      ).join('') + '</div>';
    }
    const ans = quizAnswers
      ? '<div class="mt-2 rounded-lg border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-sm"><strong>' + I18N[lang].answerLabel + '</strong> ' + q[lang === 'zh' ? 'azh' : 'aen'] + '</div>'
      : '';
    return '<article class="border border-slate-200 rounded-xl p-3 mb-2"><p class="text-sm"><strong>Q' + n + '.</strong> ' + q[lang] + '</p>' + choices + ans + '</article>';
  }).join('');
  document.getElementById('btn-quiz-answers').textContent = quizAnswers ? I18N[lang].hideAnswers : I18N[lang].showAnswers;
}
function setLang(next) {
  lang = next;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key] != null) el.innerHTML = I18N[lang][key];
  });
  document.getElementById('langZh').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'zh' ? 'bg-slate-900 text-white' : '');
  document.getElementById('langEn').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'en' ? 'bg-slate-900 text-white' : '');
  renderClassroom();
  render();
  if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(() => {});
}
function openModal(id) {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => {
    document.getElementById(mid).hidden = mid !== id;
  });
}
function closeModals() {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => { document.getElementById(mid).hidden = true; });
}
document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
document.getElementById('btn-quiz-answers').addEventListener('click', () => { quizAnswers = !quizAnswers; renderClassroom(); });
document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.querySelectorAll('[data-close]').forEach((btn) => btn.addEventListener('click', closeModals));
document.querySelectorAll('.lab-modal').forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) closeModals(); }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });
window.addEventListener('resize', () => render());

document.getElementById('vin').addEventListener('input', (e) => { S.Vin = Number(e.target.value); render(); });
document.getElementById('r1').addEventListener('input', (e) => { S.R1 = Number(e.target.value); render(); });
document.getElementById('r2').addEventListener('input', (e) => { S.R2 = Number(e.target.value); render(); });
document.getElementById('btn-reset').addEventListener('click', resetSim);

setLang('zh');
</script>
</body>
</html>
