<script>
(function () {
  const pack = {"title": {"zh": "平行載流導線", "en": "Parallel Current-Carrying Wires"}, "grade": {"zh": "物理", "en": "Physics"}, "steps": {"zh": ["用俯視看兩條導線的電流方向。", "把兩電流改成同向，看磁力線與受力是相吸還是相斥。", "改成反向，再看一次。", "切到側視，重置後重做同向。"], "en": ["Use the top view and note the two current directions.", "Set the currents in the same direction and see whether the wires attract or repel.", "Reverse one current and look again.", "Switch to the side view, reset, and repeat the same-direction case."]}, "principle": {"zh": ["每條載流導線在周圍產生圓形磁場。另一條導線處在這個磁場裡，就受到電動機效應的力。", "電流同向時兩線相吸，反向時相斥。", "安培的定義就和兩條平行載流導線之間的力有關。高壓電纜並排時也要考慮這個力。"], "en": ["Each current produces a circular field. The other wire sits in that field and feels a motor-effect force.", "Currents in the same direction attract. Opposite currents repel.", "The force between parallel wires is the historical basis of the ampere."]}, "quiz": [{"zh": "兩條平行導線電流同向時，它們會？", "en": "Two parallel wires with currents in the same direction will?", "azh": "A。", "aen": "A.", "czh": ["相吸", "相斥", "完全無力", "變成絕緣體"], "cen": ["Attract", "Repel", "Feel no force", "Become insulators"], "ans": 0}, {"zh": "先預測電流改成反向時變為相斥，再改其中一條的電流方向。", "en": "Predict repulsion when the currents are opposite, then reverse one current.", "azh": "反向電流相斥。", "aen": "Opposite currents repel."}, {"zh": "力的來歷是？", "en": "The force exists because?", "azh": "B。", "aen": "B.", "czh": ["兩條導線帶有靜電荷", "一條導線的磁場對另一條的電流施力", "地球磁場一定是零", "導線沒有電子"], "cen": ["The wires carry static charge", "The field of one wire exerts a force on the current in the other", "Earth's field must be zero", "The wires have no electrons"], "ans": 1}, {"zh": "比較俯視和側視。先預測受力方向的結論不變，再切換視角。", "en": "Compare the top and side views. Predict the same attract-or-repel conclusion, then switch view.", "azh": "視角改變畫面，不改變同向相吸、反向相斥。", "aen": "The view changes the picture, not the rule."}, {"zh": "若兩電流都加大，互相的力通常？", "en": "If both currents increase, the force between the wires usually?", "azh": "B。力與兩電流的乘積成正比。", "aen": "B. The force is proportional to the product of the currents.", "czh": ["變小", "變大", "變成零", "與電流無關"], "cen": ["Decreases", "Increases", "Becomes zero", "Does not depend on current"], "ans": 1}]};
  let lang = 'zh';
  let quizAnswers = false;
  const $ = (id) => document.getElementById(id);
  function L(obj) { return obj[lang] || obj.zh || ''; }
  function openModal(id) {
    ['modal-steps','modal-principle','modal-quiz'].forEach((mid) => {
      const el = $(mid);
      if (el) el.hidden = mid !== id;
    });
  }
  function closeModals() {
    ['modal-steps','modal-principle','modal-quiz'].forEach((mid) => {
      const el = $(mid);
      if (el) el.hidden = true;
    });
  }
  function renderLists() {
    $('steps-body').innerHTML = pack.steps[lang].map((s, i) => '<li>' + (i + 1) + '. ' + s + '</li>').join('');
    $('principle-body').innerHTML = pack.principle[lang].map((s) => '<p>' + s + '</p>').join('');
    $('ccss-title').textContent = pack.title[lang];
    $('ccss-badge').textContent = pack.grade[lang];
    $('btn-steps').textContent = lang === 'zh' ? '觀察步驟' : 'Steps';
    $('btn-principle').textContent = lang === 'zh' ? '原理解說' : 'Principle';
    $('btn-quiz').textContent = lang === 'zh' ? '課堂問題' : 'Quiz';
    $('steps-title').textContent = lang === 'zh' ? '觀察步驟' : 'Steps';
    $('principle-title').textContent = lang === 'zh' ? '原理解說' : 'Principle';
    $('quiz-title').textContent = lang === 'zh' ? '課堂問題' : 'Quiz';
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  }
  function renderQuiz() {
    const box = $('quiz-list');
    const labels = ['A','B','C','D'];
    box.innerHTML = pack.quiz.map((q, idx) => {
      const n = idx + 1;
      const open = n === 2 || n === 4;
      let choices = '';
      if (!open) {
        const arr = lang === 'zh' ? q.czh : q.cen;
        choices = '<div class="ccss-choices">' + arr.map((text, i) =>
          '<label><input type="radio" name="q' + n + '"> <span>' + labels[i] + '. ' + text + '</span></label>'
        ).join('') + '</div>';
      }
      const ans = quizAnswers
        ? '<div class="ccss-answer"><strong>' + (lang === 'zh' ? '參考答案' : 'Answer') + '</strong> ' + (lang === 'zh' ? q.azh : q.aen) + '</div>'
        : '';
      return '<article><p><strong>Q' + n + '.</strong> ' + (lang === 'zh' ? q.zh : q.en) + '</p>' + choices + ans + '</article>';
    }).join('');
    $('btn-quiz-answers').textContent = quizAnswers
      ? (lang === 'zh' ? '隱藏參考答案' : 'Hide answers')
      : (lang === 'zh' ? '顯示參考答案' : 'Show answers');
  }
  function apply() { renderLists(); renderQuiz(); }
  $('btn-steps').addEventListener('click', () => openModal('modal-steps'));
  $('btn-principle').addEventListener('click', () => openModal('modal-principle'));
  $('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
  $('btn-ccss-lang').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; apply(); });
  $('btn-quiz-answers').addEventListener('click', () => { quizAnswers = !quizAnswers; renderQuiz(); });
  document.querySelectorAll('[data-ccss-close]').forEach((btn) => btn.addEventListener('click', closeModals));
  document.querySelectorAll('.ccss-modal').forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) closeModals(); }));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });
  apply();
})();
</script>

                <div class="flex justify-between items-center text-sm">
                    <span class="font-medium text-red-500 flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                        <span id="txt-wire1">導線 1 電流 (I₁)</span>
                    </span>
                    <span class="math-text bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded text-xs" id="val-i1">5.0 A</span>
                </div>
                <input type="range" id="slider-i1" min="-10" max="10" step="0.5" value="5">
                <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400">
                    <span id="txt-in1">入 In (⊗)</span>
                    <span id="txt-out1">出 Out (⊙)</span>
                </div>
            </div>

            <!-- Wire 2 Current -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center text-sm">
                    <span class="font-medium text-blue-500 flex items-center gap-1">
                        <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                        <span id="txt-wire2">導線 2 電流 (I₂)</span>
                    </span>
                    <span class="math-text bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded text-xs" id="val-i2">5.0 A</span>
                </div>
                <input type="range" id="slider-i2" min="-10" max="10" step="0.5" value="5">
                <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400">
                    <span id="txt-in2">入 In (⊗)</span>
                    <span id="txt-out2">出 Out (⊙)</span>
                </div>
            </div>

            <!-- Separation Distance -->
            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center text-sm">
                    <span class="font-medium text-slate-700 dark:text-slate-200" id="txt-dist">間距 (d)</span>
                    <span class="math-text bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded text-xs" id="val-d">200 px</span>
                </div>
                <input type="range" id="slider-d" min="100" max="400" step="10" value="200">
            </div>
            
            <!-- Control Buttons -->
            <div class="flex justify-between gap-2 mt-2">
                <button onclick="resetSimulation()" class="flex-1 py-1.5 px-3 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors" id="btn-reset">
                    重置 Reset
                </button>
            </div>

            <!-- Teaching Note -->
            <div class="mt-2 p-3 bg-blue-50 dark:bg-blue-900/30 rounded-xl border border-blue-100 dark:border-blue-800 text-xs text-slate-700 dark:text-slate-300 leading-relaxed">
                <p id="txt-note"><strong class="text-blue-600 dark:text-blue-400">教學提示：</strong>拖曳畫面中的黃色感測點，觀察兩個磁場的向量相加 \(\vec{B}_{net} = \vec{B}_1 + \vec{B}_2\)。試找出合磁場為零的「中性點」。</p>
            </div>
        </div>
    </div>

    <script>
        // Dictionary for bilingual support
        const dict = {
            zh: {
                mainTitle: "平行導線磁場",
                controls: "控制面板",
                wire1: "導線 1 電流 (I₁)",
                wire2: "導線 2 電流 (I₂)",
                in: "入 In (⊗)",
                out: "出 Out (⊙)",
                dist: "間距 (d)",
                reset: "重置",
                view: "視角 View",
                viewTop: "俯視 Top-down",
                viewSide: "側視 Side-view",
                down: "下 Down (↓)",
                up: "上 Up (↑)",
                inShort: "入 ⊗",
                outShort: "出 ⊙",
                note: "<strong class='text-blue-600 dark:text-blue-400'>教學提示：</strong>拖曳畫面中的黃色感測點，觀察兩個磁場的向量相加 \\(\\vec{B}_{net} = \\vec{B}_1 + \\vec{B}_2\\)。試找出合磁場為零的「中性點」。"
            },
            en: {
                mainTitle: "Parallel Wires B-Field",
                controls: "Control Panel",
                wire1: "Wire 1 Current (I₁)",
                wire2: "Wire 2 Current (I₂)",
                in: "In (⊗)",
                out: "Out (⊙)",
                dist: "Separation (d)",
                reset: "Reset",
                view: "View",
                viewTop: "Top-down",
                viewSide: "Side-view",
                down: "Down (↓)",
                up: "Up (↑)",
                inShort: "IN ⊗",
                outShort: "OUT ⊙",
                note: "<strong class='text-blue-600 dark:text-blue-400'>Tip:</strong> Drag the yellow sensor to observe the vector addition \\(\\vec{B}_{net} = \\vec{B}_1 + \\vec{B}_2\\). Can you find the 'neutral point' where the net field is zero?"
            }
        };

        // State Variables
        let state = {
            I1: 5.0,
            I2: 5.0,
            d: 200,
            lang: 'zh',
            isDark: false,
            panelOpen: true,
            panelVisible: true,
            sensorX: 0,
            sensorY: 0,
            width: 0,
            height: 0,
            // Draggable panel state
            panelPosX: 16,
            panelPosY: 80,
            isDraggingPanel: false,
            dragStartX: 0,
            dragStartY: 0,
            // Draggable sensor state
            isDraggingSensor: false,
            viewMode: 'top'
        };

        // Elements
        const elSvg = document.getElementById('sim-svg');
        const elGrid = document.getElementById('vector-grid');
        const elWires = document.getElementById('wires');
        const elForces = document.getElementById('force-vectors');
        const elSensor = document.getElementById('sensor');
        const elSensorVectors = document.getElementById('sensor-vectors');
        const elTooltip = document.getElementById('sensor-tooltip');
        
        // Config
        const GRID_SPACING = 40;
        const K = 2000; // Visual scaling factor for B field
        const WIRE_RADIUS = 12;

        function init() {
            // Auto-detect language
            const userLang = navigator.language || navigator.userLanguage;
            if (!userLang.startsWith('zh')) {
                state.lang = 'en';
            }
            
            // Auto-detect theme preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                state.isDark = true;
                document.documentElement.classList.add('dark');
            }

            setLang(state.lang);
            
            // Setup resize listener
            window.addEventListener('resize', handleResize);
            handleResize();

            // Place sensor at a reasonable default position
            state.sensorX = state.width / 2;
            state.sensorY = state.height / 2 - 80;

            // Setup input listeners
            document.getElementById('slider-i1').addEventListener('input', (e) => { state.I1 = parseFloat(e.target.value); updateSim(); });
            document.getElementById('slider-i2').addEventListener('input', (e) => { state.I2 = parseFloat(e.target.value); updateSim(); });
            document.getElementById('slider-d').addEventListener('input', (e) => { state.d = parseFloat(e.target.value); updateSim(); });

            // Setup Draggable Events
            setupDraggable(document.getElementById('panel-header'), 
                (dx, dy) => {
                    state.panelPosX += dx;
                    state.panelPosY += dy;
                    // Bounds checking
                    state.panelPosX = Math.max(0, Math.min(state.panelPosX, window.innerWidth - 300));
                    state.panelPosY = Math.max(0, Math.min(state.panelPosY, window.innerHeight - 50));
                    const panel = document.getElementById('control-panel');
                    panel.style.left = state.panelPosX + 'px';
                    panel.style.top = state.panelPosY + 'px';
                }
            );

            setupDraggable(elSensor, 
                (dx, dy) => {
                    state.sensorX += dx;
                    state.sensorY += dy;
                    updateSensor();
                },
                () => { elTooltip.style.opacity = '1'; elSensor.classList.add('cursor-grabbing'); },
                () => { elTooltip.style.opacity = '0'; elSensor.classList.remove('cursor-grabbing'); }
            );

            // Initial render
            generateGrid();
            updateSim();
        }

        function setupDraggable(element, onDrag, onStart, onEnd) {
            let startX, startY, isDragging = false;
            
            const handleStart = (e) => {
                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX;
                startY = clientY;
                if(onStart) onStart();
                // Prevent text selection only if not touching form elements to keep UI usable
                if (e.cancelable) e.preventDefault();
            };

            const handleMove = (e) => {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - startX;
                const dy = clientY - startY;
                startX = clientX;
                startY = clientY;
                onDrag(dx, dy);
            };

            const handleEnd = () => {
                isDragging = false;
                if(onEnd) onEnd();
            };

            element.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);

            element.addEventListener('touchstart', handleStart, {passive: false});
            window.addEventListener('touchmove', handleMove, {passive: false});
            window.addEventListener('touchend', handleEnd);
        }

        function handleResize() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            generateGrid();
            updateSim();
        }

        // Generate the SVG paths for the grid once
        let gridPoints = [];
        function generateGrid() {
            elGrid.innerHTML = '';
            gridPoints = [];
            const cols = Math.ceil(state.width / GRID_SPACING) + 1;
            const rows = Math.ceil(state.height / GRID_SPACING) + 1;
            
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = i * GRID_SPACING;
                    const y = j * GRID_SPACING;
                    
                    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

                    // Top View Arrow
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", "0");
                    line.setAttribute("y1", "0");
                    line.setAttribute("x2", "10"); // Default length
                    line.setAttribute("y2", "0");
                    line.setAttribute("stroke", "currentColor");
                    line.setAttribute("stroke-width", "1.5");
                    line.setAttribute("marker-end", "url(#arrowhead)");
                    line.setAttribute("class", "text-slate-400 dark:text-slate-500 transition-opacity duration-100");
                    g.appendChild(line);
                    
                    // Side View Symbol (Cross or Dot)
                    const sideG = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    sideG.setAttribute("class", "text-slate-400 dark:text-slate-500 transition-opacity duration-100");
                    sideG.style.display = 'none';

                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute("cx", "0");
                    circle.setAttribute("cy", "0");
                    circle.setAttribute("r", "6");
                    circle.setAttribute("fill", "none");
                    circle.setAttribute("stroke", "currentColor");
                    circle.setAttribute("stroke-width", "1.5");
                    sideG.appendChild(circle);

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", "");
                    path.setAttribute("stroke", "currentColor");
                    path.setAttribute("stroke-width", "1.5");
                    path.setAttribute("stroke-linecap", "round");
                    sideG.appendChild(path);

                    g.appendChild(sideG);
                    elGrid.appendChild(g);
                    
                    gridPoints.push({ x, y, el: g, line: line, sideG: sideG, path: path, circle: circle });
                }
            }
        }

        // Calculate B field vector at a specific point
        function calcBField(x, y) {
            const cx = state.width / 2;
            const cy = state.height / 2;
            const w1x = cx - state.d / 2;
            const w2x = cx + state.d / 2;
            
            // Wire 1
            const dx1 = x - w1x;
            const dy1 = y - cy;
            const r1sq = dx1*dx1 + dy1*dy1;
            const r1 = Math.sqrt(r1sq);
            let b1x = 0, b1y = 0;
            if (r1sq > WIRE_RADIUS*WIRE_RADIUS) {
                // Right hand grip rule: if I is positive (out), B is CCW.
                // In SVG coordinates (+Y is DOWN), CCW tangent vector to (dx, dy) is (dy, -dx).
                const mag1 = (K * state.I1) / r1sq; 
                b1x = dy1 * mag1;
                b1y = -dx1 * mag1;
            }

            // Wire 2
            const dx2 = x - w2x;
            const dy2 = y - cy;
            const r2sq = dx2*dx2 + dy2*dy2;
            const r2 = Math.sqrt(r2sq);
            let b2x = 0, b2y = 0;
            if (r2sq > WIRE_RADIUS*WIRE_RADIUS) {
                const mag2 = (K * state.I2) / r2sq; 
                b2x = dy2 * mag2;
                b2y = -dx2 * mag2;
            }

            return {
                b1: {x: b1x, y: b1y},
                b2: {x: b2x, y: b2y},
                bnet: {x: b1x + b2x, y: b1y + b2y}
            };
        }

        // Calculate B field z-component for side view
        function calcBFieldSide(x, y) {
            const cx = state.width / 2;
            const w1x = cx - state.d / 2;
            const w2x = cx + state.d / 2;
            
            let b1z = 0, b2z = 0;
            const dx1 = x - w1x;
            const dx2 = x - w2x;

            if (Math.abs(dx1) > WIRE_RADIUS) {
                b1z = - (K * state.I1) / dx1;
            }
            if (Math.abs(dx2) > WIRE_RADIUS) {
                b2z = - (K * state.I2) / dx2;
            }
            
            return {
                b1z: b1z,
                b2z: b2z,
                bnetz: b1z + b2z
            };
        }

        function updateSim() {
            // Update UI Labels
            document.getElementById('val-i1').textContent = state.I1.toFixed(1) + ' A';
            document.getElementById('val-i2').textContent = state.I2.toFixed(1) + ' A';
            document.getElementById('val-d').textContent = state.d.toFixed(0) + ' px';

            // 1. Update Grid
            gridPoints.forEach(pt => {
                if (state.viewMode === 'top') {
                    pt.sideG.style.display = 'none';
                    pt.line.style.display = 'block';

                    const B = calcBField(pt.x, pt.y).bnet;
                    const mag = Math.sqrt(B.x*B.x + B.y*B.y);
                    const angle = Math.atan2(B.y, B.x) * 180 / Math.PI;
                    
                    // Scale arrow length non-linearly to look good
                    const visualLen = Math.min(25, mag * 2 + 5);
                    const opacity = Math.min(1, mag * 0.3 + 0.1);
                    
                    pt.el.setAttribute("transform", `translate(${pt.x}, ${pt.y}) rotate(${angle})`);
                    pt.line.setAttribute("x2", visualLen);
                    pt.el.setAttribute("opacity", opacity);
                } else {
                    pt.line.style.display = 'none';
                    pt.sideG.style.display = 'block';

                    const B = calcBFieldSide(pt.x, pt.y).bnetz;
                    const mag = Math.abs(B);
                    const opacity = Math.min(1, mag * 0.2 + 0.1);
                    const radius = Math.min(10, Math.max(2, mag * 0.5)); // Scale symbol size

                    pt.el.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);
                    pt.el.setAttribute("opacity", opacity);
                    pt.circle.setAttribute("r", radius);

                    if (B < 0) { // IN (Cross)
                        const s = radius * 0.7;
                        pt.path.setAttribute("d", `M${-s},${-s} L${s},${s} M${-s},${s} L${s},${-s}`);
                        pt.path.setAttribute("stroke-width", "1.5");
                    } else { // OUT (Dot)
                        pt.path.setAttribute("d", `M0,0 L0.1,0.1`);
                        pt.path.setAttribute("stroke-width", Math.max(3, radius));
                    }
                }
            });

            // 2. Draw Wires & Forces
            drawWiresAndForces();

            // 3. Update Sensor
            updateSensor();
        }

        function drawWiresAndForces() {
            elWires.innerHTML = '';
            elForces.innerHTML = '';
            const cx = state.width / 2;
            const cy = state.height / 2;
            const w1x = cx - state.d / 2;
            const w2x = cx + state.d / 2;

            if (state.viewMode === 'top') {
                // Draw Wire 1
                const w1 = createWireElement(w1x, cy, state.I1, '#ef4444');
                elWires.appendChild(w1);
                
                // Draw Wire 2
                const w2 = createWireElement(w2x, cy, state.I2, '#3b82f6');
                elWires.appendChild(w2);
            } else {
                // Draw Wire 1 (Side view)
                const w1 = createWireLine(w1x, state.I1, '#ef4444');
                elWires.appendChild(w1);
                
                // Draw Wire 2 (Side view)
                const w2 = createWireLine(w2x, state.I2, '#3b82f6');
                elWires.appendChild(w2);
            }

            // Calculate Forces (F = I * L * B)
            // Force on wire 2 by wire 1
            if (state.I1 !== 0 && state.I2 !== 0) {
                // parallel = attract, anti-parallel = repel
                const isAttract = (state.I1 * state.I2) > 0;
                const forceMag = Math.abs(state.I1 * state.I2) / state.d * 2000; // arbitrary scale
                const visForce = Math.min(80, Math.max(20, forceMag)); // clamp visual length

                if (forceMag > 1) {
                    const dir1 = isAttract ? 1 : -1;
                    const dir2 = isAttract ? -1 : 1;
                    const isSide = state.viewMode === 'side';
                    
                    // Force on wire 1
                    elForces.appendChild(createForceArrow(w1x, cy, dir1 * visForce, 0, '#ef4444', isSide));
                    // Force on wire 2
                    elForces.appendChild(createForceArrow(w2x, cy, dir2 * visForce, 0, '#3b82f6', isSide));
                }
            }
        }

        function createWireLine(x, I, color) {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x);
            line.setAttribute("y1", 0);
            line.setAttribute("x2", x);
            line.setAttribute("y2", state.height);
            line.setAttribute("stroke", color);
            line.setAttribute("stroke-width", "8");
            g.appendChild(line);

            if (I !== 0) {
                const cy = state.height / 2;
                const isUp = I > 0;
                
                // Draw white current direction arrows along the wire
                [-60, 0, 60].forEach(offsetY => {
                    const arr = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    const yCenter = cy + offsetY;
                    if (isUp) {
                        // Arrow pointing UP (^): vertex is higher up (yCenter - 10)
                        arr.setAttribute("d", `M${x-8},${yCenter+6} L${x},${yCenter-10} L${x+8},${yCenter+6}`);
                    } else {
                        // Arrow pointing DOWN (v): vertex is lower down (yCenter + 10)
                        arr.setAttribute("d", `M${x-8},${yCenter-6} L${x},${yCenter+10} L${x+8},${yCenter-6}`);
                    }
                    arr.setAttribute("fill", "none");
                    arr.setAttribute("stroke", "white");
                    arr.setAttribute("stroke-width", "3");
                    arr.setAttribute("stroke-linecap", "round");
                    arr.setAttribute("stroke-linejoin", "round");
                    g.appendChild(arr);
                });
            }
            return g;
        }

        function createWireElement(x, y, I, color) {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("transform", `translate(${x}, ${y})`);
            
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", "0");
            circle.setAttribute("cy", "0");
            circle.setAttribute("r", WIRE_RADIUS);
            circle.setAttribute("fill", "white");
            circle.setAttribute("stroke", color);
            circle.setAttribute("stroke-width", "3");
            
            g.appendChild(circle);

            if (I > 0) {
                // Out of page (dot)
                const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dot.setAttribute("cx", "0");
                dot.setAttribute("cy", "0");
                dot.setAttribute("r", "3");
                dot.setAttribute("fill", color);
                g.appendChild(dot);
            } else if (I < 0) {
                // Into page (cross)
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", "M-5,-5 L5,5 M-5,5 L5,-5");
                path.setAttribute("stroke", color);
                path.setAttribute("stroke-width", "2.5");
                g.appendChild(path);
            }
            return g;
        }

        function createForceArrow(x, y, dx, dy, color, isSideView = false) {
            const offsetDist = isSideView ? 6 : WIRE_RADIUS + 5;
            const offset = dx > 0 ? offsetDist : -offsetDist;
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x + offset);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + offset + dx);
            line.setAttribute("y2", y + dy);
            line.setAttribute("stroke", color);
            line.setAttribute("stroke-width", "3");
            line.setAttribute("stroke-dasharray", "4 2");
            line.setAttribute("marker-end", `url(#arrowhead-${color === '#ef4444' ? 'red' : 'blue'})`);
            return line;
        }

        function updateSensor() {
            elSensor.setAttribute("transform", `translate(${state.sensorX}, ${state.sensorY})`);
            elSensorVectors.innerHTML = '';
            
            if (state.viewMode === 'top') {
                const B = calcBField(state.sensorX, state.sensorY);
                
                // Function to draw vector
                const drawVec = (vx, vy, color, marker, width) => {
                    const mag = Math.sqrt(vx*vx + vy*vy);
                    if (mag < 0.1) return;
                    
                    // Visual scaling for the vectors on the sensor
                    const scale = 5; 
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", "0");
                    line.setAttribute("y1", "0");
                    line.setAttribute("x2", vx * scale);
                    line.setAttribute("y2", vy * scale);
                    line.setAttribute("stroke", color);
                    line.setAttribute("stroke-width", width);
                    line.setAttribute("marker-end", `url(#${marker})`);
                    if(color==='#10b981') {
                        line.setAttribute("filter", "url(#glow)");
                    }
                    elSensorVectors.appendChild(line);
                };

                drawVec(B.b1.x, B.b1.y, '#ef4444', 'arrowhead-red', 2);
                drawVec(B.b2.x, B.b2.y, '#3b82f6', 'arrowhead-blue', 2);
                drawVec(B.bnet.x, B.bnet.y, '#10b981', 'arrowhead-green', 3.5); // Net field is thicker

                // Update Tooltip
                const formatMag = (v) => Math.sqrt(v.x*v.x + v.y*v.y).toFixed(2);
                document.getElementById('tt-b1').textContent = `B₁ = ${formatMag(B.b1)}`;
                document.getElementById('tt-b2').textContent = `B₂ = ${formatMag(B.b2)}`;
                document.getElementById('tt-bnet').textContent = `B_net = ${formatMag(B.bnet)}`;
            } else {
                const B = calcBFieldSide(state.sensorX, state.sensorY);
                
                // Draw individual components B1, B2 and Bnet for Side View on Sensor
                const drawSideVecSymbol = (val, color, offsetX) => {
                    if (Math.abs(val) < 0.05) return;
                    const sG = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    sG.setAttribute("transform", `translate(${offsetX}, 0)`);
                    const isIN = val < 0;
                    const mag = Math.abs(val);
                    const r = Math.min(16, Math.max(6, mag * 1.5));
                    
                    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    c.setAttribute("r", r);
                    c.setAttribute("fill", color);
                    c.setAttribute("fill-opacity", "0.25");
                    c.setAttribute("stroke", color);
                    c.setAttribute("stroke-width", color === '#10b981' ? '2.5' : '1.5');
                    if (color === '#10b981') c.setAttribute("filter", "url(#glow)");
                    sG.appendChild(c);
                    
                    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    p.setAttribute("stroke", color);
                    p.setAttribute("stroke-linecap", "round");
                    
                    if (isIN) {
                        const s = r * 0.5;
                        p.setAttribute("d", `M${-s},${-s} L${s},${s} M${-s},${s} L${s},${-s}`);
                        p.setAttribute("stroke-width", "2");
                    } else {
                        p.setAttribute("d", "M0,0 L0.1,0.1");
                        p.setAttribute("stroke-width", Math.max(3, r * 0.5));
                    }
                    sG.appendChild(p);
                    elSensorVectors.appendChild(sG);
                };

                // Draw B1 (red, shifted left), B2 (blue, shifted right), Bnet (green, center)
                drawSideVecSymbol(B.b1z, '#ef4444', -22);
                drawSideVecSymbol(B.b2z, '#3b82f6', 22);
                drawSideVecSymbol(B.bnetz, '#10b981', 0);

                // Update Tooltip for Side View
                const dLang = dict[state.lang];
                const formatMagSide = (v) => {
                    const mag = Math.abs(v).toFixed(2);
                    const dir = v < 0 ? dLang.inShort : (v > 0 ? dLang.outShort : '');
                    return `${mag} ${dir}`;
                };
                document.getElementById('tt-b1').textContent = `B₁ = ${formatMagSide(B.b1z)}`;
                document.getElementById('tt-b2').textContent = `B₂ = ${formatMagSide(B.b2z)}`;
                document.getElementById('tt-bnet').textContent = `B_net = ${formatMagSide(B.bnetz)}`;
            }

            // Position Tooltip
            elTooltip.style.left = (state.sensorX + 20) + 'px';
            elTooltip.style.top = (state.sensorY - 30) + 'px';
        }

        function resetSimulation() {
            state.I1 = 5.0;
            state.I2 = 5.0;
            state.d = 200;
            document.getElementById('slider-i1').value = 5;
            document.getElementById('slider-i2').value = 5;
            document.getElementById('slider-d').value = 200;
            state.sensorX = state.width / 2;
            state.sensorY = state.height / 2 - 80;
            updateSim();
        }

        function setViewMode(mode) {
            state.viewMode = mode;
            const btnTop = document.getElementById('btn-view-top');
            const btnSide = document.getElementById('btn-view-side');
            const d = dict[state.lang];
            
            if (mode === 'top') {
                btnTop.className = "flex-1 py-1.5 text-sm font-medium rounded-md bg-white dark:bg-slate-600 shadow-sm transition-all text-slate-900 dark:text-white";
                btnSide.className = "flex-1 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 dark:text-slate-400 transition-all";
                document.getElementById('txt-in1').textContent = d.in;
                document.getElementById('txt-out1').textContent = d.out;
                document.getElementById('txt-in2').textContent = d.in;
                document.getElementById('txt-out2').textContent = d.out;
            } else {
                btnSide.className = "flex-1 py-1.5 text-sm font-medium rounded-md bg-white dark:bg-slate-600 shadow-sm transition-all text-slate-900 dark:text-white";
                btnTop.className = "flex-1 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 dark:text-slate-400 transition-all";
                document.getElementById('txt-in1').textContent = d.down;
                document.getElementById('txt-out1').textContent = d.up;
                document.getElementById('txt-in2').textContent = d.down;
                document.getElementById('txt-out2').textContent = d.up;
            }
            updateSim();
        }

        function togglePanelContent() {
            state.panelOpen = !state.panelOpen;
            const content = document.getElementById('panel-content');
            const icon = document.getElementById('panel-toggle-icon');
            if (state.panelOpen) {
                content.style.display = 'flex';
                icon.innerHTML = '<line x1="5" y1="12" x2="19" y2="12"></line>'; // Minus icon
            } else {
                content.style.display = 'none';
                icon.innerHTML = '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>'; // Plus icon
            }
        }

        function toggleControlPanel() {
            state.panelVisible = !state.panelVisible;
            const panel = document.getElementById('control-panel');
            if(state.panelVisible) {
                panel.style.display = 'flex';
            } else {
                panel.style.display = 'none';
            }
        }

        function toggleDarkMode() {
            state.isDark = !state.isDark;
            if (state.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function setLang(lang) {
            state.lang = lang;
            
            // Toggle Button Styles
            const btnZh = document.getElementById('btn-zh');
            const btnEn = document.getElementById('btn-en');
            
            if (lang === 'zh') {
                btnZh.className = "px-3 py-1 rounded-full text-sm font-medium transition-all bg-primary text-white shadow";
                btnEn.className = "px-3 py-1 rounded-full text-sm font-medium transition-all text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white";
            } else {
                btnEn.className = "px-3 py-1 rounded-full text-sm font-medium transition-all bg-primary text-white shadow";
                btnZh.className = "px-3 py-1 rounded-full text-sm font-medium transition-all text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white";
            }

            // Update Texts
            const d = dict[lang];
            document.getElementById('main-title').textContent = d.mainTitle;
            document.getElementById('txt-controls').textContent = d.controls;
            document.getElementById('txt-view').textContent = d.view;
            document.getElementById('btn-view-top').textContent = d.viewTop;
            document.getElementById('btn-view-side').textContent = d.viewSide;
            document.getElementById('txt-wire1').textContent = d.wire1;
            document.getElementById('txt-wire2').textContent = d.wire2;
            
            // Contextual translation for slider labels based on current viewMode
            if (state.viewMode === 'top') {
                document.getElementById('txt-in1').textContent = d.in;
                document.getElementById('txt-out1').textContent = d.out;
                document.getElementById('txt-in2').textContent = d.in;
                document.getElementById('txt-out2').textContent = d.out;
            } else {
                document.getElementById('txt-in1').textContent = d.down;
                document.getElementById('txt-out1').textContent = d.up;
                document.getElementById('txt-in2').textContent = d.down;
                document.getElementById('txt-out2').textContent = d.up;
            }
            
            document.getElementById('txt-dist').textContent = d.dist;
            document.getElementById('btn-reset').textContent = d.reset;
            document.getElementById('txt-note').innerHTML = d.note;

            // Trigger MathJax re-render for the note if needed
            if (window.MathJax) {
                MathJax.typesetPromise([document.getElementById('txt-note')]);
            }
        }

        // Start
        window.onload = init;
    </script>
</body>
</html>
