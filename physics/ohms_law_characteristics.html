<script>
const I18N = {"zh": {"badge": "物理", "btnSteps": "觀察步驟", "btnPrinciple": "原理解說", "btnQuiz": "課堂問題", "stepsTitle": "觀察步驟", "principleTitle": "原理解說", "quizTitle": "課堂問題", "showAnswers": "顯示參考答案", "hideAnswers": "隱藏參考答案", "answerLabel": "參考答案", "reset": "重置", "title": "歐姆與非歐姆特性", "deviceLabel": "元件", "resistor": "定值電阻", "lamp": "鎢絲燈", "diode": "二極管", "vLabel": "電壓 V", "formula": "歐姆導體：\\(I = V/R\\)，圖線過原點且為直線。", "noteResistor": "定值電阻的 I–V 是過原點的直線，電阻不變。", "noteLamp": "鎢絲燈溫度上升，電阻變大，圖線彎曲，電流增加變慢。", "noteDiode": "二極管正向才明顯導電，反向電流幾乎是零，圖線不對稱。"}, "en": {"badge": "Physics", "btnSteps": "Steps", "btnPrinciple": "Principle", "btnQuiz": "Quiz", "stepsTitle": "Steps", "principleTitle": "Principle", "quizTitle": "Quiz", "showAnswers": "Show answers", "hideAnswers": "Hide answers", "answerLabel": "Answer", "reset": "Reset", "title": "Ohmic and Non-ohmic Characteristics", "deviceLabel": "Component", "resistor": "Fixed resistor", "lamp": "Filament lamp", "diode": "Diode", "vLabel": "Voltage V", "formula": "Ohmic conductor: \\(I = V/R\\). The graph is a straight line through the origin.", "noteResistor": "A fixed resistor gives a straight I–V line through the origin. Its resistance stays constant.", "noteLamp": "A filament lamp heats up and its resistance rises, so the curve bends and the current grows more slowly.", "noteDiode": "A diode conducts clearly only in the forward direction. The reverse current is almost zero, so the graph is not symmetric."}};
const CLASSROOM = {"steps": {"zh": ["選定值電阻，把電壓由 0 調到 6 V，看直線過原點。", "把電壓調到負值，看直線延伸到第三象限。", "改選鎢絲燈，看同一電壓範圍的曲線向下彎。", "改選二極管，比較正向和反向。", "再切回定值電阻，確認只有它是過原點的直線。"], "en": ["Select the fixed resistor and raise the voltage from 0 to 6 V. The line passes through the origin.", "Move the voltage negative and see the line continue into the third quadrant.", "Select the filament lamp and watch the curve bend.", "Select the diode and compare forward and reverse bias.", "Return to the resistor and confirm that only it is a straight line through the origin."]}, "principle": {"zh": ["定值電阻服從歐姆定律 \\(I = V/R\\)。", "鎢絲燈不是歐姆導體：電流愈大，燈絲愈熱，電阻愈大。", "二極管只容許一個方向的明顯電流，所以 I–V 不對稱。"], "en": ["A fixed resistor obeys \\(I = V/R\\).", "A filament lamp is non-ohmic: a larger current heats the filament and raises its resistance.", "A diode allows a clear current in only one direction, so its I–V graph is asymmetric."]}, "quiz": [{"zh": "定值電阻的 I–V 圖是？", "en": "The I–V graph of a fixed resistor is?", "azh": "A。", "aen": "A.", "czh": ["過原點的直線", "過原點但向上彎的曲線", "不過原點的水平線", "只在正向有電流的折線"], "cen": ["A straight line through the origin", "A curve through the origin that bends upward", "A horizontal line that misses the origin", "A kinked line with current only one way"], "ans": 0}, {"zh": "先預測鎢絲燈的圖線會彎曲，再選「鎢絲燈」核對。", "en": "Predict that the lamp's graph bends, then select the filament lamp.", "azh": "燈絲變熱後電阻上升，所以不是直線。", "aen": "The filament heats up and its resistance rises, so the graph is not straight."}, {"zh": "電壓反向時，二極管的電流最接近？", "en": "When the voltage is reversed, the diode current is closest to?", "azh": "B。", "aen": "B.", "czh": ["與正向一樣大", "幾乎是零", "一定無限大", "一定是負的很大"], "cen": ["As large as the forward current", "Almost zero", "Certainly infinite", "Certainly a large negative value"], "ans": 1}, {"zh": "先預測電壓加倍時定值電阻的電流也加倍，再只調電壓。", "en": "Predict that doubling the voltage doubles the current in the fixed resistor, then change only the voltage.", "azh": "直線過原點，I 與 V 成正比。", "aen": "The straight line through the origin means I is proportional to V."}, {"zh": "下列哪一項是歐姆導體？", "en": "Which of these is an ohmic conductor?", "azh": "A。", "aen": "A.", "czh": ["定值電阻", "鎢絲燈", "二極管", "三者都是"], "cen": ["Fixed resistor", "Filament lamp", "Diode", "All three"], "ans": 0}]};
let lang = 'zh';
let quizAnswers = false;

const S = { device: 'resistor', V: 2 };
function currentAt(device, V) {
  if (device === 'resistor') return V / 10;
  if (device === 'lamp') {
    const R = 4 + 1.1 * V * V;
    return V / R;
  }
  if (V < 0.65) return V < 0 ? V / 5000 : V / 800;
  return Math.min(1.2, 0.015 * (Math.exp((V - 0.65) / 0.18) - 1));
}
function fitCanvas(canvas, ratio) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(360, canvas.clientWidth || 720);
  const h = Math.max(280, Math.round(w * ratio));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function drawDevice(ctx, x, y, w, h) {
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 16);
  ctx.fill();
  ctx.stroke();
  const benchY = y + h * 0.7;
  ctx.fillStyle = '#e7e5e4';
  ctx.fillRect(x + 18, benchY, w - 36, 12);
  ctx.fillStyle = '#a8a29e';
  ctx.fillRect(x + 30, benchY + 12, 8, 16);
  ctx.fillRect(x + w - 38, benchY + 12, 8, 16);
  const cy = benchY - 28;
  const cx = x + w * 0.62;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x + 36, benchY);
  ctx.lineTo(x + 36, cy);
  ctx.lineTo(x + 52, cy);
  ctx.stroke();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#b91c1c';
  ctx.beginPath();
  ctx.moveTo(x + 52, cy - 12);
  ctx.lineTo(x + 52, cy + 12);
  ctx.stroke();
  ctx.strokeStyle = '#1d4ed8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + 62, cy - 7);
  ctx.lineTo(x + 62, cy + 7);
  ctx.stroke();
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x + 62, cy);
  ctx.lineTo(cx - 42, cy);
  ctx.moveTo(cx + 42, cy);
  ctx.lineTo(x + w - 28, cy);
  ctx.lineTo(x + w - 28, benchY);
  ctx.stroke();
  ctx.fillStyle = '#ca8a04';
  ctx.beginPath();
  ctx.arc(cx - 42, cy, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 42, cy, 5, 0, Math.PI * 2);
  ctx.fill();
  if (S.device === 'resistor') {
    ctx.strokeStyle = '#b45309';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 42, cy);
    const n = 6;
    for (let i = 1; i <= n; i++) {
      const px = cx - 42 + 84 * i / n;
      const py = i === n ? cy : cy + (i % 2 ? -12 : 12);
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  } else if (S.device === 'lamp') {
    const glow = Math.min(1, Math.abs(currentAt('lamp', S.V)) / 0.35);
    ctx.fillStyle = 'rgba(251,191,36,' + (0.15 + glow * 0.75) + ')';
    ctx.beginPath();
    ctx.arc(cx, cy - 6, 28 + glow * 10, 0, Math.PI * 2);
    ctx.fill();
    const glass = ctx.createRadialGradient(cx - 6, cy - 12, 4, cx, cy - 6, 22);
    glass.addColorStop(0, 'rgba(255,255,255,0.9)');
    glass.addColorStop(1, 'rgba(226,232,240,0.35)');
    ctx.beginPath();
    ctx.arc(cx, cy - 6, 20, 0, Math.PI * 2);
    ctx.fillStyle = glass;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#334155';
    ctx.stroke();
    ctx.strokeStyle = 'rgb(' + Math.round(180 + glow * 70) + ',' + Math.round(80 + glow * 90) + ',30)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy + 2);
    ctx.quadraticCurveTo(cx, cy - 18, cx + 8, cy + 2);
    ctx.stroke();
    ctx.fillStyle = '#78716c';
    ctx.fillRect(cx - 8, cy + 14, 16, 8);
    ctx.beginPath();
    ctx.moveTo(cx - 42, cy);
    ctx.lineTo(cx - 8, cy + 18);
    ctx.moveTo(cx + 42, cy);
    ctx.lineTo(cx + 8, cy + 18);
    ctx.strokeStyle = '#334155';
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - 42, cy);
    ctx.lineTo(cx - 16, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy - 14);
    ctx.lineTo(cx + 10, cy);
    ctx.lineTo(cx - 16, cy + 14);
    ctx.closePath();
    ctx.fillStyle = S.V >= 0.65 ? '#f59e0b' : '#0f172a';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 16, cy - 14);
    ctx.lineTo(cx + 16, cy + 14);
    ctx.moveTo(cx + 20, cy);
    ctx.lineTo(cx + 42, cy);
    ctx.stroke();
  }
  ctx.fillStyle = '#334155';
  ctx.font = '600 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(S.V.toFixed(1) + ' V', x + 52, cy + 28);
  const name = S.device === 'resistor' ? (lang === 'zh' ? '定值電阻' : 'Resistor') : S.device === 'lamp' ? (lang === 'zh' ? '鎢絲燈' : 'Lamp') : (lang === 'zh' ? '二極管' : 'Diode');
  ctx.font = '600 13px "Noto Sans TC", sans-serif';
  ctx.fillText(name, x + w / 2, y + h - 16);
  ctx.restore();
}
function render() {
  const canvas = document.getElementById('plot');
  const { ctx, w, h } = fitCanvas(canvas, 0.58);
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, w, h);
  const showDevice = w > 720;
  if (showDevice) drawDevice(ctx, 12, 12, 220, h - 24);
  const vMin = -2, vMax = 6;
  let iMax = 0.2;
  for (let v = vMin; v <= vMax; v += 0.08) iMax = Math.max(iMax, Math.abs(currentAt(S.device, v)));
  iMax *= 1.2;
  const plotX = (showDevice ? 248 : 16) + 46;
  const plotY = 24;
  const plotW = w - plotX - 20;
  const plotH = h - 72;
  const X = (v) => plotX + (v - vMin) / (vMax - vMin) * plotW;
  const Y = (i) => plotY + plotH - (i + iMax) / (2 * iMax) * plotH;
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const gx = plotX + plotW * i / 4;
    const gy = plotY + plotH * i / 4;
    ctx.beginPath(); ctx.moveTo(gx, plotY); ctx.lineTo(gx, plotY + plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(plotX, gy); ctx.lineTo(plotX + plotW, gy); ctx.stroke();
  }
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(plotX, plotY);
  ctx.lineTo(plotX, plotY + plotH);
  ctx.lineTo(plotX + plotW, plotY + plotH);
  ctx.stroke();
  ctx.fillStyle = '#475569';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  [-2, 0, 2, 4, 6].forEach((v) => ctx.fillText(String(v), X(v), plotY + plotH + 16));
  ctx.textAlign = 'right';
  [-iMax, 0, iMax].forEach((i) => ctx.fillText(i.toFixed(2), plotX - 6, Y(i) + 4));
  ctx.fillStyle = '#0f172a';
  ctx.font = '600 13px "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(lang === 'zh' ? '電壓 V / V' : 'Voltage V / V', plotX + plotW / 2, h - 12);
  ctx.save();
  ctx.translate(plotX - 52, plotY + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(lang === 'zh' ? '電流 I / A' : 'Current I / A', 0, 0);
  ctx.restore();
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(X(0), plotY);
  ctx.lineTo(X(0), plotY + plotH);
  ctx.moveTo(plotX, Y(0));
  ctx.lineTo(plotX + plotW, Y(0));
  ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.font = '700 12px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('0', X(0) + 6, Y(0) - 6);
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let v = vMin; v <= vMax + 0.001; v += 0.05) {
    const x = X(v), y = Y(currentAt(S.device, v));
    if (v === vMin) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  const I = currentAt(S.device, S.V);
  ctx.beginPath();
  ctx.arc(X(S.V), Y(I), 6, 0, Math.PI * 2);
  ctx.fillStyle = '#e11d48';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  document.getElementById('vValue').textContent = S.V.toFixed(2) + ' V';
  document.getElementById('readout').textContent = 'V = ' + S.V.toFixed(2) + ' V,  I = ' + I.toFixed(3) + ' A';
  const noteKey = S.device === 'resistor' ? 'noteResistor' : S.device === 'lamp' ? 'noteLamp' : 'noteDiode';
  document.getElementById('note').textContent = I18N[lang][noteKey];
  document.querySelectorAll('.dev').forEach((btn) => {
    const on = btn.getAttribute('data-device') === S.device;
    btn.classList.toggle('border-sky-600', on);
    btn.classList.toggle('bg-sky-50', on);
  });
}
function resetSim() {
  S.device = 'resistor'; S.V = 2;
  document.getElementById('vSlider').value = 2;
  render();
}

function renderClassroom() {
  const steps = CLASSROOM.steps[lang];
  const principle = CLASSROOM.principle[lang];
  document.getElementById('steps-body').innerHTML = steps.map((s, i) => '<li>' + (i + 1) + '. ' + s + '</li>').join('');
  document.getElementById('principle-body').innerHTML = principle.map((s) => '<p>' + s + '</p>').join('');
  const labels = ['A', 'B', 'C', 'D'];
  document.getElementById('quiz-list').innerHTML = CLASSROOM.quiz.map((q, idx) => {
    const n = idx + 1;
    const open = n === 2 || n === 4;
    let choices = '';
    if (!open) {
      const arr = q[lang === 'zh' ? 'czh' : 'cen'];
      choices = '<div class="grid gap-1.5 mt-2">' + arr.map((text, i) =>
        '<label class="flex gap-2 items-start text-sm"><input type="radio" name="qq' + n + '"> <span>' + labels[i] + '. ' + text + '</span></label>'
      ).join('') + '</div>';
    }
    const ans = quizAnswers
      ? '<div class="mt-2 rounded-lg border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-sm"><strong>' + I18N[lang].answerLabel + '</strong> ' + q[lang === 'zh' ? 'azh' : 'aen'] + '</div>'
      : '';
    return '<article class="border border-slate-200 rounded-xl p-3 mb-2"><p class="text-sm"><strong>Q' + n + '.</strong> ' + q[lang] + '</p>' + choices + ans + '</article>';
  }).join('');
  document.getElementById('btn-quiz-answers').textContent = quizAnswers ? I18N[lang].hideAnswers : I18N[lang].showAnswers;
}
function setLang(next) {
  lang = next;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key] != null) el.innerHTML = I18N[lang][key];
  });
  document.getElementById('langZh').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'zh' ? 'bg-slate-900 text-white' : '');
  document.getElementById('langEn').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'en' ? 'bg-slate-900 text-white' : '');
  renderClassroom();
  render();
  if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(() => {});
}
function openModal(id) {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => {
    document.getElementById(mid).hidden = mid !== id;
  });
}
function closeModals() {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => { document.getElementById(mid).hidden = true; });
}
document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
document.getElementById('btn-quiz-answers').addEventListener('click', () => { quizAnswers = !quizAnswers; renderClassroom(); });
document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.querySelectorAll('[data-close]').forEach((btn) => btn.addEventListener('click', closeModals));
document.querySelectorAll('.lab-modal').forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) closeModals(); }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });
window.addEventListener('resize', () => render());

document.getElementById('vSlider').addEventListener('input', (e) => { S.V = Number(e.target.value); render(); });
document.querySelectorAll('.dev').forEach((btn) => btn.addEventListener('click', () => { S.device = btn.getAttribute('data-device'); render(); }));
document.getElementById('btn-reset').addEventListener('click', resetSim);

setLang('zh');
</script>
</body>
</html>
