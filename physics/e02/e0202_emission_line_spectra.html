<script>
/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

function t(key) {
  return (translations[currentLang] && translations[currentLang][key]) || (translations.zh[key] || key);
}

function typesetMath(root) {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise(root ? [root] : undefined).catch(function () {});
  }
}

function wavelengthToColor(wavelength, opacity) {
  if (opacity === undefined) opacity = 1;
  var r, g, b;
  var wl = wavelength;
  if (wl >= 380 && wl < 440) {
    r = -1 * (wl - 440) / (440 - 380); g = 0; b = 1;
  } else if (wl >= 440 && wl < 490) {
    r = 0; g = (wl - 440) / (490 - 440); b = 1;
  } else if (wl >= 490 && wl < 510) {
    r = 0; g = 1; b = -1 * (wl - 510) / (510 - 490);
  } else if (wl >= 510 && wl < 580) {
    r = (wl - 510) / (580 - 510); g = 1; b = 0;
  } else if (wl >= 580 && wl < 645) {
    r = 1; g = -1 * (wl - 645) / (645 - 580); b = 0;
  } else if (wl >= 645 && wl <= 750) {
    r = 1; g = 0; b = 0;
  } else {
    r = 0; g = 0; b = 0;
  }
  var factor;
  if (wl >= 380 && wl < 420) factor = 0.3 + 0.7 * (wl - 380) / (420 - 380);
  else if (wl >= 420 && wl < 700) factor = 1;
  else if (wl >= 700 && wl <= 750) factor = 0.3 + 0.7 * (750 - wl) / (750 - 700);
  else factor = 0;
  var R = Math.round(r * factor * 255);
  var G = Math.round(g * factor * 255);
  var B = Math.round(b * factor * 255);
  return 'rgba(' + R + ', ' + G + ', ' + B + ', ' + opacity + ')';
}

function getColorName(wl) {
  if (wl < 400) return t('colorUV');
  if (wl < 450) return t('colorViolet');
  if (wl < 495) return t('colorBlue');
  if (wl < 570) return t('colorGreen');
  if (wl < 590) return t('colorYellow');
  if (wl < 620) return t('colorOrange');
  return t('colorRed');
}

function calculateEnergy(wavelengthNm) {
  return (1239.8 / wavelengthNm).toFixed(3);
}

function updateLanguage() {
  document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.dataset.i18n;
    if (translations[currentLang][key] != null) el.textContent = translations[currentLang][key];
  });
  renderSidebarLabels();
  if (lastLineDetail) {
    document.getElementById('info-color-name').innerText = getColorName(lastLineDetail.wl);
  }
  renderSteps();
  renderPrinciple();
  renderQuiz();
  var ansBtn = document.getElementById('btn-quiz-answers');
  if (ansBtn) ansBtn.textContent = quizState.showAnswers ? t('hideAnswers') : t('showAnswers');
}

function renderSteps() {
  var ol = document.getElementById('steps-body');
  if (!ol) return;
  ol.innerHTML = [1, 2, 3, 4].map(function (n) { return '<li>' + t('step' + n) + '</li>'; }).join('');
  typesetMath(ol);
}

  var body = document.getElementById('principle-body');
  if (!body) return;
  body.innerHTML =
    '<section><h3 class="text-lg font-bold text-white mb-2 border-l-4 border-blue-500 pl-2">' + t('principleConceptTitle') + '</h3><p>' + t('principleConcept') + '</p></section>' +

}

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  if (!body) return;
  const ref = currentLang === 'zh' ? '參考答案' : 'Reference answer';
  const mkChoice = (qid) => {
    const meta = QUIZ_META.find(q => q.id === qid);
    if (!meta || meta.type !== 'mc') return '';
    return '<div class="grid gap-1.5 mt-1">' + meta.options.map(opt => {
      const key = qid + opt;
      return '<label class="flex items-start gap-2 rounded-lg border border-slate-600 p-2 cursor-pointer hover:bg-slate-800/50">' +
        '<input type="radio" name="' + qid + '" class="mt-0.5">' +
        '<span class="text-sm">' + t(key) + '</span></label>';
    }).join('') + '</div>';
  };
  const ans = (key) => quizState.showAnswers
    ? '<div class="mt-2 text-xs text-emerald-300 bg-emerald-950/40 border border-emerald-800/40 rounded-lg p-2"><strong>' + ref + '：</strong> ' + t(key) + '</div>'
    : '';
  const layout = [
    { id: 'q1', mc: true }, { id: 'q2', mc: false }, { id: 'q3', mc: true }, { id: 'q4', mc: false }, { id: 'q5', mc: true }
  ];
  body.innerHTML = layout.map((b, idx) =>
    '<div class="quiz-item" data-quiz="' + b.id + '">' +
    '<div class="q-stem">Q' + (idx + 1) + '. ' + t(b.id) + '</div>' +
    (b.mc ? mkChoice(b.id) : '<p class="text-xs text-slate-500 mb-1">' + t('shortHint') + '</p>') +
    ans(b.id + 'ans') + '</div>'
  ).join('');
  const ansBtn = document.getElementById('btn-quiz-answers');
  if (ansBtn) ansBtn.textContent = quizState.showAnswers ? t('hideAnswers') : t('showAnswers');
  typesetMath(body);
}

function openModal(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('hidden');
  requestAnimationFrame(function () {
    el.classList.remove('opacity-0');
    var panel = el.querySelector('[data-modal-panel]');
    if (panel) panel.classList.remove('scale-95');
  });
  if (id === 'modal-principle') typesetMath(document.getElementById('principle-body'));
  if (id === 'modal-steps') typesetMath(document.getElementById('steps-body'));
  if (id === 'modal-quiz') typesetMath(document.getElementById('quiz-body'));
}

function closeModal(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.add('opacity-0');
  var panel = el.querySelector('[data-modal-panel]');
  if (panel) panel.classList.add('scale-95');
  setTimeout(function () { el.classList.add('hidden'); }, 200);
}

function closeAllModals() {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(closeModal);
}

function renderSidebar() {
  var container = document.getElementById('element-list');
  container.innerHTML = '';
  elements.forEach(function (el) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.elId = el.id;
    btn.className = 'w-full text-left px-4 py-3 rounded-lg mb-1 transition-all duration-200 flex items-center justify-between group hover:bg-gray-700 border border-transparent hover:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500';
    btn.innerHTML =
      '<span class="font-medium text-gray-200 group-hover:text-white el-name">' + t(el.nameKey) + '</span>' +
      '<span class="text-xs font-mono text-gray-600 bg-gray-900 px-2 py-1 rounded">Z=' + el.atomicNumber + '</span>';
    btn.onclick = function () { selectElement(el, btn); };
    container.appendChild(btn);
  });
  if (activeElement) {
    var activeBtn = container.querySelector('[data-el-id="' + activeElement.id + '"]');
    if (activeBtn) {
      activeBtn.classList.remove('hover:bg-gray-700');
      activeBtn.classList.add('bg-blue-900', 'border-blue-500', 'shadow-lg');
    }
  }
}

function renderSidebarLabels() {
  document.querySelectorAll('#element-list button').forEach(function (btn) {
    var id = btn.dataset.elId;
    var el = elements.find(function (e) { return e.id === id; });
    if (!el) return;
    var nameSpan = btn.querySelector('.el-name');
    if (nameSpan) nameSpan.textContent = t(el.nameKey);
  });
}

function selectElement(element, btnElement) {
  activeElement = element;
  lastLineDetail = null;

  document.querySelectorAll('#element-list button').forEach(function (b) {
    b.classList.remove('bg-blue-900', 'border-blue-500', 'shadow-lg');
    b.classList.add('hover:bg-gray-700');
  });
  btnElement.classList.remove('hover:bg-gray-700');
  btnElement.classList.add('bg-blue-900', 'border-blue-500', 'shadow-lg');

  var symbol = element.id.charAt(0).toUpperCase() + element.id.slice(1);
  document.getElementById('current-element-display').innerText = symbol;
  var solidColor = element.tubeColor.replace(/[\d.]+\)$/g, '1)');
  document.getElementById('current-element-display').style.color = solidColor;
  document.getElementById('atomic-number').innerText = element.atomicNumber;
  document.getElementById('initial-hint').style.display = 'none';
  document.getElementById('info-panel').style.opacity = '0';
  document.getElementById('info-lambda').innerText = '---';
  document.getElementById('info-color-name').innerText = '---';
  document.getElementById('info-energy').innerText = '---';

  activateDischargeTube(element.tubeColor);
  renderSpectrum(element.lines);
}

function drawCircuitBase() {
  var canvas = document.getElementById('circuitCanvas');
  var ctx = canvas.getContext('2d');
  var container = document.getElementById('circuit-container');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  var w = canvas.width;
  var h = canvas.height;
  var cx = w / 2;
  var cy = h / 2;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#4a5568';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  var tubeW = Math.min(340, w * 0.7);
  var tubeH = Math.min(70, h * 0.22);

  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx - tubeW / 2, cy - tubeH / 2, tubeW, tubeH, 15);
  else {
    ctx.rect(cx - tubeW / 2, cy - tubeH / 2, tubeW, tubeH);
  }
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#718096';
  ctx.fillRect(cx - tubeW / 2 + 15, cy - (tubeH / 2 - 10), 15, tubeH - 20);
  ctx.fillRect(cx + tubeW / 2 - 30, cy - (tubeH / 2 - 10), 15, tubeH - 20);

  ctx.strokeStyle = '#63b3ed';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx - tubeW / 2 + 15, cy);
  ctx.lineTo(cx - tubeW / 2 - 40, cy);
  ctx.lineTo(cx - tubeW / 2 - 40, cy + 100);
  ctx.lineTo(cx - 40, cy + 100);
  ctx.moveTo(cx + tubeW / 2 - 15, cy);
  ctx.lineTo(cx + tubeW / 2 + 40, cy);
  ctx.lineTo(cx + tubeW / 2 + 40, cy + 100);
  ctx.lineTo(cx + 40, cy + 100);
  ctx.stroke();

  var boxW = 80;
  var boxH = 50;
  var boxY = cy + 75;
  ctx.fillStyle = '#2d3748';
  ctx.fillRect(cx - boxW / 2, boxY, boxW, boxH);
  ctx.strokeStyle = '#fbd38d';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - boxW / 2, boxY, boxW, boxH);
  ctx.fillStyle = '#fbd38d';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('H.V.', cx, boxY + boxH / 2);
  ctx.beginPath();
  ctx.moveTo(cx - 45, boxY + boxH / 2);
  ctx.lineTo(cx - 55, boxY + boxH / 2);
  ctx.stroke();
}

function activateDischargeTube(color) {
  var glow = document.getElementById('tube-glow');
  glow.style.backgroundColor = color;
  glow.style.boxShadow = '0 0 40px 15px ' + color;
  glow.style.opacity = '1';
  glow.classList.add('discharge-active');
}

function renderSpectrum(lines) {
  var container = document.getElementById('spectrum-lines-container');
  container.innerHTML = '';
  lines.forEach(function (line) {
    var range = SPECTRUM_MAX - SPECTRUM_MIN;
    var pos = ((line.wl - SPECTRUM_MIN) / range) * 100;
    if (pos < 0 || pos > 100) return;
    var lineDiv = document.createElement('div');
    var color = wavelengthToColor(line.wl);
    lineDiv.className = 'spectral-line absolute top-0 bottom-0 w-1 hover:w-2 z-10 rounded-full';
    lineDiv.style.left = pos + '%';
    lineDiv.style.backgroundColor = color;
    lineDiv.style.boxShadow = '0 0 ' + (5 + line.intensity * 10) + 'px ' + color;
    lineDiv.style.opacity = 0.8 + (line.intensity * 0.2);
    lineDiv.onclick = function () { showLineDetails(line, color); };
    lineDiv.title = line.wl + ' nm' + (line.name ? ' (' + line.name + ')' : '');
    container.appendChild(lineDiv);
  });
}

function showLineDetails(line, colorCss) {
  lastLineDetail = line;
  var panel = document.getElementById('info-panel');
  panel.style.opacity = '1';
  document.getElementById('info-color-preview').style.backgroundColor = colorCss;
  document.getElementById('info-color-preview').style.boxShadow = '0 0 15px ' + colorCss;
  document.getElementById('info-lambda').innerText = line.wl;
  document.getElementById('info-color-name').innerText = getColorName(line.wl);
  document.getElementById('info-energy').innerText = calculateEnergy(line.wl);
}

function doReset() {
  activeElement = null;
  lastLineDetail = null;
  document.getElementById('current-element-display').innerText = '--';
  document.getElementById('current-element-display').style.color = '';
  document.getElementById('atomic-number').innerText = '--';
  var glow = document.getElementById('tube-glow');
  glow.style.opacity = '0';
  glow.classList.remove('discharge-active');
  document.getElementById('spectrum-lines-container').innerHTML = '';
  document.getElementById('info-panel').style.opacity = '0';
  document.getElementById('info-lambda').innerText = '---';
  document.getElementById('info-color-name').innerText = '---';
  document.getElementById('info-energy').innerText = '---';
  document.getElementById('info-color-preview').style.backgroundColor = '';
  document.getElementById('info-color-preview').style.boxShadow = '';
  document.getElementById('initial-hint').style.display = '';
  document.querySelectorAll('#element-list button').forEach(function (b) {
    b.classList.remove('bg-blue-900', 'border-blue-500', 'shadow-lg');
    b.classList.add('hover:bg-gray-700');
  });
  drawCircuitBase();
}

function init() {
  renderSidebar();
  drawCircuitBase();
  renderSteps();
  renderPrinciple();
  renderQuiz();
  updateLanguage();

  window.addEventListener('resize', function () { drawCircuitBase(); });

  document.getElementById('btn-steps').addEventListener('click', function () { openModal('modal-steps'); });
  document.getElementById('btn-principle').addEventListener('click', function () { openModal('modal-principle'); });
  document.getElementById('btn-principle-soft').addEventListener('click', function () { openModal('modal-principle'); });
  document.getElementById('btn-quiz').addEventListener('click', function () { openModal('modal-quiz'); });
  document.getElementById('btn-lang').addEventListener('click', function () {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    updateLanguage();
  });
  document.getElementById('btn-reset').addEventListener('click', doReset);
  document.getElementById('btn-quiz-answers').addEventListener('click', function () {
    quizState.showAnswers = !quizState.showAnswers;
    renderQuiz();
  });
  document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
    btn.addEventListener('click', function () { closeModal(btn.getAttribute('data-close-modal')); });
  });
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
    var modal = document.getElementById(id);
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal(id);
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAllModals();
  });
}

init();
</script>
