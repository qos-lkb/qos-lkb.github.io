<script>
/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

const QUIZ_META = [
  { id: 'q1', type: 'mc', options: ['a', 'b', 'c', 'd'], correct: 'a' },
  { id: 'q2', type: 'short' },
  { id: 'q3', type: 'mc', options: ['a', 'b', 'c', 'd'], correct: 'a' },
  { id: 'q4', type: 'short' },
  { id: 'q5', type: 'mc', options: ['a', 'b', 'c', 'd'], correct: 'a' }
];

function t(key) {
  return (translations[currentLang] && translations[currentLang][key]) || (translations.zh[key] || key);
}

function typesetMath(root) {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise(root ? [root] : undefined).catch(() => {});
  }
}

function updateLanguage() {
  document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (translations[currentLang][key] != null) el.textContent = translations[currentLang][key];
  });
  syncToggleButton();
  updateStatsUI();
  renderSteps();
  renderPrinciple();
  renderQuiz();
  const ansBtn = document.getElementById('btn-quiz-answers');
  if (ansBtn) ansBtn.textContent = quizState.showAnswers ? t('hideAnswers') : t('showAnswers');
}

function renderSteps() {
  const ol = document.getElementById('steps-body');
  if (!ol) return;
  ol.innerHTML = [1, 2, 3, 4].map(n => `<li>${t('step' + n)}</li>`).join('');
}

function renderPrinciple() {
  const body = document.getElementById('principle-body');
  if (!body) return;
  body.innerHTML = `
    <section><h3 class="text-lg font-bold text-white mb-2 border-l-4 border-blue-500 pl-2">${t('principleConceptTitle')}</h3><p>${t('principleConcept')}</p></section>
    <section><h3 class="text-lg font-bold text-white mb-2 border-l-4 border-green-500 pl-2">${t('principleMechTitle')}</h3>${t('principleMech')}</section>
    <section><h3 class="text-lg font-bold text-white mb-2 border-l-4 border-purple-500 pl-2">${t('principleExampleTitle')}</h3><p>${t('principleExample')}</p></section>
  `;
  typesetMath(body);
}

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  if (!body) return;
  const ref = currentLang === 'zh' ? '參考答案' : 'Reference answer';
  const mkChoice = (qid) => {
    const meta = QUIZ_META.find(q => q.id === qid);
    if (!meta || meta.type !== 'mc') return '';
    return '<div class="grid gap-1.5 mt-1">' + meta.options.map(opt => {
      const key = qid + opt;
      return '<label class="flex items-start gap-2 rounded-lg border border-slate-600 p-2 cursor-pointer hover:bg-slate-800/50">' +
        '<input type="radio" name="' + qid + '" class="mt-0.5">' +
        '<span class="text-sm">' + t(key) + '</span></label>';
    }).join('') + '</div>';
  };
  const ans = (key) => quizState.showAnswers
    ? '<div class="mt-2 text-xs text-emerald-300 bg-emerald-950/40 border border-emerald-800/40 rounded-lg p-2"><strong>' + ref + '：</strong> ' + t(key) + '</div>'
    : '';
  const layout = [
    { id: 'q1', mc: true }, { id: 'q2', mc: false }, { id: 'q3', mc: true }, { id: 'q4', mc: false }, { id: 'q5', mc: true }
  ];
  body.innerHTML = layout.map((b, idx) =>
    '<div class="quiz-item" data-quiz="' + b.id + '">' +
    '<div class="q-stem">Q' + (idx + 1) + '. ' + t(b.id) + '</div>' +
    (b.mc ? mkChoice(b.id) : '<p class="text-xs text-slate-500 mb-1">' + t('shortHint') + '</p>') +
    ans(b.id + 'ans') + '</div>'
  ).join('');
  const ansBtn = document.getElementById('btn-quiz-answers');
  if (ansBtn) ansBtn.textContent = quizState.showAnswers ? t('hideAnswers') : t('showAnswers');
  typesetMath(body);
}

function openModal(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('hidden');
  requestAnimationFrame(() => {
    el.classList.remove('opacity-0');
    const panel = el.querySelector('[data-modal-panel]');
    if (panel) panel.classList.remove('scale-95');
  });
  if (id === 'modal-principle') typesetMath(document.getElementById('principle-body'));
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('opacity-0');
  const panel = el.querySelector('[data-modal-panel]');
  if (panel) panel.classList.add('scale-95');
  setTimeout(() => el.classList.add('hidden'), 200);
}

function closeAllModals() {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(closeModal);
}

const canvas = document.getElementById('simCanvas');
const chartCanvas = document.getElementById('chartCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const chartCtx = chartCanvas.getContext('2d');
const btnToggle = document.getElementById('btn-toggle');
const btnReset = document.getElementById('btn-reset');
const inputRate = document.getElementById('input-rate');
const elDistributionList = document.getElementById('distribution-list');
const elTotalCount = document.getElementById('stat-total-count');

class Nucleus {
  constructor(x, y) { this.x = x; this.y = y; }
  draw(c) {
    c.beginPath();
    c.arc(this.x, this.y, CONFIG.cutoffRadius, 0, Math.PI * 2);
    c.fillStyle = 'rgba(255, 215, 0, 0.05)';
    c.fill();
    const gradient = c.createRadialGradient(this.x, this.y, 0.5, this.x, this.y, CONFIG.goldRadius * 3);
    gradient.addColorStop(0, 'rgba(255, 215, 0, 1)');
    gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
    c.beginPath();
    c.arc(this.x, this.y, CONFIG.goldRadius * 3, 0, Math.PI * 2);
    c.fillStyle = gradient;
    c.fill();
    c.beginPath();
    c.arc(this.x, this.y, CONFIG.goldRadius, 0, Math.PI * 2);
    c.fillStyle = '#fbbf24';
    c.fill();
  }
}

class AlphaParticle {
  constructor(y) {
    this.x = 0;
    this.y = y;
    this.vx = CONFIG.initialVelocity;
    this.vy = 0;
    this.trail = [];
    this.active = true;
    this.color = `hsl(${Math.random() * 10 + 350}, 90%, 75%)`;
    this.interacted = false;
  }
  update() {
    if (!this.active) return;
    for (let i = 0; i < CONFIG.physicsSteps; i++) {
      let ax = 0, ay = 0;
      for (const n of state.nuclei) {
        const dx = this.x - n.x;
        const dy = this.y - n.y;
        const distSq = dx * dx + dy * dy;
        const cutoffSq = CONFIG.cutoffRadius * CONFIG.cutoffRadius;
        if (distSq > cutoffSq) continue;
        if (distSq < 0.5) continue;
        this.interacted = true;
        const dist = Math.sqrt(distSq);
        const force = (CONFIG.goldCharge * CONFIG.alphaCharge) / distSq;
        ax += (dx / dist) * force;
        ay += (dy / dist) * force;
      }
      this.vx += ax / CONFIG.physicsSteps;
      this.vy += ay / CONFIG.physicsSteps;
      this.x += this.vx / CONFIG.physicsSteps;
      this.y += this.vy / CONFIG.physicsSteps;
    }
    const recordChance = this.interacted ? 0.8 : 0.2;
    if (Math.random() < recordChance) {
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 30) this.trail.shift();
    }
    if (this.x > state.canvasWidth || this.x < 0 || this.y > state.canvasHeight || this.y < 0) {
      this.active = false;
      this.recordStats();
    }
  }
  draw(c) {
    if (this.trail.length > 1) {
      c.beginPath();
      c.moveTo(this.trail[0].x, this.trail[0].y);
      for (let p of this.trail) c.lineTo(p.x, p.y);
      c.strokeStyle = this.interacted ? '#ff4444' : '#4ade80';
      c.lineWidth = this.interacted ? 1.5 : 0.5;
      c.globalAlpha = this.interacted ? 0.8 : 0.3;
      c.stroke();
      c.globalAlpha = 1.0;
    }
    c.beginPath();
    c.arc(this.x, this.y, CONFIG.alphaRadius, 0, Math.PI * 2);
    c.fillStyle = '#fff';
    c.fill();
  }
  recordStats() {
    let angleRad = Math.atan2(this.vy, this.vx);
    let angleDegSigned = angleRad * (180 / Math.PI);
    let angleDegAbs = Math.abs(angleDegSigned);
    state.stats.total++;
    let binIndex = Math.min(Math.floor(angleDegAbs / 10), 18);
    state.stats.binsAbs[binIndex]++;
    if (angleDegSigned >= -180 && angleDegSigned <= 180) {
      let chartIndex = Math.floor((angleDegSigned + 180) / 2);
      if (chartIndex >= 0 && chartIndex < state.stats.chartData.length) {
        state.stats.chartData[chartIndex]++;
      }
    }
  }
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  state.canvasWidth = rect.width;
  state.canvasHeight = rect.height;
  setupNuclei();
}

function resizeChartCanvas() {
  const rect = chartCanvas.parentElement.getBoundingClientRect();
  chartCanvas.width = rect.width;
  chartCanvas.height = rect.height;
}

function setupNuclei() {
  state.nuclei = [];
  const centerX = state.canvasWidth / 2;
  const centerY = state.canvasHeight / 2;
  const spacing = 220;
  for (let col = -1; col <= 1; col++) {
    for (let row = -2; row <= 2; row++) {
      let offsetX = (row % 2 === 0) ? 0 : spacing / 2;
      state.nuclei.push(new Nucleus(
        centerX + col * spacing + offsetX,
        centerY + row * spacing * 0.866
      ));
    }
  }
}

function spawnParticles() {
  const rangeY = 600;
  const centerY = state.canvasHeight / 2;
  for (let i = 0; i < state.emissionRate; i++) {
    const y = centerY + (Math.random() - 0.5) * rangeY;
    state.particles.push(new AlphaParticle(y));
  }
}

function update() {
  state.particles = state.particles.filter(p => p.active);
  if (state.isRunning && state.particles.length < CONFIG.maxParticles) spawnParticles();
  state.particles.forEach(p => p.update());
}

function draw() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, state.canvasWidth, state.canvasHeight);
  state.nuclei.forEach(n => n.draw(ctx));
  state.particles.forEach(p => p.draw(ctx));
}

function drawChart() {
  const w = chartCanvas.width;
  const h = chartCanvas.height;
  chartCtx.fillStyle = '#1e293b';
  chartCtx.fillRect(0, 0, w, h);
  chartCtx.strokeStyle = '#475569';
  chartCtx.lineWidth = 1;
  chartCtx.beginPath();
  chartCtx.moveTo(0, h - 20);
  chartCtx.lineTo(w, h - 20);
  chartCtx.stroke();
  chartCtx.beginPath();
  chartCtx.moveTo(w / 2, 0);
  chartCtx.lineTo(w / 2, h - 20);
  chartCtx.strokeStyle = '#334155';
  chartCtx.setLineDash([5, 5]);
  chartCtx.stroke();
  chartCtx.setLineDash([]);
  const data = state.stats.chartData;
  const maxVal = Math.max(...data, 10);
  const barWidth = w / data.length;
  for (let i = 0; i < data.length; i++) {
    const count = data[i];
    const barHeight = (count / maxVal) * (h - 40);
    const x = i * barWidth;
    const y = h - 20 - barHeight;
    const distFromCenter = Math.abs(i - 90);
    if (distFromCenter > 45) chartCtx.fillStyle = '#f87171';
    else if (distFromCenter > 5) chartCtx.fillStyle = '#fbbf24';
    else chartCtx.fillStyle = '#4ade80';
    if (count > 0 && barHeight < 1) chartCtx.fillRect(x, h - 21, barWidth, 1);
    else chartCtx.fillRect(x, y, barWidth, barHeight);
  }
}

function animate() {
  update();
  draw();
  if (state.stats.total % 5 === 0) {
    updateStatsUI();
    drawChart();
  }
  requestAnimationFrame(animate);
}

function updateStatsUI() {
  elTotalCount.innerText = state.stats.total;
  if (state.stats.total === 0) {
    elDistributionList.innerHTML = `<div class="text-slate-500 text-center py-4">${t('waitingData')}</div>`;
    return;
  }
  let html = '';
  const total = state.stats.total > 0 ? state.stats.total : 1;
  for (let i = 0; i < 10; i++) {
    let count = 0;
    let label = '';
    if (i < 9) {
      count = state.stats.binsAbs[i];
      label = `${i * 10}° - ${(i + 1) * 10}°`;
    } else {
      for (let j = 9; j < state.stats.binsAbs.length; j++) count += state.stats.binsAbs[j];
      label = t('binGt90');
    }
    const pct = (count / total * 100).toFixed(1);
    const width = Math.max(pct, 0.5);
    let barColor = 'bg-green-500';
    if (i >= 1 && i <= 3) barColor = 'bg-yellow-400';
    if (i >= 4) barColor = 'bg-red-500';
    html += `<div>
      <div class="flex justify-between mb-1 text-[10px] text-slate-400">
        <span>${label}</span>
        <span>${count} (${pct}%)</span>
      </div>
      <div class="w-full bg-slate-700 rounded-full h-1.5 overflow-hidden">
        <div class="${barColor} h-1.5 rounded-full transition-all duration-300" style="width: ${width}%"></div>
      </div>
    </div>`;
  }
  elDistributionList.innerHTML = html;
}

function syncToggleButton() {
  const btnText = document.getElementById('btn-text');
  const btnIcon = document.getElementById('btn-icon');
  if (state.isRunning) {
    btnText.textContent = t('btnPause');
    btnIcon.textContent = '⏸';
    btnToggle.classList.remove('bg-green-600', 'hover:bg-green-500');
    btnToggle.classList.add('bg-yellow-600', 'hover:bg-yellow-500');
  } else {
    const started = state.stats.total > 0 || state.particles.length > 0;
    btnText.textContent = started ? t('btnContinue') : t('btnStart');
    btnIcon.textContent = '▶';
    btnToggle.classList.remove('bg-yellow-600', 'hover:bg-yellow-500');
    btnToggle.classList.add('bg-green-600', 'hover:bg-green-500');
  }
}

function toggleSim() {
  state.isRunning = !state.isRunning;
  syncToggleButton();
}

function resetSim() {
  state.particles = [];
  state.stats.total = 0;
  state.stats.binsAbs.fill(0);
  state.stats.chartData.fill(0);
  state.isRunning = false;
  state.emissionRate = 8;
  inputRate.value = '8';
  syncToggleButton();
  updateStatsUI();
  drawChart();
  // do NOT reset currentLang
}

function initTeachingShell() {
  document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
  document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
  document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
  document.getElementById('btn-lang').addEventListener('click', () => {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    updateLanguage();
  });
  document.getElementById('btn-quiz-answers').addEventListener('click', function () {
    quizState.showAnswers = !quizState.showAnswers;
    renderQuiz();
  });
  document.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close-modal')));
  });
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('click', e => { if (e.target === el) closeModal(id); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAllModals();
  });
}

function init() {
  resizeCanvas();
  resizeChartCanvas();
  window.addEventListener('resize', () => {
    resizeCanvas();
    resizeChartCanvas();
  });
  setupNuclei();
  animate();
  updateStatsUI();
  btnToggle.addEventListener('click', toggleSim);
  btnReset.addEventListener('click', resetSim);
  inputRate.addEventListener('input', e => {
    state.emissionRate = parseInt(e.target.value, 10);
  });
  initTeachingShell();
  updateLanguage();
}

init();
</script>
