<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平行板電場 | Parallel-Plate Field</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/sim-mathjax.css">
<script>
  MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  .lab-modal[hidden] { display: none !important; }
  .lab-modal { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  input[type=range] { width: 100%; accent-color: #0284c7; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="max-w-7xl mx-auto mt-3 px-4 py-3 bg-white/90 backdrop-blur rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3 sticky top-2 z-20">
  <div>
    <p class="text-[11px] font-semibold tracking-wide text-sky-700" data-i18n="badge">物理</p>
    <h1 class="text-lg sm:text-xl font-bold" data-i18n="title"></h1>
  </div>
  <div class="flex flex-wrap gap-2">
    <button type="button" id="btn-steps" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-slate-100" data-i18n="btnSteps">觀察步驟</button>
    <button type="button" id="btn-principle" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-sky-600 text-white" data-i18n="btnPrinciple">原理解說</button>
    <button type="button" id="btn-quiz" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-rose-50 text-rose-700 border border-rose-200" data-i18n="btnQuiz">課堂問題</button>
    <div class="flex rounded-full border border-slate-200 overflow-hidden">
      <button type="button" id="langZh" class="px-3 py-1.5 text-sm font-semibold bg-slate-900 text-white">中</button>
      <button type="button" id="langEn" class="px-3 py-1.5 text-sm font-semibold">EN</button>
    </div>
  </div>
</header>
<main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
  <aside class="lg:col-span-4 order-2 lg:order-1 bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
    
    <label class="block text-sm font-semibold" data-i18n="vLabel"></label>
    <input id="vSlider" type="range" min="2" max="24" step="1" value="12">
    <p id="vValue" class="text-sm text-slate-600"></p>
    <label class="block text-sm font-semibold" data-i18n="dLabel"></label>
    <input id="dSlider" type="range" min="2" max="12" step="0.5" value="6">
    <p id="dValue" class="text-sm text-slate-600"></p>
    <p class="text-sm font-semibold" data-i18n="qLabel"></p>
    <div class="grid grid-cols-2 gap-2">
      <button type="button" id="qPos" class="px-3 py-2 rounded-xl border text-sm font-semibold" data-i18n="qPos"></button>
      <button type="button" id="qNeg" class="px-3 py-2 rounded-xl border text-sm font-semibold" data-i18n="qNeg"></button>
    </div>
    <label class="block text-sm font-semibold" data-i18n="xLabel"></label>
    <input id="xSlider" type="range" min="18" max="82" step="1" value="50">
    <button type="button" id="btn-reset" class="w-full px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold" data-i18n="reset"></button>
    
  </aside>
  <section class="lg:col-span-8 order-1 lg:order-2 bg-white rounded-2xl border border-slate-200 p-4" aria-label="simulation">
    
    <p id="formula" class="text-sm mb-2" data-i18n="formula"></p>
    <canvas id="stage" class="w-full rounded-xl border border-slate-100" width="720" height="400"></canvas>
    <p id="readout" class="mt-3 text-sm leading-relaxed"></p>
    
  </section>
</main>
<div id="modal-steps" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="steps-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="steps-title" class="text-lg font-bold" data-i18n="stepsTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <ol id="steps-body" class="list-decimal pl-5 space-y-1 text-sm"></ol>
  </div>
</div>
<div id="modal-principle" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="principle-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="principle-title" class="text-lg font-bold" data-i18n="principleTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="principle-body" class="space-y-2 text-sm"></div>
  </div>
</div>
<div id="modal-quiz" class="lab-modal" hidden role="dialog" aria-modal="true" aria-labelledby="quiz-title">
  <div class="w-full max-w-xl max-h-[80vh] overflow-auto bg-white rounded-2xl p-4">
    <div class="flex justify-between items-center mb-2"><h2 id="quiz-title" class="text-lg font-bold" data-i18n="quizTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div id="quiz-list"></div>
    <button type="button" id="btn-quiz-answers" class="mt-2 px-3 py-1.5 rounded-lg bg-slate-900 text-white text-sm"></button>
  </div>
</div>
<script>
const I18N = {"zh": {"badge": "物理", "btnSteps": "觀察步驟", "btnPrinciple": "原理解說", "btnQuiz": "課堂問題", "stepsTitle": "觀察步驟", "principleTitle": "原理解說", "quizTitle": "課堂問題", "showAnswers": "顯示參考答案", "hideAnswers": "隱藏參考答案", "answerLabel": "參考答案", "reset": "重置", "title": "平行板電場", "vLabel": "電位差 V", "dLabel": "板距 d", "qLabel": "檢驗電荷（1 µC）", "qPos": "正電荷", "qNeg": "負電荷", "xLabel": "電荷位置", "formula": "均勻電場 \\(E = V/d\\)，受力 \\(F = qE\\)。", "towardNeg": "正電荷受力指向負板。", "towardPos": "負電荷受力指向正板。", "uniform": "板間場線平行，場的大小不隨位置改變。"}, "en": {"badge": "Physics", "btnSteps": "Steps", "btnPrinciple": "Principle", "btnQuiz": "Quiz", "stepsTitle": "Steps", "principleTitle": "Principle", "quizTitle": "Quiz", "showAnswers": "Show answers", "hideAnswers": "Hide answers", "answerLabel": "Answer", "reset": "Reset", "title": "Parallel-Plate Field", "vLabel": "Potential difference V", "dLabel": "Plate separation d", "qLabel": "Test charge (1 µC)", "qPos": "Positive", "qNeg": "Negative", "xLabel": "Charge position", "formula": "Uniform field \\(E = V/d\\), force \\(F = qE\\).", "towardNeg": "A positive charge is forced toward the negative plate.", "towardPos": "A negative charge is forced toward the positive plate.", "uniform": "The lines between the plates are parallel, so the field does not change with position."}};
const CLASSROOM = {"steps": {"zh": ["保持正電荷，加大 V，看場線和力的箭嘴變密、變長。", "加大板距 d，看 E 和 F 變小。", "左右移動電荷，確認板間的力大小不變。", "改成負電荷，看力的方向反轉。", "把 V 調回較小值，再比較箭嘴長短。"], "en": ["Keep the positive charge and increase V. The lines get denser and the force arrow grows.", "Increase the separation d and watch E and F fall.", "Move the charge left and right. The force stays the same size between the plates.", "Switch to a negative charge and watch the force reverse.", "Lower V again and compare the arrow length."]}, "principle": {"zh": ["平行板之間的電場近似均勻，\\(E = V/d\\)。d 用米。", "電荷受力 \\(F = qE\\)。正電荷沿電場方向，負電荷相反。", "板外的場很弱。改變電荷在板間的位置，不會改變 E 的大小。"], "en": ["The field between parallel plates is approximately uniform, \\(E = V/d\\), with d in metres.", "The force is \\(F = qE\\). A positive charge follows the field; a negative charge goes the other way.", "Outside the plates the field is weak. Moving the charge between the plates does not change the size of E."]}, "quiz": [{"zh": "只把電位差 V 加倍，板距不變，E 會？", "en": "If only the potential difference V is doubled, E will?", "azh": "A。E 與 V 成正比。", "aen": "A. E is proportional to V.", "czh": ["加倍", "減半", "不變", "變為零"], "cen": ["Double", "Halve", "Stay the same", "Become zero"], "ans": 0}, {"zh": "先預測板距加大時力變小，再把 d 調大核對。", "en": "Predict that a larger separation makes the force smaller, then increase d.", "azh": "d 變大時 E = V/d 變小，F = qE 也變小。", "aen": "A larger d makes E = V/d smaller, so F = qE is smaller."}, {"zh": "正電荷在板間的受力方向是？", "en": "The force on a positive charge between the plates points?", "azh": "B。由正板指向負板。", "aen": "B. From the positive plate toward the negative plate.", "czh": ["由負板指向正板", "由正板指向負板", "垂直於板面向上", "沒有方向"], "cen": ["From the negative plate to the positive plate", "From the positive plate to the negative plate", "Upward, perpendicular to the plates", "In no direction"], "ans": 1}, {"zh": "先預測把電荷改成負電時箭嘴反向，再按「負電荷」。", "en": "Predict that a negative charge reverses the arrow, then select Negative.", "azh": "q 變號，F = qE 的方向相反。", "aen": "Changing the sign of q reverses F = qE."}, {"zh": "電荷在兩板之間左右移動時，E 的大小？", "en": "As the charge moves left and right between the plates, the size of E?", "azh": "C。均勻電場不隨位置改變。", "aen": "C. A uniform field does not change with position.", "czh": ["愈近正板愈大", "愈近負板愈大", "保持不變", "一定變為零"], "cen": ["Grows nearer the positive plate", "Grows nearer the negative plate", "Stays the same", "Must become zero"], "ans": 2}]};
let lang = 'zh';
let quizAnswers = false;

const S = { V: 12, d: 6, q: 1, x: 50 };
function fitCanvas(canvas, ratio) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(360, canvas.clientWidth || 720);
  const h = Math.max(260, Math.round(w * ratio));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function arrow(ctx, x1, y1, x2, y2, color) {
  const ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 8 * Math.cos(ang - 0.4), y2 - 8 * Math.sin(ang - 0.4));
  ctx.lineTo(x2 - 8 * Math.cos(ang + 0.4), y2 - 8 * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fill();
}
function render() {
  const dM = S.d / 100;
  const E = S.V / dM;
  const F = Math.abs(S.q) * 1e-6 * E;
  const toRight = S.q > 0;
  const canvas = document.getElementById('stage');
  const { ctx, w, h } = fitCanvas(canvas, 0.56);
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, w, h);
  const plateT = 16;
  const top = 54;
  const bot = h - 58;
  const left = 118;
  const right = w - 64;
  const cells = Math.max(1, Math.min(4, Math.round(S.V / 6)));
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(left + plateT / 2, top);
  ctx.lineTo(left + plateT / 2, top - 18);
  ctx.lineTo(46, top - 18);
  ctx.lineTo(46, top + 8);
  ctx.stroke();
  let by = top + 8;
  for (let i = 0; i < cells; i++) {
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#b91c1c';
    ctx.beginPath();
    ctx.moveTo(46 - 12, by);
    ctx.lineTo(46 + 12, by);
    ctx.stroke();
    ctx.strokeStyle = '#1d4ed8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(46 - 7, by + 8);
    ctx.lineTo(46 + 7, by + 8);
    ctx.stroke();
    by += 16;
  }
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(46, by - 8);
  ctx.lineTo(46, h - 22);
  ctx.lineTo(right - plateT / 2, h - 22);
  ctx.lineTo(right - plateT / 2, bot);
  ctx.stroke();
  ctx.fillStyle = '#64748b';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(S.V.toFixed(0) + ' V', 46, top - 24);
  function plate(x, hot) {
    const g = ctx.createLinearGradient(x, 0, x + plateT, 0);
    if (hot) {
      g.addColorStop(0, '#fecaca');
      g.addColorStop(0.5, '#ef4444');
      g.addColorStop(1, '#7f1d1d');
    } else {
      g.addColorStop(0, '#1e3a8a');
      g.addColorStop(0.5, '#3b82f6');
      g.addColorStop(1, '#dbeafe');
    }
    ctx.fillStyle = g;
    ctx.fillRect(x, top, plateT, bot - top);
    ctx.fillStyle = hot ? '#991b1b' : '#1e3a8a';
    ctx.fillRect(x - 5, top - 4, plateT + 10, 8);
    ctx.fillRect(x - 5, bot - 4, plateT + 10, 8);
  }
  plate(left, true);
  plate(right - plateT, false);
  ctx.font = '700 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7f1d1d';
  ctx.fillText('+', left + plateT / 2, top - 8);
  ctx.fillStyle = '#1e3a8a';
  ctx.fillText('−', right - plateT / 2, top - 8);
  const n = Math.max(4, Math.min(11, Math.round(E / 220)));
  ctx.strokeStyle = '#0284c7';
  ctx.fillStyle = '#0284c7';
  ctx.lineWidth = 1.6;
  for (let i = 0; i < n; i++) {
    const y = top + 18 + (bot - top - 36) * (i + 0.5) / n;
    const bow = i === 0 ? 8 : i === n - 1 ? -8 : 0;
    const x1 = left + plateT + 6;
    const x2 = right - plateT - 14;
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.quadraticCurveTo((x1 + x2) / 2, y + bow, x2, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2 + 8, y);
    ctx.lineTo(x2, y - 4);
    ctx.lineTo(x2, y + 4);
    ctx.closePath();
    ctx.fill();
  }
  const gap = right - left;
  const cx = left + plateT + 28 + (S.x / 100) * (gap - plateT * 2 - 56);
  const cy = (top + bot) / 2;
  const reach = 26 + Math.min(48, E / 80);
  const x2 = toRight ? cx + reach : cx - reach;
  ctx.strokeStyle = '#0f172a';
  ctx.fillStyle = '#0f172a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(x2, cy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2 + (toRight ? 8 : -8), cy);
  ctx.lineTo(x2, cy - 5);
  ctx.lineTo(x2, cy + 5);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 16, 0, Math.PI * 2);
  ctx.fillStyle = S.q > 0 ? '#ef4444' : '#2563eb';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '700 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(S.q > 0 ? '+' : '−', cx, cy + 5);
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(left, bot + 16);
  ctx.lineTo(right, bot + 16);
  ctx.moveTo(left, bot + 10);
  ctx.lineTo(left, bot + 22);
  ctx.moveTo(right, bot + 10);
  ctx.lineTo(right, bot + 22);
  ctx.stroke();
  ctx.fillStyle = '#334155';
  ctx.font = '12px "Noto Sans TC", sans-serif';
  ctx.fillText('d = ' + S.d.toFixed(1) + ' cm', (left + right) / 2, bot + 34);
  document.getElementById('vValue').textContent = S.V.toFixed(0) + ' V';
  document.getElementById('dValue').textContent = S.d.toFixed(1) + ' cm';
  const dir = toRight ? I18N[lang].towardNeg : I18N[lang].towardPos;
  document.getElementById('readout').textContent =
    'E = ' + E.toFixed(0) + ' N/C    F = ' + (F * 1e6).toFixed(0) + ' µN. ' + dir + ' ' + I18N[lang].uniform;
  document.getElementById('qPos').classList.toggle('bg-rose-50', S.q > 0);
  document.getElementById('qNeg').classList.toggle('bg-sky-50', S.q < 0);
}
function resetSim() { S.V = 12; S.d = 6; S.q = 1; S.x = 50; document.getElementById('vSlider').value = 12; document.getElementById('dSlider').value = 6; document.getElementById('xSlider').value = 50; render(); }

function renderClassroom() {
  const steps = CLASSROOM.steps[lang];
  const principle = CLASSROOM.principle[lang];
  document.getElementById('steps-body').innerHTML = steps.map((s, i) => '<li>' + (i + 1) + '. ' + s + '</li>').join('');
  document.getElementById('principle-body').innerHTML = principle.map((s) => '<p>' + s + '</p>').join('');
  const labels = ['A', 'B', 'C', 'D'];
  document.getElementById('quiz-list').innerHTML = CLASSROOM.quiz.map((q, idx) => {
    const n = idx + 1;
    const open = n === 2 || n === 4;
    let choices = '';
    if (!open) {
      const arr = q[lang === 'zh' ? 'czh' : 'cen'];
      choices = '<div class="grid gap-1.5 mt-2">' + arr.map((text, i) =>
        '<label class="flex gap-2 items-start text-sm"><input type="radio" name="qq' + n + '"> <span>' + labels[i] + '. ' + text + '</span></label>'
      ).join('') + '</div>';
    }
    const ans = quizAnswers
      ? '<div class="mt-2 rounded-lg border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-sm"><strong>' + I18N[lang].answerLabel + '</strong> ' + q[lang === 'zh' ? 'azh' : 'aen'] + '</div>'
      : '';
    return '<article class="border border-slate-200 rounded-xl p-3 mb-2"><p class="text-sm"><strong>Q' + n + '.</strong> ' + q[lang] + '</p>' + choices + ans + '</article>';
  }).join('');
  document.getElementById('btn-quiz-answers').textContent = quizAnswers ? I18N[lang].hideAnswers : I18N[lang].showAnswers;
}
function setLang(next) {
  lang = next;
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key] != null) el.innerHTML = I18N[lang][key];
  });
  document.getElementById('langZh').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'zh' ? 'bg-slate-900 text-white' : '');
  document.getElementById('langEn').className = 'px-3 py-1.5 text-sm font-semibold ' + (lang === 'en' ? 'bg-slate-900 text-white' : '');
  renderClassroom();
  render();
  if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(() => {});
}
function openModal(id) {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => {
    document.getElementById(mid).hidden = mid !== id;
  });
}
function closeModals() {
  ['modal-steps', 'modal-principle', 'modal-quiz'].forEach((mid) => { document.getElementById(mid).hidden = true; });
}
document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
document.getElementById('btn-quiz-answers').addEventListener('click', () => { quizAnswers = !quizAnswers; renderClassroom(); });
document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.querySelectorAll('[data-close]').forEach((btn) => btn.addEventListener('click', closeModals));
document.querySelectorAll('.lab-modal').forEach((el) => el.addEventListener('click', (e) => { if (e.target === el) closeModals(); }));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });
window.addEventListener('resize', () => render());

document.getElementById('vSlider').addEventListener('input', (e) => { S.V = Number(e.target.value); render(); });
document.getElementById('dSlider').addEventListener('input', (e) => { S.d = Number(e.target.value); render(); });
document.getElementById('xSlider').addEventListener('input', (e) => { S.x = Number(e.target.value); render(); });
document.getElementById('qPos').addEventListener('click', () => { S.q = 1; render(); });
document.getElementById('qNeg').addEventListener('click', () => { S.q = -1; render(); });
document.getElementById('btn-reset').addEventListener('click', resetSim);

setLang('zh');
</script>
</body>
</html>
