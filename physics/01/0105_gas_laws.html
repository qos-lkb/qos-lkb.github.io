<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理想氣體粒子模型 | Ideal Gas Particle Model</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        /* Layout note: Three.js particle stage + Chart.js — A/B/C layout exemption; teaching modals still mandatory */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 0 2px white;
        }
        input[type=range]:disabled::-webkit-slider-thumb {
            background: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            border-radius: 0.5rem;
        }
        body {
            font-family: 'Noto Sans TC', system-ui, sans-serif;
        }
        .mode-btn.active {
            background-color: #3b82f6;
            border-color: #60a5fa;
            color: white;
        }
        .modal-panel { transition: opacity 0.25s ease; }
        .modal-panel [data-modal-panel] { transition: transform 0.25s ease; }
        .quiz-item { margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid #e2e8f0; }
        .quiz-item .q-stem { font-weight: 600; color: #1e293b; margin-bottom: 0.5rem; }
        .quiz-options { display: flex; flex-direction: column; gap: 0.4rem; }
        .quiz-options button {
            text-align: left; padding: 0.5rem 0.75rem; border-radius: 0.5rem;
            border: 1px solid #cbd5e1; background: #f8fafc; font-size: 0.875rem;
            transition: all 0.15s; color: #1e293b;
        }
        .quiz-options button:hover { border-color: #6366f1; background: #eef2ff; }
        .quiz-options button.selected { border-color: #4f46e5; background: #e0e7ff; }
        .quiz-options button.correct { border-color: #16a34a; background: #dcfce7; }
        .quiz-options button.wrong { border-color: #dc2626; background: #fee2e2; }
        .quiz-answer { display: none; margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: #f1f5f9; border-radius: 0.5rem; font-size: 0.85rem; color: #334155; }
        .quiz-answer.show { display: block; }
        .mj-block { overflow-x: auto; }
    </style>
</head>
<body class="bg-slate-800 text-white h-screen flex flex-col overflow-hidden">

        <div class="flex items-center gap-3 min-w-0">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>

                </h2>

                <div class="grid grid-cols-3 gap-2 mb-6">
                    <button type="button" onclick="setMode('boyle')" id="btn-boyle" class="mode-btn bg-slate-800 border border-slate-600 text-xs py-2 px-1 rounded hover:bg-slate-600 transition text-center flex flex-col items-center justify-center">
                        <span class="font-bold">等溫</span>
                        <span class="text-[10px] opacity-70">Boyle</span>

                    <button type="button" onclick="setMode('charles')" id="btn-charles" class="mode-btn bg-slate-800 border border-slate-600 text-xs py-2 px-1 rounded hover:bg-slate-600 transition text-center flex flex-col items-center justify-center">
                        <span class="font-bold">等壓</span>
                        <span class="text-[10px] opacity-70">Charles</span>
                    </button>
                    <button type="button" onclick="setMode('gay')" id="btn-gay" class="mode-btn bg-slate-800 border border-slate-600 text-xs py-2 px-1 rounded hover:bg-slate-600 transition text-center flex flex-col items-center justify-center">

                        <span>0.005</span>
                        <span>0.050</span>
                    </div>
                </div>

                <div class="mb-5 group">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-slate-300" id="label-n">摩爾數 (n)</label>
                        <span class="text-sm font-mono text-purple-400" id="val-n">1.0 mol</span>
                    </div>
                    <input type="range" id="slider-n" min="0.1" max="5.0" step="0.1" value="1.0" class="w-full">
                    <div class="mt-1 text-xs text-slate-500 flex justify-between">
                        <span>0.1</span>
                        <span>5.0</span>

                        <label class="text-sm font-medium text-slate-300" id="label-T">溫度 (T)</label>

                    <input type="range" id="slider-T" min="50" max="600" step="1" value="273" class="w-full">
                    <div class="mt-1 text-xs text-slate-500 flex justify-between">
                        <span>50K</span>
                        <span>600K</span>
                    </div>
                </div>

                    <div class="mt-1 text-xs text-slate-500 flex justify-between mb-2">
                        <span>10 kPa</span>
                        <span>1 MPa</span>
                    </div>

                <button type="button" id="btn-reset" class="mt-4 w-full py-2.5 rounded-xl font-semibold text-slate-200 bg-slate-600 hover:bg-slate-500 border border-slate-500 flex justify-center items-center gap-2 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span id="btn-reset-label">重置</span>

            <div class="bg-black/30 p-3 rounded-xl border border-slate-700">

                    </div>

        </aside>

        <section class="flex-1 flex flex-col min-w-0 bg-slate-900 relative overflow-hidden order-1">

            <div class="flex-1 relative min-h-0 bg-black">

    <!-- Modal: Steps -->

    <!-- Modal: Principle (migrated from #info-modal) -->
    <div id="modal-principle" class="modal-panel fixed inset-0 z-50 hidden opacity-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="principle-title">

    <!-- Modal: Quiz -->

                <h2 id="quiz-title" class="text-xl font-bold">課堂問題</h2>
                <div class="flex items-center gap-2">
                    <button type="button" id="btn-quiz-answers" class="text-sm font-bold px-3 py-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-500">顯示參考答案</button>
                    <button type="button" class="text-slate-400 hover:text-slate-700 text-2xl leading-none px-2" data-close-modal="modal-quiz" aria-label="Close">&times;</button>
                </div>
            </div>
            <div id="quiz-body" class="text-sm"></div>
        </div>

    <script>
        const R_SI = 8.314;

        const state = {
            lang: 'zh',
            V: 0.0224,
            n: 1.0,
            T: 273,
            P: 101325,
            mode: 'boyle',
            isUpdating: false,
        };

        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';
        Chart.defaults.font.family = "'Noto Sans TC', sans-serif";

        let myChart = null;

        function initChart() {
            const ctx = document.getElementById('liveChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Theoretical',
                            data: [],
                            borderColor: '#3b82f6',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.4,
                            fill: false
                        },
                        {
                            label: 'Current',
                            data: [],
                            backgroundColor: '#ef4444',
                            borderColor: '#fff',
                            borderWidth: 1,
                            pointRadius: 6,
                            type: 'scatter'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    scales: {
                        x: { type: 'linear', ticks: { font: { size: 10 } }, title: { display: true, font: {size: 10} } },
                        y: { type: 'linear', ticks: { font: { size: 10 } }, title: { display: true, font: {size: 10} } }
                    },
                    animation: false
                }
            });
        }

        const domV = document.getElementById('slider-V');
        const domN = document.getElementById('slider-n');
        const domT = document.getElementById('slider-T');
        const domP = document.getElementById('slider-P');

        const valV = document.getElementById('val-V');
        const valN = document.getElementById('val-n');
        const valT = document.getElementById('val-T');
        const valP = document.getElementById('val-P');

        function setMode(mode) {
            state.mode = mode;

            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`btn-${mode}`);
            if (btn) btn.classList.add('active');

            domV.disabled = false;
            domT.disabled = false;
            domP.disabled = false;
            domN.disabled = false;

            if (mode === 'boyle') {
                domT.disabled = true;
                domP.disabled = false;
            } else if (mode === 'charles') {
                domP.disabled = true;
            } else if (mode === 'gay') {
                domV.disabled = true;
            }

            updateChart();
            updateLanguageText();
        }

        function updateEquation(source) {
            if (state.isUpdating) return;
            state.isUpdating = true;

            let V = parseFloat(domV.value);
            let n = parseFloat(domN.value);
            let T = parseFloat(domT.value);
            let P = parseFloat(domP.value);

            if (state.mode === 'boyle') {
                if (source === 'P') {
                    V = (n * R_SI * T) / P;
                } else {
                    P = (n * R_SI * T) / V;
                }
            } else if (state.mode === 'charles') {
                if (source === 'V' || source === 'n') {
                    T = (P * V) / (n * R_SI);
                } else {
                    V = (n * R_SI * T) / P;
                }
            } else if (state.mode === 'gay') {
                if (source === 'P' || source === 'n') {
                    T = (P * V) / (n * R_SI);
                } else {
                    P = (n * R_SI * T) / V;
                }
            }

            if (V < 0.005) V = 0.005; if (V > 0.050) V = 0.050;
            if (T < 50) T = 50; if (T > 600) T = 600;
            if (P < 10000) P = 10000; if (P > 1000000) P = 1000000;

            state.V = V;
            state.n = n;
            state.T = T;
            state.P = P;

            domV.value = V;
            domN.value = n;
            domT.value = T;
            domP.value = P;

            valV.innerText = `${state.V.toFixed(4)} m³`;
            valN.innerText = `${state.n.toFixed(1)} mol`;
            valT.innerText = `${state.T.toFixed(0)} K`;
            valP.innerText = `${state.P.toFixed(0)} Pa`;

            state.isUpdating = false;
            updateChart();
        }

        function updateChart() {
            if (!myChart) return;

            const { P, V, n, T, mode } = state;

            delete myChart.options.scales.x.min;
            delete myChart.options.scales.x.max;
            delete myChart.options.scales.y.min;
            delete myChart.options.scales.y.max;

            let dataPoints = [];
            let currentPoint = {};
            let xLabel = '', yLabel = '';

            if (mode === 'boyle') {
                xLabel = 'V (m³)';
                yLabel = 'P (Pa)';
                currentPoint = { x: V, y: P };
                const k = n * R_SI * T;
                for (let v_i = 0.005; v_i <= 0.050; v_i += 0.001) {
                    dataPoints.push({ x: v_i, y: k / v_i });
                }
                myChart.options.scales.x.min = 0;
                myChart.options.scales.x.max = 0.050;
                myChart.options.scales.y.min = 0;
            } else if (mode === 'charles') {
                xLabel = 'T (K)';
                yLabel = 'V (m³)';
                currentPoint = { x: T, y: V };
                const k = (n * R_SI) / P;
                dataPoints.push({ x: 0, y: 0 });
                dataPoints.push({ x: 600, y: k * 600 });
                myChart.options.scales.x.min = 0;
                myChart.options.scales.y.min = 0;
                myChart.options.scales.y.max = 0.06;
            } else if (mode === 'gay') {
                xLabel = 'T (K)';
                yLabel = 'P (Pa)';
                currentPoint = { x: T, y: P };
                const k = (n * R_SI) / V;
                dataPoints.push({ x: 0, y: 0 });
                dataPoints.push({ x: 600, y: k * 600 });
                myChart.options.scales.x.min = 0;
            }

            myChart.data.datasets[0].data = dataPoints;
            myChart.data.datasets[1].data = [currentPoint];
            myChart.options.scales.x.title.text = xLabel;
            myChart.options.scales.y.title.text = yLabel;

            const t = dict[state.lang];
            const typeText = mode === 'boyle' ? t.chartBoyle : (mode === 'charles' ? t.chartCharles : t.chartGay);
            const chartTitle = document.getElementById('chart-title');
            if (chartTitle) chartTitle.innerText = typeText;

            myChart.update();
        }

        function resetSim() {
            state.V = 0.0224;
            state.n = 1.0;
            state.T = 273;
            state.P = 101325;
            // Force exact defaults (step must divide 0.0224; avoid range snap overwrite)
            domV.value = '0.0224';
            domN.value = '1.0';
            domT.value = '273';
            domP.value = '101325';
            state.V = parseFloat(domV.value);
            state.n = parseFloat(domN.value);
            state.T = parseFloat(domT.value);
            state.P = 101325;
            valV.innerText = `${state.V.toFixed(4)} m³`;
            valN.innerText = `${state.n.toFixed(1)} mol`;
            valT.innerText = `${state.T.toFixed(0)} K`;

        // --- Modal a11y ---
        let activeModalId = null;

        function openModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            if (activeModalId && activeModalId !== id) closeModal(activeModalId);
            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                const panel = modal.querySelector('[data-modal-panel]');
                if (panel) panel.classList.remove('scale-95');
            });
            activeModalId = id;
            if (id === 'modal-principle') {
                renderPrinciple();
                typesetMath(document.getElementById('principle-body'));
            }
            if (id === 'modal-steps') {
                renderSteps();
            }
            if (id === 'modal-quiz') {
                renderQuiz();
            }
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('opacity-0');
            const panel = modal.querySelector('[data-modal-panel]');
            if (panel) panel.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (activeModalId === id) activeModalId = null;
            }, 250);
        }

        function closeAllModals() {
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(closeModal);
        }

        document.getElementById('btn-steps').addEventListener('click', () => openModal('modal-steps'));
        document.getElementById('btn-principle').addEventListener('click', () => openModal('modal-principle'));
        document.getElementById('btn-quiz').addEventListener('click', () => openModal('modal-quiz'));
        document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
        document.getElementById('btn-reset').addEventListener('click', resetSim);
        document.getElementById('btn-quiz-answers').addEventListener('click', () => {
            quizAnswersVisible = !quizAnswersVisible;
            renderQuiz();
        });

        document.querySelectorAll('[data-close-modal]').forEach(btn => {
            btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close-modal')));
        });

        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(id => {
            const modal = document.getElementById(id);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal(id);
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && activeModalId) closeModal(activeModalId);
        });

        domV.addEventListener('input', () => updateEquation('V'));
        domN.addEventListener('input', () => updateEquation('n'));
        domT.addEventListener('input', () => updateEquation('T'));
        domP.addEventListener('input', () => updateEquation('P'));

        // --- Three.js ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 0, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x3b82f6, 1, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
        const edges = new THREE.EdgesGeometry(boxGeometry);
        const boxMaterial = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.5 });
        const boxLines = new THREE.LineSegments(edges, boxMaterial);
        scene.add(boxLines);

        const MAX_PARTICLES = 500;
        const particleGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const particleMat = new THREE.MeshPhongMaterial({ color: 0x60a5fa, shininess: 100 });
        const particlesMesh = new THREE.InstancedMesh(particleGeo, particleMat, MAX_PARTICLES);
        scene.add(particlesMesh);

        const dummy = new THREE.Object3D();
        const particleData = [];
        for (let i = 0; i < MAX_PARTICLES; i++) {
            particleData.push({
                x: (Math.random() - 0.5) * 10,
                y: (Math.random() - 0.5) * 10,
                z: (Math.random() - 0.5) * 10,
                vx: (Math.random() - 0.5),
                vy: (Math.random() - 0.5),
                vz: (Math.random() - 0.5)
            });
        }

        function updatePhysics() {
            const scaleSize = Math.cbrt(state.V) * 25.0;
            boxLines.scale.set(scaleSize, scaleSize, scaleSize);
            const speedFactor = Math.sqrt(state.T) * 0.02;
            const activeCount = Math.min(Math.floor(state.n * 50), MAX_PARTICLES);
            particlesMesh.count = activeCount;
            const halfSize = scaleSize / 2;

            for (let i = 0; i < activeCount; i++) {
                const p = particleData[i];
                p.x += p.vx * speedFactor;
                p.y += p.vy * speedFactor;
                p.z += p.vz * speedFactor;

                if (p.x > halfSize) { p.x = halfSize; p.vx *= -1; }
                if (p.x < -halfSize) { p.x = -halfSize; p.vx *= -1; }
                if (p.y > halfSize) { p.y = halfSize; p.vy *= -1; }
                if (p.y < -halfSize) { p.y = -halfSize; p.vy *= -1; }
                if (p.z > halfSize) { p.z = halfSize; p.vz *= -1; }
                if (p.z < -halfSize) { p.z = -halfSize; p.vz *= -1; }

                dummy.position.set(p.x, p.y, p.z);
                dummy.updateMatrix();
                particlesMesh.setMatrixAt(i, dummy.matrix);
            }
            particlesMesh.instanceMatrix.needsUpdate = true;

            const realVrms = Math.round(Math.sqrt(3 * 8.314 * state.T / 0.028));
            document.getElementById('display-velocity').innerText = `${realVrms} m/s`;

            const collisionMetric = (state.n / (state.V * 1000)) * Math.sqrt(state.T);
            let key = 'colLow';
            if (collisionMetric > 0.1) key = 'colMed';
            if (collisionMetric > 0.3) key = 'colHigh';
            if (collisionMetric > 0.5) key = 'colExtreme';
            document.getElementById('display-collisions').innerText = dict[state.lang][key];
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        initChart();
        setMode('boyle');
        updateLanguageText();
        animate();
    </script>
</body>
</html>
