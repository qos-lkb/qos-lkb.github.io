                            'Among the five liquids water has the largest $c$, alcohol the smallest; mixing uses weighted-average $T_f$ with heat-lost＝heat-gained checks; the five standard quiz items work offline—unlike heater metal specific-heat or latent-heat files',
                            'This sim mainly shows matte-black vs silver radiative emission and absorption',
                            'Every liquid is locked to $c = 4200$ in this sim',
                            'Different initial temperatures always cause boiling phase change after mixing'
                        ],
                        ans: 'A. Offline #modal-quiz; do not confuse with radiation / latent-heat / specific_heat_capacity(2).',

        const typesetMath = (root) => {
            if (window.MathJax && window.MathJax.typesetPromise) {

        const ModalShell = ({ id, titleId, title, open, onClose, children, closeLabel }) => {

                document.addEventListener('keydown', onKey);
                const t = setTimeout(() => typesetMath(panelRef.current), 50);
                return () => { document.removeEventListener('keydown', onKey); clearTimeout(t); };
            }, [open, onClose, title, children]);
            if (!open) return null;
            return (
                <div id={id} role="dialog" aria-modal="true" aria-labelledby={titleId}
                    className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/50" onClick={onClose} aria-hidden="true"></div>
                    <div ref={panelRef} className="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col border border-gray-200">

        const App = () => {

            const [liquidA, setLiquidA] = useState({ type: 'water', mass: 1.0, temp: 25 });
            const [liquidB, setLiquidB] = useState({ type: 'juice', mass: 1.0, temp: 60 });
            const [isMixed, setIsMixed] = useState(false);
            const [isAnimating, setIsAnimating] = useState(false);
            const [result, setResult] = useState(null);
            const [modal, setModal] = useState(null); // 'steps' | 'principle' | 'quiz'

            useEffect(() => {

                document.title = lang === 'en'
                    ? 'Thermal Equilibrium Mixing | Physics Lab'
                    : '熱平衡混合模擬實驗 | Thermal Equilibrium Mixing';
                const timer = setTimeout(() => typesetMath(), 80);
                return () => clearTimeout(timer);
            }, [lang, isMixed, result, modal, showAnswers]);

            useEffect(() => {
                if (!isMixed && tipRef.current) {
                    const timer = setTimeout(() => typesetMath(tipRef.current), 80);
                    return () => clearTimeout(timer);
                }
            }, [lang, isMixed]);

            const calculateResult = () => {
                const mA = parseFloat(liquidA.mass);
                const cA = LIQUID_DATA[liquidA.type].c;
                const tA = parseFloat(liquidA.temp);
                const mB = parseFloat(liquidB.mass);
                const cB = LIQUID_DATA[liquidB.type].c;
                const tB = parseFloat(liquidB.temp);

                const heatCapacityA = mA * cA;
                const heatCapacityB = mB * cB;
                const energyA = heatCapacityA * tA;
                const energyB = heatCapacityB * tB;

                const rawFinalTemp = (energyA + energyB) / (heatCapacityA + heatCapacityB);
                const finalTempFixed = rawFinalTemp.toFixed(2);
                const tFinal = parseFloat(finalTempFixed);

                const colorA = LIQUID_DATA[liquidA.type].color;
                const colorB = LIQUID_DATA[liquidB.type].color;
                const totalMass = mA + mB;
                const mixedColor = colorA.map((val, i) =>
                    Math.round((val * mA + colorB[i] * mB) / totalMass)
                );

                let energyAnalysis = null;
                if (tA !== tB) {
                    const isAGreater = tA > tB;
                    const hotObj = isAGreater
                        ? { label: 'A', type: liquidA.type, m: mA, c: cA, t_initial: tA }
                        : { label: 'B', type: liquidB.type, m: mB, c: cB, t_initial: tB };
                    const coldObj = isAGreater
                        ? { label: 'B', type: liquidB.type, m: mB, c: cB, t_initial: tB }
                        : { label: 'A', type: liquidA.type, m: mA, c: cA, t_initial: tA };
                    const qLost = hotObj.m * hotObj.c * (hotObj.t_initial - tFinal);
                    const qGained = coldObj.m * coldObj.c * (tFinal - coldObj.t_initial);
                    energyAnalysis = {
                        hot: hotObj,
                        cold: coldObj,
                        qLost: Math.round(qLost),
                        qGained: Math.round(qGained)
                    };
                }

                setResult({
                    finalTemp: finalTempFixed,
                    mixedColor: `rgb(${mixedColor.join(',')})`,
                    totalMass: totalMass,
                    analysis: energyAnalysis,
                    rawSteps: {
                         numerator: energyA + energyB,
                         denominator: heatCapacityA + heatCapacityB
                    }
                });
            };

            const handleMix = () => {
                if (isMixed) return;
                setIsAnimating(true);
                calculateResult();
                setTimeout(() => {
                    setIsMixed(true);
                    setIsAnimating(false);

                            </div>

                        <div className="mt-2 text-sm text-gray-600 font-medium">
                            {liquidName(config.type, lang)} {config.mass}kg
                        </div>
                    </div>
                );

                                return (
                                <div key={qi} className="border border-gray-200 rounded-xl p-4 bg-gray-50">
                                    <p className="font-bold text-gray-800 mb-2">Q{n}. {item.q}</p>
                                    {isMc ? (
                                        <div className="grid gap-1.5 mb-2">
                                            {item.opts.map((opt, oi) => (
                                                <label key={oi} className="flex items-start gap-2 rounded-lg border border-gray-200 bg-white px-3 py-2 cursor-pointer hover:bg-gray-100 text-sm">
                                                    <input type="radio" name={qName} className="mt-1 accent-indigo-600" />
                                                    <span><span className="font-bold mr-1">{letters[oi]}.</span>{opt}</span>
                                                </label>
                                            ))}
                                        </div>
                                    ) : (
                                        <p className="text-xs text-gray-500 mb-2">{lang === 'zh' ? '（先預測，再操作模擬核對）' : '(Predict first, then verify on the sim.)'}</p>
                                    )}
                                    {showAnswers && (
                                        <div className="mt-2 text-sm bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-lg px-3 py-2">
                                            <strong>{lang === 'zh' ? '參考答案：' : 'Reference answer: '}</strong>{item.ans}
                                        </div>
                                    )}
                                </div>
                            );})}
                            <button type="button" id="btn-quiz-answers"
                                onClick={() => setShowAnswers(!showAnswers)}
                                className="w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm">
                                {showAnswers ? t.hideAns : t.showAns}
                            </button>
                        </div>
                    </ModalShell>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
