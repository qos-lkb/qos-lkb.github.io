/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

const quizState = { selections: {}, showAnswers: false };
let currentLang = 'zh';

class Particle {
    constructor(x, y, isPinned = false) {
        this.ox = x;
        this.oy = y;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.fx = 0;
        this.fy = 0;
        this.isPinned = isPinned;
        this.mass = 1;
        this.kineticEnergy = 0;
    }

    update() {
        if (this.isPinned) return;
        this.vx += this.fx / this.mass;
        this.vy += this.fy / this.mass;
        this.vx *= DAMPING;
        this.vy *= DAMPING;
        this.x += this.vx;
        this.y += this.vy;
        const speedSq = this.vx * this.vx + this.vy * this.vy;
        this.kineticEnergy = this.kineticEnergy * 0.9 + speedSq * 0.1;
        this.fx = 0;
        this.fy = 0;
    }

    draw() {
        let heat = Math.min(this.kineticEnergy / 15, 1);
        const hue = 240 - (heat * 240);
        const lightness = 50 + (heat * 20);
        ctx.beginPath();
        ctx.arc(this.x, this.y, SPACING * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${hue}, 100%, ${lightness}%)`;
        ctx.fill();
        if (heat > 0.8) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'red';
        } else {
            ctx.shadowBlur = 0;
        }
    }
}

class Spring {
    constructor(p1, p2) {
        this.p1 = p1;
        this.p2 = p2;
        const dx = p2.ox - p1.ox;
        const dy = p2.oy - p1.oy;
        this.restLength = Math.sqrt(dx * dx + dy * dy);
    }

    update() {
        const dx = this.p2.x - this.p1.x;
        const dy = this.p2.y - this.p1.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 1e-8) return;
        const forceMagnitude = (distance - this.restLength) * STIFFNESS;
        const nx = dx / distance;
        const ny = dy / distance;
        const fx = nx * forceMagnitude;
        const fy = ny * forceMagnitude;
        if (!this.p1.isPinned) {
            this.p1.fx += fx;
            this.p1.fy += fy;
        }
        if (!this.p2.isPinned) {
            this.p2.fx -= fx;
            this.p2.fy -= fy;
        }
    }

    draw() {
        const avgEnergy = (this.p1.kineticEnergy + this.p2.kineticEnergy) / 2;
        const alpha = Math.min(0.2 + avgEnergy * 0.1, 0.8);
        ctx.beginPath();
        ctx.moveTo(this.p1.x, this.p1.y);
        ctx.lineTo(this.p2.x, this.p2.y);
        ctx.strokeStyle = `rgba(200, 200, 200, ${alpha})`;
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    SPACING = Math.min(canvas.width / (COLUMNS + 2), canvas.height / (ROWS + 2));
    if (SPACING > 40) SPACING = 40;
    if (SPACING < 15) SPACING = 15;
}

function createGrid() {
    particles = [];
    springs = [];
    const startX = (canvas.width - (COLUMNS - 1) * SPACING) / 2;
    const startY = (canvas.height - (ROWS - 1) * SPACING) / 2;
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLUMNS; x++) {
            const px = startX + x * SPACING;
            const py = startY + y * SPACING;
            const isPinned = (x === 0 || x === COLUMNS - 1 || y === 0 || y === ROWS - 1);
            particles.push(new Particle(px, py, isPinned));
        }
    }
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLUMNS; x++) {
            const i = y * COLUMNS + x;
            if (x < COLUMNS - 1) springs.push(new Spring(particles[i], particles[i + 1]));
            if (y < ROWS - 1) springs.push(new Spring(particles[i], particles[i + COLUMNS]));
            if (x < COLUMNS - 1 && y < ROWS - 1) {
                springs.push(new Spring(particles[i], particles[i + COLUMNS + 1]));
                springs.push(new Spring(particles[i + 1], particles[i + COLUMNS]));
            }
        }
    }
}

function resetSim() {
    HEAT_POWER = DEFAULT_HEAT;
    STIFFNESS = DEFAULT_STIFF;
    heatSlider.value = String(DEFAULT_HEAT);
    stiffnessSlider.value = String(DEFAULT_STIFF);
    createGrid();
}

function applyHeatAtMouse() {
    if (!isDragging) return;
    const influenceRadius = SPACING * 2.5;
    const influenceRadiusSq = influenceRadius * influenceRadius;
    particles.forEach(p => {
        if (p.isPinned) return;
        const dx = p.x - mouseX;
        const dy = p.y - mouseY;
        const distSq = dx * dx + dy * dy;
        if (distSq < influenceRadiusSq) {
            const angle = Math.random() * Math.PI * 2;
            const force = HEAT_POWER * Math.random();
            p.vx += Math.cos(angle) * force;
            p.vy += Math.sin(angle) * force;
        }
    });
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    applyHeatAtMouse();
    springs.forEach(s => s.update());
    particles.forEach(p => p.update());
    springs.forEach(s => s.draw());
    particles.forEach(p => p.draw());
    animationId = requestAnimationFrame(loop);
}

function setDocumentLang() {
    document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
}

function toggleLanguage() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    updateLanguageUI();
}

function renderSteps() {
    const t = translations[currentLang];
    document.getElementById('steps-body').innerHTML = [t.step1, t.step2, t.step3, t.step4].map(function (s) {
        return '<li>' + s + '</li>';

}

function renderPrinciple() {
    const t = translations[currentLang];
    document.getElementById('principle-body').innerHTML =
        '<div><h3 class="font-bold text-indigo-800 mb-1">' + t.principleConceptTitle + '</h3><p>' + t.principleConcept + '</p></div>' +
        '<div><h3 class="font-bold text-indigo-800 mb-1">' + t.principleMechTitle + '</h3>' + t.principleMech + '</div>' +
        '<div><h3 class="font-bold text-indigo-800 mb-1">' + t.principleExampleTitle + '</h3><p>' + t.principleExample + '</p></div>';
}

let quizAnswersVisible = false;

        function renderQuiz() {
            const texts = translations[currentLang];
            const body = document.getElementById('quiz-body');
            if (!body) return;
            const langIsZh = (currentLang === 'zh');
            const ref = texts.quizRef || (langIsZh ? '參考答案' : 'Reference answer');
            const optKey = (qid, L) => {
                const lower = qid + L.toLowerCase();
                const upper = qid + L.toUpperCase();
                return texts[lower] != null ? lower : upper;
            };
            const mkChoice = (qid) => ['A', 'B', 'C', 'D'].map(L => {
                const key = optKey(qid, L);
                return '<label class="flex items-start gap-2 rounded-lg border p-2 cursor-pointer"><input type="radio" name="' + qid + '" class="mt-1 accent-violet-600"><span>' + (texts[key] || '') + '</span></label>';
            }).join('');
            const vis = quizAnswersVisible;
            const ans = (key) => vis
                ? '<div class="mt-2 text-xs rounded-lg border border-emerald-500/40 bg-emerald-950/30 p-2"><strong>' + ref + '：</strong> ' + texts[key] + '</div>' : '';
            const openHint = texts.shortHint || texts.openHint || '';
            const block = (n, qid, mc) => {
                let h = '<div class="quiz-item rounded-xl border p-3 mb-3"><p class="font-semibold mb-2">Q' + n + '. ' + texts[qid] + '</p>';
                if (mc) h += '<div class="grid gap-1.5">' + mkChoice(qid) + '</div>';
                else if (openHint) h += '<p class="text-xs opacity-70 mb-1">' + openHint + '</p>';
                return h + ans(qid + 'ans') + '</div>';
            };
            body.innerHTML = block(1, 'q1', true) + block(2, 'q2', false) + block(3, 'q3', true) + block(4, 'q4', false) + block(5, 'q5', true);
            const ansBtn = document.getElementById('btn-quiz-answers');
            if (ansBtn) ansBtn.textContent = vis ? texts.hideAnswers : texts.showAnswers;
            const modal = document.getElementById('modal-quiz');
            if (vis && typeof typesetMath === 'function' && modal) typesetMath(modal);
        }


function openModal(id) {
    const modal = document.getElementById(id);
    if (!modal) return;
    modal.classList.remove('hidden');
    void modal.offsetWidth;
    modal.classList.remove('opacity-0');
    const panel = modal.querySelector('[data-modal-panel]');
    if (panel) panel.classList.remove('scale-95');
}

function closeModal(id) {
    const modal = document.getElementById(id);
    if (!modal || modal.classList.contains('hidden')) return;
    modal.classList.add('opacity-0');
    const panel = modal.querySelector('[data-modal-panel]');
    if (panel) panel.classList.add('scale-95');
    setTimeout(function () { modal.classList.add('hidden'); }, 250);
}

function closeAllModals() {
    ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(closeModal);
}

function wireModals() {
    document.getElementById('btn-steps').addEventListener('click', function () { openModal('modal-steps'); });
    document.getElementById('btn-principle').addEventListener('click', function () { openModal('modal-principle'); });
    document.getElementById('btn-quiz').addEventListener('click', function () { openModal('modal-quiz'); });
    document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
    document.getElementById('btn-quiz-answers').addEventListener('click', function () {
                quizAnswersVisible = !quizAnswersVisible;
                renderQuiz();
            });
    document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
        btn.addEventListener('click', function () { closeModal(btn.getAttribute('data-close-modal')); });
    });
    ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
        const modal = document.getElementById(id);
        modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(id); });
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAllModals(); });
}

function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    mouseX = (clientX - rect.left) * scaleX;
    mouseY = (clientY - rect.top) * scaleY;
}

function initPhysics() {
    resizeCanvas();
    createGrid();
    loop();
}

window.addEventListener('resize', function () {
    resizeCanvas();
    createGrid();
});

canvas.addEventListener('mousedown', function (e) {
    isDragging = true;
    pointerPos(e);
});
canvas.addEventListener('mousemove', function (e) {
    pointerPos(e);
});
window.addEventListener('mouseup', function () { isDragging = false; });

canvas.addEventListener('touchstart', function (e) {
    isDragging = true;
    pointerPos(e.touches[0]);
    e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', function (e) {
    pointerPos(e.touches[0]);
    e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', function () { isDragging = false; });

heatSlider.addEventListener('input', function (e) {
    HEAT_POWER = parseFloat(e.target.value);
});
stiffnessSlider.addEventListener('input', function (e) {
    STIFFNESS = parseFloat(e.target.value);
});
btnReset.addEventListener('click', resetSim);
btnCool.addEventListener('click', function () {
    particles.forEach(function (p) {
        p.vx *= 0.1;
        p.vy *= 0.1;
    });
});

wireModals();
updateLanguageUI();
initPhysics();
