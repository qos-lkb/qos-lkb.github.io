/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

                const isOpen = n === 2 || n === 4;
                const qid = 'q' + n;
                let html = '<div class="mb-4 p-3 bg-violet-50 rounded-lg border border-violet-100">';
                html += '<div class="font-semibold text-violet-800 mb-2">Q' + n + '. ' + item.q[currentLang] + '</div>';
                if (!isOpen && item.choices) {
                    html += '<div class="grid gap-1.5">';
                    item.choices.forEach(function(c, j) {
                        html += '<label class="flex items-start gap-2 rounded-lg border border-violet-200 bg-white p-2 cursor-pointer hover:bg-violet-50/50"><input type="radio" name="' + qid + '" class="mt-1 accent-violet-600"><span><span class="font-mono font-bold text-violet-600">' + letters[j] + '.</span> ' + c[currentLang] + '</span></label>';
                    });
                    html += '</div>';
                } else if (isOpen) {
                    html += '<p class="text-xs text-slate-500 italic">' + openHint + '</p>';
                }
                if (quizReveal) {
                    html += '<div class="mt-2 text-sm bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-lg p-2"><strong>' + refLabel + '：</strong> ' + item.explain[currentLang] + '</div>';
                }
                html += '</div>';
                return html;
            }).join('');
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? tt.hideAns : tt.showAns;
            typeset(body);
        }

        function refreshOpenTeachModals() {
            if (!document.getElementById('modal-steps').classList.contains('hidden')) fillStepsBody();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) fillPrincipleBody();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) fillQuizBody();
        }

        function closeAllModals(exceptId) {
            if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
                if (id !== exceptId) document.getElementById(id).classList.add('hidden');
            });
        }

        function openModal(id) {
            closeAllModals(id);
            document.getElementById(id).classList.remove('hidden');
            if (id === 'modal-steps') fillStepsBody();
            if (id === 'modal-principle') fillPrincipleBody();
            if (id === 'modal-quiz') fillQuizBody();
        }

        function resizeCanvas() {
            if (!canvas.parentElement) return;
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            boundaryY = canvas.height / 2;
            drawStatic();
            if (car) drawCar(car);
        }
        window.addEventListener('resize', resizeCanvas);

        function updateCalculation(angle1Deg, angle2Deg, n1, ratio) {
            const tt = t();
            let htmlContent = '';
            if (Math.abs(angle2Deg) < 0.1) {
                const n2 = n1 / ratio;
                htmlContent =
                    '<div class="flex flex-col gap-1 text-center">' +
                    '<div class="mb-1">' + tt.calcVertTitle + '</div>' +
                    '<div>\\(\\theta_2 = 0^\\circ\\)</div>' +
                    '<div class="mt-2 text-blue-600 font-bold text-sm">' +
                    '\\[\\begin{align*} n_2 &= \\frac{v_1}{v_2} n_1 \\\\ &= \\frac{1}{' + ratio + '} \\\\ &\\approx ' + n2.toFixed(2) + ' \\end{align*}\\]' +
                    '</div></div>';
            } else {
                const sin1 = Math.sin(angle1Deg * Math.PI / 180).toFixed(3);
                const sin2 = Math.sin(angle2Deg * Math.PI / 180).toFixed(3);
                const n2 = (n1 * Math.sin(angle1Deg * Math.PI / 180) / Math.sin(angle2Deg * Math.PI / 180)).toFixed(2);
                htmlContent =
                    '<div class="flex flex-col gap-1 text-center">' +
                    '<div>' + tt.calcKnown + '</div>' +
                    '<div>\\(\\theta_1 = ' + angle1Deg + '^\\circ\\), \\(\\theta_2 \\approx ' + angle2Deg + '^\\circ\\)</div>' +
                    '<div class="border-t border-gray-200 my-1"></div>' +
                    '<div class="text-sm">' + tt.calcSnell + '</div>' +
                    '<div class="overflow-x-auto overflow-y-hidden text-sm">' +
                    '\\[\\begin{align*}' +
                    'n_1 \\sin \\theta_1 &= n_2 \\sin \\theta_2 \\\\' +
                    '1.0 \\sin ' + angle1Deg + '^\\circ &= n_2 \\sin ' + angle2Deg + '^\\circ \\\\' +
                    '1.0 \\times ' + sin1 + ' &\\approx n_2 \\times ' + sin2 + ' \\\\' +
                    'n_2 &\\approx \\frac{1.0 \\times ' + sin1 + '}{' + sin2 + '} \\\\' +
                    'n_2 &\\approx \\mathbf{' + n2 + '}' +
                    '\\end{align*}\\]' +
                    '</div></div>';
            }
            calculationDisplay.innerHTML = htmlContent;
            typeset(calculationDisplay);
        }

        function initSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            isRunning = false;
            hud.classList.add('hidden');
            turnAlert.classList.add('hidden');

            boundaryY = canvas.height / 2;
            const incidenceAngleDeg = parseInt(angleInput.value);
            const incidenceAngleRad = incidenceAngleDeg * Math.PI / 180;
            const surfaceRatio = parseFloat(surfaceSelect.value);

            speedDisplay.textContent = (surfaceRatio * 100).toFixed(0) + "%";
            legendSurfaceColor.style.backgroundColor = surfaceColors[surfaceSelect.value];

            const sinRefracted = Math.sin(incidenceAngleRad) * surfaceRatio;
            const refractedAngleRad = Math.asin(sinRefracted);
            const refractedAngleDeg = (refractedAngleRad * 180 / Math.PI).toFixed(1);
            rAngleDisplay.textContent = refractedAngleDeg + "°";

            updateCalculation(incidenceAngleDeg, parseFloat(refractedAngleDeg), 1.0, surfaceRatio);

            const startY = 80;
            const dy = boundaryY - startY;
            const dx = dy * Math.tan(incidenceAngleRad);

            car = {
                x: (canvas.width / 2) - dx,
                y: startY,
                angle: incidenceAngleRad,
                speed: BASE_SPEED,
                path: [],
                state: 'asphalt',
                ratio: surfaceRatio,
                targetAngle: refractedAngleRad
            };
            car.path.push({x: car.x, y: car.y});

            drawStatic();
            drawCar(car);
        }

        function fullReset() {
            closeAllModals(null);
            quizReveal = false;
            document.getElementById('btn-quiz-answers').textContent = t().showAns;
            surfaceSelect.value = '0.6';
            angleInput.value = '30';
            angleValue.textContent = '30°';
            showPathCheck.checked = true;
            initSimulation();
            setStartBtnUI('idle');
        }

        function animate() {
            if (!isRunning) return;
            updatePhysics();
            drawStatic();
            drawCar(car);
            if (car.y > canvas.height + 100 || car.x > canvas.width + 100 || car.x < -100) {
                isRunning = false;
                setStartBtnUI('replay');
            } else {
                animationId = requestAnimationFrame(animate);
            }
        }

        function updatePhysics() {
            const tt = t();
            car.x += car.speed * Math.sin(car.angle);
            car.y += car.speed * Math.cos(car.angle);

            const lastP = car.path[car.path.length - 1];
            if (Math.hypot(car.x - lastP.x, car.y - lastP.y) > 5) {
                car.path.push({x: car.x, y: car.y});
            }

            const distToBoundary = car.y - boundaryY;
            hud.classList.remove('hidden');

            if (distToBoundary < -CAR_LENGTH/2) {
                car.speed = BASE_SPEED;
                car.state = 'asphalt';
                hudLocation.textContent = tt.locAsphalt;
                hudLocation.className = "text-xs font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-800";
                hudSpeedBar.style.width = "100%";
                hudSpeedBar.className = "h-full bg-blue-500";
                hudLeftWheel.className = "w-3 h-3 rounded-full bg-green-500";
                hudRightWheel.className = "w-3 h-3 rounded-full bg-green-500";
                turnAlert.classList.add('hidden');
            } else if (distToBoundary >= -CAR_LENGTH/2 && distToBoundary <= CAR_LENGTH/2) {
                car.state = 'crossing';
                const progress = (distToBoundary + CAR_LENGTH/2) / CAR_LENGTH;
                const angleDiff = car.targetAngle - parseFloat(angleInput.value * Math.PI / 180);
                car.speed = BASE_SPEED * (1 - progress * (1 - car.ratio));

                if (Math.abs(car.targetAngle) > 0.01) {
                    const startAngle = parseFloat(angleInput.value * Math.PI / 180);
                    car.angle = startAngle + (angleDiff * progress);
                    turnAlert.classList.remove('hidden');
                    if (car.angle > startAngle) {
                        turnAlert.innerHTML = tt.turnRightDetail;
                    } else {
                        turnAlert.innerHTML = tt.turnGeneric;
                    }
                }

                hudLocation.textContent = tt.locCrossing;
                hudLocation.className = "text-xs font-bold px-2 py-0.5 rounded bg-yellow-100 text-yellow-800";
                hudSpeedBar.style.width = (car.speed / BASE_SPEED * 100) + "%";

                if (car.angle > 0) {
                    hudLeftWheel.className = "w-3 h-3 rounded-full bg-green-500";
                    hudRightWheel.className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
                }
            } else {
                car.speed = BASE_SPEED * car.ratio;
                car.angle = car.targetAngle;
                car.state = 'surface2';
                const short = SURFACE_SHORT[currentLang][String(car.ratio)] || SURFACE_SHORT[currentLang][surfaceSelect.value] || '';
                hudLocation.textContent = short;
                hudLocation.className = "text-xs font-bold px-2 py-0.5 rounded bg-orange-100 text-orange-800";
                hudSpeedBar.style.width = (car.ratio * 100) + "%";
                hudSpeedBar.className = "h-full bg-red-500";
                hudLeftWheel.className = "w-3 h-3 rounded-full bg-red-500";
                hudRightWheel.className = "w-3 h-3 rounded-full bg-red-500";
                turnAlert.classList.add('hidden');
            }
        }

        function drawArrow(c, fromX, fromY, toX, toY) {
            const headlen = 10;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            c.beginPath();
            c.moveTo(fromX, fromY);
            c.lineTo(toX, toY);
            c.stroke();
            const midX = (fromX + toX) / 2;
            const midY = (fromY + toY) / 2;
            c.beginPath();
            c.moveTo(midX, midY);
            c.lineTo(midX - headlen * Math.cos(angle - Math.PI / 6), midY - headlen * Math.sin(angle - Math.PI / 6));
            c.moveTo(midX, midY);
            c.lineTo(midX - headlen * Math.cos(angle + Math.PI / 6), midY - headlen * Math.sin(angle + Math.PI / 6));
            c.stroke();
        }

        function drawAngleArc(c, x, y, radius, startAngle, endAngle, label, color) {
            c.beginPath();
            c.moveTo(x, y);
            c.arc(x, y, radius, startAngle, endAngle, startAngle > endAngle);
            c.fillStyle = color;
            c.globalAlpha = 0.3;
            c.fill();
            c.globalAlpha = 1.0;
            c.strokeStyle = color.replace('0.3', '1.0');
            c.stroke();
            const midAngle = (startAngle + endAngle) / 2;
            const textRadius = radius + 25;
            const textX = x + Math.cos(midAngle) * textRadius;
            const textY = y + Math.sin(midAngle) * textRadius;
            c.font = "bold italic 16px 'Times New Roman', serif";
            c.textAlign = "center";
            c.textBaseline = "middle";
            const textWidth = c.measureText(label).width;
            c.fillStyle = "rgba(0,0,0,0.5)";
            c.fillRect(textX - textWidth/2 - 4, textY - 10, textWidth + 8, 20);
            c.fillStyle = "#ffffff";
            c.fillText(label, textX, textY);
        }

        function drawStatic() {
            const tt = t();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 0, canvas.width, boundaryY);

            let safeRatio = '0.6';
            if (typeof car !== 'undefined' && car && car.ratio !== undefined && car.ratio !== null) {
                safeRatio = car.ratio;
            } else if (surfaceSelect && surfaceSelect.value) {
                safeRatio = surfaceSelect.value;
            }
            const ratioStr = String(safeRatio);

            ctx.fillStyle = surfaceColors[ratioStr] || '#b45309';
            ctx.fillRect(0, boundaryY, canvas.width, canvas.height - boundaryY);

            ctx.beginPath();
            ctx.moveTo(0, boundaryY);
            ctx.lineTo(canvas.width, boundaryY);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();

            const selectedText = SURFACE_SHORT[currentLang][surfaceSelect.value] || SURFACE_SHORT[currentLang][ratioStr] || '';
            ctx.font = "bold 16px 'Noto Sans TC', Arial, sans-serif";
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.textAlign = "right";
            ctx.fillText(tt.canvasMed1, canvas.width - 20, boundaryY - 15);
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.fillText(tt.canvasMed2Prefix + selectedText, canvas.width - 20, boundaryY + 25);

            if (showPathCheck.checked) {
                const centerX = canvas.width / 2;
                const centerY = boundaryY;

                ctx.beginPath();
                ctx.setLineDash([5, 5]);
                ctx.moveTo(centerX, 0);
                ctx.lineTo(centerX, canvas.height);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);

                const angleI_Deg = parseInt(angleInput.value);
                const angleI_Rad = angleI_Deg * Math.PI / 180;
                const currentRatio = parseFloat(ratioStr);
                const angleR_Rad = Math.asin(Math.sin(angleI_Rad) * currentRatio);
                const angleR_Deg = (angleR_Rad * 180 / Math.PI).toFixed(1);

                ctx.strokeStyle = 'rgba(255, 223, 0, 0.6)';
                ctx.lineWidth = 3;
                const rayLen = 300;
                const startX = centerX - rayLen * Math.sin(angleI_Rad);
                const startY = centerY - rayLen * Math.cos(angleI_Rad);
                drawArrow(ctx, startX, startY, centerX, centerY);
                const endX = centerX + rayLen * Math.sin(angleR_Rad);
                const endY = centerY + rayLen * Math.cos(angleR_Rad);
                drawArrow(ctx, centerX, centerY, endX, endY);

                if (angleI_Deg > 0) {
                    drawAngleArc(ctx, centerX, centerY, 60, -Math.PI/2 - angleI_Rad, -Math.PI/2, 'θ₁=' + angleI_Deg + '°', 'rgba(59, 130, 246, 0.5)');
                }
                if (angleR_Rad > 0) {
                    drawAngleArc(ctx, centerX, centerY, 60, Math.PI/2 - angleR_Rad, Math.PI/2, 'θ₂=' + angleR_Deg + '°', 'rgba(239, 68, 68, 0.5)');
                }
            }

            if (showPathCheck.checked && car && car.path && car.path.length > 0) {
                ctx.beginPath();
                ctx.moveTo(car.path[0].x, car.path[0].y);
                for (let i = 1; i < car.path.length; i++) {
                    ctx.lineTo(car.path[i].x, car.path[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.setLineDash([2, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawCar(carObj) {
            if (!carObj) return;
            ctx.save();
            ctx.translate(carObj.x, carObj.y);
            ctx.rotate(-carObj.angle);
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-CAR_WIDTH/2, -CAR_LENGTH/2, CAR_WIDTH, CAR_LENGTH);
            ctx.fillStyle = '#7f1d1d';
            ctx.fillRect(-CAR_WIDTH/2 + 5, -CAR_LENGTH/4, CAR_WIDTH - 10, CAR_LENGTH/2);
            ctx.shadowBlur = 0;

            const wheelW = 10, wheelH = 18;
            const wheelX = CAR_WIDTH/2, wheelY = CAR_LENGTH/3;
            const getWheelColor = function(isFront, isRight) {
                if (carObj.state === 'crossing') {
                    if (isFront && isRight && carObj.angle > 0) return '#450a0a';
                }
                if (carObj.state === 'surface2') return '#450a0a';
                return '#000000';
            };
            ctx.fillStyle = getWheelColor(true, false);
            ctx.fillRect(-wheelX - wheelW/2, wheelY - wheelH/2, wheelW, wheelH);
            ctx.fillStyle = getWheelColor(true, true);
            ctx.fillRect(wheelX - wheelW/2, wheelY - wheelH/2, wheelW, wheelH);
            ctx.fillStyle = getWheelColor(false, false);
            ctx.fillRect(-wheelX - wheelW/2, -wheelY - wheelH/2, wheelW, wheelH);
            ctx.fillStyle = getWheelColor(false, true);
            ctx.fillRect(wheelX - wheelW/2, -wheelY - wheelH/2, wheelW, wheelH);

            ctx.fillStyle = '#fef08a';
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(-CAR_WIDTH/2 + 8, CAR_LENGTH/2, 4, 0, Math.PI*2);
            ctx.arc(CAR_WIDTH/2 - 8, CAR_LENGTH/2, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(0, 20);
            ctx.lineTo(-4, 16);
            ctx.moveTo(0, 20);
            ctx.lineTo(4, 16);
            ctx.stroke();
            ctx.restore();
        }

        angleInput.addEventListener('input', function(e) {
            angleValue.textContent = e.target.value + "°";
            if (!isRunning) initSimulation();
        });

        surfaceSelect.addEventListener('change', function() {
            if (!isRunning) initSimulation();
        });

        showPathCheck.addEventListener('change', function() {
            if (!isRunning) {
                drawStatic();
                drawCar(car);
            }
        });

        startBtn.addEventListener('click', function() {
            if (isRunning) return;
            setStartBtnUI('running');
            initSimulation();
            isRunning = true;
            animate();
        });

        document.getElementById('btn-reset').addEventListener('click', fullReset);
        document.getElementById('btn-reset-panel').addEventListener('click', fullReset);
        document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
        document.getElementById('btn-steps').addEventListener('click', function() { openModal('modal-steps'); });
        document.getElementById('btn-principle').addEventListener('click', function() { openModal('modal-principle'); });
        document.getElementById('btn-quiz').addEventListener('click', function() { openModal('modal-quiz'); });
        document.getElementById('btn-quiz-answers').addEventListener('click', function() {
            quizReveal = !quizReveal;
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? t().hideAns : t().showAns;
            fillQuizBody();
        });

        document.querySelectorAll('.modal-close').forEach(function(btn) {
            btn.addEventListener('click', function() { closeAllModals(null); });
        });
        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
            document.getElementById(id).addEventListener('click', function(e) {
                if (e.target === this) closeAllModals(null);
            });
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAllModals(null);
        });

        resizeCanvas();
        applyLanguage();
        setStartBtnUI('idle');
        initSimulation();
    </script>

</body>
</html>
