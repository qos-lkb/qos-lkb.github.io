/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

        // --- Configuration & State ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let mirrorX;

        const state = {
            obj: { x: 0, y: 0, w: 40, h: 160, dragging: false },
            eye: { x: 0, y: 0, radius: 20, dragging: false },
            showDistances: false,
            showAngles: false,
            dragOffset: { x: 0, y: 0 }
        };

        const gridSize = 40;

        function resize() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;

            mirrorX = width / 2;

            if (state.obj.x > mirrorX - 20) state.obj.x = mirrorX - 100;
            if (state.eye.x > mirrorX - 20) state.eye.x = mirrorX - 200;

            draw();
        }

        function init() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
            mirrorX = width / 2;

            document.getElementById('toggleDistances').addEventListener('change', function (e) {
                state.showDistances = e.target.checked;
                draw();
            });

            document.getElementById('toggleAngles').addEventListener('change', function (e) {
                state.showAngles = e.target.checked;
                draw();
            });

            wireTeachUi();
            applyLanguage();
            resetSimulation();

            window.addEventListener('resize', resize);
            setupInteractions();
            requestAnimationFrame(loop);
        }

        function resetSimulation() {
            mirrorX = width / 2;
            state.obj.x = mirrorX - 150;
            state.obj.y = height / 2 + 50;
            state.obj.dragging = false;
            state.eye.x = mirrorX - 250;
            state.eye.y = height / 2 - 100;
            state.eye.dragging = false;

            const distEl = document.getElementById('toggleDistances');
            const angEl = document.getElementById('toggleAngles');
            distEl.checked = false;
            angEl.checked = false;
            state.showDistances = false;
            state.showAngles = false;

            quizReveal = false;
            document.getElementById('btn-quiz-answers').textContent = t('showAns');
            closeAllModals(null);
            draw();
        }

        function drawGrid() {
            ctx.beginPath();
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;

            for (let x = mirrorX; x < width; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
            }
            for (let x = mirrorX; x > 0; x -= gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
            }

            const centerY = height / 2;
            for (let y = centerY; y < height; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            for (let y = centerY; y > 0; y -= gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();
        }

        function drawMirror() {
            ctx.beginPath();
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 4;
            ctx.moveTo(mirrorX, 50);
            ctx.lineTo(mirrorX, height - 50);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 1;
            for (let y = 60; y < height - 50; y += 15) {
                ctx.moveTo(mirrorX, y);
                ctx.lineTo(mirrorX + 10, y + 10);
            }
            ctx.stroke();

            ctx.fillStyle = '#1f2937';
            ctx.font = 'bold 16px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(t('canvasMirror'), mirrorX, 40);
        }

        function drawDistances() {
            const pixelDist = mirrorX - state.obj.x;
            const mmDist = Math.round((pixelDist / gridSize) * 10);
            const imageX = mirrorX + pixelDist;
            const yPos = height - 120;

            ctx.save();
            ctx.strokeStyle = '#4b5563';
            ctx.fillStyle = '#4b5563';
            ctx.lineWidth = 2;
            ctx.font = 'bold 14px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';

            function drawDimensionArrow(x1, x2, y) {
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x1 + 8, y - 4);
                ctx.lineTo(x1 + 8, y + 4);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x2, y);
                ctx.lineTo(x2 - 8, y - 4);
                ctx.lineTo(x2 - 8, y + 4);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x1, y - 8); ctx.lineTo(x1, y + 8);
                ctx.moveTo(x2, y - 8); ctx.lineTo(x2, y + 8);
                ctx.stroke();
            }

            drawDimensionArrow(state.obj.x, mirrorX, yPos);

            const objLabelX = (state.obj.x + mirrorX) / 2;
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(objLabelX - 55, yPos - 20, 110, 16);
            ctx.fillStyle = '#dc2626';
            ctx.fillText(t('canvasObjDist') + ': ' + mmDist + ' mm', objLabelX, yPos - 8);

            ctx.fillStyle = '#4b5563';
            drawDimensionArrow(mirrorX, imageX, yPos);

            const imgLabelX = (mirrorX + imageX) / 2;
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(imgLabelX - 55, yPos - 20, 110, 16);
            ctx.fillStyle = '#dc2626';
            ctx.fillText(t('canvasImgDist') + ': ' + mmDist + ' mm', imgLabelX, yPos - 8);

            ctx.restore();
        }

        function drawArrow(x, y, height, color, isDashed, label) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 5;
            if (isDashed) {
                ctx.setLineDash([8, 8]);
            }

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - height);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(x, y - height);
            ctx.lineTo(x - 16, y - height + 30);
            ctx.lineTo(x + 16, y - height + 30);
            ctx.closePath();
            ctx.fill();

            if (label) {
                ctx.fillStyle = color;
                ctx.font = 'bold 18px "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(label, x, y + 30);
            }
            ctx.restore();
        }

        function drawEye(x, y) {
            ctx.save();
            ctx.translate(x, y);

            const s = 4.0;

            ctx.beginPath();
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 2;
            ctx.fillStyle = 'white';
            ctx.moveTo(-15 * s, 0);
            ctx.quadraticCurveTo(0, -12 * s, 15 * s, 0);
            ctx.quadraticCurveTo(0, 12 * s, -15 * s, 0);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.fillStyle = '#1e40af';
            ctx.ellipse(5 * s, 0, 3 * s, 6 * s, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1e40af';
            ctx.font = '14px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(t('canvasEye'), 0, 35);

            ctx.restore();
        }

        function drawRayLine(x1, y1, x2, y2, color, type) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;

            if (type === 'virtual') {
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = color;
                ctx.globalAlpha = 0.4;
            } else {
                ctx.globalAlpha = 0.8;
            }

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            if (type !== 'virtual') {
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                const angle = Math.atan2(y2 - y1, x2 - x1);

                ctx.translate(midX, midY);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.fillStyle = color;
                ctx.moveTo(0, 0);
                ctx.lineTo(-6, -3);
                ctx.lineTo(-6, 3);
                ctx.fill();

                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }

            ctx.restore();
        }

        function drawNormalAndAngles(intersectY, sourcePt, targetPt) {
            ctx.save();
            ctx.strokeStyle = '#000000';
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(mirrorX, intersectY);
            ctx.lineTo(mirrorX - 100, intersectY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = 'black';
            ctx.font = '12px "Noto Sans TC", sans-serif';
            ctx.fillText(t('canvasNormal'), mirrorX - 105, intersectY + 4);

            const theta = Math.atan(Math.abs((targetPt.y - intersectY) / (targetPt.x - mirrorX)));
            const deg = (theta * 180 / Math.PI).toFixed(1);

            const radius = 40;
            const startAngle = Math.PI;
            let endAngle = Math.PI + ((sourcePt.y > intersectY) ? theta : -theta);

            ctx.beginPath();
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.arc(mirrorX, intersectY, radius, startAngle, endAngle, (sourcePt.y < intersectY));
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 14px "Noto Sans TC", sans-serif';
            const labelAngleI = (startAngle + endAngle) / 2;
            const lxI = mirrorX + (radius + 15) * Math.cos(labelAngleI);
            const lyI = intersectY + (radius + 15) * Math.sin(labelAngleI);
            ctx.fillText('i = ' + deg + '°', lxI - 20, lyI);

            let endAngleR = Math.PI + ((targetPt.y > intersectY) ? theta : -theta);

            ctx.beginPath();
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 2;
            const radiusR = 30;
            ctx.arc(mirrorX, intersectY, radiusR, Math.PI, endAngleR, (targetPt.y < intersectY));
            ctx.stroke();

            ctx.fillStyle = '#2563eb';
            ctx.font = 'bold 14px "Noto Sans TC", sans-serif';
            const labelAngleR = (Math.PI + endAngleR) / 2;
            const lxR = mirrorX + (radiusR + 25) * Math.cos(labelAngleR);
            const lyR = intersectY + (radiusR + 25) * Math.sin(labelAngleR);
            ctx.fillText('r = ' + deg + '°', lxR - 20, lyR);

            ctx.restore();
        }

        function drawRayDiagram() {
            const objectDist = mirrorX - state.obj.x;
            const imageX = mirrorX + objectDist;
            const imageY = state.obj.y;

            drawArrow(imageX, imageY, state.obj.h, '#ef4444', true, t('canvasImage'));

            const objTop = { x: state.obj.x, y: state.obj.y - state.obj.h };
            const objBot = { x: state.obj.x, y: state.obj.y };

            const imgTop = { x: imageX, y: imageY - state.obj.h };
            const imgBot = { x: imageX, y: imageY };

            const eyePos = { x: state.eye.x, y: state.eye.y };

            const s = 4.0;
            const pupilCenterX = eyePos.x + (5 * s);
            const pupilRadiusY = 6 * s;

            const eyeTargetTop = { x: pupilCenterX, y: eyePos.y - pupilRadiusY };
            const eyeTargetBot = { x: pupilCenterX, y: eyePos.y + pupilRadiusY };

            function traceRay(sourcePt, imagePt, targetPt, color, showAnglesForThisRay) {
                const dx = targetPt.x - imagePt.x;
                const dy = targetPt.y - imagePt.y;

                if (dx === 0) return;

                const m = dy / dx;
                const intersectY = m * (mirrorX - imagePt.x) + imagePt.y;

                drawRayLine(imagePt.x, imagePt.y, mirrorX, intersectY, color, 'virtual');
                drawRayLine(mirrorX, intersectY, targetPt.x, targetPt.y, color, 'reflected');
                drawRayLine(sourcePt.x, sourcePt.y, mirrorX, intersectY, color, 'incident');

                if (showAnglesForThisRay) {
                    drawNormalAndAngles(intersectY, sourcePt, targetPt);
                }
            }

            traceRay(objTop, imgTop, eyeTargetTop, '#16a34a', state.showAngles);
            traceRay(objTop, imgTop, eyeTargetBot, '#16a34a', false);
            traceRay(objBot, imgBot, eyeTargetTop, '#9333ea', false);
            traceRay(objBot, imgBot, eyeTargetBot, '#9333ea', false);
        }

        function draw() {
            if (!width || !height) return;
            ctx.clearRect(0, 0, width, height);

            drawGrid();
            drawMirror();

            drawArrow(state.obj.x, state.obj.y, state.obj.h, '#dc2626', false, t('canvasObject'));
            drawEye(state.eye.x, state.eye.y);
            drawRayDiagram();

            if (state.showDistances) {
                drawDistances();
            }
        }

        function loop() {
            if (state.obj.dragging || state.eye.dragging) {
                draw();
            }
            requestAnimationFrame(loop);
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function isOverObject(pos) {
            const dx = Math.abs(pos.x - state.obj.x);
            return dx < 30 && pos.y > state.obj.y - state.obj.h - 20 && pos.y < state.obj.y + 20;
        }

        function isOverEye(pos) {
            const dx = pos.x - state.eye.x;
            const dy = pos.y - state.eye.y;
            return Math.sqrt(dx * dx + dy * dy) < 40;
        }

        function handleStart(e) {
            const pos = getPointerPos(e);

            if (isOverObject(pos)) {
                state.obj.dragging = true;
                state.dragOffset.x = pos.x - state.obj.x;
                state.dragOffset.y = pos.y - state.obj.y;
                canvas.style.cursor = 'grabbing';
            } else if (isOverEye(pos)) {
                state.eye.dragging = true;
                state.dragOffset.x = pos.x - state.eye.x;
                state.dragOffset.y = pos.y - state.eye.y;
                canvas.style.cursor = 'grabbing';
            }
        }

        function handleMove(e) {
            const pos = getPointerPos(e);

            if (!state.obj.dragging && !state.eye.dragging) {
                if (isOverObject(pos) || isOverEye(pos)) {
                    canvas.style.cursor = 'grab';
                } else {
                    canvas.style.cursor = 'crosshair';
                }
                return;
            }

            if (state.obj.dragging) {
                let newX = pos.x - state.dragOffset.x;
                let newY = pos.y - state.dragOffset.y;

                if (newX > mirrorX - 20) newX = mirrorX - 20;
                if (newX < 20) newX = 20;
                if (newY < state.obj.h + 20) newY = state.obj.h + 20;
                if (newY > height - 20) newY = height - 20;

                state.obj.x = newX;
                state.obj.y = newY;
            } else if (state.eye.dragging) {
                let newX = pos.x - state.dragOffset.x;
                let newY = pos.y - state.dragOffset.y;

                if (newX > mirrorX - 20) newX = mirrorX - 20;
                if (newX < 20) newX = 20;
                if (newY < 20) newY = 20;
                if (newY > height - 20) newY = height - 20;

                state.eye.x = newX;
                state.eye.y = newY;
            }
        }

        function handleEnd() {
            state.obj.dragging = false;
            state.eye.dragging = false;
            canvas.style.cursor = 'crosshair';
            draw();
        }

        function setupInteractions() {
            canvas.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);

            canvas.addEventListener('touchstart', function (e) {
                e.preventDefault();
                handleStart(e);
            }, { passive: false });
            window.addEventListener('touchmove', function (e) {
                e.preventDefault();
                handleMove(e);
            }, { passive: false });
            window.addEventListener('touchend', handleEnd);
        }

        init();
    </script>
</body>
</html>
