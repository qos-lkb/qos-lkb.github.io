/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

            q2b: 'B. I is a real screen-catchable image stuck on the mirror surface',
            q2c: 'C. Moving O vertically flips I to the front of the mirror',
            q2d: 'D. I appears only after Reset',
            q2ans: 'Model answer: A. Virtual image is symmetric behind the mirror; dashes are not real paths.',
            q3: 'Look at one solid-red pair and its grey dashes. Which description is most reasonable?',
            q3a: 'A. Solid red = real incident／reflected paths; grey dashes = extensions showing rays “appear to come from I”',
            q3b: 'B. Grey dashes are UV and solid red is IR',
            q3c: 'C. Only grey dashes reach the eye; solid red is decoration',
            q3d: 'D. The three hit points automatically scan the whole mirror over time',
            q3ans: 'Model answer: A. Matches this file’s incident／reflected vs virtual drawing logic.',

            q5b: 'B. This file offers a focal-length slider and checks 1/u+1/v=1/f',
            q5c: 'C. Reset always switches to English and deletes the virtual image',
            q5d: 'D. It mainly shows the ideal-gas law PV=nRT',

    };

    const quizState = { selections: {}, showAnswers: false };
    let currentLang = 'zh';

    function t(key) {
        return (i18n[currentLang] && i18n[currentLang][key]) || (i18n.zh[key] || key);
    }

    function updateLang() {
        document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
        document.title = t('pageTitle');
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (i18n[currentLang][key] != null) el.textContent = i18n[currentLang][key];
        });
        renderSteps();
        renderPrinciple();
        renderQuiz();
        const ansBtn = document.getElementById('btn-quiz-answers');
        if (ansBtn) ansBtn.textContent = quizAnswersVisible ? t('hideAnswers') : t('showAnswers');
    }

    function renderSteps() {
        const ol = document.getElementById('steps-body');
        if (!ol) return;
        ol.innerHTML = [1, 2, 3, 4].map(n => `<li>${t('step' + n)}</li>`).join('');
    }

    function renderPrinciple() {
        const body = document.getElementById('principle-body');
        if (!body) return;
        body.innerHTML = `
            <div><h3 class="font-bold text-indigo-700 mb-1">${t('principleConceptTitle')}</h3><p>${t('principleConcept')}</p></div>
            <div><h3 class="font-bold text-indigo-700 mb-1">${t('principleMechTitle')}</h3>${t('principleMech')}</div>
            <div><h3 class="font-bold text-indigo-700 mb-1">${t('principleExampleTitle')}</h3><p>${t('principleExample')}</p></div>
        `;
    }

    let quizAnswersVisible = false;

        function renderQuiz() {
            const texts = i18n[currentLang];
            const body = document.getElementById('quiz-body');
            if (!body) return;
            const langIsZh = (currentLang === 'zh');
            const ref = texts.quizRef || (langIsZh ? '參考答案' : 'Reference answer');
            const optKey = (qid, L) => {
                const lower = qid + L.toLowerCase();
                const upper = qid + L.toUpperCase();
                return texts[lower] != null ? lower : upper;
            };
            const mkChoice = (qid) => ['A', 'B', 'C', 'D'].map(L => {
                const key = optKey(qid, L);
                return '<label class="flex items-start gap-2 rounded-lg border p-2 cursor-pointer"><input type="radio" name="' + qid + '" class="mt-1 accent-violet-600"><span>' + (texts[key] || '') + '</span></label>';
            }).join('');
            const ans = (key) => quizAnswersVisible
                ? '<div class="mt-2 text-xs rounded-lg border border-emerald-500/40 bg-emerald-950/30 p-2"><strong>' + ref + '：</strong> ' + texts[key] + '</div>' : '';
            const openHint = texts.shortHint || texts.openHint || '';
            const block = (n, qid, mc) => {
                let h = '<div class="quiz-item rounded-xl border p-3 mb-3"><p class="font-semibold mb-2">Q' + n + '. ' + texts[qid] + '</p>';
                if (mc) h += '<div class="grid gap-1.5">' + mkChoice(qid) + '</div>';
                else if (openHint) h += '<p class="text-xs opacity-70 mb-1">' + openHint + '</p>';
                return h + ans(qid + 'ans') + '</div>';
            };
            body.innerHTML = block(1, 'q1', true) + block(2, 'q2', false) + block(3, 'q3', true) + block(4, 'q4', false) + block(5, 'q5', true);
            const ansBtn = document.getElementById('btn-quiz-answers');
            if (ansBtn) ansBtn.textContent = quizAnswersVisible ? texts.hideAnswers : texts.showAnswers;
            const modal = document.getElementById('modal-quiz');
            if (quizAnswersVisible && typeof typesetMath === 'function' && modal) typesetMath(modal);
        }


        ctx.fillStyle = '#374151';
        ctx.font = '14px "Noto Sans TC"';
        ctx.textAlign = 'left';
        ctx.fillText(t('canvasFront'), mirrorX - 80, 30);
        ctx.fillText(t('canvasBack'), mirrorX + 15, 30);
    }

    function drawArrow(fromX, fromY, toX, toY, color) {
        const headlen = 10;
        const dx = toX - fromX;
        const dy = toY - fromY;
        const angle = Math.atan2(dy, dx);
        const midX = (fromX + toX) / 2;
        const midY = (fromY + toY) / 2;
        ctx.beginPath();
        ctx.moveTo(midX, midY);
        ctx.lineTo(midX - headlen * Math.cos(angle - Math.PI / 6), midY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(midX, midY);
        ctx.lineTo(midX - headlen * Math.cos(angle + Math.PI / 6), midY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawRay(start, end, type) {
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        if (type === 'virtual') {
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = '#9CA3AF';
        } else if (type === 'incident' || type === 'reflected') {
            ctx.setLineDash([]);
            ctx.strokeStyle = '#DC2626';
        }
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
        if (type === 'incident' || type === 'reflected') {
            drawArrow(start.x, start.y, end.x, end.y, '#DC2626');
        }
    }

    function drawDimensionLine(x1, x2, y, label, color) {
        const tickSize = 5;
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x1, y - tickSize);
        ctx.lineTo(x1, y + tickSize);
        ctx.moveTo(x2, y - tickSize);
        ctx.lineTo(x2, y + tickSize);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x1 + 5, y - 3);
        ctx.lineTo(x1 + 5, y + 3);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x2, y);
        ctx.lineTo(x2 - 5, y - 3);
        ctx.lineTo(x2 - 5, y + 3);
        ctx.fill();
        ctx.font = 'bold 14px "Noto Sans TC"';
        ctx.textAlign = 'center';
        const midX = (x1 + x2) / 2;
        const textWidth = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(243, 244, 246, 0.8)';
        ctx.fillRect(midX - textWidth / 2 - 4, y - 10, textWidth + 8, 20);
        ctx.fillStyle = color;
        ctx.fillText(label, midX, y + 5);
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        drawGrid();
        drawMirror();

        const objectDistance = mirrorX - objectPos.x;
        const imagePos = {
            x: mirrorX + objectDistance,
            y: objectPos.y
        };

        const uVal = (objectDistance / cmRatio).toFixed(1);
        const vVal = ((imagePos.x - mirrorX) / cmRatio).toFixed(1);
        uLabel.innerText = uVal;
        vLabel.innerText = vVal;

        const mirrorCenterY = height / 2;
        const hitYs = [mirrorCenterY - 60, mirrorCenterY, mirrorCenterY + 60];

        hitYs.forEach(y => {
            const hitPoint = { x: mirrorX, y: y };
            drawRay(objectPos, hitPoint, 'incident');
            drawRay(imagePos, hitPoint, 'virtual');
            const dx = hitPoint.x - imagePos.x;
            const dy = hitPoint.y - imagePos.y;
            if (dx !== 0) {
                const slope = dy / dx;
                const endX = 0;
                const endY = hitPoint.y + slope * (endX - hitPoint.x);
                drawRay(hitPoint, { x: endX, y: endY }, 'reflected');
            }
        });

        ctx.beginPath();
        ctx.moveTo(objectPos.x, objectPos.y);
        ctx.lineTo(imagePos.x, objectPos.y);
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);

        const size = 10;
        ctx.beginPath();
        ctx.moveTo(mirrorX - size, objectPos.y);
        ctx.lineTo(mirrorX - size, objectPos.y - size);
        ctx.lineTo(mirrorX, objectPos.y - size);
        ctx.strokeStyle = '#000';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(imagePos.x, imagePos.y, 8, 0, Math.PI * 2);
        ctx.strokeStyle = '#4B5563';
        ctx.setLineDash([2, 2]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fill();

        ctx.fillStyle = '#4B5563';
        ctx.textAlign = 'left';
        ctx.font = 'italic 14px "Noto Sans TC"';
        ctx.fillText(t('canvasImage'), imagePos.x + 15, imagePos.y - 15);
        ctx.font = 'bold 14px "Noto Sans TC"';
        ctx.fillText('I', imagePos.x - 4, imagePos.y + 4);

        ctx.beginPath();
        ctx.arc(objectPos.x, objectPos.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#DC2626';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#DC2626';
        ctx.textAlign = 'right';
        ctx.font = 'bold 14px "Noto Sans TC"';
        ctx.fillText(t('canvasObject'), objectPos.x - 15, objectPos.y - 15);
        ctx.fillText('O', objectPos.x - 3, objectPos.y + 4);

        const dimY = objectPos.y + 100;
        drawDimensionLine(objectPos.x, mirrorX, dimY, `u = ${uVal} cm`, '#DC2626');
        drawDimensionLine(mirrorX, imagePos.x, dimY, `v = ${vVal} cm`, '#4F46E5');
    }

    function loop() {
        draw();
        requestAnimationFrame(loop);
    }

    init();
})();
</script>
