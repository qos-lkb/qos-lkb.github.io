<header class="w-full max-w-7xl mx-auto px-3 sm:px-4 pt-3 shrink-0">

    <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 text-white flex items-center justify-center shadow-md shrink-0">

            <span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-bold border border-indigo-100" data-i18n="badge">物理</span>

        </div>
      </div>
      <button class="md:hidden px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 rounded-lg border border-slate-300 shrink-0" id="btn-lang-mobile" type="button">中 / EN</button>
    </div>
    <div class="flex items-center gap-2 flex-wrap w-full md:w-auto justify-end">
      <button class="px-3.5 py-2 bg-white hover:bg-slate-50 text-slate-700 rounded-xl font-bold text-sm border border-slate-300 flex items-center gap-2" id="btn-steps" type="button">

<main class="flex-1 min-h-0 w-full max-w-7xl mx-auto p-3 sm:p-4 flex flex-col lg:flex-row gap-3 lg:gap-4 overflow-auto lg:overflow-hidden">
  <aside class="w-full lg:w-[300px] xl:w-[320px] shrink-0 order-2 lg:order-1 min-h-0 lg:overflow-y-auto space-y-3 pr-0.5">
    <section class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 space-y-2">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="modeSelect">1. 實驗模式</h2>
      <label class="choice flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer" data-choice="continuous">
        <input checked class="w-4 h-4 text-indigo-600" name="mode" type="radio" value="continuous"/>
        <span>
          <span class="block font-bold text-sm text-slate-700" data-i18n="modeContinuous">連續駐波</span>
          <span class="block text-[11px] text-slate-500" data-i18n="modeContDesc">入射與反射疊成穩定波形</span>
        </span>
      </label>
      <label class="choice flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer" data-choice="pulse">
        <input class="w-4 h-4 text-indigo-600" name="mode" type="radio" value="pulse"/>
        <span>
          <span class="block font-bold text-sm text-slate-700" data-i18n="modePulse">單一脈衝</span>
          <span class="block text-[11px] text-slate-500" data-i18n="modePulseDesc">看清端點反射有沒有顛倒</span>
        </span>
      </label>
    </section>

    <section class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 space-y-2">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="endSelect">2. 右端邊界</h2>
      <label class="choice flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer" data-choice="fixed">
        <input checked class="w-4 h-4 text-indigo-600" name="end" type="radio" value="fixed"/>
        <span>
          <span class="block font-bold text-sm text-slate-700" data-i18n="endFixed">固定端</span>
          <span class="block text-[11px] text-slate-500" data-i18n="endFixedDesc">反相反射，右端是波節</span>
        </span>
      </label>
      <label class="choice flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer" data-choice="free">
        <input class="w-4 h-4 text-indigo-600" name="end" type="radio" value="free"/>
        <span>
          <span class="block font-bold text-sm text-slate-700" data-i18n="endFree">自由端</span>
          <span class="block text-[11px] text-slate-500" data-i18n="endFreeDesc">同相反射，右端是波腹</span>
        </span>
      </label>
    </section>

    <section class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 space-y-4" id="panel-params">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="params">3. 參數</h2>
      <div id="n-wrap">
        <div class="flex justify-between text-xs mb-2 font-bold text-slate-600">

          <span class="font-mono text-indigo-600" id="val-n">3</span>
        </div>
        <div class="grid grid-cols-6 gap-1" id="n-btns"></div>
        <p class="text-[11px] text-slate-400 mt-1.5" id="n-hint">固定端：波腹數 = n，兩端都是波節</p>
      </div>
      <div>
        <div class="flex justify-between text-xs mb-1 font-bold text-slate-600">
          <span data-i18n="lengthLbl">繩長 L</span>
          <span class="font-mono text-indigo-600" id="val-L">1.20 m</span>
        </div>
        <input id="slider-L" max="2.4" min="0.6" step="0.05" type="range" value="1.2" aria-label="L"/>
      </div>
      <div>
        <div class="flex justify-between text-xs mb-1 font-bold text-slate-600">
          <span data-i18n="speedLbl">波速 v</span>
          <span class="font-mono text-indigo-600" id="val-v">6.0 m/s</span>
        </div>
        <input id="slider-v" max="16" min="2" step="0.5" type="range" value="6" aria-label="v"/>
      </div>
    </section>

    <section class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 space-y-3">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider" data-i18n="display">4. 圖層</h2>
      <label class="flex items-center justify-between text-sm font-medium text-slate-700 cursor-pointer">
        <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-sm bg-blue-500 inline-block"></i><span data-i18n="showInc">入射波（向右）</span></span>
        <input checked class="w-4 h-4 text-blue-600 rounded" id="chk-inc" type="checkbox"/>
      </label>
      <label class="flex items-center justify-between text-sm font-medium text-slate-700 cursor-pointer">
        <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-sm bg-rose-500 inline-block"></i><span data-i18n="showRef">反射波（向左）</span></span>
        <input checked class="w-4 h-4 text-rose-600 rounded" id="chk-ref" type="checkbox"/>
      </label>
      <label class="flex items-center justify-between text-sm font-medium text-slate-700 cursor-pointer">
        <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-sm bg-violet-600 inline-block"></i><span data-i18n="showRes">合成波（繩）</span></span>
        <input checked class="w-4 h-4 text-violet-600 rounded" id="chk-res" type="checkbox"/>
      </label>
      <label class="flex items-center justify-between text-sm font-medium text-slate-700 cursor-pointer">
        <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-sm bg-violet-300 inline-block"></i><span data-i18n="showEnv">合成波包絡</span></span>
        <input checked class="w-4 h-4 text-violet-400 rounded" id="chk-env" type="checkbox"/>
      </label>
      <label class="flex items-center justify-between text-sm font-medium text-slate-700 cursor-pointer">
        <span class="flex items-center gap-2"><i class="w-3 h-3 rounded-full bg-slate-700 inline-block"></i><span data-i18n="showBeads">質點</span></span>
        <input checked class="w-4 h-4 rounded" id="chk-beads" type="checkbox"/>
      </label>
    </section>

    <div class="flex gap-2">
      <button class="flex-1 py-3 rounded-lg font-bold text-white flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 shadow-sm active:scale-95" id="btn-play" type="button">
        <svg class="w-5 h-5 hidden" id="icon-play" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 4 20 12 6 20"/></svg>
        <svg class="w-5 h-5" id="icon-pause" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <span id="text-play">暫停</span>
      </button>
      <button class="px-3 py-3 rounded-lg bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 font-bold text-sm active:scale-95" id="btn-step" type="button" data-i18n="btnStep">單步</button>
      <button class="px-3 py-3 rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 active:scale-95" id="btn-reset" type="button" aria-label="重置">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
      </button>
    </div>
  </aside>

  <section class="flex-1 order-1 lg:order-2 min-w-0 min-h-[560px] lg:min-h-0 flex flex-col gap-3">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 min-h-[320px] flex flex-col overflow-hidden">
      <div class="px-3 py-2 border-b border-slate-100 shrink-0">
        <div class="mj-eq text-sm text-slate-700" id="eq-display"></div>
        <p class="text-[11px] text-slate-500 leading-snug mt-1" id="eq-note"></p>
      </div>
      <div class="flex-1 min-h-[260px] relative" id="stage">
        <canvas class="absolute inset-0 w-full h-full block" id="sim-canvas"></canvas>
      </div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 shrink-0" id="stats"></div>
    <p class="text-[11px] text-slate-500 shrink-0 -mt-1" id="slow-note"></p>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 shrink-0 p-3">
      <div class="flex items-baseline justify-between gap-2 mb-1">
        <h2 class="text-xs font-bold text-slate-500" data-i18n="chartTitle">探測點位移–時間</h2>
        <p class="text-[11px] text-slate-500 text-right" id="probe-read"></p>
      </div>
      <canvas class="w-full block h-28" id="probe-canvas"></canvas>
      <p class="text-[11px] text-slate-400 mt-1" data-i18n="probeHint">在繩上按一下，比較波節與波腹。波節的曲線貼着零線。</p>
    </div>
  </section>
</main>

<div aria-labelledby="modal-title" aria-modal="true" class="modal-backdrop fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none" id="modal-principle" role="dialog">
  <div class="modal-content bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden border border-slate-100 transform scale-95 opacity-0 flex flex-col max-h-[88vh]">
    <div class="bg-gradient-to-r from-indigo-500 to-violet-600 p-5 text-white flex justify-between items-center shrink-0">
      <div>
        <h2 class="text-lg font-bold" data-i18n="modalTitle" id="modal-title">原理解說</h2>
        <p class="text-xs opacity-80" data-i18n="modalSub">概念、機制與應用</p>
      </div>
      <button aria-label="Close" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center" id="modal-close" type="button">✕</button>
    </div>
    <div class="p-6 overflow-y-auto space-y-4 text-sm text-slate-700">
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
        <h3 class="font-bold text-slate-900 mb-1" data-i18n="m1t">1. 兩列行波疊成駐波</h3>
        <p class="text-xs leading-relaxed" data-i18n="m1d"></p>
        <p class="mj-box text-sm mt-2" data-i18n="m1eq"></p>
      </div>
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
        <h3 class="font-bold text-slate-900 mb-1" data-i18n="m2t">2. 固定端</h3>
        <p class="text-xs leading-relaxed" data-i18n="m2d"></p>
        <p class="mj-box text-sm mt-2" data-i18n="m2eq"></p>
      </div>
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
        <h3 class="font-bold text-slate-900 mb-1" data-i18n="m3t">3. 自由端</h3>
        <p class="text-xs leading-relaxed" data-i18n="m3d"></p>
        <p class="mj-box text-sm mt-2" data-i18n="m3eq"></p>
      </div>
      <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
        <h3 class="font-bold text-emerald-900 mb-1" data-i18n="m4t">4. 怎麼讀這個實驗</h3>
        <p class="text-xs text-emerald-800 leading-relaxed" data-i18n="m4d"></p>
      </div>
    </div>
    <div class="bg-slate-50 p-4 border-t border-slate-100 text-right shrink-0">
      <button class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl" data-i18n="modalClose" id="modal-confirm" type="button">關閉</button>
    </div>
  </div>
</div>

<div aria-labelledby="steps-title" aria-modal="true" class="modal-backdrop fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none" id="modal-steps" role="dialog">
  <div class="modal-content bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-slate-100 transform scale-95 opacity-0 flex flex-col max-h-[88vh]">
    <div class="bg-gradient-to-r from-indigo-500 to-violet-600 p-5 text-white flex justify-between items-center shrink-0">
      <h2 class="text-lg font-bold" data-i18n="stepsTitle" id="steps-title">觀察步驟</h2>
      <button aria-label="Close" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center" id="steps-close" type="button">✕</button>
    </div>
    <div class="p-6 overflow-y-auto space-y-3 text-sm text-slate-700">
      <div class="bg-sky-50 p-4 rounded-2xl border border-sky-100 text-xs leading-relaxed" data-i18n="s1"></div>
      <div class="bg-sky-50 p-4 rounded-2xl border border-sky-100 text-xs leading-relaxed" data-i18n="s2"></div>
      <div class="bg-sky-50 p-4 rounded-2xl border border-sky-100 text-xs leading-relaxed" data-i18n="s3"></div>
      <div class="bg-sky-50 p-4 rounded-2xl border border-sky-100 text-xs leading-relaxed" data-i18n="s4"></div>
      <div class="bg-sky-50 p-4 rounded-2xl border border-sky-100 text-xs leading-relaxed" data-i18n="s5"></div>
    </div>
    <div class="bg-slate-50 p-4 border-t border-slate-100 text-right shrink-0">
      <button class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl" data-i18n="modalClose" id="steps-confirm" type="button">關閉</button>
    </div>
  </div>
</div>

      noteFixed: 'Fixed end: the reflected wave is subtracted, so the end is a node.',
      noteFree: 'Free end: the reflected wave adds, so the end is an antinode.',
      notePulseF: 'Blue pulse travels right; after the wall the red pulse is inverted.',
      notePulseR: 'No inversion: the red pulse stays upward and the end displaces more.',
      doneF: 'Pulse has left. The fixed end sent it back upside down.',
      doneR: 'Pulse has left. The free end did not invert it.',
      going: 'Outbound', back: 'Return',
      nName: function (n) {
        if (n === 1) return 'fundamental';
        const s = n % 10, h = n % 100;
        const suf = (s === 1 && h !== 11) ? 'st' : (s === 2 && h !== 12) ? 'nd' : (s === 3 && h !== 13) ? 'rd' : 'th';
        return n + suf + ' harmonic';
      },
      nHintF: 'Fixed end: $n$ antinodes, $L=n\\lambda/2$, nodes at both ends',
      nHintR: 'Free end: antinode at right, $L=(2n-1)\\lambda/4$',
      lam: '$\\lambda$', freq: '$f$', period: '$T$',
      na: 'Nodes / antinodes', cond: 'Condition', screen: 'On-screen $f$',
      prog: 'Pulse progress', leg: 'Boundary', speed: 'Slow motion',
      nodes: 'nodes', antis: 'antinodes',
      condF: '$$L=n\\lambda/2,\\quad f_n=\\dfrac{nv}{2L}$$',
      condR: '$$L=\\dfrac{(2n-1)\\lambda}{4},\\quad f_n=\\dfrac{(2n-1)v}{4L}$$',
      slow: function (r) { return 'Animation is about ' + r + '× slower than the real frequency. Readouts are the real $f$.'; },
      pulseSlow: 'The pulse is played at 1/10 speed so the inversion is easy to see.',
      probeAt: 'at',
      kindN: 'node', kindA: 'antinode', kindM: 'in between',
      flat: 'resultant is crossing equilibrium',
      chartEmpty: 'Press play to plot y–t at this point',
      chartY: 'y / 2A',
      reset: 'Reset'
    }
  };

  const state = {
    lang: 'zh',
    mode: 'continuous',
    end: 'fixed',
    n: 3,
    L: 1.2,
    v: 6,
    showInc: true,
    showRef: true,
    showRes: true,
    showEnv: true,
    showBeads: true,
    isPlaying: true,
    time: 0,
    pulseT: 0,
    pulseActive: false,
    pulseDone: false,
    probe: 1 / 6,
    probeUser: false
  };

  const hist = [];
  const PULSE_SLOW = 10;
  let view = { w: 0, h: 0, x0: 64, len: 100, cy: 0, amp: 70 };
  let lastTs = 0;

  const els = {
    canvas: document.getElementById('sim-canvas'),
    probe: document.getElementById('probe-canvas'),
    slowNote: document.getElementById('slow-note'),
    nBtns: document.getElementById('n-btns'),
    valN: document.getElementById('val-n'),
    valL: document.getElementById('val-L'),
    valV: document.getElementById('val-v'),
    sliderL: document.getElementById('slider-L'),
    sliderV: document.getElementById('slider-v'),
    nWrap: document.getElementById('n-wrap'),
    nHint: document.getElementById('n-hint'),
    eq: document.getElementById('eq-display'),
    eqNote: document.getElementById('eq-note'),
    stats: document.getElementById('stats'),
    probeRead: document.getElementById('probe-read'),
    btnPlay: document.getElementById('btn-play'),
    textPlay: document.getElementById('text-play'),
    iconPlay: document.getElementById('icon-play'),
    iconPause: document.getElementById('icon-pause'),
    btnStep: document.getElementById('btn-step'),
    btnReset: document.getElementById('btn-reset')
  };
  const ctx = els.canvas.getContext('2d');
  const pctx = els.probe.getContext('2d');

  function t() { return TEXT[state.lang]; }

  function phys() {
    const fixed = state.end === 'fixed';
    const lambda = fixed ? (2 * state.L / state.n) : (4 * state.L / (2 * state.n - 1));
    const f = state.v / lambda;
    const k = (2 * Math.PI) / lambda;
    return { fixed: fixed, lambda: lambda, f: f, k: k };
  }

  function visualF(f) {
    return Math.max(0.3, Math.min(0.8, f * 0.06));
  }

  function omega() {
    return 2 * Math.PI * visualF(phys().f);
  }

  function firstAntinode() {
    return state.end === 'fixed' ? 1 / (2 * state.n) : 1 / (2 * state.n - 1);
  }

  function clearHist() { hist.length = 0; }

  function fitCanvas(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, rect.width);
    const h = Math.max(2, rect.height);
    if (canvas._w === w && canvas._h === h && canvas._dpr === dpr) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas._w = w;
    canvas._h = h;
    canvas._dpr = dpr;
  }

  function resize() {
    fitCanvas(els.canvas);
    fitCanvas(els.probe);
  }

  function layout() {
    const w = els.canvas._w || 0;
    const h = els.canvas._h || 0;
    const top = 22;
    const bot = 28;
    const x0 = 72;
    const right = 46;
    const len = Math.max(40, w - x0 - right);
    const bandTop = top + 6;
    const bandBot = h - bot;
    const cy = (bandTop + bandBot) / 2;
    const amp = Math.max(36, (bandBot - bandTop) / 2 - 16);
    view = { w: w, h: h, x0: x0, len: len, cy: cy, amp: amp, top: top };
  }

  function sToX(frac) { return view.x0 + frac * view.len; }

  function waveY(frac, which) {
    const p = phys();
    const s = frac * state.L;
    const A = view.amp / 2;
    const wt = omega() * state.time;
    if (which === 'inc') return A * Math.sin(p.k * s - wt);
    if (which === 'ref') return A * Math.sin(p.k * s + wt);
    return view.amp * Math.sin(p.k * s) * Math.cos(wt);
  }

  function pulseProfile(frac) {
    const sigma = view.len / 16;
    const vPx = (state.v / PULSE_SLOW) / state.L * view.len;
    const d = vPx * state.pulseT;
    const x = frac * view.len;
    const g = function (z) { return Math.exp(-(z * z) / (2 * sigma * sigma)); };
    const sign = state.end === 'fixed' ? -1 : 1;
    const peak = view.amp * 0.62;
    const inc = peak * g(x - d);
    const ref = sign * peak * g(x - (2 * view.len - d));
    return { inc: inc, ref: ref, net: inc + ref, d: d, sigma: sigma, vPx: vPx };
  }

  function yOf(frac) {
    if (state.mode === 'pulse') {
      if (!state.pulseActive && state.pulseT <= 0) return { inc: 0, ref: 0, net: 0 };
      return pulseProfile(frac);
    }
    return { inc: waveY(frac, 'inc'), ref: waveY(frac, 'ref'), net: waveY(frac, 'net') };
  }

  function typeset(el) {
    const run = function () {
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise(el ? [el] : undefined).catch(function () {});
      }
    };
    if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(run);
    else window.addEventListener('load', run, { once: true });
  }

  function updateEquation() {
    const tr = t();
    let tex = tr.eqFixed;
    let note = tr.noteFixed;
    if (state.mode === 'pulse') {
      tex = state.end === 'fixed' ? tr.eqPulseF : tr.eqPulseR;
      note = state.pulseDone ? (state.end === 'fixed' ? tr.doneF : tr.doneR) : (state.end === 'fixed' ? tr.notePulseF : tr.notePulseR);
    } else if (state.end === 'free') {
      tex = tr.eqFree;
      note = tr.noteFree;
    }
    els.eq.innerHTML = tex;
    els.eqNote.textContent = note;
    typeset(els.eq);
  }

  function sourceAnchorFrac() {
    return state.mode === 'pulse' ? 0 : 1 / 48;
  }

  function sourceY() {
    const frac = sourceAnchorFrac();
    if (state.mode === 'pulse') {
      if (!state.pulseActive && state.pulseT <= 0) return 0;
      return yOf(frac).inc;
    }
    return yOf(frac).net;
  }

  function updateControls() {
    const tr = t();
    const pulse = state.mode === 'pulse';
    els.valN.textContent = state.n + ' · ' + tr.nName(state.n);
    els.valL.textContent = state.L.toFixed(2) + ' m';
    els.valV.textContent = state.v.toFixed(1) + ' m/s';
    els.nHint.innerHTML = state.end === 'fixed' ? tr.nHintF : tr.nHintR;
    els.nWrap.style.opacity = pulse ? '0.45' : '1';
    els.nBtns.querySelectorAll('button').forEach(function (b) {
      const on = Number(b.dataset.n) === state.n;
      b.disabled = pulse;
      b.className = 'py-1.5 rounded-md text-sm font-bold border ' + (on
        ? 'bg-indigo-600 text-white border-indigo-600'
        : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    document.querySelectorAll('label.choice').forEach(function (lab) {
      const input = lab.querySelector('input');
      const on = input.checked;
      lab.classList.toggle('on', on);
    });
    const showPause = state.isPlaying && (state.mode === 'continuous' || state.pulseActive);
    let label = tr.play;
    if (showPause) label = tr.pause;
    else if (state.mode === 'pulse' && !state.pulseActive) label = tr.launch;
    els.textPlay.textContent = label;
    els.iconPlay.classList.toggle('hidden', showPause);
    els.iconPause.classList.toggle('hidden', !showPause);
    els.btnPlay.className = 'flex-1 py-3 rounded-lg font-bold text-white flex items-center justify-center gap-2 shadow-sm active:scale-95 ' +
      (showPause ? 'bg-amber-500 hover:bg-amber-600' : 'bg-indigo-600 hover:bg-indigo-700');
    els.btnReset.setAttribute('aria-label', tr.reset);
    renderStats();
    updateEquation();
  }

  function card(label, value, id, mathValue) {
    const valClass = mathValue ? 'stat-mj mj-eq mt-0.5' : 'font-mono text-sm font-bold text-slate-800 mt-0.5';
    return '<div class="bg-white rounded-xl border border-slate-200 px-3 py-2">' +
      '<div class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mj-eq" style="background:transparent;padding:0;">' + label + '</div>' +
      '<div class="' + valClass + '"' + (id ? ' id="' + id + '"' : '') + '>' + value + '</div></div>';
  }

  function renderStats() {
    const tr = t();
    const p = phys();
    const fv = visualF(p.f);
    const ratio = Math.max(1, Math.round(p.f / fv));
    const nodes = state.end === 'fixed' ? state.n + 1 : state.n;
    const antis = state.n;
    let html;
    if (state.mode === 'continuous') {
      html = card(tr.lam, p.lambda.toFixed(2) + ' m') +
        card(tr.freq, p.f.toFixed(2) + ' Hz') +
        card(tr.period, (1 / p.f).toFixed(3) + ' s') +
        card(tr.na, nodes + ' / ' + antis) +
        card(tr.cond, state.end === 'fixed' ? tr.condF : tr.condR, null, true) +
        card(tr.screen, fv.toFixed(2) + ' Hz', 'out-live');
      els.stats.innerHTML = html;
      const live = document.getElementById('out-live');
      if (live) {
        live.dataset.ratio = String(ratio);
        live.dataset.fv = fv.toFixed(2);
      }
      els.slowNote.innerHTML = tr.slow(ratio);
      typeset(els.stats);
      typeset(els.nHint);
    } else {
      const prog = state.pulseActive || state.pulseT > 0 ? Math.min(100, Math.round(100 * pulseProgress())) : 0;
      html = card(tr.prog, prog + '%', 'out-live') +
        card(tr.leg, state.end === 'fixed' ? tr.fixedEnd : tr.freeEnd) +
        card(tr.speed, '×' + PULSE_SLOW) +
        card(tr.lam, '—') +
        card('L', state.L.toFixed(2) + ' m') +
        card('v', state.v.toFixed(1) + ' m/s');
      els.stats.innerHTML = html;
      els.slowNote.textContent = tr.pulseSlow;
      typeset(els.stats);
      typeset(els.nHint);
    }
  }

  function pulseProgress() {
    if (!view.len) return 0;
    const sigma = view.len / 16;
    const vPx = (state.v / PULSE_SLOW) / state.L * view.len;
    const d = vPx * state.pulseT;
    return d / (2 * view.len + 3 * sigma);
  }

  function tickLive() {
    const tr = t();
    const live = document.getElementById('out-live');
    if (!live) return;
    if (state.mode === 'continuous') {
      const c = Math.cos(omega() * state.time);
      live.textContent = (live.dataset.fv || '') + ' Hz';
      const base = tr.slow(live.dataset.ratio || '1');
      els.slowNote.innerHTML = Math.abs(c) < 0.08 ? base + ' · ' + tr.flat : base;
    } else if (state.pulseActive || state.pulseT > 0) {
      const prog = Math.min(100, Math.round(100 * pulseProgress()));
      const vPx = (state.v / PULSE_SLOW) / state.L * (view.len || 1);
      const d = vPx * state.pulseT;
      const phase = d < (view.len || 1) ? tr.going : tr.back;
      live.textContent = prog + '% · ' + phase;
    }
  }

  function probeKind(frac) {
    const tr = t();
    if (state.mode === 'pulse') return '';
    const env = Math.abs(Math.sin(phys().k * frac * state.L));
    if (env < 0.08) return tr.kindN;
    if (env > 0.92) return tr.kindA;
    return tr.kindM;
  }

  function updateProbeRead() {
    const tr = t();
    const sample = yOf(state.probe);
    const u = view.amp ? sample.net / view.amp : 0;
    const xM = state.probe * state.L;
    const kind = probeKind(state.probe);
    let line = tr.probeAt + ' x = ' + xM.toFixed(2) + ' m · y/(2A) = ' + u.toFixed(2);
    if (kind) line += ' · ' + kind;
    if (state.mode === 'continuous') line += ' · cos(ωt) = ' + Math.cos(omega() * state.time).toFixed(2);
    els.probeRead.textContent = line;
  }

  function sampleHist(nowT, u) {
    const last = hist.length ? hist[hist.length - 1].t : -1;
    if (nowT - last >= 0.02) hist.push({ t: nowT, u: u });
    const cutoff = nowT - 2.6;
    while (hist.length && hist[0].t < cutoff) hist.shift();
  }

  function buildNButtons() {
    els.nBtns.innerHTML = '';
    for (let n = 1; n <= 6; n++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.n = String(n);
      b.textContent = String(n);
      b.addEventListener('click', function () {
        if (state.mode === 'pulse') return;
        state.n = n;
        if (!state.probeUser) state.probe = firstAntinode();
        clearHist();
        updateControls();
      });
      els.nBtns.appendChild(b);
    }
  }

  function bind() {
    document.querySelectorAll('input[name="mode"]').forEach(function (r) {
      r.addEventListener('change', function () {
        state.mode = r.value;
        state.time = 0;
        state.pulseT = 0;
        state.pulseActive = false;
        state.pulseDone = false;
        state.isPlaying = state.mode === 'continuous';
        clearHist();
        updateControls();
      });
    });
    document.querySelectorAll('input[name="end"]').forEach(function (r) {
      r.addEventListener('change', function () {
        state.end = r.value;
        state.pulseT = 0;
        state.pulseActive = false;
        state.pulseDone = false;
        if (state.mode === 'pulse') state.isPlaying = false;
        if (!state.probeUser) state.probe = firstAntinode();
        clearHist();
        updateControls();
      });
    });
    els.sliderL.addEventListener('input', function () {
      state.L = parseFloat(els.sliderL.value);
      if (!state.probeUser) state.probe = firstAntinode();
      clearHist();
      updateControls();
    });
    els.sliderV.addEventListener('input', function () {
      state.v = parseFloat(els.sliderV.value);
      clearHist();
      updateControls();
    });
    document.getElementById('chk-inc').addEventListener('change', function (e) { state.showInc = e.target.checked; });
    document.getElementById('chk-ref').addEventListener('change', function (e) { state.showRef = e.target.checked; });
    document.getElementById('chk-res').addEventListener('change', function (e) { state.showRes = e.target.checked; });
    document.getElementById('chk-env').addEventListener('change', function (e) { state.showEnv = e.target.checked; });
    document.getElementById('chk-beads').addEventListener('change', function (e) { state.showBeads = e.target.checked; });
    els.btnPlay.addEventListener('click', function () {
      if (state.mode === 'continuous') state.isPlaying = !state.isPlaying;
      else if (state.pulseActive) state.isPlaying = !state.isPlaying;
      else {
        state.pulseT = 0;
        state.pulseActive = true;
        state.pulseDone = false;
        state.isPlaying = true;
        clearHist();
      }
      updateControls();
    });
    els.btnStep.addEventListener('click', stepOnce);
    els.btnReset.addEventListener('click', function () {
      state.time = 0;
      state.pulseT = 0;
      state.pulseActive = false;
      state.pulseDone = false;
      state.isPlaying = false;
      state.probeUser = false;
      state.probe = firstAntinode();
      clearHist();
      updateControls();
    });
    els.canvas.addEventListener('click', function (e) {
      const rect = els.canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const frac = (x - view.x0) / view.len;
      if (frac < -0.02 || frac > 1.02) return;
      state.probe = Math.min(1, Math.max(0, frac));
      state.probeUser = true;
      clearHist();
      updateProbeRead();
    });
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(function () { resize(); });
      ro.observe(document.getElementById('stage'));
      ro.observe(els.probe);
    }
  }

  function stepOnce() {
    if (state.mode === 'continuous') {
      state.isPlaying = false;
      state.time += 1 / (8 * visualF(phys().f));
    } else {
      if (!state.pulseActive) {
        state.pulseT = 0;
        state.pulseActive = true;
        state.pulseDone = false;
      }
      state.isPlaying = false;
      const vPx = (state.v / PULSE_SLOW) / state.L * (view.len || 400);
      state.pulseT += (view.len || 400) / vPx / 14;
      finishPulseIfNeeded();
    }
    updateControls();
  }

  function finishPulseIfNeeded() {
    if (!state.pulseActive || !view.len) return;
    const sigma = view.len / 16;
    const vPx = (state.v / PULSE_SLOW) / state.L * view.len;
    if (vPx * state.pulseT > 2 * view.len + 3.2 * sigma) {
      state.pulseActive = false;
      state.isPlaying = false;
      state.pulseDone = true;
      updateControls();
    }
  }

  function updatePhysics(dt) {
    if (!state.isPlaying) return;
    if (state.mode === 'continuous') state.time += dt;
    else if (state.pulseActive) {
      state.pulseT += dt;
      finishPulseIfNeeded();
    }
  }

  function strokeCurve(color, width, dash, sampler, anchorSource) {
    ctx.save();
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.setLineDash(dash);
    const steps = Math.max(80, Math.round(view.len / 2));
    let i0 = 0;
    if (anchorSource) {
      ctx.moveTo(view.x0, view.cy - sourceY());
      i0 = Math.max(1, Math.round(sourceAnchorFrac() * steps));
    }
    for (let i = i0; i <= steps; i++) {
      const frac = i / steps;
      const y = sampler(frac);
      const px = sToX(frac);
      const py = view.cy - y;
      if (!anchorSource && i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawEnvelope() {
    const steps = Math.max(80, Math.round(view.len / 2));
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const frac = i / steps;
      const e = view.amp * Math.abs(Math.sin(phys().k * frac * state.L));
      const px = sToX(frac);
      if (i === 0) ctx.moveTo(px, view.cy - e);
      else ctx.lineTo(px, view.cy - e);
    }
    for (let i = steps; i >= 0; i--) {
      const frac = i / steps;
      const e = view.amp * Math.abs(Math.sin(phys().k * frac * state.L));
      ctx.lineTo(sToX(frac), view.cy + e);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(124, 58, 237, 0.07)';
    ctx.fill();
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = 'rgba(109, 40, 217, 0.55)';
    ctx.lineWidth = 1.25;
    ctx.stroke();
    ctx.restore();
  }

  function drawBracket(x0, x1, y, label) {
    if (x1 - x0 < 18) return;
    ctx.save();
    ctx.strokeStyle = '#64748b';
    ctx.fillStyle = '#475569';
    ctx.lineWidth = 1.25;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x0, y - 4);
    ctx.lineTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.lineTo(x1, y - 4);
    ctx.stroke();
    ctx.font = '11px "JetBrains Mono", ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, (x0 + x1) / 2, y + 13);
    ctx.restore();
  }

  function drawVibrator() {
    const dy = sourceY();
    const x = view.x0;
    const y = view.cy - dy;
    ctx.save();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 34, view.cy);
    ctx.lineTo(x - 34, y);
    ctx.stroke();
    ctx.fillStyle = '#475569';
    ctx.fillRect(x - 34, y - 16, 30, 32);
    ctx.fillStyle = '#334155';
    ctx.fillRect(x - 34, y + 16, 30, 5);
    if (state.mode === 'continuous' || (state.mode === 'pulse' && state.pulseActive)) {
      ctx.save();
      ctx.translate(x - 19, y);
      ctx.rotate(state.mode === 'continuous' ? state.time * omega() : state.pulseT * (state.v / PULSE_SLOW) / state.L * 3);
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#94a3b8';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(5, 0, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#0f172a';
    ctx.fill();
    ctx.restore();
  }

  function drawWall() {
    const x = view.x0 + view.len;
    const y = view.cy - view.amp - 16;
    const w = 18;
    const h = (view.amp + 16) * 2;
    ctx.save();
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 8; i < h; i += 8) {
      ctx.moveTo(x, y + i);
      ctx.lineTo(x + w, y + i);
    }
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, view.cy, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = '#334155';
    ctx.fill();
    ctx.restore();
  }

  function drawFreeEnd(yRing) {
    const x = view.x0 + view.len;
    ctx.save();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, view.cy - view.amp - 18);
    ctx.lineTo(x, view.cy + view.amp + 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, yRing, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0f172a';
    ctx.stroke();
    ctx.restore();
  }

  function drawLabels() {
    const tr = t();
    ctx.save();
    ctx.font = '12px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.textAlign = 'center';
    ctx.fillText(tr.vibrator, view.x0 - 8, 16);
    ctx.fillText(state.end === 'fixed' ? tr.fixedEnd : tr.freeEnd, view.x0 + view.len, 16);
    ctx.restore();
  }

  function drawNodes() {
    if (state.mode !== 'continuous') return;
    const tr = t();
    const p = phys();
    const nodes = [];
    const antis = [];
    const limit = state.end === 'fixed' ? state.n : state.n - 1;
    for (let m = 0; m <= limit; m++) nodes.push((m * Math.PI) / p.k / state.L);
    for (let m = 0; m < state.n; m++) antis.push(((m + 0.5) * Math.PI) / p.k / state.L);
    ctx.save();
    ctx.fillStyle = '#334155';
    nodes.forEach(function (frac, i) {
      if (frac < -0.001 || frac > 1.001) return;
      const x = sToX(Math.min(1, Math.max(0, frac)));
      ctx.beginPath();
      ctx.arc(x, view.cy, 4, 0, Math.PI * 2);
      ctx.fill();
      const nodeGap = nodes.length > 1 ? Math.abs(sToX(nodes[1]) - sToX(nodes[0])) : 999;
      if (nodeGap > 34 && i > 0 && frac < 0.98) {
        ctx.font = '10px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(tr.node, x, view.cy + 16);
      }
    });
    ctx.fillStyle = '#6d28d9';
    const gap = antis.length > 1 ? sToX(antis[1]) - sToX(antis[0]) : view.len;
    antis.forEach(function (frac) {
      if (frac < 0 || frac > 1.001) return;
      const x = sToX(Math.min(1, frac));
      if (gap < 36 && frac < 0.98) return;
      ctx.font = '10px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center';
      const e = view.amp * Math.abs(Math.sin(p.k * Math.min(1, frac) * state.L));
      if (frac > 0.98) return;
      let labelY = view.cy - e - 8;
      if (labelY < 20) labelY = Math.min(view.cy - 12, view.cy - e + 16);
      ctx.fillText(tr.anti, x, labelY);
    });
    ctx.restore();
    const bracketY = Math.min(view.h - 12, view.cy + view.amp + 22);
    if (state.end === 'fixed' && nodes.length >= 2) {
      drawBracket(sToX(nodes[0]), sToX(Math.min(1, nodes[1])), bracketY, 'λ/2');
    } else if (antis.length) {
      drawBracket(sToX(0), sToX(Math.min(1, antis[0])), bracketY, 'λ/4');
    }
  }

  function drawBeads() {
    const count = 18;
    for (let i = 1; i < count; i++) {
      const frac = i / count;
      const y = yOf(frac).net;
      const env = state.mode === 'continuous' ? Math.abs(Math.sin(phys().k * frac * state.L)) : 0.5;
      ctx.beginPath();
      ctx.arc(sToX(frac), view.cy - y, 3.3, 0, Math.PI * 2);
      ctx.fillStyle = env < 0.12 ? '#94a3b8' : '#5b21b6';
      ctx.fill();
    }
  }

  function drawProbe() {
    const y = yOf(state.probe).net;
    const x = sToX(state.probe);
    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(217, 119, 6, 0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, 22);
    ctx.lineTo(x, view.h - 30);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(x, view.cy - y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#f59e0b';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
    ctx.restore();
  }

  function callout(text, x, y, color) {
    ctx.save();
    ctx.font = '700 12px "Noto Sans TC", sans-serif';
    const w = ctx.measureText(text).width + 14;
    const left = Math.min(view.w - w - 8, Math.max(8, x - w / 2));
    ctx.fillStyle = 'rgba(255,255,255,0.94)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.25;
    ctx.fillRect(left, y - 14, w, 20);
    ctx.strokeRect(left, y - 14, w, 20);
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.fillText(text, left + 7, y);
    ctx.restore();
  }

  function drawPulseCallout() {
    if (!state.pulseActive) return;
    const prof = pulseProfile(1);
    const d = prof.d;
    if (d < view.len - 70 || d > view.len + view.len * 0.45) return;
    const peakFrac = (2 * view.len - d) / view.len;
    if (peakFrac <= 0.02 || peakFrac >= 0.98) return;
    const y = pulseProfile(peakFrac).ref;
    const tr = t();
    const up = y >= 0;
    callout(state.end === 'fixed' ? tr.inv : tr.same, sToX(peakFrac), view.cy - y + (up ? -22 : 28), '#e11d48');
  }

  function draw() {
    if (!view.w) return;
    ctx.clearRect(0, 0, view.w, view.h);
    ctx.save();
    ctx.strokeStyle = 'rgba(15, 23, 42, 0.12)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(view.x0, view.cy);
    ctx.lineTo(view.x0 + view.len, view.cy);
    ctx.stroke();
    ctx.restore();

    if (state.mode === 'continuous' && state.showEnv) drawEnvelope();

    const pulseIdle = state.mode === 'pulse' && !state.pulseActive;
    if (!pulseIdle && state.showInc) {
      strokeCurve('#2563eb', 1.75, [7, 5], function (f) { return yOf(f).inc; });
    }
    if (!pulseIdle && state.showRef) {
      strokeCurve('#e11d48', 1.75, [7, 5], function (f) { return yOf(f).ref; });
    }
    if (!pulseIdle && state.showRes) {
      strokeCurve('#6d28d9', 3.2, [], function (f) { return yOf(f).net; }, true);
    }
    if (state.showBeads) drawBeads();
    drawProbe();
    if (state.mode === 'continuous') drawNodes();
    drawVibrator();
    if (state.end === 'fixed') drawWall();
    else drawFreeEnd(view.cy - yOf(1).net);
    drawLabels();
    if (state.mode === 'pulse') drawPulseCallout();
  }

  function drawChart() {
    const w = els.probe._w;
    const h = els.probe._h;
    if (!w || !h) return;
    pctx.clearRect(0, 0, w, h);
    const left = 28;
    const right = 8;
    const top = 8;
    const bot = 8;
    const mid = (top + h - bot) / 2;
    const half = (h - bot - top) / 2 * 0.86;
    pctx.strokeStyle = '#e2e8f0';
    pctx.lineWidth = 1;
    pctx.beginPath();
    pctx.moveTo(left, mid);
    pctx.lineTo(w - right, mid);
    pctx.stroke();
    if (state.mode === 'continuous') {
      const env = Math.abs(Math.sin(phys().k * state.probe * state.L));
      pctx.setLineDash([3, 3]);
      pctx.strokeStyle = 'rgba(109, 40, 217, 0.45)';
      pctx.beginPath();
      pctx.moveTo(left, mid - env * half);
      pctx.lineTo(w - right, mid - env * half);
      pctx.moveTo(left, mid + env * half);
      pctx.lineTo(w - right, mid + env * half);
      pctx.stroke();
      pctx.setLineDash([]);
    }
    pctx.fillStyle = '#94a3b8';
    pctx.font = '10px "JetBrains Mono", ui-monospace, monospace';
    pctx.textAlign = 'right';
    pctx.fillText('1', left - 4, top + 8);
    pctx.fillText('0', left - 4, mid + 3);
    pctx.textAlign = 'left';
    pctx.fillText(t().chartY, left, h - 2);
    if (hist.length < 2) {
      pctx.textAlign = 'center';
      pctx.fillStyle = '#94a3b8';
      pctx.font = '12px "Noto Sans TC", sans-serif';
      pctx.fillText(t().chartEmpty, (left + w) / 2, mid);
      return;
    }
    const t0 = hist[0].t;
    const t1 = hist[hist.length - 1].t;
    const span = Math.max(2.6, t1 - t0);
    pctx.beginPath();
    pctx.strokeStyle = '#d97706';
    pctx.lineWidth = 2;
    pctx.lineJoin = 'round';
    hist.forEach(function (pt, i) {
      const x = left + ((pt.t - (t1 - span)) / span) * (w - left - right);
      const y = mid - Math.max(-1.25, Math.min(1.25, pt.u)) * half;
      if (i === 0) pctx.moveTo(x, y);
      else pctx.lineTo(x, y);
    });
    pctx.stroke();
  }

  function loop(now) {
    if (!lastTs) lastTs = now;
    const dt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;
    if (!els.canvas._w) resize();
    layout();
    updatePhysics(dt);
    const clock = state.mode === 'continuous' ? state.time : state.pulseT;
    const uNow = view.amp ? yOf(state.probe).net / view.amp : 0;
    if (state.mode === 'continuous' || state.pulseActive) sampleHist(clock, uNow);
    draw();
    drawChart();
    tickLive();
    updateProbeRead();
    requestAnimationFrame(loop);
  }

  window.setLanguage = function (lang) {
    state.lang = lang === 'en' ? 'en' : 'zh';
    window.currentLang = state.lang;
    updateControls();
  };

  buildNButtons();
  bind();
  resize();
  updateControls();
  window.currentLang = 'zh';
  requestAnimationFrame(loop);
})();
</script>

      s5: '5. 改繩長或波速，讀 λ 與 f＝v/λ。再轉到單一脈衝，比較固定端（脈衝顛倒）和自由端（不顛倒）。'

      const key = el.getAttribute('data-i18n');
      if (pack[key] == null) return;
      const val = pack[key];
      if (/<[a-z][\s\S]*>/i.test(val)) el.innerHTML = val;
      else el.textContent = val;
    });
    if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
      MathJax.startup.promise.then(function () {
        MathJax.typesetPromise().catch(function () {});

      window.addEventListener('load', function () {
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().catch(function () {});
      }, { once: true });

  }

  function platformToggleLang() {
    const next = getLang() === 'zh' ? 'en' : 'zh';

    else window.currentLang = next;
    applyPlatformI18n();

  function openModal(id) {
    const mp = document.getElementById(id);

    mp.classList.remove('opacity-0', 'pointer-events-none');
    mc.classList.remove('scale-95', 'opacity-0');
    mc.classList.add('scale-100', 'opacity-100');
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([mp]).catch(function () {});
  }
  function closeModal(id) {
    const mp = document.getElementById(id);
    const mc = mp && mp.querySelector('.modal-content');
    if (!mp || !mc) return;
    mc.classList.remove('scale-100', 'opacity-100');
    mc.classList.add('scale-95', 'opacity-0');
    mp.classList.add('opacity-0', 'pointer-events-none');
  }

    if (bl) bl.onclick = platformToggleLang;
    if (bm) bm.onclick = platformToggleLang;
    ['modal-close', 'modal-confirm'].forEach(function (id) {
      const b = document.getElementById(id);
      if (b) b.onclick = function () { closeModal('modal-principle'); };
    });
    ['steps-close', 'steps-confirm'].forEach(function (id) {
      const b = document.getElementById(id);
      if (b) b.onclick = function () { closeModal('modal-steps'); };
    });
    const mp = document.getElementById('modal-principle');
    const ms = document.getElementById('modal-steps');
    if (mp) mp.addEventListener('click', function (e) { if (e.target === mp) closeModal('modal-principle'); });
    if (ms) ms.addEventListener('click', function (e) { if (e.target === ms) closeModal('modal-steps'); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeModal('modal-principle'); closeModal('modal-steps'); }
    });
    applyPlatformI18n();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindPlatformUI);
  else bindPlatformUI();
})();
