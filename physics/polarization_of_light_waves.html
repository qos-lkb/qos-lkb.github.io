/* 舊畫布：位圖跟 devicePixelRatio，canvas.width 仍是 CSS 像素。 */
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr <= 1) return;
  var orig = HTMLCanvasElement.prototype.getContext;
  var descW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
  var descH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    var ctx = orig.call(this, type, attrs);
    if (type !== '2d' || !ctx || this.__cssCanvas) return ctx;
    this.__cssCanvas = true;
    var canvas = this;
    var cssW = descW.get.call(canvas);
    var cssH = descH.get.call(canvas);
    var lock = false;
    var cssBox = /\b(?:w|h)-full\b|\b(?:w|h)-screen\b|\binset-0\b/.test(canvas.className || '') || !!(canvas.style && (canvas.style.width || canvas.style.height));
    function apply() {
      if (lock) return;
      lock = true;
      descW.set.call(canvas, Math.max(1, Math.round(cssW * dpr)));
      descH.set.call(canvas, Math.max(1, Math.round(cssH * dpr)));
      if (!cssBox) {
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lock = false;
    }
    Object.defineProperty(canvas, 'width', {
      configurable: true,
      get: function () { return cssW; },
      set: function (v) { cssW = Number(v) || 0; apply(); }
    });
    Object.defineProperty(canvas, 'height', {
      configurable: true,
      get: function () { return cssH; },
      set: function (v) { cssH = Number(v) || 0; apply(); }
    });
    if (cssW && cssH) apply();
    return ctx;
  };
})();
</script>

                principleBody: `
                    <div>
                        <h3 class="text-sky-300 font-bold text-lg mb-2">Concept</h3>
                        <p>Visible light is a <strong>transverse wave</strong>: the electric field oscillates perpendicular to the travel direction. Everyday sources are mostly <strong>unpolarized</strong> (mixed vibration directions). A <strong>polarizer</strong> passes only the component along its <strong>transmission axis</strong>, making <strong>linearly polarized</strong> light. A second polarizer (the analyzer) filters again; the transmitted intensity depends on the angle between the axes—<strong>Malus's law</strong>.</p>
                    </div>
                    <div>
                        <h3 class="text-sky-300 font-bold text-lg mb-2">Mechanism</h3>

                            <li><strong>Crossed</strong> ($\\Delta\\theta=90°$): $I=0$ (black overlap).</li>

        function typeset(nodes) {
            if (window.MathJax && window.MathJax.typesetPromise) {
                return window.MathJax.typesetPromise(nodes).catch(function (err) {
                    console.log(err.message);
                });
            }
            return Promise.resolve();
        }

        function init() {
            generateBackground();
            updateUI();
            updatePhysics();

            sliderP1.addEventListener('input', function (e) {
                state.theta1 = parseInt(e.target.value, 10);
                updatePhysics();
            });
            sliderP2.addEventListener('input', function (e) {
                state.theta2 = parseInt(e.target.value, 10);
                updatePhysics();
            });

            setupDragEvents();
            setupTeachingUI();
        }

        function getPointerPos(canvasEl, evt) {
            const rect = canvasEl.getBoundingClientRect();
            let clientX, clientY;
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            } else {
                clientX = evt.clientX;
                clientY = evt.clientY;
            }
            return {
                x: (clientX - rect.left) * (canvasEl.width / rect.width),
                y: (clientY - rect.top) * (canvasEl.height / rect.height)
            };
        }

        function setupDragEvents() {
            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('touchstart', function (e) { e.preventDefault(); handlePointerDown(e); }, { passive: false });
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('touchmove', function (e) { e.preventDefault(); handlePointerMove(e); }, { passive: false });
            canvas.addEventListener('mouseup', handlePointerUp);
            canvas.addEventListener('touchend', handlePointerUp);
            canvas.addEventListener('mouseleave', handlePointerUp);
            canvas.addEventListener('touchcancel', handlePointerUp);
        }

        function handlePointerDown(e) {
            const pos = getPointerPos(canvas, e);
            const d1 = Math.hypot(pos.x - state.p1.x, pos.y - state.p1.y);
            const d2 = Math.hypot(pos.x - state.p2.x, pos.y - state.p2.y);

            if (d2 <= state.R && d1 <= state.R) {
                if (d2 < d1) startDrag(2, pos, state.p2);
                else startDrag(1, pos, state.p1);
            } else if (d2 <= state.R) {
                startDrag(2, pos, state.p2);
            } else if (d1 <= state.R) {
                startDrag(1, pos, state.p1);
            }
        }

        function startDrag(id, pos, p) {
            state.dragging = id;
            state.dragOffset.x = pos.x - p.x;
            state.dragOffset.y = pos.y - p.y;
            canvas.style.cursor = 'grabbing';
        }

        function handlePointerMove(e) {
            if (state.dragging === 0) {
                const pos = getPointerPos(canvas, e);
                const d1 = Math.hypot(pos.x - state.p1.x, pos.y - state.p1.y);
                const d2 = Math.hypot(pos.x - state.p2.x, pos.y - state.p2.y);
                canvas.style.cursor = (d1 <= state.R || d2 <= state.R) ? 'grab' : 'default';
                return;
            }

            const pos = getPointerPos(canvas, e);
            if (state.dragging === 1) {
                state.p1.x = pos.x - state.dragOffset.x;
                state.p1.y = pos.y - state.dragOffset.y;
            } else if (state.dragging === 2) {
                state.p2.x = pos.x - state.dragOffset.x;
                state.p2.y = pos.y - state.dragOffset.y;
            }
            renderCanvas();
        }

        function handlePointerUp() {
            if (state.dragging !== 0) {
                state.dragging = 0;
                canvas.style.cursor = 'grab';
            }
        }

        function generateBackground() {
            const w = bgCanvas.width;
            const h = bgCanvas.height;

            let grad = bgCtx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#1e3a8a");
            grad.addColorStop(1, "#38bdf8");
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, w, h);

            bgCtx.fillStyle = "#fde047";
            bgCtx.beginPath();
            bgCtx.arc(w * 0.7, h * 0.35, 60, 0, Math.PI * 2);
            bgCtx.fill();
            bgCtx.shadowColor = "#fef08a";
            bgCtx.shadowBlur = 30;
            bgCtx.fill();
            bgCtx.shadowBlur = 0;

            bgCtx.fillStyle = "#065f46";
            bgCtx.beginPath();
            bgCtx.moveTo(-50, h);
            bgCtx.lineTo(w * 0.3, h * 0.4);
            bgCtx.lineTo(w * 0.7, h);
            bgCtx.fill();

            bgCtx.fillStyle = "#047857";
            bgCtx.beginPath();
            bgCtx.moveTo(w * 0.2, h);
            bgCtx.lineTo(w * 0.7, h * 0.5);
            bgCtx.lineTo(w + 50, h);
            bgCtx.fill();

            bgCtx.fillStyle = "rgba(255, 255, 255, 0.9)";
            bgCtx.font = "bold 40px 'Segoe UI', sans-serif";
            bgCtx.textAlign = "center";
            bgCtx.fillText("OPTICAL TEST PATTERN", w / 2, h * 0.85);
            bgCtx.font = "20px 'Segoe UI', sans-serif";
            bgCtx.fillText("Malus's Law Experiment", w / 2, h * 0.92);
        }

        function updatePhysics() {
            valP1.innerText = state.theta1 + "°";
            valP2.innerText = state.theta2 + "°";

            let deltaTheta = Math.abs(state.theta1 - state.theta2) % 180;
            if (deltaTheta > 90) deltaTheta = 180 - deltaTheta;

            valDiff.innerText = deltaTheta + "°";

            const rad = (state.theta1 - state.theta2) * Math.PI / 180;
            const intensity = Math.pow(Math.cos(rad), 2);
            const intensityPercent = (intensity * 100).toFixed(1);

            valIntensity.innerText = intensityPercent + "%";
            intensityBar.style.width = intensityPercent + "%";

            if (intensity < 0.2) intensityBar.className = "h-full bg-red-500 transition-all duration-300";
            else if (intensity < 0.6) intensityBar.className = "h-full bg-yellow-400 transition-all duration-300";
            else intensityBar.className = "h-full bg-emerald-400 transition-all duration-300";

            renderCanvas();
        }

        function renderCanvas() {
            const w = canvas.width;
            const h = canvas.height;
            const cx1 = state.p1.x;
            const cy1 = state.p1.y;
            const cx2 = state.p2.x;
            const cy2 = state.p2.y;
            const R = state.R;

            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(bgCanvas, 0, 0, w, h);

            const baseAlpha = 0.5;
            ctx.fillStyle = "rgba(0, 0, 10, " + baseAlpha + ")";
            ctx.beginPath();
            ctx.arc(cx1, cy1, R, 0, Math.PI * 2);
            ctx.arc(cx2, cy2, R, 0, Math.PI * 2);
            ctx.fill('nonzero');

            const rad = (state.theta1 - state.theta2) * Math.PI / 180;
            const extraAlpha = Math.pow(Math.sin(rad), 2);

            ctx.save();
            ctx.beginPath();
            ctx.arc(cx1, cy1, R, 0, Math.PI * 2);
            ctx.clip();
            ctx.beginPath();
            ctx.arc(cx2, cy2, R, 0, Math.PI * 2);
            ctx.clip();
            ctx.fillStyle = "rgba(0, 0, 10, " + extraAlpha + ")";
            ctx.fillRect(0, 0, w, h);
            ctx.restore();

            drawPolarizer(cx1, cy1, R, state.theta1, '#38bdf8');
            drawPolarizer(cx2, cy2, R, state.theta2, '#f472b6');
        }

        function drawPolarizer(cx, cy, R, angle, color) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle * Math.PI / 180);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            const step = 25;
            for (let y = -R + 10; y < R; y += step) {
                const x = Math.sqrt(R * R - y * y);
                ctx.beginPath();
                ctx.moveTo(-x, y);
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-R, 0);
            ctx.lineTo(R, 0);
            ctx.stroke();

            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, R, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function resetSimulation() {
            state.theta1 = 0;
            state.theta2 = 90;
            state.p1 = { x: 320, y: 250 };
            state.p2 = { x: 480, y: 250 };
            state.dragging = 0;
            sliderP1.value = '0';
            sliderP2.value = '90';
            updatePhysics();
        }

        function toggleLanguage() {
            state.lang = state.lang === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        function renderSteps() {
            const d = dict[state.lang];
            const body = document.getElementById('steps-body');
            body.innerHTML = d.stepsBody.map(function (text, i) {
                return '<div class="step-card"><div class="text-indigo-300 font-bold mb-1">' + (i + 1) + '</div><div>' + text + '</div></div>';
            }).join('');
            typeset([body]);
        }

        function renderPrinciple() {
            const d = dict[state.lang];
            const body = document.getElementById('principle-body');
            body.innerHTML = d.principleBody;
            typeset([body]);
        }

        function renderQuiz() {
            const d = dict[state.lang];
            const lang = state.lang;
            const body = document.getElementById('quiz-body');
            if (!body) return;
            const ref = lang === 'zh' ? '參考答案' : 'Reference answer';
            const shortNote = lang === 'zh' ? '先預測，再操作本模擬核對。' : 'Predict first, then verify on the sim.';
            body.innerHTML = QUIZ.map(function (q, qi) {
                const n = qi + 1;
                const name = 'q' + n;
                let opts = '';
                if (q.type === 'mc') {
                    opts = '<div class="grid gap-1.5 mt-1">' + q.options[lang].map(function (text, oi) {
                        const L = String.fromCharCode(65 + oi);
                        return '<label class="flex items-start gap-2 rounded-lg border border-slate-600 p-2 cursor-pointer"><input type="radio" name="' + name + '" class="mt-0.5"><span>' + L + '. ' + text + '</span></label>';
                    }).join('') + '</div>';
                } else {
                    opts = '<p class="text-xs text-slate-400 mb-1">' + shortNote + '</p>';
                }
                const ans = quizAnswersVisible ? '<div class="mt-2 text-xs text-emerald-300 bg-emerald-950/40 border border-emerald-800/40 rounded-lg p-2"><strong>' + ref + '：</strong> ' + q.answer[lang] + '</div>' : '';
                return '<div class="quiz-item mb-4"><p class="q-stem font-semibold mb-2"><span class="text-violet-300">Q' + n + '.</span> ' + q.stem[lang] + '</p>' + opts + ans + '</div>';
            }).join('');
            const globalAnsBtn = document.getElementById('btn-quiz-answers');
            if (globalAnsBtn) globalAnsBtn.textContent = quizAnswersVisible ? d.hideAnswer : d.showAnswer;
            typeset([body]);
        }

        function closeAllModals(exceptId) {
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
                if (exceptId && id === exceptId) return;
                const modal = document.getElementById(id);
                if (modal) modal.classList.add('hidden');
            });
        }

        function openModal(id) {
            closeAllModals(id);
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('hidden');
            if (id === 'modal-steps') renderSteps();
            if (id === 'modal-principle') renderPrinciple();
            if (id === 'modal-quiz') renderQuiz();
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('hidden');
        }

        function updateUI() {
            const d = dict[state.lang];
            document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : 'en';

            document.getElementById('badge-subject').innerText = d.badge;
            document.getElementById('app-title').innerText = d.appTitle;
            document.getElementById('app-subtitle').innerText = d.appSubtitle;
            document.getElementById('btn-steps').innerText = d.btnSteps;
            document.getElementById('btn-principle').innerText = d.btnPrinciple;
            document.getElementById('btn-quiz').innerText = d.btnQuiz;
            document.getElementById('btn-reset').innerText = d.btnReset;

            document.getElementById('lbl-p1').innerText = d.lblP1;
            document.getElementById('lbl-p2').innerText = d.lblP2;
            document.getElementById('lbl-diff').innerText = d.lblDiff;
            document.getElementById('lbl-intensity').innerText = d.lblIntensity;

            document.getElementById('steps-title').innerText = d.stepsTitle;
            document.getElementById('principle-title').innerText = d.principleTitle;
            document.getElementById('quiz-title').innerText = d.quizTitle;
            document.querySelectorAll('.modal-close-label').forEach(function (el) {
                el.innerText = d.closeBtn;
            });
            if (document.getElementById('hint-text')) {
                document.getElementById('hint-text').innerText = d.dragHint;
            }

            document.title = state.lang === 'zh'
                ? '光波的偏振作用 / Polarization of Light'
                : 'Polarization of Light / 光波的偏振作用';

            if (!document.getElementById('modal-steps').classList.contains('hidden')) renderSteps();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) renderPrinciple();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) renderQuiz();
        }

        function setupTeachingUI() {
            document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
            document.getElementById('btn-reset').addEventListener('click', resetSimulation);
            document.getElementById('btn-steps').addEventListener('click', function () { openModal('modal-steps'); });
            document.getElementById('btn-principle').addEventListener('click', function () { openModal('modal-principle'); });
            document.getElementById('btn-quiz').addEventListener('click', function () { openModal('modal-quiz'); });
            document.getElementById('btn-quiz-answers').addEventListener('click', function () {
                quizAnswersVisible = !quizAnswersVisible;
                renderQuiz();
            });

            document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    closeModal(btn.getAttribute('data-close-modal'));
                });
            });

            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function (id) {
                const modal = document.getElementById(id);
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) closeModal(id);
                });
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeAllModals();
            });
        }

        init();
    </script>
