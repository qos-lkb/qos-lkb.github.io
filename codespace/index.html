<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Space — HTML 即時預覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
    <header class="border-b border-slate-800 px-4 py-3 shrink-0">
        <h1 class="text-lg font-semibold tracking-tight">Code Space</h1>
        <p class="text-sm text-slate-400 mt-0.5">在左方編輯 HTML，右方即時預覽</p>
    </header>

    <main class="flex-1 flex flex-col md:flex-row min-h-0 gap-0 md:gap-px bg-slate-800">
        <section class="flex flex-col flex-1 min-h-0 max-md:min-h-[42vh] bg-slate-950 p-4" aria-labelledby="editor-heading">
            <div class="flex items-center justify-between gap-2 mb-2 shrink-0">
                <h2 id="editor-heading" class="text-sm font-medium text-slate-300">HTML 原始碼</h2>
            </div>
            <label for="html-input" class="sr-only">HTML 原始碼輸入</label>
            <textarea id="html-input" spellcheck="false" rows="16"
                class="flex-1 w-full min-h-[12rem] resize-y rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 font-mono text-sm text-slate-100 placeholder:text-slate-500 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"></textarea>
        </section>

        <section class="flex flex-col flex-1 min-h-0 max-md:min-h-[50vh] bg-slate-950 p-4" aria-labelledby="preview-heading">
            <h2 id="preview-heading" class="text-sm font-medium text-slate-300 mb-2 shrink-0">預覽</h2>
            <div class="flex-1 min-h-0 rounded-lg border border-slate-700 overflow-hidden bg-white">
                <iframe id="preview-frame" title="HTML 預覽"
                    class="w-full h-full min-h-[18rem] md:min-h-0 block"
                    sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads"></iframe>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-800 px-4 py-3 text-xs text-slate-500 shrink-0">
        預覽區會執行你輸入的 HTML／腳本（在沙箱內）。請勿貼上來源不明的程式碼。
    </footer>

    <script>
        const DEFAULT_HTML = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>示範</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; }
    h1 { color: #0f766e; }
  </style>
</head>
<body>
  <h1>Code Space 示範</h1>
  <p>在左側修改這段 HTML，右側會即時更新。</p>
</body>
</html>`;

        const inputEl = document.getElementById('html-input');
        const frameEl = document.getElementById('preview-frame');

        inputEl.value = DEFAULT_HTML;
        frameEl.srcdoc = DEFAULT_HTML;

        let debounceTimer = null;
        const DEBOUNCE_MS = 150;

        function schedulePreview() {
            if (debounceTimer !== null) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                debounceTimer = null;
                frameEl.srcdoc = inputEl.value;
            }, DEBOUNCE_MS);
        }

        inputEl.addEventListener('input', schedulePreview);
    </script>
</body>
</html>
