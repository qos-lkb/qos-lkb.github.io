<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Space — HTML 即時預覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
    <header class="border-b border-slate-800 px-4 py-3 shrink-0">
        <h1 class="text-lg font-semibold tracking-tight">Code Space</h1>
        <p class="text-sm text-slate-400 mt-0.5">在左方分別編輯 HTML、CSS、JavaScript，右方即時預覽</p>
    </header>

    <main class="flex-1 flex flex-col md:flex-row min-h-0 gap-0 md:gap-px bg-slate-800">
        <section class="flex flex-col flex-1 min-h-0 max-md:min-h-[55vh] bg-slate-950 p-4 overflow-hidden" aria-labelledby="editor-heading">
            <h2 id="editor-heading" class="text-sm font-medium text-slate-300 mb-3 shrink-0">原始碼</h2>
            <div class="flex flex-col flex-1 min-h-0 gap-3 overflow-y-auto">
                <div class="flex flex-col min-h-[7rem] flex-1">
                    <label for="html-input" class="text-xs font-medium text-slate-400 mb-1">HTML</label>
                    <textarea id="html-input" spellcheck="false" rows="6"
                        class="flex-1 w-full min-h-[5rem] resize-y rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 font-mono text-sm text-slate-100 placeholder:text-slate-500 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"></textarea>
                </div>
                <div class="flex flex-col min-h-[7rem] flex-1">
                    <label for="css-input" class="text-xs font-medium text-slate-400 mb-1">CSS</label>
                    <textarea id="css-input" spellcheck="false" rows="6"
                        class="flex-1 w-full min-h-[5rem] resize-y rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 font-mono text-sm text-slate-100 placeholder:text-slate-500 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"></textarea>
                </div>
                <div class="flex flex-col min-h-[7rem] flex-1">
                    <label for="js-input" class="text-xs font-medium text-slate-400 mb-1">JavaScript</label>
                    <textarea id="js-input" spellcheck="false" rows="6"
                        class="flex-1 w-full min-h-[5rem] resize-y rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 font-mono text-sm text-slate-100 placeholder:text-slate-500 focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500"></textarea>
                </div>
            </div>
        </section>

        <section class="flex flex-col flex-1 min-h-0 max-md:min-h-[50vh] bg-slate-950 p-4" aria-labelledby="preview-heading">
            <h2 id="preview-heading" class="text-sm font-medium text-slate-300 mb-2 shrink-0">預覽</h2>
            <div class="flex-1 min-h-0 rounded-lg border border-slate-700 overflow-hidden bg-white">
                <iframe id="preview-frame" title="HTML 預覽"
                    class="w-full h-full min-h-[18rem] md:min-h-0 block"
                    sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads"></iframe>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-800 px-4 py-3 text-xs text-slate-500 shrink-0">
        預覽區會執行你輸入的 HTML／CSS／JavaScript（在沙箱內）。請勿貼上來源不明的程式碼。
    </footer>

    <script>
        const DEFAULT_HTML = `<h1>Code Space 示範</h1>
<p>在左側分別修改 HTML、CSS 與 JavaScript，右側會即時更新。</p>
<button type="button" id="demo-btn">按一下</button>`;

        const DEFAULT_CSS = `body {
  font-family: system-ui, sans-serif;
  padding: 1rem;
}
h1 {
  color: #0f766e;
}
#demo-btn {
  margin-top: 0.5rem;
  padding: 0.35rem 0.75rem;
  border: 1px solid #0f766e;
  border-radius: 0.375rem;
  background: #ecfdf5;
  color: #0f766e;
  cursor: pointer;
}`;

        const DEFAULT_JS = `document.getElementById('demo-btn')?.addEventListener('click', () => {
  alert('Hello from Code Space!');
});`;

        const htmlEl = document.getElementById('html-input');
        const cssEl = document.getElementById('css-input');
        const jsEl = document.getElementById('js-input');
        const frameEl = document.getElementById('preview-frame');

        htmlEl.value = DEFAULT_HTML;
        cssEl.value = DEFAULT_CSS;
        jsEl.value = DEFAULT_JS;

        let debounceTimer = null;
        const DEBOUNCE_MS = 150;

        function escapeStyleContent(css) {
            return css.replace(/<\/style/gi, '<\\/style');
        }

        function escapeScriptContent(js) {
            return js.replace(/<\/script/gi, '<\\/script');
        }

        function buildPreviewDoc() {
            const html = htmlEl.value;
            const css = escapeStyleContent(cssEl.value);
            const js = escapeScriptContent(jsEl.value);
            return `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預覽</title>
  <style>${css}</style>
</head>
<body>
${html}
<script>${js}<\/script>
</body>
</html>`;
        }

        function updatePreview() {
            frameEl.srcdoc = buildPreviewDoc();
        }

        function schedulePreview() {
            if (debounceTimer !== null) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                debounceTimer = null;
                updatePreview();
            }, DEBOUNCE_MS);
        }

        updatePreview();
        [htmlEl, cssEl, jsEl].forEach((el) => el.addEventListener('input', schedulePreview));
    </script>
</body>
</html>
