<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!-- 模擬標題 | Simulation Title --></title>
    <!--
      Science Sims — 新模擬骨架（Phase 6）
      檢查清單見 docs/sim_standards.md 與 rule.md。
      禁止依賴 app/ Vite bundler；本頁須可靜態開啟。
      CDN：沿用鄰近模擬版本；React 僅用 production.min.js（勿用 *.development.js）。
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 可選：MathJax / Chart.js / Three.js — 取消註解並對齊鄰近模擬版本
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    -->
    <style>
        /* 頁面專用樣式；共用樣式可放 assets/sim-common/（見該目錄 README） */
        body { font-family: system-ui, "Noto Sans TC", sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <header class="shrink-0 border-b border-slate-200 bg-white px-4 py-3">
        <h1 class="text-xl font-bold text-slate-900">模擬標題</h1>
        <p class="text-sm text-slate-500 mt-0.5">一句話說明學習目標。</p>
    </header>

    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4 min-h-0">
        <aside class="w-full md:w-72 shrink-0 space-y-4" aria-label="控制面板">
            <section class="bg-white rounded-lg border border-slate-200 p-4 shadow-sm">
                <h2 class="text-sm font-semibold text-slate-700 mb-3">控制</h2>
                <label class="block text-sm text-slate-600">
                    參數
                    <input type="range" id="param" min="0" max="100" value="50"
                           class="mt-1 w-full" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                </label>
                <div class="mt-3 flex gap-2">
                    <button type="button" id="btn-start"
                            class="flex-1 bg-indigo-600 text-white text-sm font-medium py-2 rounded-lg hover:bg-indigo-700">
                        開始
                    </button>
                    <button type="button" id="btn-reset"
                            class="flex-1 bg-slate-100 text-slate-700 text-sm font-medium py-2 rounded-lg hover:bg-slate-200">
                        重設
                    </button>
                </div>
            </section>
        </aside>

        <section class="flex-1 min-h-[240px] bg-white rounded-lg border border-slate-200 shadow-sm relative overflow-hidden"
                 aria-label="模擬畫布">
            <canvas id="sim-canvas" class="absolute inset-0 w-full h-full" role="img" aria-label="模擬視覺化"></canvas>
        </section>
    </main>

    <script>
    (function () {
        'use strict';

        const canvas = document.getElementById('sim-canvas');
        const param = document.getElementById('param');
        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');

        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.floor(rect.width);
            canvas.height = Math.floor(rect.height);
            draw();
        }

        function draw() {
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4338ca';
            ctx.font = '16px sans-serif';
            ctx.fillText('參數：' + param.value, 16, 32);
        }

        param.addEventListener('input', function () {
            param.setAttribute('aria-valuenow', param.value);
            draw();
        });
        btnStart.addEventListener('click', draw);
        btnReset.addEventListener('click', function () {
            param.value = '50';
            param.setAttribute('aria-valuenow', '50');
            draw();
        });
        window.addEventListener('resize', resize);
        resize();
    })();
    </script>
</body>
</html>
