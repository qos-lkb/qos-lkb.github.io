<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>細胞結構 Structure of Cell</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Noto Sans TC & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        .selected-part {
            filter: drop-shadow(0 0 8px rgba(234, 88, 12, 0.55));
        }
        .selected-part > path,
        .selected-part > circle,
        .selected-part > ellipse {
            stroke: #ea580c !important;
            stroke-width: 3.5px !important;
        }
        .hover-part { cursor: pointer; }
        .hover-part:hover { filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.35)); }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .label-hit { cursor: pointer; outline: none; }
        .label-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
        .label-hit:hover .label-bg,
        .label-hit:focus-visible .label-bg { fill: #ecfdf5; stroke: #059669; }
        .label-hit.is-selected .label-bg { fill: #059669; stroke: #065f46; }
        .label-text {
            font-size: 14px;
            font-weight: 700;
            fill: #1f2937;
            pointer-events: none;
        }
        .label-hit.is-selected .label-text { fill: #ffffff; }
        .leader-hit {
            fill: none;
            stroke: transparent;
            stroke-width: 18;
            pointer-events: stroke;
        }
        .leader-line {
            stroke: #475569;
            stroke-width: 1.8;
            fill: none;
            pointer-events: stroke;
        }
        .label-hit.is-selected .leader-line { stroke: #ea580c; stroke-width: 2.4; }
        .leader-dot {
            fill: #0f172a;
            stroke: #fff;
            stroke-width: 1.6;
            pointer-events: auto;
        }
        #view-plant.hidden, #view-animal.hidden { display: none !important; }
        .label-hit.is-selected .leader-dot { fill: #ea580c; }
        .speak-on { box-shadow: 0 0 0 2px rgba(255,255,255,0.35) inset; }
        /* Sidebar active state */
        .nav-active {
            background-color: white;
            color: black !important;
            border-right: 4px solid #059669; /* emerald-600 */
        }
        /* Table Styles */
        .compare-table th, .compare-table td {
            border: 1px solid #e5e7eb;
            padding: 12px;
            text-align: center;
        }
        .compare-table th {
            background-color: #f0fdf4; /* green-50 */
            color: #166534; /* green-800 */
            font-weight: bold;
        }
        .compare-table tr:nth-child(even) {
            background-color: #f9fafb; /* gray-50 */
        }
        .check-icon { color: #16a34a; font-weight: bold; }
        .cross-icon { color: #dc2626; font-weight: bold; }
        /* Custom Scrollbar for the floating card */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        .modal-animate { animation: fadeInScale 0.3s ease-out forwards; }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .teach-modal { z-index: 80; }
        .teach-modal.hidden { display: none !important; }
        .teach-modal:not(.hidden) { display: flex !important; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-3 sm:p-4 shadow-md flex-shrink-0 z-20">
        <div class="flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <span class="text-2xl shrink-0">🔬</span>
                <div class="min-w-0">
                    <h1 id="app-title" class="text-lg sm:text-xl md:text-2xl font-bold tracking-wide truncate">細胞結構 Structure of Cell</h1>
                    <span id="app-subtitle" class="text-xs sm:text-sm opacity-80">細胞結構｜Structure of a cell</span>
                </div>
                <span id="badge-subject" class="text-xs bg-white/20 border border-white/40 text-white px-2.5 py-1 rounded-full whitespace-nowrap shrink-0">科學｜Science</span>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button type="button" id="btn-steps" onclick="openTeachModal('modal-steps')" class="px-2.5 py-1.5 bg-emerald-800 hover:bg-emerald-900 text-white rounded-md text-xs sm:text-sm font-semibold border border-emerald-500 transition-colors">觀察步驟</button>
                <button type="button" id="btn-principle" onclick="openTeachModal('modal-principle')" class="px-2.5 py-1.5 bg-teal-600 hover:bg-teal-500 text-white rounded-md text-xs sm:text-sm font-semibold border border-teal-400 transition-colors">原理解說</button>
                <button type="button" id="btn-quiz" onclick="openTeachModal('modal-quiz')" class="px-2.5 py-1.5 bg-violet-600 hover:bg-violet-500 text-white rounded-md text-xs sm:text-sm font-semibold border border-violet-400 transition-colors">課堂問題</button>
                <div class="hidden sm:block h-6 w-px bg-white/30"></div>
                <button type="button" id="btn-compare" onclick="openModal()" class="flex items-center gap-1.5 bg-white text-emerald-700 px-2.5 py-1.5 rounded-md font-bold shadow hover:bg-emerald-50 transition text-xs sm:text-sm">
                    <span>📊</span>
                    <span id="btn-compare-text" class="hidden md:inline">比較圖表</span>
                </button>
                <button type="button" id="btn-speak" onclick="toggleSpeech()" class="speak-on bg-white/20 hover:bg-white/30 text-white px-2.5 py-1.5 rounded-md text-xs sm:text-sm font-bold border border-white/40 transition-colors" aria-pressed="true" title="開啟後點標示，以 Google UK English Female 朗讀英文名稱">
                    🔊 <span id="btn-speak-text">關閉朗讀</span>
                </button>
                <button type="button" id="btn-lang" onclick="toggleLanguage()" class="bg-white/20 hover:bg-white/30 text-white px-2.5 py-1.5 rounded-md text-xs sm:text-sm font-bold border border-white/40 transition-colors min-w-[72px]">
                    <span id="lang-btn-text">中 / EN</span>
                </button>
                <button type="button" id="btn-reset" onclick="resetAll()" class="px-2.5 py-1.5 bg-red-500 hover:bg-red-600 text-white rounded-md text-xs sm:text-sm font-semibold transition-colors">重置</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- Sidebar Navigation (Fixed Left) -->
        <nav class="w-24 md:w-32 bg-gray-800 flex flex-col items-center py-6 gap-4 shadow-lg z-20 flex-shrink-0 h-full">
            <button onclick="switchMode('plant')" id="btn-plant" class="nav-btn w-full py-4 flex flex-col items-center gap-2 text-gray-400 hover:text-white transition-colors nav-active">
                <span class="text-3xl">🌱</span>
                <span id="nav-plant-text" class="text-xs md:text-sm font-bold text-center">植物細胞</span>
            </button>
            <button onclick="switchMode('animal')" id="btn-animal" class="nav-btn w-full py-4 flex flex-col items-center gap-2 text-gray-400 hover:text-white transition-colors">
                <span class="text-3xl">🦁</span>
                <span id="nav-animal-text" class="text-xs md:text-sm font-bold text-center">動物細胞</span>
            </button>
        </nav>

        <!-- Content Area (Diagram + Floating Info) -->
        <main class="flex-1 relative bg-gray-50 overflow-hidden">
            
            <!-- 1. Interactive Diagram Container (Full Screen Layer) -->
            <div class="absolute inset-0 w-full h-full flex justify-center items-center p-4 overflow-hidden z-0">
                
                <div id="hint-bubble" class="absolute top-4 left-4 bg-yellow-100 text-yellow-800 text-sm px-3 py-1 rounded-lg shadow animate-pulse pointer-events-none z-10">
                    👆 點擊標示或構造：查看並朗讀
                </div>

                <!-- PLANT CELL VIEW -->
                <div id="view-plant" class="w-full h-full flex justify-center items-center transition-opacity duration-300">
                    <svg viewBox="0 0 980 540" class="w-full h-full max-w-6xl select-none" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="plant-svg-title">
                        <title id="plant-svg-title">植物細胞示意圖</title>
                        <defs>
                            <linearGradient id="plant-wall-grad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#86efac"/>
                                <stop offset="50%" stop-color="#4ade80"/>
                                <stop offset="100%" stop-color="#22c55e"/>
                            </linearGradient>
                            <radialGradient id="plant-cyto-grad" cx="42%" cy="40%" r="70%">
                                <stop offset="0%" stop-color="#f0fdf4"/>
                                <stop offset="70%" stop-color="#dcfce7"/>
                                <stop offset="100%" stop-color="#bbf7d0"/>
                            </radialGradient>
                            <radialGradient id="vacuole-grad" cx="45%" cy="40%" r="65%">
                                <stop offset="0%" stop-color="#e0f2fe"/>
                                <stop offset="100%" stop-color="#7dd3fc"/>
                            </radialGradient>
                            <radialGradient id="nucleus-grad" cx="40%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#f3e8ff"/>
                                <stop offset="100%" stop-color="#d8b4fe"/>
                            </radialGradient>
                            <radialGradient id="mito-grad" cx="40%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#fecaca"/>
                                <stop offset="100%" stop-color="#f87171"/>
                            </radialGradient>
                            <radialGradient id="chloro-grad" cx="40%" cy="35%" r="70%">
                                <stop offset="0%" stop-color="#4ade80"/>
                                <stop offset="100%" stop-color="#15803d"/>
                            </radialGradient>
                            <filter id="cell-shadow" x="-8%" y="-8%" width="116%" height="116%">
                                <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14532d" flood-opacity="0.18"/>
                            </filter>
                            <g id="mito-icon">
                                <ellipse cx="0" cy="0" rx="26" ry="13" fill="url(#mito-grad)" stroke="#b91c1c" stroke-width="2"/>
                                <path d="M-16 1 C-10 -7 -6 7 0 -4 C6 8 12 -6 17 1" fill="none" stroke="#991b1b" stroke-width="1.6"/>
                            </g>
                            <g id="chloro-icon">
                                <ellipse cx="0" cy="0" rx="30" ry="16" fill="url(#chloro-grad)" stroke="#14532d" stroke-width="2"/>
                                <rect x="-16" y="-7" width="12" height="3.2" rx="1" fill="#166534"/>
                                <rect x="-16" y="-2.5" width="12" height="3.2" rx="1" fill="#bbf7d0"/>
                                <rect x="-16" y="2" width="12" height="3.2" rx="1" fill="#166534"/>
                                <rect x="2" y="-5" width="12" height="3.2" rx="1" fill="#166534"/>
                                <rect x="2" y="-0.5" width="12" height="3.2" rx="1" fill="#bbf7d0"/>
                            </g>
                        </defs>

                        <!-- 1. Cell wall (outer cellulose rim) -->
                        <g id="plant-cell-wall" class="hover-part" onclick="selectPart('cell-wall')" filter="url(#cell-shadow)">
                            <path d="M248,96 Q248,42 312,42 H820 Q884,42 884,96 V444 Q884,498 820,498 H312 Q248,498 248,444 Z" fill="url(#plant-wall-grad)" stroke="#166534" stroke-width="3"/>
                        </g>
                        <!-- 2. Cell membrane (inside wall) + cytoplasm fill -->
                        <g id="plant-cell-membrane" class="hover-part" onclick="selectPart('cell-membrane')">
                            <path d="M268,108 Q268,62 318,62 H814 Q864,62 864,108 V432 Q864,478 814,478 H318 Q268,478 268,432 Z" fill="url(#plant-cyto-grad)" stroke="#f59e0b" stroke-width="3.2"/>
                        </g>
                        <!-- 7. Cytoplasm (inner clickable matrix; leader aims at bottom-left pocket) -->
                        <g id="plant-cytoplasm" class="hover-part" onclick="selectPart('cytoplasm')">
                            <path d="M274,112 Q274,66 322,66 H810 Q858,66 858,112 V428 Q858,474 810,474 H322 Q274,474 274,428 Z" fill="transparent"/>
                        </g>
                        <!-- 4. Large central vacuole -->
                        <g id="plant-vacuole" class="hover-part" onclick="selectPart('vacuole')">
                            <path d="M430,168 Q590,128 760,188 Q810,270 770,372 Q620,438 430,402 Q372,280 430,168 Z" fill="url(#vacuole-grad)" stroke="#0284c7" stroke-width="2.4" opacity="0.95"/>
                            <circle cx="560" cy="250" r="7" fill="#bae6fd" opacity="0.8"/>
                            <circle cx="640" cy="310" r="5" fill="#7dd3fc" opacity="0.7"/>
                            <circle cx="520" cy="340" r="4" fill="#e0f2fe" opacity="0.8"/>
                        </g>
                        <!-- 3. Nucleus (peripheral, pressed by vacuole) -->
                        <g id="plant-nucleus" class="hover-part" onclick="selectPart('nucleus')">
                            <circle cx="352" cy="188" r="46" fill="none" stroke="#7e22ce" stroke-width="5" opacity="0.35"/>
                            <circle cx="352" cy="188" r="42" fill="url(#nucleus-grad)" stroke="#7e22ce" stroke-width="2.5"/>
                            <circle cx="344" cy="182" r="11" fill="#7e22ce" opacity="0.55"/>
                            <circle cx="368" cy="198" r="3.5" fill="#a855f7" opacity="0.7"/>
                            <circle cx="336" cy="204" r="2.5" fill="#a855f7" opacity="0.6"/>
                        </g>
                        <!-- 5. Mitochondria in cytoplasm (not in vacuole) -->
                        <g id="plant-mitochondrion" class="hover-part" onclick="selectPart('mitochondrion')">
                            <use href="#mito-icon" transform="translate(312,338) rotate(78)"/>
                            <use href="#mito-icon" transform="translate(790,150) rotate(-28)"/>
                            <use href="#mito-icon" transform="translate(838,318) rotate(95)"/>
                            <use href="#mito-icon" transform="translate(500,452) rotate(8)"/>
                        </g>
                        <!-- 6. Chloroplasts along the periphery -->
                        <g id="plant-chloroplast" class="hover-part" onclick="selectPart('chloroplast')">
                            <use href="#chloro-icon" transform="translate(318,412) rotate(-18)"/>
                            <use href="#chloro-icon" transform="translate(330,92) rotate(12)"/>
                            <use href="#chloro-icon" transform="translate(820,96) rotate(-8)"/>
                            <use href="#chloro-icon" transform="translate(846,250) rotate(72)"/>
                            <use href="#chloro-icon" transform="translate(740,452) rotate(16)"/>
                        </g>

                        <!-- Clickable labels + leaders that terminate ON the organelle -->
                        <g id="label-hit-plant-cell-wall" class="label-hit" onclick="selectPart('cell-wall')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="56" width="168" height="30" rx="15"/>
                            <text id="label-plant-cell-wall" class="label-text" x="24" y="76">1. 細胞壁</text>
                            <path class="leader-line" d="M180,71 H230 L258,88"/>
                            <circle class="leader-dot" cx="258" cy="88" r="4.2"/>
                        </g>
                        <g id="label-hit-plant-cell-membrane" class="label-hit" onclick="selectPart('cell-membrane')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="108" width="168" height="30" rx="15"/>
                            <text id="label-plant-cell-membrane" class="label-text" x="24" y="128">2. 細胞膜</text>
                            <path class="leader-line" d="M180,123 H248 L268,123"/>
                            <circle class="leader-dot" cx="268" cy="123" r="4.2"/>
                        </g>
                        <g id="label-hit-plant-nucleus" class="label-hit" onclick="selectPart('nucleus')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="170" width="168" height="30" rx="15"/>
                            <text id="label-plant-nucleus" class="label-text" x="24" y="190">3. 細胞核</text>
                            <path class="leader-line" d="M180,185 H300 L312,188"/>
                            <circle class="leader-dot" cx="312" cy="188" r="4.2"/>
                        </g>
                        <g id="label-hit-plant-vacuole" class="label-hit" onclick="selectPart('vacuole')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="248" width="168" height="30" rx="15"/>
                            <text id="label-plant-vacuole" class="label-text" x="24" y="268">4. 液泡</text>
                            <path class="leader-line" d="M180,263 H390 L412,268"/>
                            <circle class="leader-dot" cx="412" cy="268" r="4.2"/>
                        </g>
                        <g id="label-hit-plant-mitochondrion" class="label-hit" onclick="selectPart('mitochondrion')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="322" width="168" height="30" rx="15"/>
                            <text id="label-plant-mitochondrion" class="label-text" x="24" y="342">5. 線粒體</text>
                            <path class="leader-line" d="M180,337 H286 L312,338"/>
                            <circle class="leader-dot" cx="312" cy="338" r="4.2"/>
                        </g>
                        <g id="label-hit-plant-chloroplast" class="label-hit" onclick="selectPart('chloroplast')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="394" width="168" height="30" rx="15"/>
                            <text id="label-plant-chloroplast" class="label-text" x="24" y="414">6. 葉綠體</text>
                            <path class="leader-line" d="M180,409 H286 L318,412"/>
                            <circle class="leader-dot" cx="318" cy="412" r="4.2"/>
                        </g>
                        <g id="label-hit-plant-cytoplasm" class="label-hit" onclick="selectPart('cytoplasm')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="458" width="168" height="30" rx="15"/>
                            <text id="label-plant-cytoplasm" class="label-text" x="24" y="478">7. 細胞質</text>
                            <path class="leader-line" d="M180,473 H250 L338,462"/>
                            <circle class="leader-dot" cx="338" cy="462" r="4.2"/>
                        </g>
                    </svg>
                </div>

                <!-- ANIMAL CELL VIEW -->
                <div id="view-animal" class="w-full h-full flex justify-center items-center hidden transition-opacity duration-300">
                    <svg viewBox="0 0 980 540" class="w-full h-full max-w-6xl select-none" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="animal-svg-title">
                        <title id="animal-svg-title">動物細胞示意圖</title>
                        <defs>
                            <radialGradient id="animal-cyto-grad" cx="48%" cy="42%" r="62%">
                                <stop offset="0%" stop-color="#fff7ed"/>
                                <stop offset="55%" stop-color="#ffedd5"/>
                                <stop offset="100%" stop-color="#fecdd3"/>
                            </radialGradient>
                            <radialGradient id="animal-nucleus-grad" cx="38%" cy="34%" r="68%">
                                <stop offset="0%" stop-color="#f3e8ff"/>
                                <stop offset="100%" stop-color="#d8b4fe"/>
                            </radialGradient>
                            <radialGradient id="animal-mito-grad" cx="40%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#fecaca"/>
                                <stop offset="100%" stop-color="#f87171"/>
                            </radialGradient>
                            <filter id="animal-shadow" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#9f1239" flood-opacity="0.16"/>
                            </filter>
                            <g id="animal-mito-icon">
                                <ellipse cx="0" cy="0" rx="28" ry="14" fill="url(#animal-mito-grad)" stroke="#b91c1c" stroke-width="2"/>
                                <path d="M-18 1 C-12 -8 -6 8 1 -5 C8 9 14 -7 19 1" fill="none" stroke="#991b1b" stroke-width="1.6"/>
                            </g>
                        </defs>

                        <g id="animal-cell-membrane" class="hover-part" onclick="selectPart('cell-membrane')" filter="url(#animal-shadow)">
                            <path d="M292,210 C262,88 430,52 580,72 C730,92 858,128 838,250 C818,372 748,468 560,478 C372,488 258,412 248,300 C242,248 310,236 292,210 Z"
                                  fill="url(#animal-cyto-grad)" stroke="#f59e0b" stroke-width="4"/>
                        </g>
                        <g id="animal-cytoplasm" class="hover-part" onclick="selectPart('cytoplasm')">
                            <path d="M300,214 C274,98 432,62 578,80 C722,98 846,136 828,250 C810,366 742,458 562,468 C382,478 272,406 262,300 C258,252 318,238 300,214 Z"
                                  fill="transparent"/>
                        </g>
                        <g id="animal-nucleus" class="hover-part" onclick="selectPart('nucleus')">
                            <circle cx="560" cy="258" r="58" fill="none" stroke="#7e22ce" stroke-width="6" opacity="0.3"/>
                            <circle cx="560" cy="258" r="52" fill="url(#animal-nucleus-grad)" stroke="#7e22ce" stroke-width="2.8"/>
                            <circle cx="548" cy="248" r="14" fill="#7e22ce" opacity="0.5"/>
                            <circle cx="576" cy="270" r="4" fill="#a855f7" opacity="0.7"/>
                            <circle cx="540" cy="276" r="3" fill="#a855f7" opacity="0.55"/>
                        </g>
                        <g id="animal-mitochondrion" class="hover-part" onclick="selectPart('mitochondrion')">
                            <use href="#animal-mito-icon" transform="translate(368,332) rotate(-42)"/>
                            <use href="#animal-mito-icon" transform="translate(620,128) rotate(12)"/>
                            <use href="#animal-mito-icon" transform="translate(740,268) rotate(78)"/>
                            <use href="#animal-mito-icon" transform="translate(520,400) rotate(-16)"/>
                            <use href="#animal-mito-icon" transform="translate(430,180) rotate(50)"/>
                        </g>

                        <g id="label-hit-animal-cell-membrane" class="label-hit" onclick="selectPart('cell-membrane')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="128" width="168" height="30" rx="15"/>
                            <text id="label-animal-cell-membrane" class="label-text" x="24" y="148">1. 細胞膜</text>
                            <path class="leader-line" d="M180,143 H250 L290,186"/>
                            <circle class="leader-dot" cx="290" cy="186" r="4.2"/>
                        </g>
                        <g id="label-hit-animal-nucleus" class="label-hit" onclick="selectPart('nucleus')" role="button" tabindex="0">
                            <rect class="label-bg" x="12" y="236" width="168" height="30" rx="15"/>
                            <text id="label-animal-nucleus" class="label-text" x="24" y="256">2. 細胞核</text>
                            <path class="leader-line" d="M180,251 H480 L508,258"/>
                            <circle class="leader-dot" cx="508" cy="258" r="4.2"/>
                        </g>

        function fillStepsBody() {
            const body = document.getElementById('steps-body');
            const steps = teachContent[currentLang].steps;
            body.innerHTML = steps.map(function(s, i) {
                return '<div class="rounded-xl border border-indigo-100 bg-indigo-50/50 p-3">' +
                    '<div class="font-bold text-indigo-800 mb-1">' + s.title + '</div>' +
                    '<div class="text-slate-700 leading-relaxed">' + s.body + '</div></div>';
            }).join('');
        }

        function fillPrincipleBody() {
            const body = document.getElementById('principle-body');
            const p = teachContent[currentLang].principle;
            let htmlP = '<div><h3 class="font-bold text-emerald-800 mb-1">' + p.conceptTitle + '</h3><p>' + p.concept + '</p></div>';
            htmlP += '<div><h3 class="font-bold text-emerald-800 mb-1">' + p.mechTitle + '</h3><ol class="list-decimal list-inside space-y-1.5">';
            p.mech.forEach(function(m) { htmlP += '<li>' + m + '</li>'; });
            htmlP += '</ol></div>';
            htmlP += '<div><h3 class="font-bold text-emerald-800 mb-1">' + p.egTitle + '</h3><p>' + p.eg + '</p></div>';
            body.innerHTML = htmlP;
        }

        function fillQuizBody() {
            const body = document.getElementById('quiz-body');
            const quiz = teachContent[currentLang].quiz;
            const t = uiTranslations[currentLang];
            const letters = ['A', 'B', 'C', 'D'];
            const openHint = currentLang === 'zh' ? '先預測，再操作本模擬核對。' : 'Predict first, then use the sim to check.';
            const refLabel = currentLang === 'zh' ? '參考答案' : 'Reference answer';
            body.innerHTML = quiz.map(function(item, i) {
                const n = i + 1;
                const isOpen = n === 2 || n === 4;
                const qid = 'q' + n;
                let optsHtml = '';
                if (!isOpen && item.opts && item.opts.length) {
                    optsHtml = '<div class="grid gap-1.5 mt-2">';
                    item.opts.forEach(function(o, j) {
                        const text = o.replace(/^[A-D]\.\s*/, '');
                        optsHtml += '<label class="flex items-start gap-2 rounded-lg border border-violet-200 bg-white p-2 cursor-pointer hover:bg-violet-50/50"><input type="radio" name="' + qid + '" class="mt-1 accent-violet-600"><span><span class="font-mono font-bold text-violet-600">' + letters[j] + '.</span> ' + text + '</span></label>';
                    });
                    optsHtml += '</div>';
                } else if (isOpen) {
                    optsHtml = '<p class="text-xs text-slate-500 italic mt-1">' + openHint + '</p>';
                }
                const ansHtml = quizReveal
                    ? '<div class="mt-2 rounded-lg bg-emerald-50 border border-emerald-200 p-2 text-emerald-900 text-xs"><strong>' + refLabel + '：</strong>' + item.a + '</div>'
                    : '';
                return '<div class="rounded-xl border border-violet-100 bg-violet-50/40 p-3">' +
                    '<div class="font-bold text-violet-800 mb-1">Q' + n + '</div>' +
                    '<div class="text-slate-800">' + item.q + '</div>' + optsHtml + ansHtml + '</div>';
            }).join('');
            const ansBtn = document.getElementById('btn-quiz-answers');
            if (ansBtn) ansBtn.textContent = quizReveal ? t.btnHideAnswers : t.btnShowAnswers;
        }

        function closeAllModals(exceptId) {
            if (modalCloseTimer) {
                clearTimeout(modalCloseTimer);
                modalCloseTimer = null;
            }
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
                if (exceptId && id === exceptId) return;
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            if (!exceptId || exceptId !== 'compare-modal') {
                const cm = document.getElementById('compare-modal');
                if (cm && !cm.classList.contains('hidden')) {
                    cm.classList.add('opacity-0');
                    modalCloseTimer = setTimeout(function() {
                        cm.classList.add('hidden');
                        modalCloseTimer = null;
                    }, 300);
                }
            }
            stopSpeech();
        }

        function openTeachModal(id) {
            closeAllModals(id);
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('hidden');
            if (id === 'modal-steps') fillStepsBody();
            if (id === 'modal-principle') fillPrincipleBody();
            if (id === 'modal-quiz') fillQuizBody();
        }

        function resetAll() {
            // Do NOT reset language
            closeAllModals(null);
            quizReveal = false;
            stopSpeech();
            switchMode('plant');
            currentSelectedId = null;
            document.querySelectorAll('.selected-part').forEach(function(el) { el.classList.remove('selected-part'); });
            document.querySelectorAll('.selected-text').forEach(function(el) { el.classList.remove('selected-text'); });
            document.getElementById('default-state').classList.remove('hidden');
            document.getElementById('active-state').classList.add('hidden');
            renderMobileLegend();
        }


        // --- Logic ---

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
            updateUI();
            // Refresh open teach modals
            if (!document.getElementById('modal-steps').classList.contains('hidden')) fillStepsBody();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) fillPrincipleBody();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) fillQuizBody();
        }

            const t = uiTranslations[currentLang];

            document.getElementById('btn-reset').innerText = t.btnReset;
            document.getElementById('steps-title').innerText = t.stepsTitle;
            document.getElementById('principle-title').innerText = t.principleTitle;
            document.getElementById('quiz-title').innerText = t.quizTitle;
            const ansBtn = document.getElementById('btn-quiz-answers');

            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('th-feature').innerText = t.thFeature;

            Object.keys(t.svgLabels).forEach(id => {

                if(labelEl) labelEl.textContent = t.svgLabels[id];

            updateModalTable();

            if (currentSelectedId) {
                selectPart(currentSelectedId); // Re-render current selection with new lang
            } else {
                renderMobileLegend(); // Refresh names in legend
            }

        function updateModalTable() {
            const t = uiTranslations[currentLang];
            const tbody = document.getElementById('modal-tbody');
            tbody.innerHTML = '';

            t.tableRows.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 1 ? 'bg-gray-50' : '';
                tr.innerHTML = `
                    <td class="font-bold border border-gray-200 p-3">${row.feature}</td>
                    <td class="border border-gray-200 p-3">${formatCheck(row.plant)}</td>
                    <td class="border border-gray-200 p-3">${formatCheck(row.animal)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function formatCheck(text) {
            // Helper to style check/cross marks
            return text.replace('✓', '<span class="check-icon">✓</span>')
                       .replace('✗', '<span class="cross-icon">✗</span>');
        }

        function switchMode(mode) {
            currentMode = mode;
            currentSelectedId = null;

            // UI Toggle
            const btnPlant = document.getElementById('btn-plant');
            const btnAnimal = document.getElementById('btn-animal');

            if (mode === 'plant') {
                btnPlant.classList.add('nav-active');
                btnPlant.classList.remove('text-gray-400');
                btnAnimal.classList.remove('nav-active');
                btnAnimal.classList.add('text-gray-400');
            } else {
                btnAnimal.classList.add('nav-active');
                btnAnimal.classList.remove('text-gray-400');
                btnPlant.classList.remove('nav-active');
                btnPlant.classList.add('text-gray-400');
            }

            // View Toggle
            if (mode === 'plant') {
                document.getElementById('view-plant').classList.remove('hidden');
                document.getElementById('view-animal').classList.add('hidden');
            } else {
                document.getElementById('view-plant').classList.add('hidden');
                document.getElementById('view-animal').classList.remove('hidden');
            }

            // Reset Info
            document.getElementById('default-state').classList.remove('hidden');
            document.getElementById('active-state').classList.add('hidden');
            document.querySelectorAll('.selected-part').forEach(function(el) { el.classList.remove('selected-part'); });
            document.querySelectorAll('.label-hit.is-selected').forEach(function(el) { el.classList.remove('is-selected'); });
            stopSpeech();

            renderMobileLegend();
        }

        function loadVoices() {
            if (!window.speechSynthesis) return [];
            cachedVoices = speechSynthesis.getVoices() || [];
            return cachedVoices;
        }

        function pickUkFemaleVoice() {
            const voices = loadVoices();
            if (!voices.length) return null;
            const nameOf = function(v) { return (v.name || '').toLowerCase(); };
            const langOf = function(v) { return (v.lang || '').toLowerCase().replace('_', '-'); };
            const isGb = function(v) { return langOf(v).indexOf('en-gb') === 0 || nameOf(v).indexOf('uk english') !== -1; };
            const isFemale = function(v) { return /female|kate|serena|martha|stephanie|flo|sandy|grandma|moira|fiona|samantha/.test(nameOf(v)); };
            return voices.find(function(v) { return v.name === 'Google UK English Female'; })
                || voices.find(function(v) { return nameOf(v) === 'google uk english female'; })
                || voices.find(function(v) { return nameOf(v).indexOf('google uk english female') !== -1; })
                || voices.find(function(v) { return nameOf(v).indexOf('uk english female') !== -1; })
                || voices.find(function(v) { return isGb(v) && isFemale(v); })
                || voices.find(function(v) { return isFemale(v) && langOf(v).indexOf('en') === 0; })
                || voices.find(function(v) { return isGb(v); })
                || null;
        }

        function stopSpeech() {
            if (speechTimer) {
                clearTimeout(speechTimer);
                speechTimer = null;
            }
            if (window.speechSynthesis) {
                try { speechSynthesis.cancel(); } catch (e) {}
            }
        }

        function speakTextUk(text) {
            if (!speechEnabled || !text) return;
            if (!window.speechSynthesis) return;
            const token = ++speakToken;
            loadVoices();
            const start = function() {
                if (token !== speakToken) return;
                const utter = new SpeechSynthesisUtterance(text);
                const voice = pickUkFemaleVoice();
                utter.lang = 'en-GB';
                utter.rate = 0.88;
                utter.pitch = 1;
                utter.volume = 1;
                if (voice) {
                    utter.voice = voice;
                    utter.lang = voice.lang || 'en-GB';
                }
                try { speechSynthesis.cancel(); } catch (e) {}
                if (speechTimer) clearTimeout(speechTimer);
                speechTimer = setTimeout(function() {
                    if (token !== speakToken) return;
                    speechTimer = null;
                    speechSynthesis.speak(utter);
                    try { speechSynthesis.resume(); } catch (e2) {}
                }, 80);
            };
            if (!cachedVoices.length) {
                const once = function() {
                    speechSynthesis.removeEventListener('voiceschanged', once);
                    loadVoices();
                    start();
                };
                speechSynthesis.addEventListener('voiceschanged', once);
                setTimeout(function() {
                    speechSynthesis.removeEventListener('voiceschanged', once);
                    loadVoices();
                    start();
                }, 280);
                return;
            }
            start();
        }

        function speakCurrentPart() {
            if (!speechEnabled || !currentSelectedId) return;
            const dataItem = scientificData[currentMode][currentSelectedId];
            if (!dataItem || !dataItem.en) return;
            speakTextUk(dataItem.en.name);
        }

        function syncSpeakButton() {
            const t = uiTranslations[currentLang];
            const btn = document.getElementById('btn-speak');
            const label = document.getElementById('btn-speak-text');
            if (label) label.innerText = speechEnabled ? t.btnSpeakOn : t.btnSpeakOff;
            if (btn) {
                btn.setAttribute('aria-pressed', speechEnabled ? 'true' : 'false');
                btn.classList.toggle('speak-on', speechEnabled);
            }
        }

        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            syncSpeakButton();
            if (!speechEnabled) {
                stopSpeech();
                return;
            }
            loadVoices();
            if (currentSelectedId) speakCurrentPart();
            else speakTextUk('Structure of a cell');
        }

        function replaySpeech() {
            if (!speechEnabled) {
                speechEnabled = true;
                const t = uiTranslations[currentLang];
                const btn = document.getElementById('btn-speak');
                const label = document.getElementById('btn-speak-text');
                if (label) label.innerText = t.btnSpeakOn;
                if (btn) {
                    btn.setAttribute('aria-pressed', 'true');
                    btn.classList.add('speak-on');
                }
            }
            speakCurrentPart();
        }

        function selectPart(partId) {
            const prefix = currentMode + '-';

            document.querySelectorAll('.selected-part').forEach(function(el) { el.classList.remove('selected-part'); });
            document.querySelectorAll('.label-hit.is-selected').forEach(function(el) { el.classList.remove('is-selected'); });

            const targetShape = document.getElementById(prefix + partId);
            if (targetShape) targetShape.classList.add('selected-part');

            const targetHit = document.getElementById('label-hit-' + prefix + partId);
            if (targetHit) targetHit.classList.add('is-selected');

            currentSelectedId = partId;

            const dataItem = scientificData[currentMode][partId];
            if (!dataItem) return;

            const content = dataItem[currentLang];

            document.getElementById('default-state').classList.add('hidden');
            document.getElementById('active-state').classList.remove('hidden');

            const infoCard = document.getElementById('info-card');
            infoCard.classList.remove('fade-in');
            void infoCard.offsetWidth;
            infoCard.classList.add('fade-in');

            document.getElementById('part-title').innerText = content.name;
            document.getElementById('part-icon').innerText = dataItem.icon;
            document.getElementById('part-structure').innerText = content.structure;
            document.getElementById('part-function').innerText = content.function;
            document.getElementById('analogy-text').innerText = content.analogy;

            speakCurrentPart();
        }

        function renderMobileLegend() {
            const container = document.getElementById('mobile-legend');
            container.innerHTML = ''; 
            
            const currentData = scientificData[currentMode];
            Object.keys(currentData).forEach(key => {
                const item = currentData[key];
                const content = item[currentLang];
                const btn = document.createElement('button');
                btn.className = "p-2 bg-white rounded shadow text-xs font-bold text-gray-700 border border-gray-200 truncate";
                // Simplified name for legend
                const shortName = content.name.split(' (')[0]; 
                btn.innerText = shortName;
                btn.onclick = () => selectPart(key);
                container.appendChild(btn);
            });
        }

        function openModal() {
            closeAllModals('compare-modal');
            updateModalTable(); // Ensure table is up to date with lang
            const modal = document.getElementById('compare-modal');
            modal.classList.remove('hidden');
            modal.classList.remove('opacity-0');
        }

        function closeModal() {
            const modal = document.getElementById('compare-modal');
            modal.classList.add('opacity-0');
            if (modalCloseTimer) clearTimeout(modalCloseTimer);
            modalCloseTimer = setTimeout(function() {
                modal.classList.add('hidden');
                modalCloseTimer = null;
            }, 300);
        }

        document.getElementById('compare-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.querySelectorAll('.modal-close').forEach(function(btn) {
            btn.addEventListener('click', function() { closeAllModals(null); });
        });
        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
            const el = document.getElementById(id);
            el.addEventListener('click', function(e) {
                if (e.target === el) closeAllModals(null);
            });
        });
        document.getElementById('btn-quiz-answers').addEventListener('click', function() {
            quizReveal = !quizReveal;
            fillQuizBody();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAllModals(null);
        });

        document.querySelectorAll('.leader-line').forEach(function(line) {
            const hit = line.cloneNode();
            hit.setAttribute('class', 'leader-hit');
            line.parentNode.insertBefore(hit, line);
        });
        document.querySelectorAll('.label-hit').forEach(function(el) {
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
                }
            });
        });
        loadVoices();
        if (window.speechSynthesis) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        // Initialize table and mobile legend on load
        document.documentElement.lang = 'zh-Hant';
        updateModalTable();
        renderMobileLegend();
        updateUI();
    </script>
</body>
</html>
