<!DOCTYPE html>

        :root {
            --accent: #0d9488;
            --accent-dark: #0f766e;
            --accent-soft: #ccfbf1;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            overflow-x: hidden;
        }
        canvas { touch-action: none; }
        .control-panel {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.96);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 6px rgba(13, 148, 136, 0.35);
            border: 2px solid white;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 3px;
        }
        .chargaff-ok { color: #059669; }
        .chargaff-bad { color: #dc2626; }
        .teach-modal { z-index: 80; }
        .teach-modal.hidden { display: none !important; }
    </style>

        const BASES = {
            A: { id: 'baseA', color: '#ef4444', light: '#f87171', dark: '#dc2626', pair: 'T', bonds: 2 },
            T: { id: 'baseT', color: '#3b82f6', light: '#60a5fa', dark: '#2563eb', pair: 'A', bonds: 2 },
            C: { id: 'baseC', color: '#22c55e', light: '#4ade80', dark: '#16a34a', pair: 'G', bonds: 3 },
            G: { id: 'baseG', color: '#eab308', light: '#facc15', dark: '#ca8a04', pair: 'C', bonds: 3 }
        };

        function getBaseName(key) {
            return TRANSLATIONS[currentLang][BASES[key].id];
        }

        let numPairs = 40;
        let rowHeight = 14;
        let geneStartIndex = 10;
        let geneLength = 8;
        let activePreset = 'demo1';

        function buildPresetLeft(type) {
            const left = [];
            for (let i = 0; i < numPairs; i++) {
                if (type === 'demo1') left.push(['A', 'T', 'G', 'C'][i % 4]);
                else if (type === 'demo2') left.push(i % 2 ? 'G' : 'C');
                else if (type === 'demo3') left.push(i % 2 ? 'T' : 'A');
                else left.push(['C', 'G', 'A', 'T', 'T', 'A'][i % 6]);
            }
            return left;
        }

        const DEMO_PRESETS = {
            demo1: { geneStartRatio: 0.25, geneLenRatio: 0.2 },
            demo2: { geneStartRatio: 0.2, geneLenRatio: 0.25 },
            demo3: { geneStartRatio: 0.3, geneLenRatio: 0.15 },
            demo4: { geneStartRatio: 0.15, geneLenRatio: 0.35 }
        };

        function applyGeneFromPreset(key) {
            const preset = DEMO_PRESETS[key];
            if (!preset) return;
            geneStartIndex = Math.floor(numPairs * preset.geneStartRatio);
            geneLength = Math.max(4, Math.floor(numPairs * preset.geneLenRatio));
        }

        function syncSequenceToLength() {
            if (dnaSequence.length === numPairs) return;
            buildSequence(buildPresetLeft(activePreset));
            applyGeneFromPreset(activePreset);
        }

        let dnaSequence = [];

        function buildSequence(leftBases) {
            dnaSequence = leftBases.map((left, i) => ({
                id: i,
                left,
                right: BASES[left].pair
            }));
            updateStats();
        }

        function initSequence() {
            const keys = ['A', 'T', 'C', 'G'];
            const left = [];
            for (let i = 0; i < numPairs; i++) {
                left.push(keys[Math.floor(Math.random() * keys.length)]);
            }
            buildSequence(left);
        }


        function loadPreset(key) {
            const preset = DEMO_PRESETS[key];
            if (!preset) return;
            activePreset = key;
            applyGeneFromPreset(key);
            buildSequence(buildPresetLeft(key));
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-teal-500', 'bg-teal-50', 'border-teal-300'));
            const activeBtn = document.getElementById('preset-btn-' + key.replace('demo', ''));
            if (activeBtn) activeBtn.classList.add('ring-2', 'ring-teal-500', 'bg-teal-50', 'border-teal-300');
            visualEffects.push({ type: 'flash', index: geneStartIndex + Math.floor(geneLength / 2), life: 1.4 });
        }

        function mutateRow(index) {
            const order = ['A', 'T', 'C', 'G'];
            const cur = dnaSequence[index].left;
            const nextLeft = order[(order.indexOf(cur) + 1) % order.length];
            dnaSequence[index].left = nextLeft;
            dnaSequence[index].right = BASES[nextLeft].pair;
            visualEffects.push({ type: 'flash', index, life: 1.0 });
            updateStats();
            updatePairPanel(index);
        }

        function updateStats() {
            const counts = { A: 0, T: 0, C: 0, G: 0 };
            dnaSequence.forEach(row => {
                counts[row.left]++;
                counts[row.right]++;
            });
            document.getElementById('stat-a').innerText = counts.A;
            document.getElementById('stat-t').innerText = counts.T;
            document.getElementById('stat-c').innerText = counts.C;
            document.getElementById('stat-g').innerText = counts.G;

            const atEl = document.getElementById('chargaff-at');
            const cgEl = document.getElementById('chargaff-cg');
            const atOk = counts.A === counts.T;
            const cgOk = counts.C === counts.G;
            atEl.className = atOk ? 'chargaff-ok' : 'chargaff-bad';
            cgEl.className = cgOk ? 'chargaff-ok' : 'chargaff-bad';
            atEl.textContent = atOk
                ? `A = T = ${counts.A} ✓`
                : `A (${counts.A}) ≠ T (${counts.T}) ✗`;
            cgEl.textContent = cgOk
                ? `C = G = ${counts.C} ✓`
                : `C (${counts.C}) ≠ G (${counts.G}) ✗`;
        }

        function updatePairPanel(index) {
            const placeholder = document.getElementById('pair-placeholder');
            const detail = document.getElementById('pair-detail');
            if (index < 0 || !dnaSequence[index]) {
                placeholder.classList.remove('hidden');
                detail.classList.add('hidden');
                return;
            }
            const row = dnaSequence[index];
            const t = TRANSLATIONS[currentLang];
            placeholder.classList.add('hidden');
            detail.classList.remove('hidden');
            document.getElementById('pair-names').textContent =
                `${getBaseName(row.left)}  ·  ${getBaseName(row.right)}`;
            document.getElementById('pair-bonds').textContent =
                t.bondsLabel(BASES[row.left].bonds);
        }

        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        const canvasWrap = document.getElementById('canvas-wrap');

        let rotation = 0;
        let rotationSpeed = 0.02;
        let isPlaying = true;
        let visualEffects = [];
        let width = 0;
        let height = 0;
        let scaleFactor = 1;
        let mouseX = 0;
        let mouseY = 0;
        let hoveredRowIndex = -1;
        let lastHoveredForUi = -2;
        let isDragging = false;
        let dragMoved = false;
        let lastPointerX = 0;
        let pointerDownRow = -1;
        let lastFrameTime = 0;
        let lastCursor = '';
        let lastTooltipClientX = 0;
        let lastTooltipClientY = 0;
        let lastClientX = 0;
        let lastClientY = 0;
        const HELIX_RADIUS = 82;
        const HELIX_VISUAL_SCALE = 1.3;
        const HELIX_TWIST = 0.42;
        const VERTICAL_FILL = 1.04;
        const ROW_DENSITY = 12;
        let points = [];

        function updateHelixDimensions() {
            if (height < 120) return;
            const perspComp = 400 / (400 + HELIX_RADIUS);
            const targetSpan = (height * VERTICAL_FILL) / (perspComp * HELIX_VISUAL_SCALE);
            numPairs = Math.max(36, Math.min(120, Math.floor(targetSpan / ROW_DENSITY) + 1));
            rowHeight = targetSpan / Math.max(1, numPairs - 1);
        }

        function helixStartY() {
            return -((numPairs - 1) * rowHeight) / 2;
        }

        function resize() {
            const parent = canvas.parentElement;
            width = parent.clientWidth;
            height = parent.clientHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
            canvas.width = Math.max(1, Math.floor(width * dpr));
            canvas.height = Math.max(1, Math.floor(height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = false;
            const prevPairs = numPairs;
            updateHelixDimensions();
            scaleFactor = Math.min(width / 300, 1.15);
            if (numPairs !== prevPairs || dnaSequence.length !== numPairs) {
                syncSequenceToLength();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function setPointerPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            mouseX = clientX - rect.left;
            mouseY = clientY - rect.top;
            lastClientX = clientX;
            lastClientY = clientY;
        }

        function showTooltip(clientX, clientY, forceContent) {
            if (hoveredRowIndex === -1) {
                if (tooltip.style.opacity !== '0') tooltip.style.opacity = 0;
                return;
            }
            const wrapRect = canvasWrap.getBoundingClientRect();
            tooltip.style.left = (clientX - wrapRect.left) + 'px';
            tooltip.style.top = (clientY - wrapRect.top - 12) + 'px';
            tooltip.style.transform = 'translate(-50%, -100%)';
            tooltip.style.opacity = 1;
            lastTooltipClientX = clientX;
            lastTooltipClientY = clientY;

            if (!forceContent && hoveredRowIndex === lastHoveredForUi) return;

            const row = dnaSequence[hoveredRowIndex];
            const bonds = BASES[row.left].bonds;
            const t = TRANSLATIONS[currentLang];
            tooltip.innerHTML = `
                <div class="flex flex-col gap-1.5">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full" style="background:${BASES[row.left].color}"></span>
                        <span>${getBaseName(row.left)}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full" style="background:${BASES[row.right].color}"></span>
                        <span>${getBaseName(row.right)}</span>
                    </div>
                    <div class="text-[11px] text-teal-200 border-t border-white/15 pt-1">${t.bondsLabel(bonds)}</div>
                </div>
            `;
        }

        function syncHoverUi(clientX, clientY) {
            if (hoveredRowIndex === lastHoveredForUi) {
                if (hoveredRowIndex !== -1 && (clientX !== lastTooltipClientX || clientY !== lastTooltipClientY)) {
                    showTooltip(clientX, clientY, false);
                }
                return;
            }
            lastHoveredForUi = hoveredRowIndex;
            updatePairPanel(hoveredRowIndex);
            showTooltip(clientX, clientY, true);
        }

        function onPointerDown(clientX, clientY) {
            setPointerPos(clientX, clientY);
            updateHoverDetection();
            isDragging = true;
            dragMoved = false;
            lastPointerX = clientX;
            pointerDownRow = hoveredRowIndex;
            syncHoverUi(clientX, clientY);
        }

        function onPointerMove(clientX, clientY) {
            setPointerPos(clientX, clientY);
            if (isDragging) {
                const dx = clientX - lastPointerX;
                if (Math.abs(dx) > 2) dragMoved = true;
                rotation += dx * 0.012;
                lastPointerX = clientX;
            }
            syncHoverUi(clientX, clientY);
        }

        function onPointerUp() {
            if (isDragging && !dragMoved && pointerDownRow !== -1) {
                mutateRow(pointerDownRow);
            }
            isDragging = false;
            dragMoved = false;
            pointerDownRow = -1;
        }

        canvas.addEventListener('mousedown', e => {
            e.preventDefault();
            onPointerDown(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', e => {
            if (!isDragging && e.target !== canvas) {
                if (hoveredRowIndex !== -1 || lastHoveredForUi !== -1) {
                    hoveredRowIndex = -1;
                    lastHoveredForUi = -2;
                    tooltip.style.opacity = 0;
                    updatePairPanel(-1);
                }
                return;
            }
            onPointerMove(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => onPointerUp());

        canvas.addEventListener('touchstart', e => {
            if (!e.touches[0]) return;
            e.preventDefault();
            onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            if (!e.touches[0]) return;
            e.preventDefault();
            onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            onPointerUp();
            tooltip.style.opacity = 0;
            lastHoveredForUi = -2;
        }, { passive: false });

        canvas.addEventListener('mouseleave', () => {
            if (!isDragging) {
                hoveredRowIndex = -1;
                lastHoveredForUi = -2;
                tooltip.style.opacity = 0;
                updatePairPanel(-1);
            }
        });

        function project(x, y, z, out) {
            const perspective = 400 / (400 + z);
            const s = perspective * HELIX_VISUAL_SCALE;
            out.x = x * s + width / 2;
            out.y = y * s + height / 2;
            out.scale = s * scaleFactor;
            out.z = z;
            return out;
        }

        function drawBead(p, alpha, highlight) {
            const r = (highlight ? 5.5 : 4.2) * p.scale;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = highlight ? '#e2e8f0' : '#94a3b8';
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        function drawBasePairBar(p1, p2, leftBase, rightBase, highlight, isGene) {
            const mx = (p1.x + p2.x) * 0.5;
            const my = (p1.y + p2.y) * 0.5;
            const avgScale = (p1.scale + p2.scale) * 0.5;
            const lw = (highlight ? 5 : 3.5) * avgScale;
            ctx.lineCap = 'round';
            ctx.strokeStyle = BASES[leftBase].color;
            ctx.lineWidth = lw;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(mx, my);
            ctx.stroke();
            ctx.strokeStyle = BASES[rightBase].color;
            ctx.beginPath();
            ctx.moveTo(mx, my);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            if (isGene && !highlight) {
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)';
                ctx.lineWidth = lw + 2 * avgScale;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }

        function draw(now) {
            if (!lastFrameTime) lastFrameTime = now;
            let dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;
            if (dt > 0.05) dt = 0.05;

            ctx.clearRect(0, 0, width, height);

            if (isPlaying && !isDragging) {
                rotation += rotationSpeed * 60 * dt;
            }

            const startY = helixStartY();

            for (let i = 0; i < numPairs; i++) {
                const yBase = startY + i * rowHeight;
                const angle = i * HELIX_TWIST + rotation;
                const x1 = Math.sin(angle) * HELIX_RADIUS;
                const z1 = Math.cos(angle) * HELIX_RADIUS;
                const x2 = -x1;
                const z2 = -z1;

                let pt = points[i];
                if (!pt) {
                    pt = points[i] = {
                        row: null,
                        s1: { x: 0, y: 0, z: 0, p: { x: 0, y: 0, scale: 1, z: 0 } },
                        s2: { x: 0, y: 0, z: 0, p: { x: 0, y: 0, scale: 1, z: 0 } }
                    };
                }
                pt.row = dnaSequence[i];
                pt.s1.x = x1; pt.s1.y = yBase; pt.s1.z = z1;
                pt.s2.x = x2; pt.s2.y = yBase; pt.s2.z = z2;
                project(x1, yBase, z1, pt.s1.p);
                project(x2, yBase, z2, pt.s2.p);
            }

            let geneYStart = 0;
            let geneYEnd = 0;
            if (points[geneStartIndex] && points[geneStartIndex + geneLength - 1]) {
                geneYStart = (points[geneStartIndex].s1.p.y + points[geneStartIndex].s2.p.y) * 0.5;
                geneYEnd = (points[geneStartIndex + geneLength - 1].s1.p.y + points[geneStartIndex + geneLength - 1].s2.p.y) * 0.5;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = 1;

            // 1) Thin backbone rails connecting beads
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2.5 * scaleFactor;
            ctx.beginPath();
            for (let i = 0; i < numPairs; i++) {
                const p = points[i].s1.p;
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            ctx.beginPath();
            for (let i = 0; i < numPairs; i++) {
                const p = points[i].s2.p;
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();

            // 2) Base-pair bars (farther pairs first)
            const drawOrder = [];
            for (let i = 0; i < numPairs; i++) {
                const curr = points[i];
                drawOrder.push({
                    i,
                    z: (curr.s1.z + curr.s2.z) * 0.5,
                    curr
                });
            }
            drawOrder.sort((a, b) => b.z - a.z);
            for (let k = 0; k < drawOrder.length; k++) {
                const { i, curr } = drawOrder[k];
                const hi = i === hoveredRowIndex;
                const isGene = i >= geneStartIndex && i < geneStartIndex + geneLength;
                drawBasePairBar(curr.s1.p, curr.s2.p, curr.row.left, curr.row.right, hi, isGene);
            }

            // 3) Sugar-phosphate beads on backbones
            for (let i = 0; i < numPairs; i++) {
                const curr = points[i];
                const hi = i === hoveredRowIndex;
                const alpha = Math.max(0.45, Math.min(1, curr.s1.p.scale * 1.4));
                if (curr.s1.z >= curr.s2.z) {
                    drawBead(curr.s1.p, alpha, hi);
                    drawBead(curr.s2.p, alpha, hi);
                } else {
                    drawBead(curr.s2.p, alpha, hi);
                    drawBead(curr.s1.p, alpha, hi);
                }
            }

            // Gene bracket + one label
            if (geneYStart && geneYEnd) {
                const bracketX = width / 2 + 130 * scaleFactor;
                const top = geneYStart - 8 * scaleFactor;
                const bottom = geneYEnd + 8 * scaleFactor;
                const midY = (top + bottom) * 0.5;
                ctx.beginPath();
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 2;
                ctx.moveTo(bracketX, top);
                ctx.lineTo(bracketX + 10 * scaleFactor, top);
                ctx.lineTo(bracketX + 10 * scaleFactor, bottom);
                ctx.lineTo(bracketX, bottom);
                ctx.stroke();
                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold ' + Math.round(12 * scaleFactor) + 'px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(TRANSLATIONS[currentLang].geneLabel, bracketX + 16 * scaleFactor, midY);
            }

            // Lightweight flash
            if (visualEffects.length) {
                for (let i = visualEffects.length - 1; i >= 0; i--) {
                    const fx = visualEffects[i];
                    fx.life -= dt * 4;
                    if (fx.life <= 0) {
                        visualEffects.splice(i, 1);
                        continue;
                    }
                    const yBase = startY + fx.index * rowHeight;
                    const p = { x: 0, y: 0, scale: 1, z: 0 };
                    project(0, yBase, 0, p);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 40 * (1.5 - fx.life * 0.5), 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(94,234,212,' + (fx.life * 0.25) + ')';
                    ctx.fill();
                }
            }

            updateHoverDetection();
            if (hoveredRowIndex !== lastHoveredForUi) {
                syncHoverUi(lastClientX, lastClientY);
            }
            requestAnimationFrame(draw);
        }

        function updateHoverDetection() {
            const startY = helixStartY();
            let minDistance = 1e9;
            let targetIndex = -1;
            for (let i = 0; i < numPairs; i++) {
                const yBase = startY + i * rowHeight;
                const scale = scaleFactor;
                const cy = yBase + height / 2;
                const cx = width / 2;
                const dy = Math.abs(mouseY - cy);
                const dx = Math.abs(mouseX - cx);
                if (dy < rowHeight * 0.75 && dx < 110 * scale) {
                    const dist = dx * dx + dy * dy;
                    if (dist < minDistance) {
                        minDistance = dist;
                        targetIndex = i;
                    }
                }
            }
            hoveredRowIndex = targetIndex;
            const nextCursor = hoveredRowIndex !== -1 ? 'pointer' : (isDragging ? 'grabbing' : 'grab');
            if (nextCursor !== lastCursor) {
                lastCursor = nextCursor;
                canvas.style.cursor = nextCursor;
            }
        }

        function toggleAnimation() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('btn-play');
            if (isPlaying) {
                btn.classList.remove('bg-teal-600', 'hover:bg-teal-500');
                btn.classList.add('bg-slate-800', 'hover:bg-slate-700');
            } else {
                btn.classList.remove('bg-slate-800', 'hover:bg-slate-700');
                btn.classList.add('bg-teal-600', 'hover:bg-teal-500');
            }
            updatePlayButtonText();
        }

        function randomizeDNA() {
            visualEffects.push({ index: Math.floor(numPairs / 2), life: 1.8, type: 'flash' });
            initSequence();
        }

        function updateSpeed(val) {
            rotationSpeed = Number(val) / 1500;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function closeAllModals(exceptId) {
            if (modalCloseTimer) {
                clearTimeout(modalCloseTimer);
                modalCloseTimer = null;
            }
            ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
                if (exceptId && id === exceptId) return;
                document.getElementById(id).classList.add('hidden');
            });
        }

        function openTeachModal(id) {
            closeAllModals(id);
            document.getElementById(id).classList.remove('hidden');
            if (id === 'modal-steps') fillStepsBody();
            if (id === 'modal-principle') fillPrincipleBody();
            if (id === 'modal-quiz') {
                quizReveal = false;
                fillQuizBody();
            }
        }

        function resetDNA() {
            loadPreset('demo1');
        }

        function resetAll() {
            closeAllModals(null);
            quizReveal = false;
            resetDNA();
            const speedEl = document.getElementById('speed-range');
            if (speedEl) {
                speedEl.value = 30;
                updateSpeed(30);
            }
            if (!isPlaying) {
                isPlaying = true;
                const btn = document.getElementById('btn-play');
                if (btn) {
                    btn.classList.remove('bg-teal-600', 'hover:bg-teal-500');
                    btn.classList.add('bg-slate-800', 'hover:bg-slate-700');
                }
                updatePlayButtonText();
            }
            hoveredRowIndex = -1;
            lastHoveredForUi = -2;
            const tip = document.getElementById('tooltip');
            if (tip) tip.style.opacity = 0;
            updatePairPanel(-1);
            // Do NOT reset language
        }

        document.querySelectorAll('.modal-close').forEach(function(btn) {
            btn.addEventListener('click', function() { closeAllModals(null); });
        });
        ['modal-steps', 'modal-principle', 'modal-quiz'].forEach(function(id) {
            document.getElementById(id).addEventListener('click', function(e) {
                if (e.target === this) closeAllModals(null);
            });
        });
        document.getElementById('btn-quiz-answers').addEventListener('click', function() {
            quizReveal = !quizReveal;
            fillQuizBody();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAllModals(null);
        });

        // Declare isPlaying before updatePlayButtonText first call path;
        // engine below also declares let isPlaying — need single declaration.

        updateTextContent();
        resetAll();
        requestAnimationFrame(draw);
    </script>
</body>
</html>
