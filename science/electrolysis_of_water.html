<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

            <button type="button" id="btn-quiz" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 text-white rounded-md text-xs sm:text-sm font-semibold transition-colors">課堂問題</button>
            <div class="hidden sm:block h-6 w-px bg-slate-200"></div>
            <button type="button" id="btn-lang" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 rounded-md text-xs sm:text-sm font-semibold transition-colors">中 / EN</button>

    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <section class="order-1 lg:order-2 lg:col-span-8 bg-white p-4 rounded-xl shadow-md flex flex-col items-center justify-center w-full">
            <div id="canvas-wrapper" class="relative w-full aspect-[4/3] max-w-[600px] mx-auto overflow-hidden rounded-lg shadow-inner bg-slate-50">
                <canvas id="simCanvas" class="absolute inset-0 w-full h-full touch-none"></canvas>
            </div>
            <p id="canvas-hint" class="text-sm text-slate-500 mt-3 font-semibold text-center">收集法：向下排水法 | 體積比 (H₂ : O₂) = 2 : 1</p>
        </section>

        <!-- Controls: Scheme A col-span-4, order-2 on narrow -->
        <aside class="order-2 lg:order-1 lg:col-span-4 w-full flex flex-col gap-4">
            <div class="bg-white p-5 rounded-xl shadow-md">
                <h2 id="ctrl-title" class="text-lg font-bold border-b pb-2 mb-4 text-slate-700">控制面板</h2>

                <div class="mb-6">
                    <label class="flex justify-between text-sm font-semibold mb-2">
                        <span id="label-voltage">電源電壓 (V)</span>
                        <span id="val-voltage" class="text-blue-600 font-bold">0.0 V</span>
                    </label>
                    <input type="range" id="slider-voltage" min="0" max="24" step="0.5" value="0" class="w-full" oninput="updateControls()">
                    <div class="flex justify-between text-xs text-slate-400 mt-1">
                        <span>0V</span><span>24V</span>
                    </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 mb-6 space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span id="label-h2-vol" class="font-semibold text-slate-600">氫氣體積 (陰極 −):</span>
                        <span id="val-h2-vol" class="font-mono text-blue-600 font-bold">0.0 mL</span>
                    </div>
                    <div class="flex justify-between">
                        <span id="label-o2-vol" class="font-semibold text-slate-600">氧氣體積 (陽極 ＋):</span>
                        <span id="val-o2-vol" class="font-mono text-red-500 font-bold">0.0 mL</span>
                    </div>
                    <div class="flex justify-between border-t pt-2 mt-2">
                        <span id="label-current" class="font-semibold text-slate-600">相對電流:</span>
                        <span id="val-current" class="font-mono text-slate-800">0.00 A</span>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="button" id="btn-toggle" onclick="toggleSim()" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-bold transition-colors">啟動電源</button>
                    <button type="button" id="btn-reset-panel" onclick="resetAll()" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-bold transition-colors">重置</button>
                </div>
            </div>

            <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl shadow-sm">
                <h3 id="tip-title" class="text-sm font-bold text-blue-800 mb-2">觀察重點</h3>
                <ul id="tip-content" class="text-xs text-blue-700 space-y-1 list-disc pl-4"></ul>
            </div>
        </aside>
    </main>

    <!-- Teaching Modals -->

    </div>

              zh: '在約 8–12 V、電源開啟下讓氣體累積一段時間，比較氫氣與氧氣體積讀數。哪項最合理？',
              en: 'At about 8–12 V with Power ON, let gas accumulate, then compare H₂ and O₂ volume readouts. Which is most reasonable?'
            },
            choices: [
              { zh: '氫氣體積約為氧氣的兩倍，對應總反應 2H₂O → 2H₂ + O₂ 的莫耳／體積比 2:1', en: 'H₂ volume is about twice O₂, matching 2H₂O → 2H₂ + O₂ (2:1)' },
              { zh: '氧氣體積一定精確為氫氣的四倍', en: 'O₂ volume must be exactly four times H₂' },
              { zh: '體積比與化學方程式無關，只由電壓數字直接等於毫升數', en: 'The ratio is unrelated to the equation; voltage in volts equals millilitres directly' },
              { zh: '本模擬不顯示任何體積讀數', en: 'This sim shows no volume readouts' }
            ],
            ans: 0,
            explain: {
              zh: 'A。氣泡 pending 以 2:1 產率維持；允許離散氣泡造成的小偏差。',
              en: 'A. Bubble pending keeps a 2:1 rate; small discrete-bubble error is OK.'
            }
          },
          {
            q: {
              zh: '先調高電壓、啟動電源並讓兩管有一些氣體，再按頁首重置。用自己的話寫：（1）重置後電壓、電源、兩氣體體積、氣泡應如何；（2）重置會不會切換中／EN。',
              en: 'Raise voltage, Power ON, collect some gas, then press header Reset. In your own words: (1) expected voltage／power／volumes／bubbles after Reset; (2) whether Reset switches zh／EN.'
            },
            choices: null,
            ans: null,
            explain: {
              zh: '（1）電壓 0 V；電源關；H₂／O₂ 0.0 mL；氣泡清空；電流 0。（2）不切換語言。',
              en: '(1) Voltage 0 V; power OFF; H₂／O₂ 0.0 mL; bubbles cleared; current 0. (2) Reset must not switch language.'
            }
          },
          {
            q: {
              zh: '根據本模擬控件與設計，哪項最正確？',
              en: 'Using this sim’s controls and design, which is most correct?'
            },
            choices: [
              { zh: '可調直流電壓、開關電源、觀察倒立管收集的 H₂／O₂ 與約 2:1 體積比、讀相對電流，並有步驟／原理／五題／中EN／重置——主軸是水的電解實況，不是多電解質 E.C.S.／濃鹽產氯實驗室、不是原電池鹽橋／Nernst、不是金屬–酸置換試管、也不是金屬與水專檔', en: 'You set DC voltage, toggle power, watch inverted-tube H₂／O₂ near 2:1, read relative current, with steps／principle／five quiz items／zh-EN／Reset—focus water electrolysis, not multi-electrolyte E.C.S.／brine chlorine lab, not galvanic salt-bridge／Nernst, not metal–acid tubes, not metals–water labs' },
              { zh: '主要靠選 NaCl／CuSO₄ 等電解質並查陽極 Cl₂／陰極鍍銅規則', en: 'It mainly picks NaCl／CuSO₄ electrolytes and teaches anode Cl₂／cathode copper-plating rules' },
              { zh: '重置會強制改成英文並刪除 2:1 產氣邏輯', en: 'Reset always switches to English and deletes the 2:1 gas logic' },
              { zh: '這是自發原電池：電子由鋅流向銅且無需外加電源', en: 'It is a spontaneous galvanic cell: electrons flow Zn→Cu with no external supply' }
            ],
            ans: 0,
            explain: {
              zh: 'A。隔離 chem-electrolysis／原電池／金屬–酸／金屬–水；Reset 不改語言、不刪物理常數。',
              en: 'A. Separates chem-electrolysis／galvanic／metal–acid／metals–water; Reset does not change language or delete constants.'
            }
          }
        ];

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        function typesetMath(root) {
            if (window.MathJax && window.MathJax.typesetPromise) {
                const nodes = root ? [root] : undefined;
                MathJax.typesetPromise(nodes).catch(function(err) { console.log(err); });
            }
        }

        function updateUI() {
            const t = i18n[currentLang];
            document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-Hant';
            document.getElementById('app-title').innerText = t.appTitle;
            document.getElementById('app-subtitle').innerText = t.appSubtitle;
            document.getElementById('badge-subject').innerText = t.badge;
            document.getElementById('btn-steps').innerText = t.btnSteps;
            document.getElementById('btn-principle').innerText = t.btnPrinciple;
            document.getElementById('btn-quiz').innerText = t.btnQuiz;
            document.getElementById('btn-lang').innerText = t.btnLang;
            document.getElementById('btn-reset').innerText = t.btnReset;
            const panelReset = document.getElementById('btn-reset-panel');
            if (panelReset) panelReset.innerText = t.btnReset;
            document.getElementById('canvas-hint').innerText = t.canvasHint;
            document.getElementById('ctrl-title').innerText = t.ctrlTitle;
            document.getElementById('label-voltage').innerText = t.lblVoltage;
            document.getElementById('label-h2-vol').innerText = t.lblH2Vol;
            document.getElementById('label-o2-vol').innerText = t.lblO2Vol;
            document.getElementById('label-current').innerText = t.lblCurrent;
            document.getElementById('btn-toggle').innerText = state.powerOn ? t.btnStop : t.btnStart;
            document.getElementById('tip-title').innerText = t.tipTitle;
            document.getElementById('tip-content').innerHTML = t.tipContent;
            refreshOpenTeachModals();
        }

        // --- Simulation State ---
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvas-wrapper');

        const BASE_W = 600;
        const BASE_H = 450;
        const THRESHOLD_V = 2.0;
        const MAX_TUBE_VOL = 100;

        let state = {
            voltage: 0,
            current: 0,
            powerOn: false,
            h2Vol: 0,
            o2Vol: 0,
            bubbles: [],
            h2Pending: 0,
            o2Pending: 0
        };

        const sliderV = document.getElementById('slider-voltage');
        const valV = document.getElementById('val-voltage');
        const valH2 = document.getElementById('val-h2-vol');
        const valO2 = document.getElementById('val-o2-vol');
        const valI = document.getElementById('val-current');
        const btnToggle = document.getElementById('btn-toggle');

        function updateControls() {
            state.voltage = parseFloat(sliderV.value);
            valV.innerText = state.voltage.toFixed(1) + ' V';

            if (state.powerOn && state.voltage > THRESHOLD_V) {
                state.current = (state.voltage - THRESHOLD_V) * 0.2;
            } else {
                state.current = 0;
            }
            valI.innerText = state.current.toFixed(2) + ' A';
        }

        function toggleSim() {
            state.powerOn = !state.powerOn;
            updateControls();

            if (state.powerOn) {
                btnToggle.className = "flex-1 bg-yellow-500 hover:bg-yellow-600 text-white py-2 rounded-lg font-bold transition-colors";
                btnToggle.innerText = i18n[currentLang].btnStop;
            } else {
                btnToggle.className = "flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-bold transition-colors";
                btnToggle.innerText = i18n[currentLang].btnStart;
            }
        }

        function resetAll() {
            closeAllModals(null);
            state.voltage = 0;
            state.powerOn = false;
            state.current = 0;
            state.h2Vol = 0;
            state.o2Vol = 0;
            state.h2Pending = 0;
            state.o2Pending = 0;
            state.bubbles = [];
            sliderV.value = 0;
            valV.innerText = '0.0 V';
            valH2.innerText = '0.0 mL';
            valO2.innerText = '0.0 mL';
            valI.innerText = '0.00 A';
            btnToggle.className = "flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-bold transition-colors";
            btnToggle.innerText = i18n[currentLang].btnStart;
            quizReveal = false;
            updateControls();
        }
        // Alias for any leftover callers
        function resetSim() { resetAll(); }

        // --- Teaching modals ---
        function closeAllModals(exceptId) {
            if (modalTimer) { clearTimeout(modalTimer); modalTimer = null; }
            ['modal-steps','modal-principle','modal-quiz'].forEach(function(id) {
                if (exceptId && id === exceptId) return;
                var el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }
        function openTeachModal(id) {
            closeAllModals(id);
            var el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        }
        function renderSteps() {
            var t = i18n[currentLang];
            document.getElementById('steps-title').textContent = t.stepsTitle;
            var body = document.getElementById('steps-body');
            body.innerHTML = STEPS.map(function(s, i) {
                return '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200"><div class="font-bold text-indigo-600 mb-1">' + (i+1) + '</div><div class="leading-relaxed">' + (currentLang==='en'?s.en:s.zh) + '</div></div>';
            }).join('');
            typesetMath(body);
        }
        function renderPrinciple() {
            var p = PRINCIPLE[currentLang] || PRINCIPLE.zh;
            var t = i18n[currentLang];
            document.getElementById('principle-title').textContent = t.principleTitle;
            var mech = p.mech.map(function(m){ return '<li class="mb-2 leading-relaxed">'+m+'</li>'; }).join('');
            var body = document.getElementById('principle-body');
            body.innerHTML =
              '<div><h3 class="font-bold text-emerald-700 mb-1">'+p.conceptTitle+'</h3><p class="leading-relaxed">'+p.concept+'</p></div>' +
              '<div><h3 class="font-bold text-emerald-700 mb-1">'+p.mechTitle+'</h3><ol class="list-decimal pl-5">'+mech+'</ol></div>' +
              '<div><h3 class="font-bold text-emerald-700 mb-1">'+p.egTitle+'</h3><p class="leading-relaxed">'+p.eg+'</p></div>';
            typesetMath(body);
        }
        function renderQuiz() {
            var t = i18n[currentLang];
            document.getElementById('quiz-title').textContent = t.quizTitle;
            document.getElementById('btn-quiz-answers').textContent = quizReveal ? t.hideAns : t.showAns;
            var body = document.getElementById('quiz-body');
            body.innerHTML = QUIZ.map(function(item, qi) {
                var qtext = currentLang==='en' ? item.q.en : item.q.zh;
                var html = '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200 mb-3"><div class="font-bold text-violet-700 mb-2">Q'+(qi+1)+'. '+qtext+'</div>';
                var qNum = qi + 1;
                var isOpen = (qNum === 2 || qNum === 4);
                if (!isOpen && item.choices) {
                  var qName = 'q' + qNum;
                  html += '<div class="grid gap-1.5 text-sm">';
                  item.choices.forEach(function(c, ci) {
                    var label = String.fromCharCode(65+ci);
                    var txt = currentLang==='en' ? c.en : c.zh;
                    html += '<label class="flex items-start gap-2 rounded-lg border border-slate-200 p-2 cursor-pointer hover:bg-slate-50"><input type="radio" name="'+qName+'" class="mt-0.5 accent-violet-600"><span>'+label+'. '+txt+'</span></label>';
                  });
                  html += '</div>';
                } else if (isOpen) {
                  html += '<p class="text-xs text-slate-500 italic">'+(currentLang==='en'?'Predict, then use the sim controls to check. Write in your own words.':'先預測，再操作畫面控件核對，用自己的話作答。')+'</p>';
                }
                if (quizReveal && item.explain) {
                  var ex = currentLang==='en' ? item.explain.en : item.explain.zh;
                  var ref = currentLang==='en' ? 'Reference answer' : '參考答案';
                  html += '<div class="mt-2 text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg p-2"><strong>'+ref+'：</strong> '+ex+'</div>';
                }
                html += '</div>';
                return html;
            }).join('');
            typesetMath(body);
        }
        function refreshOpenTeachModals() {
            if (!document.getElementById('modal-steps').classList.contains('hidden')) renderSteps();
            if (!document.getElementById('modal-principle').classList.contains('hidden')) renderPrinciple();
            if (!document.getElementById('modal-quiz').classList.contains('hidden')) renderQuiz();
        }
        function wireTeachingUI() {
            document.getElementById('btn-steps').addEventListener('click', function() { renderSteps(); openTeachModal('modal-steps'); });
            document.getElementById('btn-principle').addEventListener('click', function() { renderPrinciple(); openTeachModal('modal-principle'); });
            document.getElementById('btn-quiz').addEventListener('click', function() { quizReveal = false; renderQuiz(); openTeachModal('modal-quiz'); });
            document.getElementById('btn-lang').addEventListener('click', toggleLang);
            document.getElementById('btn-reset').addEventListener('click', resetAll);
            document.getElementById('btn-quiz-answers').addEventListener('click', function() { quizReveal = !quizReveal; renderQuiz(); });
            document.querySelectorAll('.modal-close').forEach(function(btn) {
                btn.addEventListener('click', function() { closeAllModals(null); });
            });
            document.querySelectorAll('.teach-modal').forEach(function(el) {
                el.addEventListener('click', function(e) { if (e.target === el) closeAllModals(null); });
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeAllModals(null);
            });
        }

        // --- Canvas ---
        function resizeCanvas() {
            const rect = canvasWrapper.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.resetTransform();
            ctx.scale(dpr * (rect.width / BASE_W), dpr * (rect.height / BASE_H));
            drawScene();
        }
        const resizeObserver = new ResizeObserver(() => resizeCanvas());
        resizeObserver.observe(canvasWrapper);

        const W = BASE_W;
        const H = BASE_H;
        const beaker = { x: 150, y: 150, w: 300, h: 250 };
        const waterLvl = 170;
        const tubes = {
            H2: { x: 220, y: 80, w: 40, h: 280, color: 'rgba(59, 130, 246, 0.1)' },
            O2: { x: 340, y: 80, w: 40, h: 280, color: 'rgba(239, 68, 68, 0.1)' }
        };
        const electrodes = {
            Cathode: { x: 235, y: 320, w: 10, h: 40 },
            Anode:   { x: 355, y: 320, w: 10, h: 40 }
        };

        function drawScene() {
            ctx.clearRect(0, 0, W, H);

            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(electrodes.Cathode.x + 5, electrodes.Cathode.y + 40);
            ctx.lineTo(electrodes.Cathode.x + 5, 420);
            ctx.lineTo(100, 420);
            ctx.lineTo(100, 50);
            ctx.lineTo(260, 50);
            ctx.moveTo(electrodes.Anode.x + 5, electrodes.Anode.y + 40);
            ctx.lineTo(electrodes.Anode.x + 5, 420);
            ctx.lineTo(500, 420);
            ctx.lineTo(500, 50);
            ctx.lineTo(340, 50);
            ctx.stroke();

            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(260, 30, 80, 40);
            ctx.fillStyle = '#0f172a';
            ctx.font = '16px sans-serif';
            ctx.fillText("DC", 290, 55);

            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText("+", 325, 25);
            ctx.fillStyle = '#3b82f6';
            ctx.fillText("-", 265, 25);

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(beaker.x, beaker.y);
            ctx.lineTo(beaker.x, beaker.y + beaker.h);
            ctx.lineTo(beaker.x + beaker.w, beaker.y + beaker.h);
            ctx.lineTo(beaker.x + beaker.w, beaker.y);
            ctx.stroke();

            ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
            ctx.fillRect(beaker.x + 2, waterLvl, beaker.w - 4, beaker.y + beaker.h - waterLvl - 2);

            ctx.fillStyle = '#64748b';
            ctx.fillRect(electrodes.Cathode.x, electrodes.Cathode.y, electrodes.Cathode.w, electrodes.Cathode.h);
            ctx.fillRect(electrodes.Anode.x, electrodes.Anode.y, electrodes.Anode.w, electrodes.Anode.h);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ['H2', 'O2'].forEach(key => {
                const t = tubes[key];
                ctx.beginPath();
                ctx.moveTo(t.x, t.y + t.h);
                ctx.lineTo(t.x, t.y + 10);
                ctx.arc(t.x + t.w/2, t.y + 10, t.w/2, Math.PI, 0);
                ctx.lineTo(t.x + t.w, t.y + t.h);
                ctx.stroke();
                ctx.fillStyle = '#64748b';
                ctx.font = '14px sans-serif';
                ctx.fillText(key === 'H2' ? 'H₂' : 'O₂', t.x + 12, t.y - 10);
            });

            const fillTube = (tubeKey, vol) => {
                const t = tubes[tubeKey];
                const maxH = t.h - 20;
                const gasH = (vol / MAX_TUBE_VOL) * maxH;
                const innerWaterY = t.y + 10 + gasH;

                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.moveTo(t.x + 2, innerWaterY);
                ctx.lineTo(t.x + 2, t.y + 10);
                ctx.arc(t.x + t.w/2, t.y + 10, t.w/2 - 2, Math.PI, 0);
                ctx.lineTo(t.x + t.w - 2, innerWaterY);
                ctx.fill();

                ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.fillRect(t.x + 2, innerWaterY, t.w - 4, (t.y + t.h) - innerWaterY);

                ctx.strokeStyle = 'rgba(14, 165, 233, 0.8)';
                ctx.beginPath();
                ctx.moveTo(t.x + 2, innerWaterY);
                ctx.lineTo(t.x + t.w - 2, innerWaterY);
                ctx.stroke();

                return innerWaterY;
            };

            const h2WaterY = fillTube('H2', state.h2Vol);
            const o2WaterY = fillTube('O2', state.o2Vol);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.8)';
            ctx.lineWidth = 1;

            for (let i = state.bubbles.length - 1; i >= 0; i--) {
                const b = state.bubbles[i];
                b.y -= b.speed;
                b.x += Math.sin(b.y * 0.1) * 0.5;

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                const targetY = b.type === 'H2' ? h2WaterY : o2WaterY;
                if (b.y - b.r <= targetY) {
                    if (b.type === 'H2' && state.h2Vol < MAX_TUBE_VOL) {
                        state.h2Vol += 0.1;
                    } else if (b.type === 'O2' && state.o2Vol < MAX_TUBE_VOL) {
                        state.o2Vol += 0.1;
                    }
                    state.bubbles.splice(i, 1);
                }
            }

            valH2.innerText = state.h2Vol.toFixed(1) + " mL";
            valO2.innerText = state.o2Vol.toFixed(1) + " mL";
        }

        let lastTime = 0;
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;

            if (dt > 50) {
                if (state.current > 0) {
                    state.h2Pending += state.current * 0.4;
                    state.o2Pending += state.current * 0.2;

                    while(state.h2Pending >= 1) {
                        if(state.h2Vol < MAX_TUBE_VOL) {
                            state.bubbles.push({
                                type: 'H2',
                                x: electrodes.Cathode.x + Math.random() * electrodes.Cathode.w,
                                y: electrodes.Cathode.y - 2,
                                r: 2 + Math.random() * 2,
                                speed: 1.5 + Math.random() * 1
                            });
                        }
                        state.h2Pending -= 1;
                    }

                    while(state.o2Pending >= 1) {
                        if(state.o2Vol < MAX_TUBE_VOL) {
                            state.bubbles.push({
                                type: 'O2',
                                x: electrodes.Anode.x + Math.random() * electrodes.Anode.w,
                                y: electrodes.Anode.y - 2,
                                r: 2.5 + Math.random() * 2,
                                speed: 1.5 + Math.random() * 1
                            });
                        }
                        state.o2Pending -= 1;
                    }
                }
                lastTime = timestamp;
            }

            drawScene();
            requestAnimationFrame(loop);
        }

        // Init
        wireTeachingUI();
        updateUI();
        updateControls();
        requestAnimationFrame(loop);
    </script>
</body>
