<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焰色試驗 | Flame Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Noto Sans TC', 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .mj-display { text-align: center; }
        .mj-display mjx-container { display: inline-block !important; margin-inline: auto; text-align: center; }
        .mj-display mjx-container[display="true"] { display: block !important; margin-inline: auto !important; }

        #flameCanvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 62%, #1e293b 0%, #0b1220 72%);
            border-radius: 1rem;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .cobalt-glass-active { position: relative; }
        .cobalt-glass-active::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 50, 150, 0.4);
            border-radius: 1rem;
            pointer-events: none;
            mix-blend-mode: multiply;
            z-index: 10;
        }

        .teach-modal { z-index: 60; }
        .teach-modal.hidden { display: none !important; }
        .quiz-ans { display: none; }
        .quiz-ans.shown { display: block; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="shrink-0 sticky top-0 bg-slate-800 shadow-md py-3 sm:py-4 px-4 sm:px-6 flex flex-col md:flex-row justify-between items-center gap-3 z-40">
        <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start min-w-0">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/50 shrink-0" aria-hidden="true">🧪</div>
                <div class="min-w-0">
                    <h1 class="text-xl font-bold tracking-wide flex items-center gap-2 flex-wrap">
                        <span data-i18n="title">焰色試驗</span>
                        <span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-bold" data-i18n="badge">化學</span>
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block" data-i18n="subtitle">本生燈金屬離子焰色觀察（初中科學／化學單元）</p>
                </div>
            </div>
            <button type="button" id="btn-lang" onclick="toggleLanguage()" class="md:hidden shrink-0 px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold border border-slate-600">中 / EN</button>
        </div>
        <div class="flex flex-wrap gap-2 sm:gap-3 justify-end w-full md:w-auto items-center">
            <button type="button" id="btn-steps" onclick="openTeachModal('modal-steps')" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-semibold transition-colors border border-slate-600 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span data-i18n="btnSteps">觀察步驟</span>
            </button>
            <button type="button" id="btn-principle" onclick="openTeachModal('modal-principle')" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-semibold transition-colors shadow-lg flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span data-i18n="btnPrinciple">原理解說</span>
            </button>
            <button type="button" id="btn-quiz" onclick="openTeachModal('modal-quiz')" class="px-3 py-2 bg-violet-600 hover:bg-violet-500 text-white rounded-lg text-sm font-semibold transition-colors shadow-lg flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span data-i18n="btnQuiz">課堂問題</span>
            </button>
            <span class="hidden sm:inline text-slate-600">|</span>
            <button type="button" id="btn-lang-desktop" onclick="toggleLanguage()" class="hidden md:flex px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors border border-slate-600">
                中 / EN
            </button>
            <button type="button" id="btn-reset" onclick="resetAll()" class="px-3 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-semibold transition-colors shadow-lg flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span data-i18n="btnResetHeader">重置</span>
            </button>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 p-4 sm:p-6 overflow-hidden min-h-0">

        <section class="order-1 lg:order-none lg:col-span-8 relative flex flex-col items-center min-h-0">
            <div id="canvasContainer" class="relative w-full flex-1 min-h-0 max-w-3xl lg:max-w-none">
                <canvas id="flameCanvas"></canvas>
                <div class="absolute top-4 left-6 pointer-events-none z-20">
                    <h2 id="currentIon" class="text-3xl font-bold text-white drop-shadow-[0_2px_2px_rgba(0,0,0,1)] transition-colors duration-300">—</h2>
                    <p id="currentName" class="text-lg text-slate-300 font-medium drop-shadow-md">純潔火焰</p>
                    <p class="text-sm text-slate-400 mt-1 drop-shadow-md"><span data-i18n="wavelengthLabel">主要波長</span>: <span id="currentWavelength" class="text-white font-mono">-</span></p>
                </div>
            </div>

            <div class="mt-4 mb-1 flex items-center gap-3 shrink-0">
                <button type="button" class="flex items-center gap-3 bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-lg hover:bg-slate-700/80 transition" onclick="toggleCobaltGlass()" aria-pressed="false" id="cobaltToggleBtn">
                    <div class="relative w-12 h-6 transition duration-200 ease-linear rounded-full bg-slate-600" id="cobaltToggleBg">
                        <div class="absolute left-1 top-1 w-4 h-4 rounded-full bg-white transition transform duration-100 ease-linear" id="cobaltToggleDot"></div>
                    </div>
                    <span class="text-sm font-medium text-slate-300 select-none" data-i18n="cobaltGlass">使用鈷玻璃</span>
                </button>
            </div>
        </section>

        <aside class="order-2 lg:order-none lg:col-span-4 w-full bg-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl border border-slate-700 flex flex-col overflow-y-auto min-h-0">
            <h2 class="text-lg font-bold mb-4 text-emerald-400 border-b border-slate-700 pb-2" data-i18n="selectIon">選擇測試離子</h2>
            <div class="grid grid-cols-2 gap-3" id="ionButtonsContainer"></div>

            <div class="mt-6 bg-slate-900/50 rounded-xl p-4 border border-slate-700">
                <h3 class="text-sm font-semibold text-slate-300 mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z"></path></svg>
                    <span data-i18n="observationTip">觀察提示</span>
                </h3>
                <p class="text-xs text-slate-400 leading-relaxed" id="observationText">純淨的高溫本生燈火焰。</p>
            </div>

            <ol class="mt-5 space-y-2 text-[11px] text-slate-400">
                <li class="flex gap-2"><span class="w-5 h-5 rounded-full bg-slate-700 text-emerald-300 font-bold flex items-center justify-center shrink-0">1</span><span data-i18n="sideStep1">點燃本生燈，打開空氣孔，調成無光的藍色火焰。</span></li>
                <li class="flex gap-2"><span class="w-5 h-5 rounded-full bg-slate-700 text-emerald-300 font-bold flex items-center justify-center shrink-0">2</span><span data-i18n="sideStep2">用潔淨鎳鉻絲蘸取金屬鹽樣品。</span></li>
                <li class="flex gap-2"><span class="w-5 h-5 rounded-full bg-slate-700 text-emerald-300 font-bold flex items-center justify-center shrink-0">3</span><span data-i18n="sideStep3">把鎳鉻絲伸入燈管口上方的外焰，觀察顏色。</span></li>
                <li class="flex gap-2"><span class="w-5 h-5 rounded-full bg-slate-700 text-emerald-300 font-bold flex items-center justify-center shrink-0">4</span><span data-i18n="sideStep4">若有鈉干擾，透過鈷玻璃再觀察鉀的焰色。</span></li>
            </ol>

            <button type="button" onclick="resetAll()" class="mt-5 w-full bg-slate-900 hover:bg-slate-950 text-white font-bold py-2.5 px-4 rounded-xl border border-slate-600 transition-colors">
                <span data-i18n="btnReset">重置模擬</span>
            </button>
        </aside>
    </main>

    <!-- Modal: Steps -->
    <div id="modal-steps" class="teach-modal hidden fixed inset-0 items-center justify-center bg-black/70 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="steps-title">
        <div class="bg-slate-800 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-600 relative" id="modal-steps-content">
            <div class="sticky top-0 bg-slate-800 p-5 border-b border-slate-700 flex justify-between items-center z-10">
                <h2 id="steps-title" class="text-xl font-bold text-emerald-300" data-i18n="stepsTitle">觀察步驟</h2>
                <button type="button" class="modal-close text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-700 transition" aria-label="關閉">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <ol id="steps-body" class="p-6 text-slate-300 text-sm space-y-3 list-none"></ol>
        </div>
    </div>

    <!-- Modal: Principle -->
    <div id="modal-principle" class="teach-modal hidden fixed inset-0 items-center justify-center bg-black/70 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="principle-title">
        <div class="bg-slate-800 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-600 relative" id="modal-principle-content">
            <div class="sticky top-0 bg-slate-800 p-6 border-b border-slate-700 flex justify-between items-center z-10">
                <h2 id="principle-title" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400" data-i18n="principleTitle">焰色試驗的量子原理</h2>
                <button type="button" class="modal-close text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-700 transition" aria-label="關閉">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="principle-body" class="p-6 text-slate-300 leading-relaxed space-y-6"></div>
        </div>
    </div>

    <!-- Modal: Quiz -->
    <div id="modal-quiz" class="teach-modal hidden fixed inset-0 items-center justify-center bg-black/70 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
        <div class="bg-slate-800 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-600 relative" id="modal-quiz-content">
            <div class="sticky top-0 bg-slate-800 p-5 border-b border-slate-700 flex justify-between items-center z-10 gap-3">
                <h2 id="quiz-title" class="text-xl font-bold text-violet-300" data-i18n="quizTitle">課堂問題</h2>
                <div class="flex items-center gap-2">
                    <button type="button" id="btn-quiz-answers" onclick="toggleQuizAnswers()" class="text-xs px-3 py-1.5 rounded-lg bg-violet-700/80 hover:bg-violet-600 text-white border border-violet-400 font-semibold" data-i18n="showAns">顯示參考答案</button>
                    <button type="button" class="modal-close text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-700 transition" aria-label="關閉">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
            <div id="quiz-body" class="p-6 text-slate-300 text-sm space-y-4"></div>
        </div>
    </div>

    <script>
const metals = {
            base: { id: "base", symbol: "—", nameZH: "純潔火焰", nameEN: "Clean flame", colorRGB: [90, 170, 255], colorHex: "#5aaaff", wavelength: "-", descZH: "空氣孔打開時的無光焰：內錐呈淡藍白色，外焰幾乎無色。火焰從燈管口升起。", descEN: "A non-luminous flame with the air hole open: pale inner cone, almost colourless outer cone, rising from the barrel." },
            na: { id: "na", symbol: "Na⁺", nameZH: "鈉 (Sodium)", nameEN: "Sodium", colorRGB: [255, 215, 0], colorHex: "#FFD700", wavelength: "589 nm", descZH: "外焰呈強烈金黃色，極易掩蓋其他離子的顏色。", descEN: "Intense golden-yellow outer flame that easily masks other colours." },
            k: { id: "k", symbol: "K⁺", nameZH: "鉀 (Potassium)", nameEN: "Potassium", colorRGB: [200, 162, 200], colorHex: "#C8A2C8", wavelength: "404 nm, 766 nm", descZH: "外焰呈淡紫色。透過鈷玻璃觀察會呈紫紅色。", descEN: "Lilac outer flame; appears crimson through cobalt glass." },
            ca: { id: "ca", symbol: "Ca²⁺", nameZH: "鈣 (Calcium)", nameEN: "Calcium", colorRGB: [255, 69, 0], colorHex: "#FF4500", wavelength: "622 nm", descZH: "外焰呈磚紅色 (Brick Red)。", descEN: "Brick-red outer flame." },
            ba: { id: "ba", symbol: "Ba²⁺", nameZH: "鋇 (Barium)", nameEN: "Barium", colorRGB: [141, 182, 0], colorHex: "#8DB600", wavelength: "524 nm", descZH: "外焰呈蘋果綠 (Apple Green)。", descEN: "Apple-green outer flame." },
            cu: { id: "cu", symbol: "Cu²⁺", nameZH: "銅 (Copper)", nameEN: "Copper", colorRGB: [0, 191, 165], colorHex: "#00BFA5", wavelength: "510 nm", descZH: "外焰呈藍綠色 (Blue-Green)。", descEN: "Blue-green outer flame." },
            sr: { id: "sr", symbol: "Sr²⁺", nameZH: "鍶 (Strontium)", nameEN: "Strontium", colorRGB: [220, 20, 60], colorHex: "#DC143C", wavelength: "460 nm, 605 nm", descZH: "外焰呈鮮豔血紅色 (Crimson)。", descEN: "Vivid crimson outer flame." },
            li: { id: "li", symbol: "Li⁺", nameZH: "鋰 (Lithium)", nameEN: "Lithium", colorRGB: [227, 34, 39], colorHex: "#E32227", wavelength: "670 nm", descZH: "外焰呈紫紅色／洋紅 (Carmine)。", descEN: "Carmine / magenta outer flame." }
        };

        let currentLang = 'zh';
        let currentMetalId = 'base';
        let isCobaltGlassOn = false;
        let currentColor = [...metals.base.colorRGB];
        let targetColor = [...metals.base.colorRGB];
        let wireInsert = 0;
        let time = 0;
        let layout = null;

function init() {
            renderButtons();
            updateUIInfo();
            initCanvas();
            seedParticles();
            animate();
        }

        function renderButtons() {
            const container = document.getElementById('ionButtonsContainer');
            container.innerHTML = '';
            Object.values(metals).forEach(metal => {
                const btn = document.createElement('button');
                const isSelected = metal.id === currentMetalId;
                btn.type = 'button';
                btn.className = `flex flex-col items-center p-3 border-2 rounded-xl transition-all duration-200 ${isSelected ? 'border-emerald-500 bg-emerald-500/10 scale-105 shadow-lg shadow-emerald-500/20' : 'border-slate-700 bg-slate-800 hover:bg-slate-700 hover:border-slate-500'}`;
                btn.onclick = () => selectMetal(metal.id);
                const colorIndicator = metal.id === 'base'
                    ? '<div class="w-4 h-4 rounded-full border border-slate-400 bg-blue-400 mb-2"></div>'
                    : `<div class="w-4 h-4 rounded-full border border-slate-400 mb-2" style="background-color: ${metal.colorHex}; box-shadow: 0 0 8px ${metal.colorHex}"></div>`;
                const name = currentLang === 'zh' ? metal.nameZH : metal.nameEN;
                btn.innerHTML = `${colorIndicator}<span class="font-bold text-white text-lg">${metal.symbol}</span><span class="text-xs text-slate-400 mt-1 text-center">${name}</span>`;
                container.appendChild(btn);
            });
        }

        function selectMetal(id) {
            currentMetalId = id;
            calculateTargetColor();
            updateUIInfo();
            renderButtons();
        }

        function calculateTargetColor() {
            const metal = metals[currentMetalId];
            if (isCobaltGlassOn) {
                if (currentMetalId === 'na') targetColor = [...metals.base.colorRGB];
                else if (currentMetalId === 'k') targetColor = [220, 20, 60];
                else targetColor = [metal.colorRGB[0] * 0.8, metal.colorRGB[1] * 0.8, metal.colorRGB[2] * 0.8 + 50];
            } else {
                targetColor = [...metal.colorRGB];
            }
        }

        function updateUIInfo() {
            const metal = metals[currentMetalId];
            const ionEl = document.getElementById('currentIon');
            ionEl.textContent = metal.symbol;
            ionEl.style.color = isCobaltGlassOn && currentMetalId === 'na' ? '#cbd5e1' : `rgb(${targetColor.join(',')})`;
            document.getElementById('currentName').textContent = currentLang === 'zh' ? metal.nameZH : metal.nameEN;
            const waveEl = document.getElementById('currentWavelength');
            if (isCobaltGlassOn && currentMetalId === 'na') {
                waveEl.textContent = currentLang === 'zh' ? "被鈷玻璃吸收" : "Absorbed by glass";
            } else {
                waveEl.textContent = metal.wavelength;
            }
            const obsEl = document.getElementById('observationText');
            obsEl.textContent = currentLang === 'zh' ? metal.descZH : metal.descEN;
            if (isCobaltGlassOn && currentMetalId === 'k') {
                obsEl.textContent = currentLang === 'zh'
                    ? "透過鈷玻璃，清除了黃光干擾，鉀的紫紅色變得清晰可見。"
                    : "Through cobalt glass, yellow interference is removed, making K's crimson colour clearly visible.";
            }
        }

        function toggleCobaltGlass() {
            isCobaltGlassOn = !isCobaltGlassOn;
            const toggleBg = document.getElementById('cobaltToggleBg');
            const toggleDot = document.getElementById('cobaltToggleDot');
            const canvasContainer = document.getElementById('canvasContainer');
            const btn = document.getElementById('cobaltToggleBtn');
            btn.setAttribute('aria-pressed', String(isCobaltGlassOn));
            if (isCobaltGlassOn) {
                toggleBg.classList.replace('bg-slate-600', 'bg-blue-600');
                toggleDot.style.transform = 'translateX(1.5rem)';
                canvasContainer.classList.add('cobalt-glass-active');
            } else {
                toggleBg.classList.replace('bg-blue-600', 'bg-slate-600');
                toggleDot.style.transform = 'translateX(0)';
                canvasContainer.classList.remove('cobalt-glass-active');
            }
            calculateTargetColor();
            updateUIInfo();
        }

        let quizReveal = false;
        let modalTimer = null;

        const translations = {
            zh: {
                title: "焰色試驗",
                badge: "化學",
                subtitle: "本生燈金屬離子焰色觀察（初中科學／化學單元）",
                btnPrinciple: "原理解說",
                btnSteps: "觀察步驟",
                btnQuiz: "課堂問題",
                btnResetHeader: "重置",
                stepsTitle: "觀察步驟",
                principleTitle: "焰色試驗的量子原理",
                quizTitle: "課堂問題",
                wavelengthLabel: "主要波長",
                cobaltGlass: "使用鈷玻璃",
                selectIon: "選擇測試離子",
                observationTip: "觀察提示",
                btnReset: "重置模擬",
                showAns: "顯示參考答案",

        const canvas = document.getElementById('flameCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];

        function computeLayout() {
            const rect = canvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            const s = Math.min(w / 360, h / 480, 1.45);
            const cx = w * 0.5;
            const footBottom = h - 28 * s;
            const footH = 16 * s;
            const stemH = 30 * s;
            const collarH = 20 * s;
            const tubeH = 132 * s;
            const tubeW = 30 * s;
            const tubeTop = footBottom - footH - stemH - collarH - tubeH;
            return { w, h, s, cx, tubeTop, tubeW, tubeH, footBottom, footH, stemH, collarH };
        }

        function initCanvas() {
            const resize = () => {
                const parent = canvas.parentElement.getBoundingClientRect();
                if (parent.width < 2 || parent.height < 2) return;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(parent.width * dpr);
                canvas.height = Math.floor(parent.height * dpr);
                canvas.style.width = `${parent.width}px`;
                canvas.style.height = `${parent.height}px`;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                layout = computeLayout();
            };
            resize();
            window.addEventListener('resize', resize);
            if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas.parentElement);
        }

        class Particle {
            constructor(type) {
                this.type = type;
                this.reset();
            }
            reset() {
                const L = layout || computeLayout();
                const mouth = L.tubeW * 0.38;
                if (this.type === 'inner') {
                    this.x = L.cx + (Math.random() - 0.5) * mouth;
                    this.y = L.tubeTop - Math.random() * 6 * L.s;
                    this.vx = (Math.random() - 0.5) * 0.22 * L.s;
                    this.vy = -(1.1 + Math.random() * 1.3) * L.s;
                    this.size = (2.5 + Math.random() * 4) * L.s;
                    this.life = 0.32 + Math.random() * 0.28;
                } else {
                    this.x = L.cx + (Math.random() - 0.5) * mouth * 1.05;
                    this.y = L.tubeTop - 4 * L.s - Math.random() * 12 * L.s;
                    this.vx = (Math.random() - 0.5) * 0.7 * L.s;
                    this.vy = -(2.2 + Math.random() * 2.6) * L.s;
                    this.size = (6 + Math.random() * 11) * L.s;
                    this.life = 0.55 + Math.random() * 0.65;
                }
                this.maxLife = this.life;
            }
            update() {
                const L = layout;
                this.x += this.vx;
                this.y += this.vy;
                this.vy -= 0.035 * L.s;
                this.vx -= (this.x - L.cx) * 0.014;
                this.life -= 0.012;
                const maxRise = this.type === 'inner' ? 64 * L.s : 210 * L.s;
                if (this.life <= 0 || this.y < L.tubeTop - maxRise) this.reset();
            }
            draw() {
                const t = Math.max(this.life / this.maxLife, 0);
                const r = this.size * t;
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, r * 0.55, r * 1.15, 0, 0, Math.PI * 2);
                const a = t * (this.type === 'inner' ? 0.85 : 0.7);
                if (this.type === 'inner') {
                    ctx.fillStyle = `rgba(190, 230, 255, ${a})`;
                } else {
                    ctx.fillStyle = `rgba(${Math.round(currentColor[0])}, ${Math.round(currentColor[1])}, ${Math.round(currentColor[2])}, ${a})`;
                }
                ctx.fill();
            }
        }

        function seedParticles() {
            particles.length = 0;
            for (let i = 0; i < 80; i++) particles.push(new Particle('inner'));
            for (let i = 0; i < 200; i++) particles.push(new Particle('outer'));
        }

        function lerpColor() {
            const speed = 0.06;
            currentColor[0] += (targetColor[0] - currentColor[0]) * speed;
            currentColor[1] += (targetColor[1] - currentColor[1]) * speed;
            currentColor[2] += (targetColor[2] - currentColor[2]) * speed;
        }

        function roundRectPath(x, y, w, h, r) {
            const rr = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + rr, y);
            ctx.arcTo(x + w, y, x + w, y + h, rr);
            ctx.arcTo(x + w, y + h, x, y + h, rr);
            ctx.arcTo(x, y + h, x, y, rr);
            ctx.arcTo(x, y, x + w, y, rr);
            ctx.closePath();
        }

        function drawFlameEnvelope(L, flicker) {
            const { cx, tubeTop, tubeW, s } = L;
            const isClean = currentMetalId === 'base' || (isCobaltGlassOn && currentMetalId === 'na');
            const outerH = (isClean ? 160 : 190) * s * flicker;
            const outerW = (isClean ? 36 : 48) * s;
            const [r, g, b] = currentColor.map(Math.round);

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            ctx.moveTo(cx - tubeW * 0.32, tubeTop);
            ctx.bezierCurveTo(cx - outerW, tubeTop - outerH * 0.28, cx - outerW * 0.55, tubeTop - outerH * 0.72, cx, tubeTop - outerH);
            ctx.bezierCurveTo(cx + outerW * 0.55, tubeTop - outerH * 0.72, cx + outerW, tubeTop - outerH * 0.28, cx + tubeW * 0.32, tubeTop);
            ctx.closePath();
            const og = ctx.createLinearGradient(cx, tubeTop, cx, tubeTop - outerH);
            og.addColorStop(0, `rgba(${r},${g},${b},0.28)`);
            og.addColorStop(0.45, `rgba(${r},${g},${b},0.38)`);
            og.addColorStop(1, `rgba(${r},${g},${b},0)`);
            ctx.fillStyle = og;
            ctx.fill();

            const halo = ctx.createRadialGradient(cx, tubeTop - outerH * 0.35, 6 * s, cx, tubeTop - outerH * 0.25, 120 * s);
            halo.addColorStop(0, `rgba(${r},${g},${b},0.18)`);
            halo.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = halo;
            ctx.fillRect(cx - 140 * s, tubeTop - outerH - 40 * s, 280 * s, outerH + 80 * s);
            ctx.restore();
        }

        function drawInnerCone(L, flicker) {
            const { cx, tubeTop, tubeW, s } = L;
            const h = 58 * s * flicker;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            ctx.moveTo(cx - tubeW * 0.28, tubeTop);
            ctx.quadraticCurveTo(cx - tubeW * 0.12, tubeTop - h * 0.55, cx, tubeTop - h);
            ctx.quadraticCurveTo(cx + tubeW * 0.12, tubeTop - h * 0.55, cx + tubeW * 0.28, tubeTop);
            ctx.closePath();
            const g = ctx.createLinearGradient(cx, tubeTop, cx, tubeTop - h);
            g.addColorStop(0, 'rgba(80, 160, 255, 0.55)');
            g.addColorStop(0.5, 'rgba(210, 240, 255, 0.7)');
            g.addColorStop(1, 'rgba(255, 255, 255, 0.15)');
            ctx.fillStyle = g;
            ctx.fill();

            ctx.globalCompositeOperation = 'source-over';
            ctx.beginPath();
            ctx.moveTo(cx - tubeW * 0.12, tubeTop);
            ctx.lineTo(cx, tubeTop - h * 0.62);
            ctx.lineTo(cx + tubeW * 0.12, tubeTop);
            ctx.closePath();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
            ctx.fill();
            ctx.restore();
        }

        function drawBurnerBody(L) {
            const { cx, s, tubeTop, tubeW, tubeH, collarH, stemH, footH, footBottom, w } = L;
            const collarY = tubeTop + tubeH;
            const stemY = collarY + collarH;
            const footY = stemY + stemH;
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';

            ctx.fillStyle = '#0b1220';
            ctx.fillRect(0, footBottom + 6 * s, w, L.h);
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(24 * s, footBottom + 6 * s);
            ctx.lineTo(w - 24 * s, footBottom + 6 * s);
            ctx.stroke();

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 7 * s;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx - 22 * s, footY - 8 * s);
            ctx.bezierCurveTo(cx - 70 * s, footY - 4 * s, cx - 90 * s, footBottom + 4 * s, 18 * s, footBottom + 10 * s);
            ctx.stroke();

            const footG = ctx.createLinearGradient(cx - 46 * s, 0, cx + 46 * s, 0);
            footG.addColorStop(0, '#334155');
            footG.addColorStop(0.5, '#94a3b8');
            footG.addColorStop(1, '#1e293b');
            ctx.fillStyle = footG;
            roundRectPath(cx - 46 * s, footY, 92 * s, footH, 4 * s);
            ctx.fill();

            const stemG = ctx.createLinearGradient(cx - 22 * s, 0, cx + 22 * s, 0);
            stemG.addColorStop(0, '#475569');
            stemG.addColorStop(0.35, '#e2e8f0');
            stemG.addColorStop(0.7, '#94a3b8');
            stemG.addColorStop(1, '#334155');
            ctx.fillStyle = stemG;
            roundRectPath(cx - 18 * s, stemY, 36 * s, stemH, 4 * s);
            ctx.fill();

            ctx.fillStyle = '#64748b';
            roundRectPath(cx + 16 * s, stemY + 8 * s, 16 * s, 10 * s, 3 * s);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 38 * s, stemY + 13 * s, 7 * s, 0, Math.PI * 2);
            ctx.fillStyle = '#94a3b8';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 38 * s, stemY + 13 * s, 3 * s, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();

            const tubeG = ctx.createLinearGradient(cx - tubeW / 2, 0, cx + tubeW / 2, 0);
            tubeG.addColorStop(0, '#64748b');
            tubeG.addColorStop(0.18, '#f1f5f9');
            tubeG.addColorStop(0.5, '#94a3b8');
            tubeG.addColorStop(0.82, '#cbd5e1');
            tubeG.addColorStop(1, '#334155');
            ctx.fillStyle = tubeG;
            roundRectPath(cx - tubeW / 2, tubeTop, tubeW, tubeH + collarH - 2 * s, 3 * s);
            ctx.fill();

            const colG = ctx.createLinearGradient(cx - 26 * s, 0, cx + 26 * s, 0);
            colG.addColorStop(0, '#334155');
            colG.addColorStop(0.4, '#cbd5e1');
            colG.addColorStop(1, '#1e293b');
            ctx.fillStyle = colG;
            roundRectPath(cx - 22 * s, collarY, 44 * s, collarH, 3 * s);
            ctx.fill();
            ctx.strokeStyle = 'rgba(15, 23, 42, 0.45)';
            ctx.lineWidth = 1;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(cx - 18 * s, collarY + i * 4.5 * s);
                ctx.lineTo(cx + 18 * s, collarY + i * 4.5 * s);
                ctx.stroke();
            }

            const holeX = cx - tubeW * 0.08;
            const holeY = collarY + collarH * 0.5;
            const holeRx = 5.4 * s;
            const holeRy = 6.6 * s;
            ctx.save();
            roundRectPath(cx - tubeW / 2, tubeTop, tubeW, tubeH + collarH, 3 * s);
            ctx.clip();
            ctx.beginPath();
            ctx.ellipse(holeX, holeY, holeRx, holeRy, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#020617';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(holeX + 1.2 * s, holeY, holeRx * 0.52, holeRy * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(holeX, holeY, holeRx, holeRy, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(241, 245, 249, 0.55)';
            ctx.lineWidth = 1.4;
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
            ctx.beginPath();
            ctx.ellipse(cx, tubeTop + 3 * s, tubeW * 0.38, 5 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawBurnerRim(L) {
            const { cx, tubeTop, tubeW, s } = L;
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.beginPath();
            ctx.ellipse(cx, tubeTop, tubeW * 0.52, 5.5 * s, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#94a3b8';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx, tubeTop, tubeW * 0.34, 3.6 * s, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx, tubeTop - 1.2 * s, tubeW * 0.5, 4.2 * s, 0, Math.PI, 0);
            ctx.strokeStyle = 'rgba(248, 250, 252, 0.55)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
        }

        function drawNichromeWire(L) {
            const { cx, tubeTop, s } = L;
            const target = currentMetalId === 'base' ? 0 : 1;
            wireInsert += (target - wireInsert) * 0.08;
            const t = wireInsert;
            if (t < 0.02) return;
            const loopX = cx + 10 * s + (1 - t) * 70 * s;
            const loopY = tubeTop - 46 * s;
            const startX = cx + 118 * s;
            const startY = tubeTop - 8 * s;
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2.2 * s;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(cx + 70 * s, tubeTop - 18 * s, loopX + 8 * s, loopY);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(loopX, loopY, 7 * s, 5 * s, -0.4, 0, Math.PI * 2);
            ctx.stroke();
            if (t > 0.7 && currentMetalId !== 'base') {
                ctx.globalCompositeOperation = 'lighter';
                ctx.beginPath();
                ctx.arc(loopX - 2 * s, loopY, 5 * s, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${Math.round(currentColor[0])},${Math.round(currentColor[1])},${Math.round(currentColor[2])},0.45)`;
                ctx.fill();
            }
            ctx.restore();
        }

        function animate() {
            layout = computeLayout();
            const L = layout;
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, L.w, L.h);
            lerpColor();
            time += 0.016;
            const flicker = 0.94 + 0.06 * Math.sin(time * 17) + 0.03 * Math.sin(time * 41);

            drawBurnerBody(L);
            drawFlameEnvelope(L, flicker);
            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            drawInnerCone(L, flicker);
            drawBurnerRim(L);
            drawNichromeWire(L);
            requestAnimationFrame(animate);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
